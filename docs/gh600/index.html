 and asking for a fix, /diff confirms the correction.","rationale":["Step 1: /session checkpoints lists every checkpoint with its number and title, so User1 can find the phase where the decision was made.","Step 2: adding the number shows the full content of that checkpoint, which reveals whether the decision survived the compaction.","Step 3: restating the decision puts it back in the active context and asks Copilot to undo the changes that drifted from it.","Step 4: /diff shows the changes in the session, so User1 can confirm that the original table names are back.","Incorrect: compaction cannot bring back a detail that an earlier summary dropped, and it does not undo the renames.","Incorrect: /clear starts a new conversation and loses the rest of the context, and the renamed tables stay as they are."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.3.1-01","obj":"3.3.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. uses Copilot Memory. While it works on an issue, the Copilot cloud agent learns that two configuration files in a repository must always be updated together. Other developers who work in the same repository must benefit from this knowledge.\n\nWhich mechanism should hold this knowledge?","choices":["A user-level preference","A repository-level fact","An organization custom instruction","A personal custom instruction"],"answer":[1],"explanation":"Copilot Memory has two types. Repository-level facts are shared with everyone who works in the same repository, while user-level preferences follow one user across repositories. Custom instructions are written by people, not captured by Copilot.","rationale":["Incorrect: user-level preferences belong to a single user and follow that user to other repositories. Use them for personal working styles, not for repository knowledge that collaborators must share.","Correct: repository-level facts are shared with collaborators and applied only in the repository where they were captured, which is exactly the scope of a rule about two files in that repository.","Incorrect: organization custom instructions are written by owners and apply across repositories on GitHub website sessions and code review. They are not where Copilot stores what it learns while working.","Incorrect: personal custom instructions are written by one user and apply only to that user's requests. Other developers in the repository would not receive the knowledge."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.1-02","obj":"3.3.1","difficulty":"medium","type":"single","stem":"Tailspin Toys enables Copilot Memory for a repository. The Copilot cloud agent stores a repository fact about how the code handles database connections while it fixes an issue. A week later, Copilot code review reviews an unrelated pull request in the same repository that changes database code.\n\nWhat should you expect Copilot code review to do with the fact?","choices":["Ignore the fact, because facts are scoped to the surface that stored them","Use the fact only after a user approves it in the cloud agent session","Use the fact, because memories are shared across Copilot surfaces","Use the fact only if it is copied into .github/copilot-instructions.md"],"answer":[2],"explanation":"Copilot Memory is shared across Copilot surfaces such as the cloud agent, Copilot CLI, and Copilot code review. Knowledge captured by one surface can be applied by another in the same repository, which is how agents share state without hand-written notes.","rationale":["Incorrect: memories are not tied to the surface that created them. The documentation describes the cloud agent learning database connection handling and code review later applying it.","Incorrect: the cloud agent does not ask for approval before it stores a memory. Approval prompts exist only in the GitHub Copilot app and interactive Copilot CLI sessions.","Correct: facts captured by one Copilot surface are available to other surfaces in the same repository, so code review can apply what the cloud agent learned, after it checks the fact's citations.","Incorrect: copying a fact into custom instructions is a way to make a rule consistent, but it is not a prerequisite. Code review can use repository facts directly from Copilot Memory."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.1-03","obj":"3.3.1","difficulty":"easy","type":"single","stem":"At Litware, Inc., User1 assigned an issue to the Copilot cloud agent. Other developers on the team must be able to open the session log of that agent session to see what the agent did. You need to minimize administrative effort.\n\nWhat should User1 do?","choices":["Nothing; teammates can open it from the All sessions view on the Agents tab","Share the session as view-only by using the Copilot CLI","Run /chronicle reindex and send the session store to the team","Copy ~/.copilot/session-state/ to a shared network folder"],"answer":[0],"explanation":"Cloud agent sessions are shared by default, so collaborators can find them in the All sessions view on the repository's Agents tab. Local sessions are different: they are unshared by default and are stored on the developer's machine.","rationale":["Correct: Copilot cloud agent sessions are shared by default and appear in the All sessions view on the repository's Agents tab, so no extra action is needed.","Incorrect: view-only sharing is how you share a local session, which is unshared by default. A cloud agent session is already shared with the repository's collaborators.","Incorrect: /chronicle reindex rebuilds the local session store on one machine. It does not share a cloud agent session with other people.","Incorrect: ~/.copilot/session-state/ holds local session data. A cloud agent session does not run on User1's machine, and copying files adds effort for no benefit."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.3.1-04","obj":"3.3.1","difficulty":"medium","type":"single","stem":"At Fabrikam, Inc., User2 starts a Copilot session in a cloud sandbox from the GitHub Copilot app. Later, User2 must continue the same session from a terminal with the full conversation history.\n\nWhich Copilot CLI command should User2 use?","choices":["/memory show","/chronicle reindex","/resume","/memory off"],"answer":[2],"explanation":"Cloud sandbox sessions can continue across clients such as the GitHub Copilot app, GitHub Mobile, GitHub.com, and Copilot CLI, and keep their full history. In Copilot CLI you pick up such a session with /resume.","rationale":["Incorrect: /memory show displays the local Copilot Memory setting. It does not open or continue a session.","Incorrect: /chronicle reindex rebuilds the local session store. It does not attach the terminal to a cloud sandbox session.","Correct: /resume continues an existing session in Copilot CLI, and cloud sandbox sessions keep their full history when you move between clients.","Incorrect: /memory off disables Copilot Memory for the CLI. It changes what Copilot remembers, not which session you work in."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.3.1-05","obj":"3.3.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank has two repositories named Repo1 and Repo2 in the same organization. In Repo1, Copilot Memory holds a validated repository fact that all currency values must use a shared Money type. The Copilot cloud agent must apply the same rule for every developer who assigns work in Repo2.\n\nWhat should you do?","choices":["Rely on the Repo1 fact, because facts are pooled across organization repositories","Fork Repo1 and use the fork in place of Repo2","Ask User1 to store the rule as a user-level preference","Add the rule to .github/copilot-instructions.md in Repo2"],"answer":[3],"explanation":"Repository facts stay in the repository where they were captured: they are not pooled across an organization and are not copied to forks. To share a rule with every agent task in another repository, put it in that repository's custom instructions.","rationale":["Incorrect: Copilot Memory does not pool facts across the repositories of an organization. A fact from Repo1 is applied only in Repo1.","Incorrect: forking a repository does not copy its memories, so a fork would start without the fact. Forking would also replace Repo2 rather than configure it.","Incorrect: a user-level preference follows only User1. Tasks that other developers assign in Repo2 would not receive the rule.","Correct: repository-wide custom instructions in Repo2 are applied to every cloud agent task in that repository, regardless of who assigns the work, so the rule is shared consistently."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.1-06","obj":"3.3.1","difficulty":"hard","type":"yesno","stem":"Proseware, Inc. enables Copilot Memory for repository facts and user preferences. Developers use the Copilot cloud agent, Copilot CLI, and Copilot code review.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["A user-level preference that User1 creates is applied when User1 works in a different repository.","Copilot code review applies the user-level preferences of the pull request author.","A Copilot CLI subagent that has the read_memories tool can store a new repository fact.","Facts that the Copilot cloud agent stores can later be used by Copilot CLI in the same repository."],"answer":[0,3],"explanation":"User preferences follow a user across repositories, and repository facts are shared across Copilot surfaces in one repository. Some surfaces and agents have limits: code review never applies user preferences, and only the root agent in Copilot CLI can store or vote on memories.","rationale":["Yes: user-level preferences follow the user across repositories, so User1's preference is applied wherever User1 works with Copilot.","No: Copilot code review and Agentic Autofix never apply user-level preferences. They use repository facts and instructions instead.","No: only the root agent can use store_memory and vote_memory. A subagent with read_memories can read memories but cannot create or change them.","Yes: memory is shared across Copilot surfaces, so a fact the cloud agent captured can be used by Copilot CLI, code review, and other surfaces in that repository."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.2-01","obj":"3.3.2","difficulty":"medium","type":"single","stem":"You need to resolve the package manager problem in the src/web pull requests and meet the technical requirements.\n\nWhat should you do?","choices":["Store a repository fact in Copilot Memory that says pnpm is required","Edit the instruction files so that src/web receives only one package manager rule","Ask each web developer to add pnpm to their personal custom instructions","Add organization custom instructions that say to use pnpm"],"answer":[1],"explanation":"When several instruction sets give contradictory guidance, Copilot may follow either of them, because all relevant instructions are provided together. The documented fix is to avoid conflicting instruction sets rather than to add another source that repeats one side of the conflict.","rationale":["Incorrect: a memory adds a third source of guidance and does not remove the contradiction between the two instruction files. Memory is also applied by judgment, not guaranteed.","Correct: scoping the npm rule to the backend, for example in a path-specific file for src/api, and keeping pnpm only in src/web/AGENTS.md gives src/web one consistent rule and meets the requirement.","Incorrect: personal instructions apply to Copilot Chat on GitHub.com for one user, not to the cloud agent, and they add yet another source while the conflicting files remain.","Incorrect: organization instructions have the lowest priority and would leave both conflicting repository instructions in place, so the conflict remains."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/custom-instructions","case":"C-d"},{"id":"3.3.2-02","obj":"3.3.2","difficulty":"medium","type":"order","stem":"Fabrikam, Inc. keeps backend and web conventions in .github/copilot-instructions.md. The Copilot cloud agent applies web conventions to backend files. You need the web conventions to apply only to files under src/web.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a .github/instructions directory in the repository.","Add a file named web.instructions.md to that directory.","Add frontmatter to the file that sets applyTo to \"src/web/**\".","Below the frontmatter, add the web conventions, remove them from .github/copilot-instructions.md, and commit.","Add the web conventions to an AGENTS.md file at the repository root.","Store the web conventions as a user-level preference in Copilot Memory."],"answer":[0,1,2,3],"explanation":"Path-specific instructions live in .github/instructions as files that end in .instructions.md. The applyTo frontmatter limits them to matching paths, and moving the web rules out of the repository-wide file removes the source of the misapplied guidance.","rationale":["Step 1: path-specific instruction files must be stored in the .github/instructions directory, so the directory has to exist first.","Step 2: the file name must end in .instructions.md for Copilot to treat it as a path-specific instructions file.","Step 3: the applyTo glob in the frontmatter limits the instructions to files under src/web, which is the scoping requirement.","Step 4: the conventions go in the body after the frontmatter, and removing them from the repository-wide file before committing stops them from applying to backend files.","Incorrect: an AGENTS.md file at the repository root applies to the whole repository, so the web conventions would still reach backend files. Use a nested AGENTS.md when a directory needs its own agent instructions.","Incorrect: a user-level preference follows one user, not a path. It cannot limit conventions to src/web and would not reach work assigned by other developers."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions?tool=webui"},{"id":"3.3.2-03","obj":"3.3.2","difficulty":"medium","type":"dragdrop","stem":"Adatum Corporation wants each piece of guidance for the Copilot cloud agent to live in exactly one place so that sources do not contradict each other.\n\nWhich source should you use for each piece of guidance? To answer, drag the appropriate sources to the correct guidance. Each source may be used once, more than once, or not at all.","choices":[".github/copilot-instructions.md","A path-specific .instructions.md file","A repository fact in Copilot Memory","Personal custom instructions","Organization custom instructions"],"answer":[0,1,2],"explanation":"Rules that must apply to every task in a repository belong in repository-wide instructions, rules for some paths belong in path-specific files, and details that Copilot discovers while working belong in memory. Keeping each item in one place avoids conflicting context.","rationale":["Guidance1 must apply to every task and to code review in the repository, which is what .github/copilot-instructions.md provides; memory or personal instructions would not guarantee that reach.","Guidance2 is limited to src/jobs, so a path-specific .instructions.md file with an applyTo glob keeps it away from other files and avoids contradicting their conventions.","Guidance3 is accumulated detail that Copilot learned while working, which is the purpose of a repository fact; the fact is cited to code and checked before it is used."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions?tool=webui","targets":["Guidance1: an input validation rule that every agent task and code review in the repository must follow","Guidance2: naming conventions that apply only to files under src/jobs","Guidance3: a detail Copilot discovered while working, that two files must be kept in sync"],"notes":["Repository-wide instructions apply to every request in the repository, including cloud agent tasks and Copilot code review. Use them for rules that must always apply.","Path-specific instructions use an applyTo glob so they apply only to matching files. Use them when a convention is limited to part of the repository.","Repository facts are captured by Copilot while it works and are shared across surfaces. Use memory for accumulated detail, not for mandatory rules.","Personal custom instructions apply only to the user who wrote them. They are the wrong place for guidance that every developer's tasks must follow.","Organization custom instructions apply across repositories and have the lowest priority. They do not fit guidance that is specific to one repository."]},{"id":"3.3.2-04","obj":"3.3.2","difficulty":"hard","type":"dropdown","stem":"Proseware, Inc. wants API conventions to apply to files under src/api and src/jobs. The Copilot cloud agent must use the conventions, but Copilot code review must not, because code review uses a separate checklist.\n\nHow should you complete the file .github/instructions/api.instructions.md? To answer, select the appropriate options in the answer area.\n\n```markdown\n---\napplyTo: [[1]]\nexcludeAgent: [[2]]\n---\nUse the shared logger in every request handler.\n```","answer":[0,1],"explanation":"Path-specific instructions use the applyTo frontmatter, with multiple globs separated by commas. The excludeAgent key keeps one Copilot agent from using the file, which prevents code review from receiving guidance that conflicts with its own checklist.","ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions?tool=webui","targets":[{"label":"Box 1","options":["\"src/api/**,src/jobs/**\"","\"src/api/** | src/jobs/**\"","\"src/api/\""],"why":["Correct: applyTo accepts several glob patterns separated by commas, so this value matches every file under both directories.","Incorrect: a vertical bar is not the documented separator for applyTo globs. Separate multiple patterns with commas instead.","Incorrect: this value names only one directory and has no glob, so files under src/jobs would not receive the conventions."]},{"label":"Box 2","options":["\"cloud-agent\"","\"code-review\""],"why":["Incorrect: excluding cloud-agent would stop the Copilot cloud agent from using the file, which is the opposite of the requirement.","Correct: excludeAgent set to code-review keeps Copilot code review from using the file while the cloud agent still applies it."]}]},{"id":"3.3.2-05","obj":"3.3.2","difficulty":"hard","type":"multi","stem":"In a Relecloud repository, .github/copilot-instructions.md says to write tests with Jest, and tests/AGENTS.md says to use Vitest. Copilot Memory also holds a repository fact, captured before a migration, that says the project uses Mocha. The Copilot cloud agent switches between frameworks from task to task.\n\nWhich two actions should you perform to stop the agent from receiving conflicting guidance? Each correct answer presents part of the solution.","choices":["Delete the outdated repository fact in the repository settings","Rely on instruction precedence to make Copilot ignore the lower-priority file","Edit the instruction files so that only one of them names the test framework","Add organization custom instructions that name the correct framework","Ask each developer to add the framework to a user-level preference"],"answer":[0,2],"explanation":"Conflicting context comes from every source that Copilot reads, so each source must agree. Contradicting instruction files must be edited so that only one states the rule, and a memory that is wrong must be deleted explicitly to make sure Copilot stops using it.","rationale":["Correct: to make sure Copilot stops using a memory, you delete it explicitly in the repository settings. Waiting for citation checks or expiry is not guaranteed.","Incorrect: Copilot receives all relevant instruction sets, and most clients combine them without a defined precedence. The documentation advises avoiding conflicting sets instead of relying on priority.","Correct: keeping the framework rule in one instruction file removes the contradiction between Jest and Vitest that Copilot receives on every task.","Incorrect: organization instructions have the lowest priority and add a fourth source of guidance. They do not remove the existing contradictions.","Incorrect: user-level preferences follow individual users and add more sources. Tasks assigned by developers without the preference would still see the conflict."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.2-06","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Northwind Traders wants a single set of coding standards that the Copilot cloud agent and Copilot code review both use for every task in a repository.\n\nWhich file should you create?","choices":[".github/agents/standards.agent.md",".github/copilot-instructions.md",".github/instructions/standards.md",".github/copilot/settings.json"],"answer":[1],"explanation":"Repository-wide custom instructions are stored in .github/copilot-instructions.md and apply to cloud agent tasks, Copilot Chat, and Copilot code review in the repository. One shared file prevents each surface from receiving different standards.","rationale":["Incorrect: a .agent.md file defines a custom agent that applies only when that agent is selected. Code review and default agent tasks would not use it.","Correct: .github/copilot-instructions.md holds repository-wide instructions that both the cloud agent and Copilot code review read for every request in the repository.","Incorrect: path-specific instructions must end in .instructions.md and target paths with applyTo. A file named standards.md in that directory is not recognized.","Incorrect: .github/copilot/settings.json configures plugins such as enabledPlugins and extraKnownMarketplaces. It does not hold coding standards."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions?tool=webui"},{"id":"3.3.2-07","obj":"3.3.2","difficulty":"easy","type":"single","stem":"Adatum Corporation has organization custom instructions that say to use tabs for indentation. A repository has repository custom instructions that say to use two spaces. Both sets are provided to the Copilot cloud agent.\n\nWhich instructions should you expect the cloud agent to prioritize?","choices":["The organization instructions","Whichever instructions were changed most recently","The repository instructions","Neither, because Copilot rejects both conflicting sets"],"answer":[2],"explanation":"The Copilot cloud agent uses organization custom instructions, but repository instructions take priority over them. Even so, conflicting sets should be avoided, because priority does not guarantee that the lower-priority guidance is ignored.","rationale":["Incorrect: organization instructions have the lowest priority. They are used, but repository instructions are prioritized when both apply.","Incorrect: priority is based on the type of instructions, not on when a file changed. Edit dates do not affect which guidance wins.","Correct: the documentation states that the cloud agent uses organization instructions with repository instructions prioritized, so the two-space rule wins.","Incorrect: Copilot does not reject conflicting sets; it receives all relevant instructions. That is why you should remove contradictions instead of relying on a block."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"3.3.3-01","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Contoso, Ltd. uses Copilot Memory with the default settings. A repository fact is created and Copilot never validates it again.\n\nHow long should you expect the fact to remain before it expires?","choices":["7 days","90 days","180 days","365 days"],"answer":[1],"explanation":"Memories expire by default 90 days after creation, and the timer resets when Copilot upvotes a memory that it validated. Expiry keeps unused knowledge from lingering as stale context.","rationale":["Incorrect: 7 days is the shortest value that an owner can configure for repository facts. It is not the default.","Correct: the default expiry is 90 days, measured from creation, and it resets only when Copilot upvotes the memory.","Incorrect: 180 days is the longest value that an owner can configure for repository facts, not the default.","Incorrect: 365 days is outside the configurable range of 7 to 180 days, so it can be neither the default nor a valid setting."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.3-02","obj":"3.3.3","difficulty":"medium","type":"single","stem":"In a Tailspin Toys repository, Copilot retrieves a repository fact in many sessions. Copilot never upvotes the fact, and nobody changes the expiry settings.\n\nWhat should you expect to happen to the fact?","choices":["It expires 90 days after it was created","Each retrieval resets its 90-day expiry","It never expires while it is retrieved","It expires at the end of each session"],"answer":[0],"explanation":"Expiry is measured from creation and resets only when Copilot upvotes the memory after validating it. Merely reading a memory does not keep it alive, which limits how long unvalidated knowledge can influence agents.","rationale":["Correct: retrieving a memory does not reset its expiry, so a fact that is never upvoted expires 90 days after it was created.","Incorrect: only an upvote resets the timer. Retrieval alone does not count as validation.","Incorrect: use does not extend a memory. Without upvotes the default 90-day expiry still applies.","Incorrect: memories persist across sessions by design. Session-scoped context would not be shared knowledge at all."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.3-03","obj":"3.3.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. refactors a module and removes a retry helper. A repository fact in Copilot Memory still says to use the retry helper. You must make sure that Copilot stops using the fact now.\n\nWhat should you do?","choices":["Wait for Copilot to check the citations of the fact against the branch","Add a note to .github/copilot-instructions.md that the fact is outdated","Change the repository fact expiry setting to 7 days","Delete the fact in the repository settings"],"answer":[3],"explanation":"Copilot checks a fact's citations before using it, but that check is a judgment, not a guarantee. The documented way to make sure Copilot stops using a memory is to delete it explicitly.","rationale":["Incorrect: the citation check usually catches facts whose code changed, but it is not guaranteed, so it does not meet the requirement to stop use now.","Incorrect: a note in custom instructions adds a contradiction alongside the stale fact. Copilot could still receive both and follow either.","Incorrect: changing the expiry setting does not re-date existing facts. They adopt the new period only the next time they are reinforced.","Correct: explicitly deleting the fact in the repository settings makes sure that Copilot no longer uses it."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.3-04","obj":"3.3.3","difficulty":"hard","type":"single","stem":"At Woodgrove Bank, the enterprise sets the expiry for repository facts to 60 days, and an organization owner sets it to 30 days. Many repository facts in the organization were created before these changes.\n\nWhat should you expect?","choices":["60 days applies, and existing facts change when they are reinforced","30 days applies, and existing facts change when they are reinforced","30 days applies, and all existing facts are re-dated immediately","30 days applies to repository facts and to user preferences"],"answer":[1],"explanation":"Owners can set the repository fact expiry between 7 and 180 days, and when organization and enterprise values differ, the lower value applies. Existing facts are not re-dated; they adopt the new period the next time they are reinforced.","rationale":["Incorrect: when the organization and enterprise values differ, the lower value applies, so 60 days is not used.","Correct: the lower value of 30 days applies, and existing facts move to the new period the next time Copilot reinforces them.","Incorrect: changing the setting does not re-date existing facts. Expect stale facts to remain until they expire or are reinforced.","Incorrect: the setting affects repository facts only. User-level preferences always use the default expiry."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.3-05","obj":"3.3.3","difficulty":"medium","type":"order","stem":"Litware, Inc. replaced the build system of a repository. The old .github/copilot-instructions.md describes commands that no longer exist, so you delete it. You want the Copilot cloud agent to generate a new file that reflects the current repository.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Go to the agents tab at github.com/copilot/agents.","Select the repository in the prompt field dropdown.","Paste the documented onboarding prompt and submit it.","Review the pull request that adds the new file and merge it.","Store the new build commands as a user-level preference.","Ask Copilot to make the file task-specific for the current issue."],"answer":[0,1,2,3],"explanation":"The cloud agent can generate repository-wide instructions from the agents tab by using a documented onboarding prompt. Regenerating after a large change replaces stale build guidance, and reviewing the pull request keeps a human in control of what agents will read.","rationale":["Step 1: the agents tab is where you start a cloud agent task that generates the instructions file.","Step 2: the prompt field dropdown selects the repository that the new copilot-instructions.md file is written for.","Step 3: the documented prompt asks the agent to add .github/copilot-instructions.md with validated build, test, and layout details for an agent seeing the repository for the first time.","Step 4: the agent delivers the file in a pull request; a reviewer checks it before merging so that the new context is accurate.","Incorrect: a user-level preference follows one user and is not shared with collaborators. Build commands for the repository belong in repository instructions.","Incorrect: the documented prompt states that instructions must not be task specific. Task-specific details become stale as soon as the task ends."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions?tool=webui"},{"id":"3.3.3-06","obj":"3.3.3","difficulty":"hard","type":"yesno","stem":"Adatum Corporation reviews how Copilot Memory limits stale context in its repositories.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["When Copilot downvotes a memory, the time remaining before the memory expires is shortened.","Copilot is instructed not to store short-lived or task-specific instructions as memories.","Copilot checks the citations of a repository fact against the current branch before it uses the fact.","User-level preferences use the expiry period that an organization owner sets for repository facts."],"answer":[1,2],"explanation":"Copilot Memory limits stale context through citation checks, voting, expiry, and rules about what is stored. Each mechanism has limits, so important rules belong in custom instructions and wrong memories should be deleted.","rationale":["No: downvoting does not change the remaining time. Memories downvoted past a threshold are no longer used and are deleted after disuse.","Yes: Copilot is instructed not to store short-lived or task-specific instructions, which would quickly become stale context.","Yes: before it uses a fact, Copilot checks the fact's citations against the current branch, which helps it skip facts about code that changed.","No: the configurable expiry applies to repository facts only. User-level preferences always use the default expiry."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.3.3-07","obj":"3.3.3","difficulty":"easy","type":"single","stem":"Relecloud has a mandatory security rule that the Copilot cloud agent must follow in every task in a repository. The rule must not depend on knowledge that can expire.\n\nWhich location should you use to record the rule?","choices":["In a repository fact in Copilot Memory","In a user-level preference in Copilot Memory","In the repository custom instructions","In the description of a closed pull request"],"answer":[2],"explanation":"Custom instructions are the place for important, consistent rules, while Copilot Memory holds accumulated detail that can be downvoted or expire. Neither guarantees compliance, but instructions do not age out.","rationale":["Incorrect: repository facts expire after a period without validation and are applied by judgment, so a mandatory rule could silently disappear.","Incorrect: a user-level preference follows one user and also expires. Tasks assigned by other users would not receive the rule.","Correct: the documentation recommends custom instructions for important rules such as security requirements, because they are provided on every request and do not expire.","Incorrect: Copilot can capture facts from closed pull requests, but this is not guaranteed and the result would still be a memory that can expire."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.1.1-01","obj":"4.1.1","difficulty":"medium","type":"dropdown","stem":"User2 writes an issue that asks the Copilot cloud agent to add a CSV export button to the orders page. User2 must place each statement in the correct section of the issue template so that the agent knows what to build, when it is done, and where it may work.\n\nHow should User2 complete the issue? To answer, select the appropriate options in the answer area.\n\n- \"Unit tests cover the new export function.\" goes in [[1]].\n- \"Change only files under src/web/orders/.\" goes in [[2]].\n- \"Users cannot download their order history.\" goes in [[3]].","answer":[1,2,0],"explanation":"A well-scoped issue acts as the prompt for the cloud agent. It needs a clear problem description, complete acceptance criteria such as whether unit tests are needed, and directions about which files to change.","ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results","case":"C-d","targets":[{"label":"Box 1","options":["Problem","Acceptance criteria","Files in scope"],"why":["Incorrect: the Problem section describes what is wrong for users. A testing requirement is a completion condition, not a problem statement.","Correct: whether unit tests are required is part of complete acceptance criteria, which tell the agent when the work is done.","Incorrect: Files in scope directs the agent to where it may change code. A test requirement says how the result is judged, not where to work."]},{"label":"Box 2","options":["Problem","Acceptance criteria","Files in scope"],"why":["Incorrect: a path restriction is not a description of the problem. Keeping it in Problem hides an operational constraint inside the narrative.","Incorrect: acceptance criteria state outcomes. A list of allowed paths is better stated as direction about which files to change.","Correct: the documentation recommends giving directions about which files to change, which is an operational constraint on the agent's scope."]},{"label":"Box 3","options":["Problem","Acceptance criteria","Files in scope"],"why":["Correct: a clear description of the problem from the user's point of view tells the agent what needs to be solved.","Incorrect: this statement describes the current failure, not a verifiable condition for completion. Acceptance criteria describe the outcome to verify.","Incorrect: the statement says nothing about which files may change, so it does not belong in Files in scope."]}]},{"id":"4.1.1-02","obj":"4.1.1","difficulty":"medium","type":"order","stem":"Contoso, Ltd. wants developers to get an implementation plan with success criteria, risks, and out-of-scope items before any feature work starts. You decide to use the implementation planner custom agent from the GitHub Docs customization library in the repository.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create the file .github/agents/implementation-planner.agent.md.","Add frontmatter with the name, description, and tools of the agent, followed by its instructions.","Commit the file and merge it to the default branch.","On the agents tab, select the implementation-planner agent and describe the feature.","Save the profile as .github/instructions/implementation-planner.instructions.md.","Assign the feature issue to Copilot before the profile is merged."],"answer":[0,1,2,3],"explanation":"A custom agent is a .agent.md profile in .github/agents with frontmatter that names it and limits its tools. It becomes selectable after it is merged to the default branch, and its instructions define the expected plan structure.","rationale":["Step 1: custom agent profiles are stored in the .github/agents directory with a .agent.md extension.","Step 2: the frontmatter sets name, description, and tools such as read, search, and edit, and the body defines the plan structure that the agent must produce.","Step 3: the tutorial says to commit the file and merge it into the default branch so that the agent is available in the repository.","Step 4: once merged, you select the agent on the agents tab and give it the feature to plan.","Incorrect: .instructions.md files are path-specific custom instructions, not custom agent profiles, so the planner would not be selectable as an agent.","Incorrect: assigning work before the profile is on the default branch means the planner is not available, so the default agent would start coding without a plan."],"ref":"https://docs.github.com/en/copilot/tutorials/customization-library/custom-agents/implementation-planner"},{"id":"4.1.1-03","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. creates a custom agent that writes implementation plans. The agent must be able to read and search the code and write a plan document, and it must not have other tools.\n\nWhich tools value should you use in the agent profile?","choices":["[\"read\", \"search\"]","[\"read\", \"search\", \"edit\"]","[\"edit\"]","[\"search\", \"edit\"]"],"answer":[1],"explanation":"The tools list in a custom agent profile is a capability boundary. The implementation planner example uses read, search, and edit so that the agent can study the code and write the plan, with nothing more.","rationale":["Incorrect: without edit, the agent can study the code but cannot write the plan document that is the expected output.","Correct: read and search let the agent study the codebase, and edit lets it write the plan document. This matches the implementation planner example.","Incorrect: edit alone lets the agent write files but not read or search the code, so its plan would not be grounded in the codebase.","Incorrect: without read, the agent cannot open the files that search finds, so it cannot analyze the code that the plan depends on."],"ref":"https://docs.github.com/en/copilot/tutorials/customization-library/custom-agents/implementation-planner"},{"id":"4.1.1-04","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Woodgrove Bank defines agent tasks by using a task contract. For a vulnerability fix, the contract must state that required checks pass, the vulnerable version is replaced, and no unexpected files change.\n\nWhich part of the task contract should contain these statements?","choices":["Inputs","Outputs","Success criteria","Operational constraints"],"answer":[2],"explanation":"A task contract defines inputs (what the agent needs), outputs (what it produces), and success criteria (how results are evaluated). Vague success criteria let an agent finish work that looks plausible but misses the goal.","rationale":["Incorrect: inputs describe what the agent receives, such as the alert, the repository scope, and constraints. They do not describe how the result is judged.","Incorrect: outputs describe what the agent produces, such as the plan, the bounded changeset, and evidence links. They are the things being evaluated.","Correct: success criteria state how results are evaluated, such as passing checks, a resolved security signal, and a scope that matches intent.","Incorrect: constraints such as no workflow changes and no direct pushes are part of the inputs. They limit how the agent works, not how the outcome is judged."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/3-inputs-outputs-success-criteria"},{"id":"4.1.1-05","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Tailspin Toys allows the Copilot cloud agent to change application code. Any change to files under .github/workflows/ must be approved by the platform team before it can merge, even when the agent makes the change.\n\nWhat should you use to enforce this constraint?","choices":["A sentence in the issue that asks the agent to avoid workflow files","A repository fact in Copilot Memory that lists the platform team","CODEOWNERS for .github/workflows/ with required code owner review","A read-only GITHUB_TOKEN for every workflow in the repository"],"answer":[2],"explanation":"Operational constraints must be enforced by the system rather than assumed from the agent. High-risk paths such as .github/workflows/ are protected with CODEOWNERS, multiple reviews, and stricter rulesets so that the right owners must approve.","rationale":["Incorrect: an instruction in the issue tells the agent what is expected, but nothing blocks the merge if the agent or another contributor ignores it.","Incorrect: memories inform Copilot and are applied by judgment. A fact cannot require an approval from the platform team before merging.","Correct: assigning the path to the platform team in CODEOWNERS and requiring code owner review blocks merging until that team approves, regardless of who made the change.","Incorrect: a read-only token limits what workflows can write, but it does not require platform team approval and would break workflows that need write access."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/6-reliable-workflows"},{"id":"4.1.1-06","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Litware, Inc. wants the Copilot cloud agent to prepare changes to production deployment settings. The agent must not be able to run a production deployment on its own, and a human must approve each deployment.\n\nHow should you design the task constraints?","choices":["Let the agent prepare the change and protect the deploy job with an environment that has required reviewers","Let the agent merge the change by using automerge after all required checks pass","Let the agent run the deploy job when CODEOWNERS for infra/ have reviewed the plan","Give the agent the production secrets so that it can run and verify the deployment by itself"],"answer":[0],"explanation":"Autonomy should match the risk of the task. For critical actions such as production deployments, the agent prepares the change and an environment with required reviewers pauses the deploy job until a human approves.","rationale":["Correct: a job that targets an environment with required reviewers pauses until approval, so the agent can prepare changes but cannot execute the production deployment by itself.","Incorrect: automerge after checks is suitable for low-risk work such as documentation. It removes the human approval that a critical deployment needs.","Incorrect: CODEOWNERS review controls merging of files, not the execution of a deployment job, and it would still let the agent run the deployment.","Incorrect: handing production secrets to the agent widens its access and breaks least privilege. Secrets should stay behind protected boundaries such as environments."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/6-reliable-workflows"},{"id":"4.1.1-07","obj":"4.1.1","difficulty":"medium","type":"single","stem":"Northwind Traders uses the implementation planner custom agent. Reviewers complain that plans do not make clear which related work the team deliberately leaves for later.\n\nWhich section of the plan should state this work?","choices":["Overview","Technical Approach","Considerations","Not Included"],"answer":[3],"explanation":"The implementation planner produces a plan with an overview and success criteria, a technical approach, phased tasks, considerations, and a Not Included section. Stating what is out of scope keeps the agent and reviewers aligned on the expected outcome.","rationale":["Incorrect: the Overview summarizes the feature and its success criteria, which describe what done looks like rather than what is excluded.","Incorrect: the Technical Approach explains how the work will be built. Listing excluded work there mixes design with scope decisions.","Incorrect: Considerations lists assumptions, constraints, and risks. Deliberately excluded work is a scope boundary, not a risk.","Correct: the Not Included section states what is out of scope, so reviewers and implementers know which work is intentionally deferred."],"ref":"https://docs.github.com/en/copilot/tutorials/customization-library/custom-agents/implementation-planner"},{"id":"4.1.1-08","obj":"4.1.1","difficulty":"easy","type":"single","stem":"Adatum Corporation reviews plans that an agent writes in pull request descriptions. Each plan already lists the scope and the success criteria.\n\nWhich other element should you require so that the plan is easier to review for higher-risk changes?","choices":["A rollback or escalation path","The model temperature used for the task","A list of every file in the repository","The agent's confidence score for the plan"],"answer":[0],"explanation":"Plans become more reviewable when they include scope, success criteria, and a rollback or escalation path. Together, these state what will change, how success is judged, and what happens if it fails.","rationale":["Correct: a rollback or escalation path tells reviewers how a failed or risky change will be undone or handed off, which completes scope and success criteria.","Incorrect: model settings do not tell a reviewer what will change or how to recover. They are not part of a reviewable plan.","Incorrect: listing every file hides the real scope. A plan should name the files that will change, not the whole repository.","Incorrect: evaluation must be grounded in system signals, not in the agent's confidence, so a self-reported score adds no reviewable evidence."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/3-explain-agent-lifecycle-plan-act-evaluate"},{"id":"4.1.1-09","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Relecloud wants to delegate one of these tasks to the Copilot cloud agent:\n\n- Task1: respond to a production incident in the payment service\n- Task2: redesign the data model while requirements are still being discussed\n- Task3: add unit tests for the invoice module, with acceptance criteria and target files listed in the issue\n- Task4: change how the login service stores personal data\n\nWhich task should you assign to the cloud agent?","choices":["Task1","Task2","Task3","Task4"],"answer":[2],"explanation":"The cloud agent works best on well-scoped tasks with a clear problem, complete acceptance criteria, and directions on which files to change. Sensitive, ambiguous, broad, or incident response tasks are better kept with humans.","rationale":["Incorrect: incident response is listed as a sensitive task that is better handled by a human, because it is production-critical and time-sensitive.","Incorrect: ambiguous work without clear requirements gives the agent no reliable definition of done, so it is better kept with a human.","Correct: Task3 has a clear goal, acceptance criteria, and target files, which is the kind of well-scoped issue that the cloud agent handles well.","Incorrect: changes that involve personal data and security are sensitive and are better kept with humans, even if the issue is well written."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"4.1.1-10","obj":"4.1.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. writes a task for an agent that runs integration tests against a partner API. The tests need an API token. The token must not appear in repository content, and only the component that calls the API may receive it.\n\nHow should you provide the token?","choices":["Add the token to .github/copilot-instructions.md","Inject it at runtime from a protected secret boundary","Write the token in plain text in the workflow YAML","Store it as a repository secret exposed to every job"],"answer":[1],"explanation":"Secrets are operational constraints: they must stay out of instructions files, committed configuration, and workflow YAML. Inject them at runtime through protected secret boundaries, scoped to the components that need them.","rationale":["Incorrect: instructions files are repository content that every agent reads, so the token would be exposed to anyone with read access.","Correct: a protected secret boundary injects the token at runtime and can be scoped, for example by environment, so only the component that calls the API receives it.","Incorrect: workflow YAML is committed content, so a plain text token leaks to everyone who can read the repository.","Incorrect: a repository secret exposed to every job keeps the token out of repository content, but components that do not call the API also receive it, which breaks least privilege."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"4.1.2-01","obj":"4.1.2","difficulty":"medium","type":"dragdrop","stem":"Contoso, Ltd. evaluates pull requests that the Copilot cloud agent opens. The team must pick the signal that answers each evaluation question.\n\nWhich signal should you use for each question? To answer, drag the appropriate signals to the correct questions. Each signal may be used once, more than once, or not at all.","choices":["Required status check results","Code review feedback","Dependency review","Session token usage and length","Secret scanning alerts"],"answer":[1,2,3,0],"explanation":"Evaluation combines quantitative signals, such as check results and usage numbers, with qualitative signals, such as reviewer judgment. Pick the signal that actually measures the question instead of relying on the agent's confidence.","rationale":["Question1 asks for a judgment about architecture fit, which only human code review feedback provides; check results cannot judge design intent.","Question2 is about a dependency added in a lock file, and dependency review reports changes to indirect dependencies along with known vulnerabilities.","Question3 asks for duration and tokens, which the agent session view reports as session length and token usage.","Question4 is answered by the required status checks for the build, test, and lint workflows, which give a pass or fail result per run."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/3-explain-agent-lifecycle-plan-act-evaluate","targets":["Question1: does the change follow the team's architecture expectations?","Question2: does a package version added in the lock file have a known vulnerability?","Question3: how long did the agent session run and how many tokens did it use?","Question4: do the build, test, and lint jobs pass?"],"notes":["Pass or fail results of workflows such as build, test, and lint. A quantitative signal that answers whether automated checks succeed.","Requested changes and approvals from human reviewers. A qualitative signal for design, readability, and architecture fit that automation cannot judge.","Shows added, removed, and updated dependencies in a pull request, including indirect ones in lock files, with known vulnerability data.","The agent session view shows progress, token usage, and session length. Use it to measure the cost and duration of agent work.","Alerts for credentials found in the code. Use them to detect exposed secrets, not vulnerable packages or design problems."]},{"id":"4.1.2-02","obj":"4.1.2","difficulty":"medium","type":"multi","stem":"Fabrikam, Inc. builds a dashboard that tracks the quality of agent work over time. The dashboard must show only quantitative signals.\n\nWhich two signals should you include? Each correct answer presents a complete solution.","choices":["The pass rate of an evaluation set across repeated runs","A reviewer comment that a function is hard to read","The number of required checks that failed on each agent pull request","A code owner's judgment that a design fits the architecture","The assumptions that the agent lists in its plan"],"answer":[0,2],"explanation":"Quantitative signals are measured values such as pass rates and counts of failed checks. Qualitative signals are judgments and narrative evidence such as review comments and plan assumptions, which matter but cannot be charted as numbers directly.","rationale":["Correct: a pass rate measured over repeated runs is a numeric signal, and repeated runs account for the probabilistic results of agents.","Incorrect: a comment about readability is a human judgment, which is a qualitative signal. It is valuable in review but is not a measured value.","Correct: the count of failed required checks is a numeric result of workflow runs and can be tracked over time.","Incorrect: an architecture judgment by a code owner is qualitative. It answers whether the change fits, not how much or how often.","Incorrect: plan assumptions are narrative evidence that reviewers read to judge intent. They are qualitative, not measured values."],"ref":"https://learn.microsoft.com/agents/agent-evaluation/evaluation-checklist"},{"id":"4.1.2-03","obj":"4.1.2","difficulty":"easy","type":"single","stem":"Tailspin Toys classifies the evaluation signals for agent pull requests.\n\nWhich signal should you classify as qualitative?","choices":["The number of failing unit tests","The count of open code scanning alerts","A reviewer's request for changes about the design","The length of the agent session in minutes"],"answer":[2],"explanation":"Common evaluation signals in GitHub include workflow runs and status checks, code review feedback, and security signals. Review feedback is qualitative because it records human judgment, while counts and durations are quantitative.","rationale":["Incorrect: a count of failing tests is a measured value from a workflow run, so it is quantitative.","Incorrect: a count of alerts is a number from a scanning tool, so it is quantitative even though it measures security.","Correct: a request for changes captures a reviewer's judgment about the design, which is a qualitative signal.","Incorrect: session length is a measured duration that the session view reports, so it is quantitative."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/3-explain-agent-lifecycle-plan-act-evaluate"},{"id":"4.1.2-04","obj":"4.1.2","difficulty":"easy","type":"single","stem":"At Litware, Inc., User1 must compare how many tokens and how much time different Copilot cloud agent sessions use.\n\nWhich location should User1 check for these values?","choices":["The session view of each agent session","The Dependabot alerts page of the repository","The code scanning tool status page","The organization audit log"],"answer":[0],"explanation":"Agent sessions report progress, token usage, and session length in the session view. These quantitative values help compare the cost and duration of agent work.","rationale":["Correct: the session view shows the progress of a session together with its token usage and session length.","Incorrect: Dependabot alerts list vulnerable dependencies. They contain no data about agent sessions.","Incorrect: the tool status page shows the health of code scanning tools. It is used to debug scanning setup, not agent sessions.","Incorrect: the audit log records events such as who did what and when. It is not where token usage and session length are reported."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"4.1.2-05","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Relecloud changes the custom instructions for an agent and runs its evaluation set once. The pass rate rises from 78% to 84%.\n\nWhat should you do before you conclude that the change improved the agent?","choices":["Accept the result, because one run is enough","Run the evaluation several times and compare to the baseline","Ask the agent to rate its own improvement","Remove the test cases that failed in the new run"],"answer":[1],"explanation":"Agent results are probabilistic, so a single run can differ from the next. Compare repeated runs against a baseline pass rate before you treat a change as an improvement.","rationale":["Incorrect: a single run can vary by chance, so a six-point difference may not be a real improvement.","Correct: running the evaluation multiple times and comparing to the baseline shows whether the improvement holds beyond normal variation.","Incorrect: the agent's opinion of its own work is not an objective signal. Evaluation must rely on measured results.","Incorrect: removing failing cases inflates the pass rate and hides real gaps. It changes the test, not the agent."],"ref":"https://learn.microsoft.com/agents/agent-evaluation/evaluation-checklist"},{"id":"4.1.2-06","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Woodgrove Bank iterates on an agent until its evaluation results are good enough to release. The team needs a rule that decides when to stop iterating.\n\nWhich rule should you use?","choices":["Stop when one run scores above the threshold","Stop when the agent reports that every case passes","Stop after the hardest test cases are removed","Stop when runs stay above the threshold with little variation"],"answer":[3],"explanation":"Stop iterating when evaluation sets are above their thresholds, remaining gaps are documented, and scores vary only a little between runs. A single good run or a trimmed test set does not show stable quality.","rationale":["Incorrect: one run can be above the threshold by chance. Stable results across runs are required before you stop.","Incorrect: the agent's own report is not a measured signal and can be wrong, so it cannot decide when quality is sufficient.","Incorrect: removing hard tests to reach a threshold is explicitly discouraged, because the score no longer reflects real performance.","Correct: results above the threshold with run-to-run variation under about 5%, plus documented gaps, show that further iteration is unlikely to change the outcome."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/evaluation-triage-pattern"},{"id":"4.1.2-07","obj":"4.1.2","difficulty":"easy","type":"single","stem":"A pull request from the Copilot cloud agent at Contoso, Ltd. ends with the sentence \"All requirements are met and the fix is complete.\"\n\nWhich evidence should you rely on to decide whether the fix is complete?","choices":["The agent's closing sentence in the pull request description","The number of commits that the agent pushed to the branch","Required checks and security signals on the pull request","The length of the pull request description"],"answer":[2],"explanation":"Agent evaluation must be grounded in system signals such as workflow runs, status checks, review feedback, and security signals, not in the agent's confidence. A claim of completion is a statement to verify, not evidence.","rationale":["Incorrect: the agent's claim reflects its confidence, not objective evidence. It must be verified with system signals.","Incorrect: the number of commits says nothing about whether the requirements are met. A large or small history can hide failures.","Correct: required checks and security signals are objective evidence produced by the system, so they show whether the fix actually works.","Incorrect: a long description can look thorough without proving anything. Evidence comes from checks, reviews, and scans."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/3-explain-agent-lifecycle-plan-act-evaluate"},{"id":"4.1.2-08","obj":"4.1.2","difficulty":"hard","type":"single","stem":"An agent pull request at Northwind Traders passes every required check. The plan in the description says that only src/api/orders will change, but the diff also changes files under infra/.\n\nWhich signal should you use to detect this kind of problem in future pull requests?","choices":["Rerunning the required checks on the pull request","Reviewing changed files against the scope of the plan","Checking the token usage of the agent session","Checking the secret scanning alerts for the pull request"],"answer":[1],"explanation":"Passing checks validate only what they are designed to detect. Comparing the changed files with the plan's scope is a qualitative review signal that catches unexpected changes that CI cannot see.","rationale":["Incorrect: the checks already passed and test behavior, not scope. Rerunning them produces the same result.","Correct: the review rubric asks whether the changed files align with the plan, which exposes out-of-scope changes such as edits under infra/.","Incorrect: token usage measures cost and effort. It does not show which files the agent changed.","Incorrect: secret scanning finds exposed credentials. It does not compare a diff with the intended scope."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/6-apply-contributor-model-agent-generated-work"},{"id":"4.1.2-09","obj":"4.1.2","difficulty":"hard","type":"single","stem":"Adatum Corporation uses GitHub Code Quality and uploads code coverage data. The company must block agent pull requests that lower line coverage by more than two percentage points compared to the default branch.\n\nWhich ruleset rule should you use?","choices":["Require code scanning results","Require code quality results","Restrict code coverage","Require status checks to pass"],"answer":[2],"explanation":"Code coverage is a quantitative signal. The Restrict code coverage rule, which is in public preview, can block merges based on a minimum line coverage percentage or a maximum coverage drop relative to the default branch.","rationale":["Incorrect: this rule blocks merges based on code scanning alerts and tool status. It does not evaluate coverage data.","Incorrect: this rule blocks merges based on Code Quality findings and their severity. It does not compare line coverage to the default branch.","Correct: Restrict code coverage supports a maximum line coverage drop in percentage points relative to the default branch, which matches the requirement.","Incorrect: required status checks only enforce that named checks pass. They do not measure coverage drop unless you build that logic yourself."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"4.1.2-10","obj":"4.1.2","difficulty":"medium","type":"single","stem":"Proseware, Inc. uses CODEOWNERS for its infra/ directory. A reviewer must confirm that the right people evaluated the infra/ changes in an agent pull request.\n\nWhich signal should the reviewer check?","choices":["The approval from the code owners of infra/","The approval from any user with write access","The result of the required build check","The approval from the user who assigned the issue"],"answer":[0],"explanation":"The contributor model reviews agent work like any contribution. Ownership is a qualitative signal: the code owners of sensitive areas must review and approve the change.","rationale":["Correct: the review rubric asks whether code owners reviewed sensitive areas, and their approval on the pull request is the signal that they did.","Incorrect: an approval from any user with write access shows that someone reviewed the change, not that the owners of infra/ evaluated it.","Incorrect: a passing build shows that the code compiles and tests pass. It does not show that the owners of infra/ reviewed it.","Incorrect: the user who asked Copilot to create the pull request cannot provide a required approval for it, and that user is not necessarily an owner of infra/."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/6-apply-contributor-model-agent-generated-work"},{"id":"4.1.3-01","obj":"4.1.3","difficulty":"medium","type":"dropdown","stem":"Litware, Inc. builds an evaluation test set for an HR policy agent. The agent instructions say that the agent must answer leave questions only from the policy knowledge article, cite the article, and send questions that the article does not cover to HR support. The acceptance criteria of each test case must match this intent.\n\nHow should you complete the test cases? To answer, select the appropriate options in the answer area.\n\n- Test case 1 asks \"How many vacation days do new employees get?\", which the article answers. Acceptance criteria: [[1]].\n- Test case 2 asks \"Can I carry over unused sick days?\", which the article does not cover. Acceptance criteria: [[2]].","answer":[1,0],"explanation":"Test cases should come directly from the agent instruction requirements, and their acceptance criteria define what passes and what fails. Criteria that check grounding, citation, and routing for out-of-scope questions keep the evaluation aligned with what the team intends the agent to do.","ref":"https://learn.microsoft.com/en-us/agents/agent-evaluation/evaluation-checklist","targets":[{"label":"Box 1","options":["The response is friendly and states a number of days","The response matches the article text and includes a citation","The response directs the user to HR support"],"why":["Incorrect: a friendly answer with any number can pass even when the number is wrong or invented, so it does not test grounding in the article.","Correct: the intent is to answer from the policy article with a citation, so the criteria must check the article text and the citation.","Incorrect: the article covers this question, so routing it to HR would fail the intent that the agent answers covered questions itself."]},{"label":"Box 2","options":["The response routes the user to HR support and invents no policy","The response quotes the closest related policy with a citation","The response states the carry-over rule that most companies use"],"why":["Correct: the instructions require questions outside the article to go to HR, so the criteria must check the routing and that no policy is made up.","Incorrect: quoting a related policy can sound grounded but answers a question the article does not cover, which the instructions forbid.","Incorrect: a generic rule is not from the article, so a criterion that accepts it would reward the agent for answering beyond its knowledge."]}]},{"id":"4.1.3-02","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. asks an agent to remediate a vulnerable package. The current success criterion is \"All tests pass.\"\n\nWhich success criterion should you use instead to match the intent of the task?","choices":["The agent reports that it updated the package to the latest version","The vulnerable version is no longer reachable, even transitively","The pull request has no merge conflicts with the default branch","The build finishes in under ten minutes"],"answer":[1],"explanation":"CI passing is necessary but not always sufficient. Success criteria should reflect the real intent of the task, such as the vulnerability being resolved, because an agent can update a direct dependency and leave the vulnerable version reachable through a transitive one.","rationale":["Incorrect: the agent's report is not evidence, and updating the direct package can still leave the vulnerable version in the dependency tree.","Correct: this criterion tests the actual intent, a resolved vulnerability, and closes the gap where a transitive dependency keeps the old version.","Incorrect: a clean merge says nothing about whether the vulnerability is fixed. It is a mechanical condition, not the task's goal.","Incorrect: build speed is unrelated to the vulnerability. Meeting it would not show that the security problem is resolved."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/3-inputs-outputs-success-criteria"},{"id":"4.1.3-03","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. receives its first pull requests from an agent. Some reviewers want to reject them because an AI wrote them, and others want to approve them because automation produced them.\n\nHow should reviewers evaluate the agent's pull requests?","choices":["Reject them unless a human rewrites the code","Approve them when the agent says the work is complete","Apply the same review criteria as for any contribution","Approve them automatically when CI passes"],"answer":[2],"explanation":"The contributor model treats agent work as a contribution and judges it by the standards of the workflow: intent, scope, evidence, ownership, and policy. It avoids both excessive suspicion and excessive trust.","rationale":["Incorrect: rejecting work because AI wrote it is the excessive suspicion error. The change should be judged on its merits.","Incorrect: the agent's claim is not evidence, and approving on its word is the excessive trust error.","Correct: the contributor model evaluates agent pull requests with the same criteria as any contribution, not by the novelty of the author.","Incorrect: checks validate only what they are designed to detect, so automatic approval on CI alone is blind trust in automation."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/6-apply-contributor-model-agent-generated-work"},{"id":"4.1.3-04","obj":"4.1.3","difficulty":"easy","type":"single","stem":"Tailspin Toys adds a CodeQL workflow that checks every pull request to main. Agent pull requests must not merge until this workflow passes.\n\nWhat should you configure?","choices":["The workflow as a required status check in a ruleset","A sentence in the issue that asks the agent to wait","A repository fact that says the workflow must pass","A label that marks agent pull requests as unsafe"],"answer":[0],"explanation":"Success should be enforced by the system, not assumed by the agent. Configuring the workflow as a required check through a ruleset or branch protection blocks merging until it passes.","rationale":["Correct: a required status check, set through a ruleset or branch protection, prevents merging until the workflow passes.","Incorrect: a request in the issue informs the agent, but it does not stop anyone from merging the pull request early.","Incorrect: memories inform Copilot and can expire. They cannot block a merge.","Incorrect: a label documents a concern but does not enforce anything unless a rule acts on it."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/3-inputs-outputs-success-criteria"},{"id":"4.1.3-05","obj":"4.1.3","difficulty":"easy","type":"single","stem":"An agent pull request at Relecloud updates a dependency and also changes two configuration files that the issue did not mention.\n\nWhich question should reviewers ask first?","choices":["Whether the extra changes are justified","Whether the agent used fewer tokens than last time","Whether the commit messages are short","Whether the branch name starts with copilot/"],"answer":[0],"explanation":"Under the contributor model, reviewers ask whether extra changes are justified, whether checks cover the risk introduced, and whether the right owners reviewed the affected areas, not only whether the code compiles.","rationale":["Correct: unexpected changes must be justified against the intent of the task before reviewers rely on any other signal.","Incorrect: token usage measures cost, not whether the configuration changes match the intent of the task.","Incorrect: commit message length is a style detail. It does not tell reviewers whether the extra changes belong in the pull request.","Incorrect: the branch name shows that Copilot created the branch. It says nothing about whether the changes are appropriate."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/6-apply-contributor-model-agent-generated-work"},{"id":"4.1.3-06","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Woodgrove Bank requires an 80% pass rate on an agent evaluation set before release. The agent scores 76%. A team member proposes deleting the six hardest test cases, which would raise the score to 82%.\n\nWhat should you do?","choices":["Delete the six hardest test cases and release the agent","Lower the threshold to 75% without recording the reason","Rerun the evaluation set until one run scores above 80%","Keep the cases, triage the failures, and fix or document gaps"],"answer":[3],"explanation":"Evaluation criteria must keep measuring what the team intends the agent to do. Removing hard tests to meet a threshold hides real gaps; triage the failures, fix the agent, or document the remaining gaps instead.","rationale":["Incorrect: deleting hard tests to reach a threshold is explicitly discouraged, because the score no longer reflects how the agent performs.","Incorrect: quietly lowering the threshold changes the bar instead of the agent and leaves no record of the decision.","Incorrect: rerunning until one run passes exploits randomness. Stable results across runs are what show quality.","Correct: keeping the hard cases and triaging the failures preserves the intent of the evaluation, and documented gaps make any release decision explicit."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/evaluation-triage-pattern"},{"id":"4.1.3-07","obj":"4.1.3","difficulty":"hard","type":"single","stem":"At Northwind Traders, agent pull requests that change infra/ must merge only after the same scrutiny as other high-risk work. Today, only unit tests are required for all paths.\n\nHow should you align the evaluation criteria with the risk of these changes?","choices":["Require unit tests only, because they already pass","Require CODEOWNERS, multiple reviews, and stricter rulesets","Enable automerge after the required checks pass","Ask the agent to review its own infra/ changes"],"answer":[1],"explanation":"Checks and approvals should match the risk of the change. Paths such as infra/ and .github/workflows/ are high risk and call for CODEOWNERS, multiple reviews, and stricter rulesets, while low-risk paths can use lighter controls.","rationale":["Incorrect: unit tests do not cover infrastructure risk. Passing them says little about whether an infra/ change is safe.","Correct: the risk-based autonomy model assigns CODEOWNERS, multiple reviews, and stricter rulesets to high-risk paths such as infra/.","Incorrect: automerge after checks fits low-risk paths such as docs/. It removes human review from high-risk changes.","Incorrect: self-review by the agent is not independent evidence and does not add owner judgment."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/6-reliable-workflows"},{"id":"4.1.3-08","obj":"4.1.3","difficulty":"medium","type":"single","stem":"Adatum Corporation changed the format of order confirmations on purpose. An evaluation case for its support agent still expects the old format, and the agent now fails that case.\n\nWhat should you do?","choices":["Change the agent so that it returns the old format","Update the test case to expect the new format","Delete the agent's custom instructions","Remove the case from the set permanently"],"answer":[1],"explanation":"When a test fails, first decide whether the test case or the agent design is wrong. A test case that no longer matches the intended behavior must be updated so that the evaluation stays aligned with what the team wants.","rationale":["Incorrect: the format change was intentional, so changing the agent back would make it worse at the real goal just to satisfy an outdated test.","Correct: this is a test case issue, not an agent design issue. Updating the expected output realigns the evaluation with the intended behavior.","Incorrect: the instructions are not the cause of the failure. Removing them would degrade the agent without fixing the test.","Incorrect: the case still covers useful behavior. Removing it loses coverage instead of correcting the expectation."],"ref":"https://learn.microsoft.com/agents/agent-evaluation/evaluation-checklist"},{"id":"4.1.3-09","obj":"4.1.3","difficulty":"hard","type":"single","stem":"Proseware, Inc. lets an agent revise its pull request branch when a required check fails. The same required integration check has now failed twice in a row.\n\nWhat should happen next?","choices":["Escalate to a human reviewer with what failed and what was tried","Let the agent keep retrying until the check passes","Disable the integration check for agent pull requests","Merge the change by using an administrator bypass"],"answer":[0],"explanation":"A safe iteration policy allows bounded retries and then escalates. If the same required check fails twice, hand off to a human with what failed, what was attempted, the evidence, and a suggested next step.","rationale":["Correct: after two failures of the same check, the policy escalates to a human reviewer with a summary of the failure, the attempts, the evidence, and a suggested next step.","Incorrect: unbounded retries can loop forever and hide a problem that needs human judgment.","Incorrect: disabling the check removes the success criterion instead of meeting it, so the evaluation no longer reflects intent.","Incorrect: bypassing protections merges a change that failed its required evidence, which defeats the purpose of the check."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"4.1.4-01","obj":"4.1.4","difficulty":"medium","type":"multi
