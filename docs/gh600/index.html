","stem":"You need to meet the technical requirements for checking the pull requests that the Copilot cloud agent opens in orders-service.\n\nWhich two features should you rely on? Each correct answer presents part of the solution.","choices":["Secret scanning that the cloud agent runs on its own changes","The cloud agent check of new dependencies against the GitHub Advisory Database","A new workflow that runs actions/dependency-review-action","A ruleset rule that requires code scanning results","A repository fact that tells Copilot to look for credentials"],"answer":[0,1],"explanation":"The Copilot cloud agent has built-in validation tools: CodeQL, a GitHub Advisory Database check of new dependencies, secret scanning, and Copilot code review. They run before the agent completes its pull request and need no GitHub Advanced Security, Code Security, or Secret Protection license.","rationale":["Correct: the built-in secret scanning checks the agent's changes for exposed credentials before it completes, without a Secret Protection license.","Correct: the built-in dependency check compares new dependencies with the GitHub Advisory Database for malware and High or Critical vulnerabilities, without extra licenses.","Incorrect: in a private repository the dependency review action needs GitHub Code Security or Advanced Security, and it adds a workflow that the platform team must maintain.","Incorrect: code scanning in a private repository needs a GitHub Code Security license, which the company must not buy during the pilot.","Incorrect: a memory only informs Copilot and is applied by judgment. It is not a scan and produces no evaluation signal."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations","case":"C-d"},{"id":"4.1.4-02","obj":"4.1.4","difficulty":"medium","type":"single","stem":"Relecloud uses the Copilot cloud agent in a private repository. Relecloud has no GitHub Advanced Security, GitHub Code Security, or GitHub Secret Protection licenses. You need to ensure that new dependencies that the agent adds are checked against the GitHub Advisory Database before the agent completes its pull request.\n\nSolution: You keep the default Validation tools settings of the Copilot cloud agent.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"The cloud agent runs a GitHub Advisory Database check of new dependencies as one of its built-in validation tools. The tools are on by default and need no security license.","rationale":["Correct: with the default settings the agent checks new dependencies against the GitHub Advisory Database and tries to resolve findings before it completes the pull request, with no license needed.","Incorrect: the solution does meet the goal. No would be right only if an administrator had turned off the validation tools in the cloud agent settings."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations","series":"S-d"},{"id":"4.1.4-03","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Relecloud uses the Copilot cloud agent in a private repository. Relecloud has no GitHub Advanced Security, GitHub Code Security, or GitHub Secret Protection licenses. You need to ensure that new dependencies that the agent adds are checked against the GitHub Advisory Database before the agent completes its pull request.\n\nSolution: You turn off the Validation tools in the Copilot cloud agent settings and enable Dependabot version updates.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Turning off the validation tools removes the built-in dependency check. Dependabot version updates propose newer versions on a schedule; they do not check the dependencies that the agent adds before it finishes.","rationale":["Incorrect: turning off the validation tools stops the very check that compares new dependencies with the GitHub Advisory Database before the agent completes.","Correct: the solution does not meet the goal. Turning the validation tools off is useful only when they conflict with another product or slow work down, not when you need the check."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings","series":"S-d"},{"id":"4.1.4-04","obj":"4.1.4","difficulty":"hard","type":"single","stem":"Relecloud uses the Copilot cloud agent in a private repository. Relecloud has no GitHub Advanced Security, GitHub Code Security, or GitHub Secret Protection licenses. You need to ensure that new dependencies that the agent adds are checked against the GitHub Advisory Database before the agent completes its pull request.\n\nSolution: You add a workflow that runs actions/dependency-review-action on pull requests and make it a required check.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"The dependency review action is available for public repositories and for private repositories with GitHub Code Security or Advanced Security. It also runs on pull request events, after the agent has pushed, so it does not check dependencies before the agent completes.","rationale":["Incorrect: in a private repository without Code Security or Advanced Security the action is not available, and a required check would block merges instead of checking before the agent completes.","Correct: the solution does not meet the goal. The dependency review action is the right choice for public repositories or licensed private repositories that need a merge gate."],"ref":"https://docs.github.com/en/code-security/concepts/supply-chain-security/dependency-review","series":"S-d"},{"id":"4.1.4-05","obj":"4.1.4","difficulty":"medium","type":"order","stem":"Tailspin Toys maintains a public repository. Pull requests from developers and from the Copilot cloud agent must fail a check when they add a dependency with a vulnerability of high severity or higher, and the check must block merging.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Add a workflow file in .github/workflows that runs on: [pull_request].","Add an actions/checkout step to the dependency-review job.","Add an actions/dependency-review-action@v4 step with fail-on-severity: high.","Require the dependency-review check to pass in a ruleset or branch protection rule.","Add the dependency review step to .github/copilot/settings.json.","Add allow-ghsas with every advisory ID that the check reports."],"answer":[0,1,2,3],"explanation":"The dependency review action scans dependency changes in pull requests and fails when it finds vulnerable versions. Requiring the check makes the failure block merging, which turns the scan into an enforced evaluation signal.","rationale":["Step 1: the action reports on dependency changes in pull requests, so the workflow must run on the pull_request event.","Step 2: the documented job checks out the repository before the dependency review step runs.","Step 3: fail-on-severity sets the severity level that makes the action fail, so high meets the requirement.","Step 4: a failed check blocks merging only when the repository requires the dependency review check to pass.","Incorrect: .github/copilot/settings.json configures plugins for Copilot. Workflow steps belong in .github/workflows.","Incorrect: allow-ghsas skips the listed advisories during detection, which would hide the vulnerabilities that the check must report."],"ref":"https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-dependency-review-action"},{"id":"4.1.4-06","obj":"4.1.4","difficulty":"hard","type":"order","stem":"Contoso, Ltd. has GitHub Code Security licenses. Pull requests from the Copilot cloud agent to the default branch must not merge while CodeQL reports alerts of high severity or higher. The ruleset must never block a pull request because a required tool is not yet configured.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Configure code scanning with CodeQL for the repository.","Create a branch ruleset that targets the default branch.","Add the Require code scanning results rule with CodeQL and the high severity threshold.","Turn off the cloud agent Validation tools so that CodeQL runs only once.","Add the Require a pull request before merging rule with one required approval."],"answer":[0,1,2],"explanation":"The Require code scanning results rule blocks merging when a required tool reports alerts at the configured severity, when analysis is in progress, or when the tool is not configured. Code scanning must therefore be set up before the rule is enforced.","rationale":["Step 1: the rule blocks merging if a required tool is not configured, so CodeQL code scanning must be set up first.","Step 2: rules are added to a ruleset, and the ruleset must target the default branch that receives agent pull requests.","Step 3: the rule names CodeQL as a required tool and sets the alert severity that blocks merging.","Incorrect: the built-in CodeQL run helps the agent fix issues before it finishes, but it does not block merges. Turning it off is unnecessary and removes an early signal.","Incorrect: a required approval adds human review before merge, but it does not evaluate CodeQL alerts or their severity."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"4.1.4-07","obj":"4.1.4","difficulty":"medium","type":"dropdown","stem":"Wide World Importers runs the dependency review action in a public repository. The settings must be kept in a separate file. Pull requests must be blocked when they add a dependency under the LGPL-2.0 license, and vulnerabilities must block only when they are in runtime dependencies.\n\nHow should you complete the configuration? To answer, select the appropriate options in the answer area.\n\n```yaml\n# .github/workflows/dependency-review.yml (excerpt)\n      - name: Dependency Review\n        uses: actions/dependency-review-action@v4\n        with:\n          [[1]]: './.github/dependency-review-config.yml'\n```\n\n```yaml\n# .github/dependency-review-config.yml\nfail-on-severity: high\n[[2]]:\n  - LGPL-2.0\nfail-on-scopes:\n  - [[3]]\n```","answer":[0,1,1],"explanation":"The dependency review action can read its settings from a configuration file. In that file, deny-licenses blocks listed licenses and fail-on-scopes limits which dependency scopes can fail the check.","ref":"https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/manage-your-dependency-security/configure-dependency-review-action","targets":[{"label":"Box 1","options":["config-file","external-repo-token","allow-ghsas"],"why":["Correct: config-file points the action to a configuration file, which keeps the settings out of the workflow as required.","Incorrect: external-repo-token is used only when the configuration file is in a private external repository. It does not name the file.","Incorrect: allow-ghsas lists advisory IDs to skip. It is not a path to a configuration file."]},{"label":"Box 2","options":["allow-licenses","deny-licenses","allow-ghsas"],"why":["Incorrect: allow-licenses permits only the listed licenses, so listing LGPL-2.0 would allow it and block everything else.","Correct: deny-licenses blocks pull requests that add dependencies under the listed licenses, such as LGPL-2.0.","Incorrect: allow-ghsas skips advisories during detection. It has nothing to do with licenses."]},{"label":"Box 3","options":["development","runtime","unknown"],"why":["Incorrect: development would fail the check for vulnerabilities in development dependencies, which the requirement excludes.","Correct: fail-on-scopes set to runtime blocks only vulnerabilities in runtime dependencies.","Incorrect: unknown targets dependencies whose scope cannot be determined. It does not match the runtime-only requirement."]}]},{"id":"4.1.4-08","obj":"4.1.4","difficulty":"hard","type":"yesno","stem":"Northwind Traders reviews the built-in validation tools of the Copilot cloud agent in a private repository that has no security licenses.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The built-in validation tools need a GitHub Advanced Security license for the repository.","Details of the validation tool results are visible in the agent session log.","A repository administrator can turn off the validation tools in the Copilot cloud agent settings.","The secret scanning that the agent runs replaces push protection for developers' own pushes."],"answer":[1,2],"explanation":"The cloud agent runs CodeQL, a GitHub Advisory Database check, secret scanning, and Copilot code review on its own changes, without extra licenses. Results appear in the session log, and administrators can turn the tools off in the cloud agent settings.","rationale":["No: the validation tools run without a GitHub Advanced Security, Code Security, or Secret Protection license.","Yes: the session log shows the details of the validation tools, so reviewers can see what the scans found and how the agent responded.","Yes: repository administrators can toggle the tools in the Validation tools section of the cloud agent settings, for example to avoid conflicts with another product.","No: the agent scans its own changes. Push protection is a separate secret scanning feature that blocks pushes containing secrets before they reach the repository."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"4.1.4-09","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants to know which built-in validation tool of the Copilot cloud agent checks the packages that the agent adds to a project.\n\nWhich tool should you identify?","choices":["CodeQL code security analysis","The GitHub Advisory Database check","Secret scanning of the changes","Copilot code review second opinion"],"answer":[1],"explanation":"Each built-in validation tool produces a different signal. CodeQL finds code security issues, the GitHub Advisory Database check examines new dependencies, secret scanning finds credentials, and Copilot code review gives a second opinion.","rationale":["Incorrect: CodeQL analyzes the code itself for security issues. It does not check newly added packages against known advisories.","Correct: the agent checks new dependencies against the GitHub Advisory Database for malware and High or Critical CVSS vulnerabilities.","Incorrect: secret scanning looks for credentials such as tokens and keys in the changes, not for vulnerable packages.","Incorrect: Copilot code review provides a second opinion on the change. It is not the tool that checks packages against advisories."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"4.1.4-10","obj":"4.1.4","difficulty":"easy","type":"single","stem":"Litware, Inc. uses a third-party static analysis tool that writes SARIF output. Findings for agent pull requests must appear as code scanning alerts in the repository.\n\nWhat should you do?","choices":["Upload the SARIF output to code scanning","Add the findings to copilot-instructions.md","Store the output as a workflow artifact only","Create Dependabot alerts from the output"],"answer":[0],"explanation":"Code scanning works with CodeQL and with third-party tools that produce SARIF. Uploading SARIF turns their findings into code scanning alerts that act as evaluation signals for agent work.","rationale":["Correct: code scanning accepts SARIF from third-party tools, either from actions or an external CI system, and shows the findings as alerts.","Incorrect: instructions guide Copilot's behavior. Pasting findings there does not create alerts or track their resolution.","Incorrect: an artifact keeps the file for download but does not create code scanning alerts.","Incorrect: Dependabot alerts come from dependency data. They cannot import SARIF findings from a static analysis tool."],"ref":"https://docs.github.com/en/code-security/concepts/code-scanning/code-scanning"},{"id":"4.2.1-01","obj":"4.2.1","difficulty":"medium","type":"yesno","stem":"User3 investigates the problems with pull request 121.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["No workflow results appear because workflow runs for Copilot pushes wait until someone selects Approve and run workflows.","Copilot did not respond to the comment from User4 because User4 does not have write access to orders-service.","User3 can delete the agent session to remove its log from the pull request.","The session log is lost when the ephemeral GitHub Actions environment of the session is destroyed."],"answer":[0,1],"explanation":"Several symptoms of agent pull requests are caused by documented safeguards rather than by the agent. Workflows wait for approval, Copilot ignores comments from users without write access, and session logs remain available after the environment is destroyed.","rationale":["Yes: by default, workflows do not run on Copilot pushes until a user with write access selects Approve and run workflows, so no results appear until then.","Yes: Copilot responds only to comments from users with write access, and User4 has only read access, so the comment is never shown to the agent.","No: cloud agent sessions can be archived but not deleted. The session log stays available as part of the audit trail.","No: the Actions environment is destroyed when the session ends, but the session log remains available for review."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent","case":"C-d"},{"id":"4.2.1-02","obj":"4.2.1","difficulty":"easy","type":"order","stem":"At Fabrikam, Inc., User1 assigned an issue to the Copilot cloud agent. Copilot reacted with an eyes emoji and opened a draft pull request. User1 must watch what the agent is doing while it works.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Open the draft pull request that Copilot created for the issue.","Find the Copilot started work event in the pull request timeline.","Select View session on that event.","Review the reasoning and tool calls in the session log.","Open the Validation tools section of the cloud agent settings.","Search the organization audit log for the issue number."],"answer":[0,1,2,3],"explanation":"The live session log is reached from the agent's draft pull request. A Copilot started work event in the timeline links to the session, where you can follow the agent's reasoning and the tools it uses.","rationale":["Step 1: after the eyes reaction, Copilot opens a draft pull request, which is the entry point to the session.","Step 2: the pull request timeline contains a Copilot started work event for the session.","Step 3: View session on that event opens the live session log.","Step 4: the session log shows Copilot's reasoning and the tools it used, which is what User1 needs to watch.","Incorrect: the Validation tools section turns the built-in scans on or off. It does not show what a session is doing.","Incorrect: the audit log records events for governance. It does not show the live reasoning and tool calls of a session."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.1-03","obj":"4.2.1","difficulty":"medium","type":"order","stem":"Contoso, Ltd. finds that test failures on agent pull requests are hard to debug after job logs scroll away. Reviewers need durable test reports that they can open from the pull request.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Add a workflow step that runs the tests and writes reports to results/.","Add an actions/upload-artifact@v4 step with name: test-results and path: results/.","Link the workflow run and the artifact in an Evidence section of the pull request.","Commit the results/ folder to the agent branch after each run.","Paste the test reports into .github/copilot-instructions.md."],"answer":[0,1,2],"explanation":"Uploading workflow artifacts makes evidence durable and reviewable. Produce the reports, upload them where they are produced, and link the run and the artifact in the pull request so reviewers can find them.","rationale":["Step 1: the reports must exist before they can be uploaded, so the test step writes them to results/ first.","Step 2: upload-artifact stores the results/ folder as an artifact named test-results that stays available after the logs scroll away.","Step 3: an Evidence section with links to the run and artifact lets reviewers validate outcomes quickly from the pull request.","Incorrect: committing generated files clutters the history. Artifacts keep outputs inspectable without committing them back to the repository.","Incorrect: instructions files guide Copilot's behavior. Test reports there would become stale context and would not help reviewers."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"4.2.1-04","obj":"4.2.1","difficulty":"medium","type":"multi","stem":"A change that the Copilot cloud agent made at Woodgrove Bank passed CI but later caused a regression. The team must be able to reconstruct what changed, who approved it, and what evidence existed.\n\nWhich three items should each agent pull request include? Each correct answer presents part of the solution.","choices":["An inspectable plan in the pull request description","Links to the workflow runs and uploaded artifacts","The review and approval from a human reviewer","The user-level memory preferences of the requester","A copy of the reviewer's local ~/.copilot/session-state folder"],"answer":[0,1,2],"explanation":"A minimum audit trail for agent contributions contains a stated goal, an inspectable plan, a bounded changeset, automated evidence, human judgment, and a clear outcome. These artifacts make a failure understandable after the fact.","rationale":["Correct: an inspectable plan shows the intended scope and approach, so the team can see whether the regression came from the plan or the implementation.","Correct: workflow runs and artifacts are the automated evidence that shows what was checked and what passed at the time.","Correct: the review and approval record the human judgment that accepted the change, which answers who approved it.","Incorrect: user preferences describe how one person likes to work. They do not show what changed or why it was approved.","Incorrect: local session state belongs to one machine and is unrelated to the cloud agent session. It is not part of the pull request audit trail."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/5-identify-risks-traceability"},{"id":"4.2.1-05","obj":"4.2.1","difficulty":"easy","type":"single","stem":"A reviewer at Tailspin Toys wants to understand why the Copilot cloud agent changed a file and which tools it used before it pushed the change.\n\nWhich artifact should the reviewer examine?","choices":["The agent session log","The Dependabot alerts list","The final pull request diff","The repository traffic graph"],"answer":[0],"explanation":"Session logs show Copilot's internal reasoning and the tools it used during the task. The diff shows only the outcome, not the decisions that led to it.","rationale":["Correct: the session log shows the agent's reasoning and tool calls, which explains why the file changed.","Incorrect: Dependabot alerts report vulnerable dependencies. They contain no information about the agent's decisions.","Incorrect: the diff shows what changed but not why or which tools were used. Exposing only the diff is the hidden reasoning anti-pattern.","Incorrect: the traffic graph shows repository views and clones. It is unrelated to agent activity."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"4.2.1-06","obj":"4.2.1","difficulty":"easy","type":"single","stem":"At Relecloud, a reviewer finds a commit authored by Copilot in a pull request and must trace it back to the agent session that produced it.\n\nWhat should the reviewer do to find the session?","choices":["Use the session log link that the commit provides","Search the organization audit log for the commit","Ask the requester for their local session store","Check the repository facts in Copilot Memory"],"answer":[0],"explanation":"Commits from the Copilot cloud agent link to the session logs of the agent session that produced them. This makes each change traceable to the session that created it.","rationale":["Correct: each Copilot commit links to the session logs, so the reviewer can go directly from the commit to the session.","Incorrect: audit log events help with governance, but the direct link from a commit to its session is on the commit itself.","Incorrect: a cloud agent session does not run on the requester's machine, so a local session store would not contain it.","Incorrect: repository facts are short pieces of knowledge that Copilot captured. They do not record which session produced a commit."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"4.2.1-07","obj":"4.2.1","difficulty":"medium","type":"single","stem":"At Proseware, Inc., User1 assigned an issue to the Copilot cloud agent a few minutes ago. No pull request is linked to the issue yet, and User1 is unsure whether the agent received the task.\n\nWhich evidence should User1 look for first to confirm that Copilot picked up the issue?","choices":["An eyes reaction from Copilot on the issue","A firewall warning in the issue description","A new alert in the Dependabot alerts list","An Approve and run workflows button on the issue"],"answer":[0],"explanation":"When you assign an issue to the cloud agent, Copilot first leaves an eyes reaction on the issue and shortly after opens a draft pull request that appears in the issue timeline. If neither appears after a wait and a refresh, the task has not started.","rationale":["Correct: Copilot leaves an eyes reaction on the issue when it picks up the task, before it opens the draft pull request.","Incorrect: firewall warnings are added to the pull request body or a comment after a blocked request, not to the issue description.","Incorrect: Dependabot alerts report vulnerable dependencies in the repository. They do not show whether the agent received a task.","Incorrect: the Approve and run workflows button appears in the merge box of a pull request after Copilot pushes, not on the issue."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.1-08","obj":"4.2.1","difficulty":"hard","type":"single","stem":"At Adatum Corporation, User2 attached a 4.5 MiB screenshot of a page mockup to an issue and assigned the issue to the Copilot cloud agent. The pull request ignores the layout in the mockup, and the session log never mentions the image.\n\nWhat should you identify as the cause?","choices":["The firewall blocked the download of the image","The image was over 3.00 MiB and was removed","The validation tools stripped the image as unsafe","The image was stored as a user-level preference"],"answer":[1],"explanation":"The troubleshooting guidance states that images larger than 3.00 MiB are removed from what the agent receives. Comparing the input artifacts with the session log shows that the agent never had the mockup.","rationale":["Incorrect: a firewall block would add a warning with the blocked address to the pull request. The image is part of the issue, not an internet download.","Correct: images larger than 3.00 MiB are removed, so the agent never received the mockup, which matches a session log with no mention of it.","Incorrect: the validation tools scan the agent's changes after it writes code. They do not filter images from the issue.","Incorrect: memories are text facts and preferences captured by Copilot. An attached image does not become a memory."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.1-09","obj":"4.2.1","difficulty":"hard","type":"single","stem":"Northwind Traders uploads test reports from agent pull requests as artifacts named test-results. During an incident review, nobody can tell which run and which code state produced a specific report.\n\nWhat should you change?","choices":["Commit each report to the default branch after merge","Add the commit SHA to artifact names and link the run","Store the latest report as a repository fact","Upload every report under the fixed name latest"],"answer":[1],"explanation":"Evidence should be traceable to a specific workflow run and a specific commit. Naming artifacts with the commit and linking the run in the pull request answers which run produced an artifact and against what code state.","rationale":["Incorrect: committing reports to the default branch separates them from the run that produced them and adds generated files to the history.","Correct: including the commit SHA in the artifact name and linking the run in an Evidence section ties each report to its run and code state.","Incorrect: a memory holds short facts for Copilot and can expire. It is not a durable, traceable store for evidence.","Incorrect: a fixed name makes every report look the same, which is exactly why the team cannot match reports to runs."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"4.2.1-10","obj":"4.2.1","difficulty":"hard","type":"order","stem":"At Litware, Inc., the Copilot cloud agent pushed a fix to its pull request, but the pull request shows no check results. The team must find which test the change breaks and whether the agent ran that test before it pushed.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Select Approve and run workflows in the merge box of the pull request.","Open the logs of the failed workflow run to find the failing test.","Open the session log and check whether the agent ran that test before it pushed.","Unassign Copilot from the issue and assign the issue to Copilot again.","Turn off the validation tools in the cloud agent settings."],"answer":[0,1,2],"explanation":"Workflows do not run automatically on Copilot pushes, so no evidence exists until someone approves them. The run logs then identify the failing test, and the session log shows whether the agent validated its work in its own environment before it pushed.","rationale":["Step 1: workflows wait for a user with write access to select Approve and run workflows, so no check results exist until then.","Step 2: once the workflows run, the logs of the failed run show which test the change breaks.","Step 3: the session log shows the commands the agent ran, so you can see whether it ran the failing test in its environment before it pushed.","Incorrect: reassigning the issue is the retry for a stuck session. It starts new work instead of explaining why this push fails a test.","Incorrect: the validation tools are the built-in security and review checks of the agent. They do not control whether repository workflows run."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.2-01","obj":"4.2.2","difficulty":"medium","type":"single","stem":"You need to classify the root cause of the failure in pull request 118 before you choose a fix.\n\nHow should you classify the root cause?","choices":["A reasoning error","Tool misuse","A context issue","An environment issue"],"answer":[3],"explanation":"Classifying the root cause directs the fix. A firewall warning that lists a blocked address shows that the execution environment prevented the action, even though the agent's plan and tool choice were reasonable.","rationale":["Incorrect: the agent correctly tried to install a package that the task needed. Nothing in the evidence shows a flawed decision.","Incorrect: the install command was an appropriate tool call. The failure came from where the command ran, not from how it was used.","Incorrect: the agent had the right instructions and inputs. Missing or wrong context would show up as wrong decisions, not as a blocked request.","Correct: the firewall warning in the pull request body shows that the agent environment blocked access to packages.northwindtraders.com, which is an environment issue."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent","case":"C-d"},{"id":"4.2.2-02","obj":"4.2.2","difficulty":"medium","type":"single","stem":"At Tailspin Toys, User2 has write access to a repository. User2 posts a comment that mentions @copilot on a pull request from the Copilot cloud agent after the pull request was closed. Copilot does not respond.\n\nWhat should you identify as the root cause?","choices":["User2 does not have write access to the repository","Copilot responds only to comments on open pull requests","The agent firewall blocked the comment from User2","Copilot Memory is turned off for the repository"],"answer":[1],"explanation":"Before blaming the agent, check the documented conditions for a response. Copilot responds only to comments from users with write access, and only on open pull requests.","rationale":["Incorrect: the scenario states that User2 has write access, so permission is not the cause.","Correct: Copilot responds only on open pull requests, so a comment on a closed pull request does not start any work.","Incorrect: the firewall limits the agent's internet access during a session. It does not filter comments on GitHub.","Incorrect: memory affects what Copilot remembers, not whether it responds to a comment."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.2-03","obj":"4.2.2","difficulty":"hard","type":"dragdrop","stem":"Wide World Importers reviews the session logs of four failed Copilot cloud agent sessions and must classify each root cause.\n\nWhich root cause should you assign to each failure? To answer, drag the appropriate root causes to the correct failures. Each root cause may be used once, more than once, or not at all.","choices":["Reasoning error","Tool misuse","Context issue","Environment issue","Evaluation setup issue"],"answer":[3,2,1,3],"explanation":"Classify a failure by where it originated: the agent's decisions, the way it used a tool, the context it received, or the environment it ran in. The session log shows the reasoning and tool calls that make this distinction possible.","rationale":["Failure1 originated in the execution environment: the firewall blocked network access, so the agent's choice to download the package was not at fault.","Failure2 came from stale context: the agent faithfully applied a memory that no longer matched the code, so the input was wrong, not the reasoning.","Failure3 is tool misuse: search was the right tool, but it was pointed at the wrong directory, and the empty result led to a wrong conclusion.","Failure4 is an environment issue: the runner was missing a runtime, which setup steps such as copilot-setup-steps.yml should preinstall."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/evaluation-triage-failure","targets":["Failure1: a package download was blocked by the agent firewall","Failure2: the agent followed a repository fact about a helper that was removed last month","Failure3: the agent searched the wrong directory and concluded that a function did not exist","Failure4: the runner lacked a required runtime because no setup steps installed it"],"notes":["A flawed decision by the agent when its inputs, tools, and environment were all correct, such as misreading a clear requirement.","A correct tool used in the wrong way, such as wrong arguments or the wrong scope, which then leads to a wrong conclusion.","Missing, conflicting, or stale information that the agent received, such as outdated memories or contradictory instructions.","A problem with where the agent runs, such as network blocks, missing dependencies, or unsupported runners.","A problem with the test itself, such as a wrong expected answer. It applies to evaluation runs, not to these session failures."]},{"id":"4.2.2-04","obj":"4.2.2","difficulty":"easy","type":"single","stem":"Pushes from the Copilot cloud agent at Contoso, Ltd. often fail CI because the agent does not know how to build and test the project. You decide that the root cause is missing context.\n\nWhich file should you update?","choices":[".github/copilot-instructions.md",".github/pull_request_template.md",".github/dependabot.yml",".github/CODEOWNERS"],"answer":[0],"explanation":"When the agent lacks project knowledge, the root cause is context, and the fix is to provide that context. The troubleshooting guidance recommends adding build and test instructions to .github/copilot-instructions.md.","rationale":["Correct: build and test instructions in .github/copilot-instructions.md give the agent the missing context on every task, which the troubleshooting guidance recommends for failing CI.","Incorrect: a pull request template structures pull request descriptions. It does not tell the agent how to build or test the project.","Incorrect: dependabot.yml configures dependency updates. It does not give the agent build or test steps.","Incorrect: CODEOWNERS assigns reviewers to paths. It does not change what the agent knows about building the project."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.2-05","obj":"4.2.2","difficulty":"medium","type":"single","stem":"Session logs at Fabrikam, Inc. show the Copilot cloud agent spending much of each session trying different ways to install the project's toolchain on GitHub Actions, and some sessions fail.\n\nHow should you classify and fix the root cause?","choices":["Reasoning error; rewrite the issue text","Environment issue; preinstall in copilot-setup-steps.yml","Context issue; store the versions as a repository fact","Tool misuse; remove the edit tool from the agent"],"answer":[1],"explanation":"When the runner lacks dependencies, the agent falls back to slow and unreliable trial and error. That is an environment issue, and the fix is to preinstall the dependencies with copilot-setup-steps.yml.","rationale":["Incorrect: the agent's attempts are reasonable responses to a missing toolchain. Rewording the issue does not install anything.","Correct: copilot-setup-steps.yml preinstalls dependencies when the agent runs on GitHub Actions, removing the trial and error caused by the environment.","Incorrect: knowing the versions does not install them. The runner would still lack the toolchain.","Incorrect: the edit tool is not involved in installing the toolchain, and removing it would stop the agent from changing code."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"4.2.2-06","obj":"4.2.2","difficulty":"easy","type":"single","stem":"Overnight, many test cases in the evaluation set of a Litware, Inc. agent fail. Nobody changed the agent's configuration.\n\nWhat should you do first?","choices":["Rewrite the agent instructions","Confirm that backends and tokens were healthy","Remove the failing test cases","Switch the agent to a different model"],"answer":[1],"explanation":"Before diagnosing the agent, check that the infrastructure was healthy during the run: knowledge was indexed, API backends were not throttled or erroring, tokens were valid, and the environment matched the configuration.","rationale":["Incorrect: rewriting instructions assumes an agent problem before you have ruled out the environment that the run depended on.","Correct: a pre-triage check of backends, authentication tokens, indexing, and environment rules out infrastructure failures before you diagnose the agent.","Incorrect: removing failing cases hides the failures instead of explaining them.","Incorrect: changing the model is an agent change that is not justified until you know that the agent is the cause."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/evaluation-triage-failure"},{"id":"4.2.2-07","obj":"4.2.2","difficulty":"medium","type":"single","stem":"At Woodgrove Bank, User5 signs in with a managed user account under Enterprise Managed Users. User5 assigns an issue in a personal repository to the Copilot cloud agent, and the agent never starts work.\n\nWhat should you identify as the root cause?","choices":["The agent misread the issue description","Personal repositories of managed users are not supported","The repository has conflicting custom instructions","The firewall blocked access to the issue"],"answer":[1],"explanation":"Some failures come from the platform environment rather than from the agent. The cloud agent is not supported in personal repositories owned by managed user accounts because those repositories cannot use GitHub-hosted runners.","rationale":["Incorrect: a reasoning problem would still produce a session and a pull request. Here the agent never starts, which points to the environment.","Correct: personal repositories of Enterprise Managed Users are not supported because GitHub-hosted runners are not available, so the agent cannot run there.","Incorrect: conflicting instructions lead to inconsistent results in a running session, not to a session that never starts.","Incorrect: the firewall limits outbound internet access during a session. Issues are on GitHub and are not blocked by it."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"4.2.2-08","obj":"4.2.2","difficulty":"easy","type":"single","stem":"In a Relecloud repository, the Copilot cloud agent keeps calling a retry helper that was removed last month. The session log shows that the agent applied a repository fact from Copilot Memory that describes the helper.\n\nHow should you classify the root cause?","choices":["A reasoning error","Tool misuse","A context issue","An environment issue"],"answer":[2],"explanation":"A context issue occurs when the agent receives missing, conflicting, or stale information. Here the agent reasoned correctly from a memory that no longer matched the code.","rationale":["Incorrect: the agent reasoned correctly from what it was told. The mistake was in the information, not in the reasoning.","Incorrect: no tool was used in the wrong way. The agent called the helper because the memory said to.","Correct: a stale repository fact gave the agent outdated context, so this is a context issue. Deleting the fact removes the cause.","Incorrect: the runner, network, and dependencies worked. Nothing in the environment caused the wrong call."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.2.2-09","obj":"4.2.2","difficulty":"hard","type":"single","stem":"An agent pull request at Proseware, Inc. omits a required CSV export. The issue lists the export as an acceptance criterion. The session log shows that every tool call succeeded and the right files were read, but the plan states that the export is optional.\n\nHow should you classify and address the root cause?","choices":["Reasoning error; clarify the criterion and request a new plan","Tool misuse; remove the search tool from the agent","Environment issue; add steps to copilot-setup-steps.yml","Context issue; delete all repository facts in memory"],"answer":[0],"explanation":"When tools, context, and environment all worked, the failure lies in the agent's reasoning. The lifecycle then loops: make the requirement explicit, have the agent revise its plan, and reevaluate.","rationale":["Correct: the agent had the right inputs and working tools but misjudged a stated criterion, which is a reasoning error. Clarifying it and asking for a revised plan restarts the plan, act, evaluate loop.","Incorrect: the log shows that tool calls succeeded and found the right files, so tool use did not cause the omission.","Incorrect: nothing failed in the runner or network. Changing setup steps would not change how the agent read the criterion.","Incorrect: no stale memory is involved, and deleting every fact would remove useful context without addressing the misread criterion."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/3-explain-agent-lifecycle-plan-act-evaluate"},{"id":"4.2.2-10","obj":"4.2.2","difficulty":"hard","type":"single","stem":"The evaluation pass rate of a Northwind Traders agent drops from 85% to 60% overnight. Nobody changed the agent or the test cases. The agent instructions are long, and several failing responses miss required facts. The logs of the failing cases show that the backend API that one tool calls returned throttling errors.\n\nHow should you classify the root cause?","choices":["A reasoning error","A context issue","An environment issue","An evaluation setup issue"],"answer":[2],"explanation":"Verify that infrastructure was healthy before you diagnose an agent. Throttled or erroring backends produce failures that look like agent regressions but originate in the environment.","rationale":["Incorrect: a lower score alone does not show bad reasoning. The logs point to failing backend calls, not to wrong decisions.","Incorrect: nothing changed in the instructions, so their length cannot explain a sudden overnight drop.","Correct: throttling errors from the backend mean the environment failed during the run. Rerun after the backend is healthy before changing the agent.","Incorrect: the test cases did not change and passed before, so the evaluation setup is not the cause."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/evaluation-triage-failure"},{"id":"4.3.1-01","obj":"4.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. wants every Copilot agent that works in a repository to use the same build command and test command. The guidance must apply to the whole repository.\n\nWhich location should you use for the guidance?","choices":["In the .github/copilot-instructions.md file","In a .github/agents/conventions.agent.md profile","In a Copilot Memory repository fact","In the copilot-setup-steps.yml workflow file"],"answer":[0],"explanation":"Repository-wide custom instructions in .github/copilot-instructions.md are added to the context of requests in that repository. They are the documented place for build, test, and convention guidance that every agent should receive.","rationale":["Correct: .github/copilot-instructions.md holds repository-wide custom instructions, so build and test commands written there apply to work in the whole repository.","Incorrect: a custom agent profile defines a specialist agent with its own prompt and tools. Its prompt only applies when that agent is used, so it is right for a persona, not for repository-wide rules.","Incorrect: Copilot Memory stores facts that Copilot learns and validates, and a fact is not guaranteed to be applied. You cannot create a fact in the settings; use memory for accumulated detail, not for mandatory rules.","Incorrect: copilot-setup-steps.yml prepares the agent's development environment, for example by installing tools. It runs steps; it does not give the model instructions about which commands to use."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-02","obj":"4.3.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. has a path-specific instructions file named .github/instructions/frontend.instructions.md that contains the following frontmatter.\n\n```yaml\n---\napplyTo: \"web/**/*.ts\"\n---\n```\n\nThe instructions must also apply to .tsx files in the web folder and its subfolders.\n\nHow should you revise the frontmatter?","choices":["Set applyTo to \"web/**/*.ts,web/**/*.tsx\".","Add a second applyTo line set to \"web/**/*.tsx\".","Rename the file to frontend.tsx.instructions.md.","Add an excludeAgent line set to \"web/**/*.ts\"."],"answer":[0],"explanation":"The applyTo property accepts one or more glob patterns separated by commas. Adding the .tsx pattern to the same value extends the file to both file types.","rationale":["Correct: applyTo accepts several glob patterns separated by commas, so one value can match both the .ts and the .tsx files under web.","Incorrect: YAML frontmatter keys must be unique, so a second applyTo key is not a supported way to add a pattern. Use one applyTo value with comma-separated patterns.","Incorrect: the file name only needs the .instructions.md suffix; the part before it is a free name and does not select file types. File matching comes from applyTo.","Incorrect: excludeAgent takes an agent name, such as code-review or cloud-agent, to stop that agent from using the file. It does not hold glob patterns and cannot add files."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-03","obj":"4.3.1","difficulty":"hard","type":"single","stem":"Litware, Inc. has a sentence in its .github/copilot-instructions.md file that tells agents never to run terraform apply. Session logs show that Copilot CLI sessions in the repository still run the command occasionally.\n\nYou need to block the command reliably in Copilot CLI sessions for the repository.\n\nWhat should you do?","choices":["Add a preToolUse hook in .github/hooks that denies terraform apply.","Repeat the rule in capital letters at the top of the instructions file.","Store the rule as a Copilot Memory repository fact in a session.","Add a postToolUse hook in .github/hooks that logs terraform apply."],"answer":[0],"explanation":"Custom instructions ask the model to follow a rule, and the model can still deviate. A preToolUse hook runs code before each tool call and can deny the execution, so it enforces the constraint instead of requesting it.","rationale":["Correct: preToolUse runs before the agent uses a tool and can approve or deny the execution. A script that denies terraform apply enforces the rule in code, which instructions cannot do.","Incorrect: stronger wording still only asks the model to comply. Instructions are the right place for guidance, but they do not guarantee compliance, so they cannot meet a reliable block requirement.","Incorrect: a memory fact is not a guaranteed rule and Copilot decides whether to use it. GitHub Docs recommends custom instructions, not memory, for important rules, and neither one blocks a tool call.","Incorrect: postToolUse runs after a tool completes, so the command has already run. It is right for logging results and audit trails, not for preventing an action."],"ref":"https://docs.github.com/en/copilot/concepts/customizations/hooks"},{"id":"4.3.1-04","obj":"4.3.1","difficulty":"medium","type":"single","stem":"Relecloud has a .github/copilot-instructions.md file that is 12 pages long. It mixes repository conventions with notes about individual past tasks, and some notes contradict each other. Copilot cloud agent follows the conventions inconsistently.\n\nWhat should you do first?","choices":["Shorten the file to concise repository-wide rules without task notes.","Copy the whole file into AGENTS.md so that agents read it twice.","Store each note as a Copilot Memory user preference for developers.","Move the file content into the prompt body of a custom agent."],"answer":[0],"explanation":"Repository instructions work best when they are short, repository-wide, and free of conflicts. Removing task-specific notes and contradictions gives the agent a clear set of rules instead of noise.","rationale":["Correct: GitHub Docs advises avoiding conflicting instructions, and its suggested prompt for generating the file keeps it to about two pages of guidance that is not task-specific.","Incorrect: duplicating the content in AGENTS.md adds a second instruction source with the same contradictions. AGENTS.md is useful for agent instructions per folder, not for repeating an oversized file.","Incorrect: user preferences follow one developer across repositories and are not shared with the repository. They suit personal style choices, not repository conventions that every agent must use.","Incorrect: a custom agent prompt only applies when that agent runs, and moving the text keeps the conflicts. A custom agent is right for a specialist role, not for cleaning up repository guidance."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-05","obj":"4.3.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank has a repository instruction that requires two-space indentation. User1 has personal custom instructions that require tab indentation. Copilot uses tabs in User1's chats about the repository.\n\nThe repository rule must apply to User1 as well.\n\nWhat should you do?","choices":["Remove the indentation rule from the personal instructions of User1.","Add the two-space rule to the organization custom instructions.","Add the two-space rule to an AGENTS.md file in the repository root.","Add the two-space rule to a Copilot Memory repository fact."],"answer":[0],"explanation":"Personal instructions take priority over repository instructions, which take priority over organization instructions. All sets are provided to Copilot, so the conflicting personal rule must be removed for the repository rule to win.","rationale":["Correct: personal instructions have the highest priority, so the tab rule overrides the repository rule. Removing the conflict lets the repository instruction apply, which matches the advice to avoid conflicting instructions.","Incorrect: organization instructions have the lowest priority of the three levels, so the personal rule still wins. Use organization instructions for defaults that repositories and users do not override.","Incorrect: AGENTS.md is another repository-level instruction source, so it still ranks below personal instructions. It is right for agent guidance per folder, not for overriding a personal setting.","Incorrect: a memory fact is not a guaranteed rule and does not outrank personal instructions. Memory suits accumulated details that Copilot learns, not conflict resolution between instruction levels."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-06","obj":"4.3.1","difficulty":"easy","type":"single","stem":"Tailspin Toys has an AGENTS.md file in the root of a repository. Agents working in the services/payments folder must follow different rules than agents working elsewhere in the repository.\n\nWhat should you do?","choices":["Add an AGENTS.md file with the payments rules to services/payments.","Add a CLAUDE.md file with the payments rules to services/payments.","Add the payments rules to the root AGENTS.md under a new heading.","Add a GEMINI.md file with the payments rules to services/payments."],"answer":[0],"explanation":"Copilot supports several AGENTS.md files in a repository, and the nearest file in the directory tree takes precedence. A file in services/payments therefore applies to work in that folder.","rationale":["Correct: the nearest AGENTS.md in the directory tree takes precedence, so a file in services/payments gives that folder its own rules while the root file covers the rest.","Incorrect: Copilot supports a single CLAUDE.md file stored in the root of the repository, not one per folder. Use it as an alternative to AGENTS.md when the repository already uses that convention.","Incorrect: a heading in the root file still applies to the whole repository, so agents elsewhere also receive the payments rules. A single root file is fine only when rules are the same everywhere.","Incorrect: like CLAUDE.md, GEMINI.md is supported as a single file in the repository root. It cannot scope rules to a subfolder the way a nested AGENTS.md can."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-07","obj":"4.3.1","difficulty":"medium","type":"dropdown","stem":"Fabrikam, Inc. adds Terraform rules to a repository. The rules must apply to every file in the infra folder and its subfolders. Copilot code review must use the rules, and Copilot cloud agent must not use them.\n\nYou create the following file.\n\n```yaml\n# .github/instructions/terraform.instructions.md\n---\napplyTo: [[1]]\nexcludeAgent: [[2]]\n---\n```\n\nHow should you complete the frontmatter? To answer, select the appropriate options in the answer area.","answer":[0,1],"explanation":"applyTo selects the files with glob patterns, and excludeAgent names the agent that must not use the file. Excluding cloud-agent leaves the file for Copilot code review only.","targets":[{"label":"Box 1","options":["\"infra/**\"","\"**/*.md\"","\"terraform\""],"why":["Correct: infra/** matches every file in the infra folder and in all of its subfolders, which is the scope the rules must cover.","Incorrect: **/*.md matches Markdown files anywhere in the repository, not the Terraform files in infra. Use it for documentation rules.","Incorrect: terraform is not a glob that matches the infra folder; applyTo patterns are matched against file paths, so this value matches no Terraform file paths."]},{"label":"Box 2","options":["\"code-review\"","\"cloud-agent\"","\"copilot-cli\""],"why":["Incorrect: excluding code-review stops Copilot code review from using the file, which is the opposite of the requirement. Use it when only the cloud agent needs the rules.","Correct: excludeAgent set to cloud-agent stops Copilot cloud agent from using the file, so only Copilot code review receives the Terraform rules.","Incorrect: GitHub Docs documents code-review and cloud-agent as the values for excludeAgent. copilot-cli is not a documented value for this property."]}],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-08","obj":"4.3.1","difficulty":"hard","type":"dragdrop","stem":"Litware, Inc. is reorganizing the guidance that Copilot agents receive. You must store each type of guidance in the most appropriate place.\n\nWhich location should you use for each type of guidance? To answer, drag the appropriate locations to the correct guidance types. Each location may be used once, more than once, or not at all.","choices":["Repository custom instructions","Path-specific custom instructions","Copilot Memory repository fact","Copilot Memory user preference","Custom agent profile"],"answer":[0,1,3,4],"explanation":"Mandatory rules belong in custom instructions because memory is not guaranteed to be applied. Path-specific files scope rules to matching files, user preferences follow a person, and a custom agent profile defines a specialist with its own tools.","rationale":["Guidance1 is a mandatory review step for every agent in the repository. GitHub Docs recommends custom instructions, not memory, for important rules such as mandatory review steps.","Guidance2 only applies to files in one folder, so a path-specific instructions file with an applyTo glob limits it to those files.","Guidance3 belongs to one person and must follow that person across repositories, which is what a user preference in Copilot Memory does.","Guidance4 needs its own persona and a restricted tool list, which only a custom agent profile provides through its prompt body and tools property."],"targets":["Guidance1: a mandatory security review step that every agent in the repository must follow","Guidance2: conventions for SQL migration files in the db/migrations folder only","Guidance3: User1 prefers short commit summaries in every repository that User1 works in","Guidance4: a release-notes specialist that has its own restricted list of tools"],"notes":["Applies to all work in the repository from .github/copilot-instructions.md. Use it for rules that every agent must follow.","A .instructions.md file whose applyTo glob limits the rules to matching files. Use it for folder- or file-type-specific conventions.","A fact that Copilot learns and validates against code. Use it for accumulated detail, not for mandatory rules, because it is not guaranteed to be applied.","A preference stored for one user that follows that user across repositories. Use it for personal style choices.","A .agent.md file with a prompt, tools, and model for a specialist agent. Use it when a role needs its own behavior and tool access."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-09","obj":"4.3.1","difficulty":"easy","type":"order","stem":"Contoso, Ltd. wants Copilot cloud agent to follow extra rules only when it edits YAML pipeline files in a repository.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a .github/instructions directory in the repository.","Create a file named pipelines.instructions.md in the directory.","Add frontmatter with an applyTo glob that matches the pipeline files.","Write the rules in Markdown below the frontmatter.","Add the rules to the description property of a custom agent profile.","Create a Copilot Memory repository fact with the rules in the repository settings."],"answer":[0,1,2,3],"explanation":"Path-specific instructions live in .instructions.md files in .github/instructions. The file starts with frontmatter that has an applyTo glob, and the rules follow in natural language.","rationale":["Step 1: path-specific instruction files live in the .github/instructions directory, so the directory must exist first.","Step 2: the file name must end with .instructions.md for Copilot to treat it as a path-specific instructions file.","Step 3: the frontmatter at the start of the file holds applyTo, which limits the rules to the matching pipeline files.","Step 4: the natural-language rules follow the frontmatter; Copilot adds them when it works on files that match applyTo.","Incorrect: the description of a custom agent profile explains the agent's purpose for selection. It does not deliver path-scoped rules to Copilot cloud agent.","Incorrect: you cannot create or edit memories in the repository settings; you can only delete them there. Memory is also not intended for mandatory rules."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.1-10","obj":"4.3.1","difficulty":"medium","type":"single","stem":"You need to meet the requirements for the Terraform rules.\n\nWhat should you do?","choices":["Create .github/instructions/terraform.instructions.md with applyTo \"infra/**\" and excludeAgent \"code-review\".","Add a Terraform section to .github/copilot-instructions.md and disable custom instructions for code review.","Create an AGENTS.md file that contains the Terraform rules in the infra folder of the repository.","Create a custom agent profile named infra with the Terraform rules in its prompt body and tools list."],"answer":[0],"explanation":"A path-specific instructions file limits rules to the files that match applyTo, and excludeAgent removes one agent from the audience. Together they give the cloud agent the Terraform rules only for infra files while code review keeps the repository-wide instructions.","rationale":["Correct: applyTo infra/** scopes the rules to the infra folder and its subfolders, and excludeAgent code-review stops Copilot code review from receiving this file while it still uses copilot-instructions.md.","Incorrect: a section in the repository-wide file applies to every file, and disabling custom instructions for code review removes the repository-wide instructions too, which breaks a requirement.","Incorrect: an AGENTS.md file in infra scopes the rules to that folder, but it has no setting to keep the rules away from Copilot code review. Use it when every agent should receive the folder rules.","Incorrect: a custom agent prompt applies only when developers or the planner select that agent, not whenever the cloud agent edits infra files. Use a profile for a specialist role."],"case":"C-e","ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"4.3.2-01","obj":"4.3.2","difficulty":"easy","type":"single","stem":"User1 notices that Copilot Memory stored an incorrect repository fact for a repository named App1. User1 is a repository administrator.\n\nWhich location should User1 use to remove the fact?","choices":["In the settings of the App1 repository on GitHub.com","In the personal Copilot settings of User1 on GitHub.com","In the .github/copilot-instructions.md file of App1","In the audit log of the organization that owns App1"],"answer":[0],"explanation":"Repository facts are stored per repository and are managed from the repository settings on GitHub.com. Personal settings manage user preferences instead.","rationale":["Correct: repository facts are listed and deleted in the repository settings on GitHub.com, where people with the right access can review the stored memories.","Incorrect: personal Copilot settings list user preferences, which follow a user across repositories. Use them to delete a personal preference, not a repository fact.","Incorrect: the instructions file contains custom instructions that you write; memories are stored by Copilot outside the repository files. Editing the file does not delete a memory.","Incorrect: the audit log records events for review and investigation. It is read-only history and cannot delete a stored memory."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-02","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank has a Copilot Memory repository fact that names the wrong port for a local test server. The rest of the fact is correct.\n\nYou need Copilot to stop using the wrong port and to learn the correct value.\n\nWhat should you do?","choices":["Delete the fact in the repository settings, and state the correct port clearly in a session.","Edit the fact text in the repository settings and replace the port with the correct value.","Downvote the fact once so that Copilot rewrites it with the correct port on the next run.","Create a corrected fact in the repository settings and leave the original fact in place."],"answer":[0],"explanation":"Memories cannot be created or edited in the GitHub.com settings, only deleted. You can influence what Copilot stores by stating facts clearly while you work with it.","rationale":["Correct: deleting removes the wrong value immediately, and stating the correct fact clearly in a Copilot session is the documented way to influence which memories Copilot creates.","Incorrect: the settings let you delete memories but not edit them. Editing would be the natural choice for a typo, but GitHub Docs states that memories cannot be created or edited there.","Incorrect: votes change how likely a memory is to be sent to the model, and memories are dropped only after enough downvotes. Voting does not rewrite a fact.","Incorrect: you cannot create a memory in the settings, and leaving the original keeps the wrong port available. Create memories by working with Copilot or by importing them with Copilot CLI."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-03","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. sets the repository fact expiration to 60 days at the enterprise level. The organization that owns a repository sets the expiration to 30 days. Nobody upvotes a fact that Copilot stored in the repository, although Copilot retrieves it often.\n\nHow long should you expect the fact to remain available after it was stored?","choices":["30 days","60 days","90 days","180 days"],"answer":[0],"explanation":"When both an enterprise and an organization set the expiration, the lower value applies. Retrieval does not reset the timer; only an upvote does.","rationale":["Correct: the lower of the enterprise and organization values applies, so the fact expires after 30 days. Frequent retrieval does not reset the timer, so the fact still expires.","Incorrect: 60 days is the enterprise value, but the organization value is lower and the lower setting wins. 60 days would apply if the organization did not set a lower value.","Incorrect: 90 days is the default expiration when no owner changes it. Both owners set a lower value here, so the default does not apply.","Incorrect: 180 days is the maximum value that owners can choose. It would apply only if an owner set it and no other level set a lower value."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-04","obj":"4.3.2","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. assigns Copilot Business licenses to its developers. Copilot stores repository facts in the company repositories, but it never stores user preferences for any developer.\n\nWhat should you do?","choices":["Ask an administrator to enable the Copilot Memory user preferences policy.","Ask each repository administrator to turn on repository facts for the repository.","Tell each developer to run /memory on in a Copilot CLI session in each repository.","Ask an organization owner to set the repository fact expiration to 180 days."],"answer":[0],"explanation":"For Copilot Business and Copilot Enterprise, user preferences are disabled until an administrator enables the policy. Repository facts are allowed by default and are controlled separately.","rationale":["Correct: user preferences stay disabled for Copilot Business and Copilot Enterprise users until an administrator enables the policy, which explains why only repository facts appear.","Incorrect: repository facts already work here, and the repository setting for facts is independent of user preferences. Use it to stop or allow facts in one repository.","Incorrect: /memory on turns memory back on locally after /memory off, but it cannot override a policy that disables user preferences for the account.","Incorrect: the expiration setting changes how long repository facts last and does not apply to user preferences. It does not enable a disabled memory type."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-05","obj":"4.3.2","difficulty":"hard","type":"single","stem":"Relecloud runs a Copilot CLI /fleet task. A subagent discovers that the integration tests require a local database container. The fact must be stored in Copilot Memory for future sessions.\n\nWhat should you do?","choices":["Have the subagent return the fact to the root agent, which stores the memory.","Add the store_memory tool to the tools list of the subagent's custom agent.","Start the fleet run with --enable-memory so that each subagent stores memories.","Instruct the subagent to call vote_memory to upvote the fact after it is found."],"answer":[0],"explanation":"In Copilot CLI only the root agent can use the tools that store or vote on memories. Subagents can read memories, so a fact they find must be passed back to the root agent.","rationale":["Correct: only the root agent can store memories in Copilot CLI, so the subagent reports the fact in its result and the root agent stores it.","Incorrect: storing memories is limited to the root agent, so listing the tool for a subagent does not let it store facts. Subagents can only read memories.","Incorrect: --enable-memory turns memory on for non-interactive runs, but it does not change which agent can store memories. Use it for scripted runs with -p.","Incorrect: voting is also limited to the root agent, and an upvote changes the priority of an existing memory. It cannot store a new fact."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-06","obj":"4.3.2","difficulty":"medium","type":"yesno","stem":"Tailspin Toys uses Copilot Memory with Copilot cloud agent and Copilot code review in a repository.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Repository facts that Copilot cloud agent stores can be used by Copilot code review in the same repository.","Copilot code review applies user preferences that Copilot Memory stored for the pull request author.","When a developer forks the repository, the repository facts are copied to the fork.","Copilot Memory rejects a fact that contains a secret."],"answer":[0,3],"explanation":"Memories are shared across Copilot surfaces in a repository, but code review never applies user preferences. Forks do not receive memories, and Copilot rejects secrets.","rationale":["Yes: memories are shared across surfaces, so a fact that the cloud agent learns can be applied later by Copilot code review in the same repository.","No: Copilot code review and Agentic Autofix never apply user preferences. They only use repository-level information such as repository facts.","No: forking a repository does not copy its memories. The fork starts without stored facts and builds its own over time.","Yes: Copilot Memory rejects secrets, and Copilot is told not to store sensitive or short-lived task-specific information."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-07","obj":"4.3.2","difficulty":"easy","type":"order","stem":"User1 works in an interactive Copilot CLI session. User1 must check the local memory setting, perform a sensitive task without memory, and then use memory again.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run /memory show.","Run /memory off.","Perform the sensitive task in the session.","Run /memory on.","Run /compact.","Run /clear."],"answer":[0,1,2,3],"explanation":"/memory show displays the local memory setting, /memory off disables both memory types locally, and /memory on turns memory back on after the sensitive work.","rationale":["Step 1: /memory show displays the current local memory setting, so User1 checks the state before changing it.","Step 2: /memory off disables repository facts and user preferences locally, so the sensitive task does not use or store memories.","Step 3: the sensitive task runs while memory is off, which is the purpose of turning it off first.","Step 4: /memory on restores memory for the rest of the work after the sensitive task is complete.","Incorrect: /compact summarizes the conversation to free context window space. It does not turn off or remove memories.","Incorrect: /clear starts with a clear context for an unrelated task. It does not disable memory, so memories can still be used."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-08","obj":"4.3.2","difficulty":"hard","type":"single","stem":"You need to meet the requirement for the outdated Jest information.\n\nWhat should you do?","choices":["Delete the Jest fact in the repository settings, and add the Vitest rule to .github/copilot-instructions.md.","Downvote the Jest fact in each session, and wait for the fact to expire after the default 90 days.","Delete the Jest fact in your personal settings, and store a Vitest user preference for each developer.","Run /memory off in Copilot CLI for each developer, and add the Vitest rule to a Copilot Memory fact."],"answer":[0],"explanation":"The outdated fact must be removed from the repository, and a rule that must be applied consistently belongs in custom instructions. Memory is not guaranteed to be applied.","rationale":["Correct: deleting the repository fact stops Copilot from using it, and custom instructions are the recommended place for rules that must be followed consistently.","Incorrect: votes only lower the chance that a memory is used until a threshold is reached, and downvoting does not reset the timer. The fact stays usable in the meantime.","Incorrect: repository facts are deleted in the repository settings, not in personal settings, and user preferences are not shared with the repository or used by code review.","Incorrect: /memory off is a local CLI setting and does not affect Copilot cloud agent. You also cannot create a memory directly, and memory is not meant for consistent rules."],"case":"C-e","ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.2-09","obj":"4.3.2","difficulty":"easy","type":"single","stem":"Litware, Inc. runs Copilot CLI in a script by using copilot -p with a prompt. The runs must use Copilot Memory, but the session logs show that no memories are used.\n\nWhich option should you add to the command?","choices":["--enable-memory","--resume","--allow-tool write","--fleet"],"answer":[0],"explanation":"Non-interactive Copilot CLI runs need the --enable-memory option to use Copilot Memory. Interactive sessions use the /memory commands instead.","rationale":["Correct: GitHub Docs states that non-interactive runs need --enable-memory to use memory, so adding it to the scripted command enables memory.","Incorrect: --resume opens an earlier session by its ID or from a picker. It continues a conversation but does not turn on memory for a scripted run.","Incorrect: --allow-tool write lets the run modify files without asking. It controls tool permissions, not whether memories are used.","Incorrect: --fleet runs the prompt with parallel subagents. It changes how work is split, not whether memory is enabled."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"4.3.3-01","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Litware, Inc. has a custom agent profile named docs-writer.agent.md for Copilot cloud agent. The agent must be able to read, search, and edit files. It must not run shell commands and must not invoke other custom agents.\n\nSolution: You set tools to [\"read\", \"edit\", \"search\"] in the frontmatter.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"A specific tools list enables only the listed tools. read, edit, and search cover the required work, and execute and agent are not enabled.","rationale":["Correct: a tools list enables only the named tools, so the agent can
