cute gives docs-bot a shell, and shell commands can create, change, or delete files, so the requirement is not met."]}]},{"id":"6.1.1-01","obj":"6.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. classifies agent changes by risk. High-risk changes need a plan that a reviewer approves before any code is written.\n\nWhich change should Fabrikam, Inc. classify as high risk?","choices":["A change to the deployment workflow in .github/workflows","A correction of spelling errors in the README file","New unit tests for an existing utility module","A clearer name for a local variable in one function"],"answer":[0],"explanation":"Workflow, infrastructure, authentication, and production changes are high risk because they are hard to reverse or affect many systems. Documentation, tests, and small refactors are lower risk and reversible.","rationale":["Correct: the Learn module treats changes to workflows, infrastructure, authentication, and production as high risk or hard to reverse, which calls for a plan-first pull request.","Incorrect: a spelling fix in documentation is low risk and easy to reverse, so it can be planned and done in the same pull request.","Incorrect: new tests add checks without changing production behavior. They are low risk and do not need a separate plan approval.","Incorrect: renaming a local variable has a small, local scope and is easy to review and revert, so it is not a high-risk change."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/4-plan-reason-execution"},{"id":"6.1.1-02","obj":"6.1.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a public repository that uses Copilot cloud agent. User1, an outside contributor with read access only, adds a comment that mentions @copilot and asks Copilot to change the release script.\n\nWhat should the maintainers expect?","choices":["Copilot never sees the comment because User1 lacks write access.","Copilot changes the release script and opens a draft pull request.","Copilot asks a maintainer to approve the request in the session log.","Copilot applies the request only after the firewall approves it."],"answer":[0],"explanation":"Only users with write access can trigger Copilot cloud agent, and comments from users without write access are never shown to it. This removes a whole class of injection risk from outsiders.","rationale":["Correct: GitHub Docs state that only users with write access can trigger the agent, and comments from users without write access are never presented to it.","Incorrect: User1 has read access only, so the comment cannot trigger any work, and no pull request is created.","Incorrect: Copilot does not ask for approval of requests from people without write access. It never sees these comments at all.","Incorrect: the firewall controls outbound internet access during a session. It does not decide which comments reach the agent."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.1-03","obj":"6.1.1","difficulty":"easy","type":"single","stem":"Copilot cloud agent adds a configuration file that contains an API key to a pull request at Litware, Inc. The organization does not have a GitHub Advanced Security license.\n\nWhich built-in validation should detect the key?","choices":["Secret scanning","CodeQL","Copilot code review","The GitHub Advisory Database check"],"answer":[0],"explanation":"Copilot cloud agent runs built-in validation that does not need a GitHub Advanced Security license. Secret scanning is the part that detects secrets such as API keys.","rationale":["Correct: GitHub Docs list secret scanning among the validation that Copilot cloud agent runs without a GitHub Advanced Security license, and it detects secrets such as API keys and tokens.","Incorrect: CodeQL analyzes code for security vulnerabilities, such as injection flaws. It is not the check that looks for leaked credentials.","Incorrect: Copilot code review gives a second opinion on the change. Detecting committed secrets is the job of secret scanning.","Incorrect: the Advisory Database check looks at new dependencies for malware and high or critical vulnerabilities, not at secrets in files."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.1-04","obj":"6.1.1","difficulty":"medium","type":"dragdrop","stem":"Tailspin Toys wants to right-size human control for agent actions. Each action must get the lightest control that still matches its risk.\n\nWhich control should you use for each action? To answer, drag the appropriate controls to the correct actions. Each control may be used once, more than once, or not at all.","choices":["Plan and changes in the same pull request with standard review","Plan-first pull request with code owner review","Environment with required reviewers","Approve and run workflows","Block the action in every case"],"answer":[0,1,2,3],"explanation":"Low-risk, reversible changes get the lightest process. Workflow and authentication changes need an approved plan and code owner review. Production deployments are gated by environments, and CI on agent pushes waits for a human to approve the run.","rationale":["A documentation fix is low risk and reversible, so a single pull request that holds the plan and the change, with normal review, keeps delivery fast.","Changes to authentication code are high risk and hard to reverse, so the plan is approved first and code owners review the change.","A deploy job that references an environment with required reviewers waits for a named person to approve it, which suits production deployments.","By default, workflows on Copilot pushes wait until a user with write access clicks Approve and run workflows, so a human decides before CI runs the agent code."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/4-plan-reason-execution","targets":["The agent fixes a broken link in the documentation.","The agent changes the token validation logic in the authentication module.","A workflow job deploys agent-built code to production.","CI workflows must run on commits that Copilot pushed to its pull request."],"notes":["Fast path for low-risk, reversible work. The plan and the change are reviewed together, which avoids an extra round trip.","Slow path for high-risk or hard-to-reverse work. A reviewer approves the plan before code is written, and code owners review the result.","A deployment protection rule. The job that references the environment waits until one required reviewer approves it.","The default gate for workflows on Copilot pushes. A user with write access decides when the agent's code may run in CI.","Reserved for prohibited actions that no control can make acceptable. None of these actions is prohibited, so blocking them only slows delivery."]},{"id":"6.1.1-05","obj":"6.1.1","difficulty":"medium","type":"single","stem":"The security team at Woodgrove Bank asks why Copilot cloud agent has a firewall that limits its internet access by default.\n\nWhich risk should you identify as the main reason for the firewall?","choices":["Exfiltration of code or sensitive data to remote locations","Merging of pull requests that nobody has reviewed","Pushes from the agent directly to the default branch","Use of more AI credits than the budget allows"],"answer":[0],"explanation":"Surprising agent behavior or malicious instructions could make the agent send code or secrets to a remote host. The firewall limits where the agent can connect, which reduces that risk.","rationale":["Correct: GitHub Docs explain that the agent has access to code and sensitive information and could leak it, accidentally or because of malicious input, so GitHub restricts its internet access to reduce that risk.","Incorrect: unreviewed merges are prevented by the fact that the agent cannot approve or merge pull requests and by review rules, not by the firewall.","Incorrect: the agent can only push to its own branch and is subject to rulesets and branch protection. The firewall plays no part in that.","Incorrect: AI credit use is a cost concern managed through budgets and policies. The firewall is a security control for network access."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.1-06","obj":"6.1.1","difficulty":"medium","type":"multi","stem":"Relecloud reviews pull requests from Copilot cloud agent. Files in some paths must be classified as security-sensitive and require review by the platform team.\n\nWhich three paths should Relecloud classify as security-sensitive? Each correct answer presents part of the solution.","choices":[".github/workflows/",".github/agents/","infra/","docs/","tests/","styles/"],"answer":[0,1,2],"explanation":"Workflow files, agent and MCP configuration, and infrastructure code change what runs, with which permissions, and where. Documentation, tests, and styles are lower risk and reversible.","rationale":["Correct: workflow files define what runs in CI with which permissions and secrets. The Learn module's CODEOWNERS example routes .github/workflows/ to the platform team for this reason.","Correct: agent profiles define tools and MCP servers. GitHub Docs recommend protecting Copilot and MCP configuration with CODEOWNERS and code owner review.","Correct: infrastructure code changes production resources and is hard to reverse, so the Learn module puts it on the list of high-risk paths for CODEOWNERS.","Incorrect: documentation is low risk and easy to revert. Normal review is enough, and adding the platform team slows delivery for no gain.","Incorrect: tests add checks without changing production behavior. They are reviewed normally and do not need a security owner.","Incorrect: style sheets change presentation only. They are low risk and easy to revert, so normal review is enough."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/5-pull-request-governance-controls"},{"id":"6.1.1-07","obj":"6.1.1","difficulty":"hard","type":"single","stem":"Adatum Corporation wants an automation that runs Copilot when issues are labeled. Compliance requires that every pull request from the automation is attributed to a named person who is accountable for it, and that this person can never approve those pull requests.\n\nWhich type of automation should you create?","choices":["A personal automation that User1 creates","A shared automation that the repository owns","A shared automation with an additional reviewer","A personal automation that a GitHub App creates"],"answer":[0],"explanation":"Personal automations are attributed to the user who creates them, and that user cannot approve their pull requests. Shared automations are attributed to Copilot and get an extra review instead.","rationale":["Correct: GitHub Docs say that actions of a personal automation are attributed to its creator, who cannot approve its pull requests, which meets both compliance requirements.","Incorrect: actions of a shared automation are attributed to Copilot, not to a named person, so the accountability requirement is not met.","Incorrect: a shared automation already needs an extra review, but its work is still attributed to Copilot rather than to a named accountable person.","Incorrect: a personal automation belongs to a user account. A GitHub App is not a person, so it cannot be the accountable owner."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.1-08","obj":"6.1.1","difficulty":"hard","type":"single","stem":"Northwind Traders has a repository whose workflows use deployment secrets. Developers want CI to run automatically on every push from Copilot cloud agent and ask to turn off Require approval for workflow runs.\n\nWhat should you recommend?","choices":["Keep the setting, because unreviewed agent code could gain write access or secrets.","Turn off the setting, because the agent firewall already blocks all secret access.","Turn off the setting, because the agent cannot push to the default branch anyway.","Keep the setting, because the agent cannot run tests in its own environment."],"answer":[0],"explanation":"Workflows run with the permissions and secrets available to them. With approval turned off, code that nobody has reviewed runs in those workflows, so the risk outweighs the speed gain here.","rationale":["Correct: GitHub Docs warn that if you allow workflows to run automatically, unreviewed code written by Copilot could gain write access to the repository or access to secrets.","Incorrect: the firewall limits outbound internet access from the agent session. It does not stop a workflow from reading secrets when it runs the agent's code.","Incorrect: the branch restriction limits where the agent pushes, but workflows can still run its code with secrets on the pull request branch.","Incorrect: the agent can run tests and linters in its own ephemeral environment. The setting exists because of workflow permissions, not testing."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"6.1.2-01","obj":"6.1.2","difficulty":"easy","type":"single","stem":"Wingtip Toys uses agents for documentation updates. These changes are low risk and easy to reverse. The team wants the fastest delivery that still keeps a human review.\n\nWhich pattern should the team use?","choices":["Plan and changes in the same pull request","A plan-first pull request before any changes","A production environment with required reviewers","Direct pushes from the agent to the default branch"],"answer":[0],"explanation":"For low-risk, reversible work, a single pull request that holds both the plan and the change gives speed and still keeps the human review.","rationale":["Correct: the Learn module recommends plan and execution in the same pull request for low or medium risk, reversible changes where speed matters.","Incorrect: a separate plan approval adds a round trip that the Learn module reserves for high-risk or hard-to-reverse changes.","Incorrect: environments gate deployment jobs. Documentation pull requests do not deploy to production, so this adds friction without reducing risk.","Incorrect: Copilot cloud agent cannot push to the default branch, and removing the pull request removes the human review that the team wants."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/4-plan-reason-execution"},{"id":"6.1.2-02","obj":"6.1.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. evaluates how much autonomy Copilot cloud agent has by default.\n\nWhich action should Fabrikam, Inc. expect the agent to never perform?","choices":["Merge its own pull request into the default branch","Push commits to a branch whose name starts with copilot/","Open a draft pull request that is linked to the issue","Run tests and linters in its development environment"],"answer":[0],"explanation":"Copilot cloud agent can work on its own branch and open draft pull requests, but it cannot approve or merge them. A human with the right access always makes the merge decision.","rationale":["Correct: GitHub Docs state that Copilot cloud agent opens draft pull requests that a human must review and merge, and that it cannot approve or merge them.","Incorrect: pushing to a new copilot/ branch is how the agent normally delivers its work for an issue.","Incorrect: opening a draft pull request linked to the issue is the normal output of a cloud agent task.","Incorrect: the agent runs tests and linters in its ephemeral environment to validate its work before it pushes."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.2-03","obj":"6.1.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. adds a planning agent to its workflow. The planning agent must never change files in the repository.\n\nWhat should you put in the profile of the planning agent?","choices":["A tools list that contains only read and search","An instruction in the prompt not to edit files","A model property that selects a smaller model","A target property that is set to github-copilot"],"answer":[0],"explanation":"Instructions are guidance, while a tool allowlist is enforcement. A planning agent with only read and search tools cannot edit files, whatever its prompt says.","rationale":["Correct: the Learn module recommends read-only tools for planning and review agents and treats tool allowlists as enforcement, so read and search alone keep the agent from editing files.","Incorrect: the Learn module treats instructions not to edit as guidance that an agent might ignore. They do not enforce anything.","Incorrect: a smaller model changes cost and quality. It still has the same tools, so the agent could still edit files.","Incorrect: target chooses where the agent is available. It does not limit which tools the agent can use there."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"6.1.2-04","obj":"6.1.2","difficulty":"medium","type":"order","stem":"At Litware, Inc., agents prepare releases, and a workflow named deploy.yml has a job that deploys to production. A person other than the one who starts a deployment must approve it, and the job must never run without this approval, not even once.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In the repository settings, click Environments, click New environment, enter production, and click Configure environment.","Select Required reviewers, add the release team, select Prevent self-review, and click Save protection rules.","Add environment: production to the deploy job in deploy.yml and merge the change through a pull request.","Select Wait timer, enter 30 minutes, and click Save protection rules.","Turn off Require approval for workflow runs in the Copilot cloud agent settings.","Store the deployment credentials as repository secrets instead of environment secrets."],"answer":[0,1,2],"explanation":"The environment and its protection rules must exist before any job uses it, otherwise a run could deploy without approval. Required reviewers and prevent self-review give the independent approval.","rationale":["Step 1: you create the production environment first, because protection rules are configured on an environment.","Step 2: required reviewers make the job wait for approval, and Prevent self-review stops the person who started the run from approving it.","Step 3: only after the rules exist do you make the deploy job reference the environment, so the first run is already gated.","Incorrect: a wait timer only delays the job. Nobody approves it, so it does not provide the required human decision.","Incorrect: this setting is about workflows on Copilot pushes, and turning it off reduces control. It does not gate production deployments.","Incorrect: repository secrets are available to jobs without environment approval. Environment secrets stay locked until the reviewers approve."],"ref":"https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/manage-environments"},{"id":"6.1.2-05","obj":"6.1.2","difficulty":"medium","type":"yesno","stem":"Adatum Corporation reviews the default limits on the autonomy of Copilot cloud agent. The repository has a ruleset that requires one approving review on the default branch.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Copilot cloud agent can push directly to the default branch when the ruleset is disabled.","Commits that Copilot cloud agent makes list the user who requested the work as a co-author.","A pull request under the Copilot app identity needs one more approval because the ruleset requires a review.","The GITHUB_TOKEN default permissions policy restricts the token of the Copilot cloud agent session."],"answer":[1,2],"explanation":"The agent always pushes to one branch and cannot run git push directly. Its commits credit the requester. An extra approval applies to pull requests under its app identity, and the GITHUB_TOKEN policy does not change its session token.","rationale":["No: the agent can only push to a single branch, either the existing pull request branch or a new copilot/ branch, and it cannot run git push directly.","Yes: GitHub Docs say that commits are authored by Copilot with the user who requested the work as co-author, which keeps a named person accountable.","Yes: when a pull request is under the Copilot app identity and the repository requires at least one approval, one additional approval is required. This is on by default for rulesets.","No: the GitHub Docs build-guardrails tutorial states that the GITHUB_TOKEN default permissions policy does not affect the token of the Copilot session, although it applies to copilot-setup-steps.yml."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.2-06","obj":"6.1.2","difficulty":"medium","type":"single","stem":"Relecloud creates an automation that runs Copilot when an issue is opened. The automation must add labels to the issue that triggered it and must not change any other issue or pull request.\n\nWhat should you configure?","choices":["Set what configured tools can change to Only this issue.","Set what configured tools can change to Anything in this repository.","Make the automation shared so that its pull requests need an extra review.","Allow events from users without write access to trigger the automation."],"answer":[0],"explanation":"Automations let you choose which tools they can use and how far those tools reach. Limiting the reach to the triggering issue gives the automation exactly the autonomy it needs.","rationale":["Correct: GitHub Docs describe the option Only this issue for what configured tools can change, which keeps the automation's changes on the issue that triggered it.","Incorrect: Anything in this repository lets the tools change other issues and pull requests, which is more autonomy than labeling one issue needs.","Incorrect: a shared automation adds review for pull requests, but it does not limit which issues the tools can change, and this automation creates no pull requests.","Incorrect: events from untrusted users are ignored by default for good reason. Accepting them widens who can trigger the automation and does not limit its reach."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.1.2-07","obj":"6.1.2","difficulty":"hard","type":"single","stem":"Woodgrove Bank must run Copilot cloud agent sessions on self-hosted runners on its own network. The security team wants to reduce the risk that one session affects another.\n\nWhat should you configure?","choices":["Ephemeral self-hosted runners that are restricted to a runner label","Persistent self-hosted runners that are shared by all repositories","Self-hosted runners with Require approval for workflow runs turned off","Self-hosted runners that store Agents secrets on the local disk"],"answer":[0],"explanation":"GitHub-hosted runners start each job on a fresh VM. When self-hosted runners are required, ephemeral runners give the same clean start, and organization owners can restrict agent sessions to runners with a specific label.","rationale":["Correct: GitHub Docs recommend ephemeral runners if you use self-hosted runners for Copilot, and organization owners can restrict the runners that agents use to a label.","Incorrect: persistent runners keep files and state between jobs, so one session can leave data or changes that affect the next session.","Incorrect: turning off workflow approval lets unreviewed agent code run automatically, which adds risk instead of isolating sessions.","Incorrect: secrets on a runner's disk can be read by later jobs on that runner. Agents secrets are provided to sessions by GitHub, not stored locally."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/build-guardrails"},{"id":"6.1.2-08","obj":"6.1.2","difficulty":"hard","type":"single","stem":"Tailspin Toys builds an agent that can call a tool that deletes cloud resources. The deletions cannot be undone. The agent must still be able to perform cleanup tasks, and the design must follow Responsible AI guidance for high-risk actions.\n\nHow should you configure the agent?","choices":["Disclose each deletion and require human confirmation before every call.","Allow every deletion without approval and log each call for later review.","Require human confirmation only for the first deletion in each session.","Remove the tool so that the agent can never delete cloud resources."],"answer":[0],"explanation":"Irreversible actions need the most human control: the agent must disclose what it is about to do and get explicit confirmation each time. Logging alone comes too late, and removing the tool breaks the requirement.","rationale":["Correct: Learn guidance says high-risk actions need human-in-the-loop confirmation, and irreversible actions need disclosure plus confirmation, which keeps a human decision on each deletion.","Incorrect: logs help with audits after the fact, but an irreversible deletion cannot be undone once a reviewer finds the problem.","Incorrect: later deletions in the same session can target other resources, so one confirmation does not cover the risk of each irreversible call.","Incorrect: prohibited actions are never allowed, but the agent must still perform cleanup, so removing the tool fails the requirement."],"ref":"https://learn.microsoft.com/azure/foundry/concepts/ai-red-teaming-agent"},{"id":"6.1.2-09","obj":"6.1.2","difficulty":"hard","type":"single","stem":"You need to assign the autonomy level for agent changes to the deploy.yml workflow file, in line with the Fabrikam, Inc. requirements and Incident 3.\n\nWhat should you do?","choices":["Use a plan-first pull request and require code owner review by the platform team.","Let implementer plan and change the file in one pull request with standard review.","Turn off Require approval for workflow runs so CI validates every workflow change.","Add an instruction to the implementer profile that it must not edit workflow files."],"answer":[0],"explanation":"Workflow changes are high risk. The plan is approved before code is written, and CODEOWNERS with required code owner review makes sure the platform team sees every change, which Incident 3 showed was missing.","rationale":["Correct: a plan-first pull request meets the requirement that a reviewer approves the plan first, and code owner review for .github/workflows ensures that the platform team reviews the change.","Incorrect: a single pull request with standard review is the low-risk pattern for documentation and tests. It is how Incident 3 happened.","Incorrect: turning off approval lets unreviewed agent code run in workflows with their permissions and secrets, which increases risk.","Incorrect: an instruction is guidance that the agent might not follow, and it does not make the platform team review changes from humans."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/5-pull-request-governance-controls","case":"C-f"},{"id":"6.2.1-01","obj":"6.2.1","difficulty":"medium","type":"single","case":"C-g","stem":"Copilot cloud agent opens the following draft pull requests in LabPortal. All checks pass on each pull request.\n\nWhich pull request should you route to SecTeam for a decision before it is merged?","choices":["A pull request that changes how src/auth/ validates session tokens","A pull request that adds UI integration tests to the tests/ folder","A pull request that updates button labels in src/ui/ components","A pull request that adds an npm package for formatting dates"],"answer":[0],"explanation":"The business requirements reserve a SecTeam decision for authentication code and workflow definitions. Token validation in src/auth/ is authentication code, so a human with security judgment must decide on it. The other changes are covered by checks and normal review.","rationale":["Correct: src/auth/ holds sign-in and token validation, and the business requirements say that authentication changes need a decision by a member of SecTeam before merging, regardless of passing checks.","Incorrect: new tests under tests/ do not change authentication code or workflow definitions, so the normal required approval is enough. Route test changes to SecTeam only if they touch security-sensitive test fixtures.","Incorrect: label text in src/ui/ is a low-risk change that the existing required approval covers. A SecTeam decision would add delay without reducing risk, which conflicts with avoiding approvals that do not reduce risk.","Incorrect: Copilot cloud agent checks newly added dependencies against the GitHub Advisory Database by default, so a known malicious or high-severity package is flagged without SecTeam. Route it to SecTeam only if the requirements named dependencies."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.2.1-02","obj":"6.2.1","difficulty":"medium","type":"order","stem":"User1 assigned an issue in Repo1 to Copilot cloud agent. Copilot opened a draft pull request that also modifies .github/workflows/ci.yml. Repo1 uses the default Copilot cloud agent settings and a CODEOWNERS file that assigns /.github/workflows/ to Team1. A branch protection rule on main requires review from code owners.\n\nA human must inspect the workflow change before any workflow runs, and the pull request must be merged with a valid code owner review.\n\nWhich four actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["User1 reviews the session log and the diff of .github/workflows/ci.yml in the pull request.","User1 selects Approve and run workflows in the merge box of the pull request.","User1 checks the workflow results and marks the pull request as ready for review.","A member of Team1 reviews and approves the pull request, and then the pull request is merged.","User1 approves the pull request to satisfy the code owner review requirement.","User1 asks Copilot in a comment to mark the pull request as ready for review."],"answer":[0,1,2,3],"explanation":"Workflows on Copilot pull requests wait for a user with write access to approve them, so the workflow change must be inspected first. Code owners are not requested on draft pull requests, so the pull request must be marked ready before Team1 can review it. The requester cannot provide the required approval.","rationale":["Step 1: a changed workflow file can run with repository permissions, so the human must read the diff, especially under .github/workflows/, before allowing any workflow to run.","Step 2: by default, workflows on Copilot pull requests do not run until a user with write access selects Approve and run workflows in the merge box, which is the gate that the inspection protects.","Step 3: Copilot opens draft pull requests and cannot mark them ready. Code owners are notified only when a draft is marked ready, so User1 does this after the checks pass.","Step 4: the code owner review from Team1 satisfies the branch protection rule. An independent reviewer is needed because the requester's approval does not count.","Incorrect: when approvals are required, the approval of the user who asked Copilot to create the pull request does not count. This keeps an independent reviewer in the loop, so a member of Team1 must approve.","Incorrect: Copilot cloud agent cannot mark its own pull requests as ready for review. A human does this, which is one of the deliberate points where a person decides that the work is ready."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"6.2.1-03","obj":"6.2.1","difficulty":"hard","type":"dragdrop","stem":"Fabrikam, Inc. uses Copilot cloud agent in Repo1. The company wants a human decision at three points and must use a built-in GitHub control for each point.\n\nWhich control should you use for each requirement? To answer, drag the appropriate controls to the correct requirements. Each control may be used once, more than once, or not at all.","choices":["Approve and run workflows","Required review from code owners","Environment required reviewers","Required status checks","Push protection"],"targets":["Copilot changes a workflow file, and no workflow may run until a person with write access has looked at the change","Any change under /security/ must be accepted by a member of SecTeam before it is merged","A job that deploys main to production must wait until a release manager agrees"],"answer":[0,1,2],"rationale":["Workflows on Copilot pull requests are held until a user with write access selects Approve and run workflows, so the person decides before any changed workflow executes.","A CODEOWNERS entry for /security/ plus the require review from Code Owners rule makes a SecTeam member's approval a condition for merging those files.","Required reviewers on the production environment pause the deploy job until one of the listed reviewers approves, which places the release manager's decision before the deployment."],"notes":["Approve and run workflows is the default gate for workflow runs on Copilot pull requests. Use it when a person must look at a change before workflows execute with repository access.","Required review from code owners routes changes to owners of matching paths. Use it when a team must accept changes to sensitive folders such as /security/ before merge.","Environment required reviewers pause jobs that reference the environment until an approver agrees. Use it for deployments and other actions that must wait for a named person.","Required status checks are automated gates that block merging until checks pass. They do not involve human judgment, so they fit only when a tool can make the decision.","Push protection blocks pushes that contain detected secrets. It is an automated policy control for secret leaks, not a way to get a human decision at a chosen point."],"explanation":"Each requirement maps to the control that pauses work at that exact point: workflow execution, merge of sensitive paths, and deployment. Status checks and push protection are automated blocks that do not ask a person to decide.","ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/5-pull-request-governance-controls"},{"id":"6.2.1-04","obj":"6.2.1","difficulty":"easy","type":"multi","stem":"User1 assigns an issue in Repo1 to Copilot cloud agent. Repo1 uses the default Copilot cloud agent settings, and main requires one approval before merging.\n\nWhich three actions should a human perform because Copilot cloud agent cannot perform them? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.","choices":["Mark the draft pull request as ready for review","Approve and merge the pull request","Approve the pending workflow runs on the pull request","Push commits to a branch that starts with copilot/","Run the unit tests in the agent environment","Open a draft pull request with the changes"],"answer":[0,1,2],"explanation":"Copilot cloud agent works on its own branch and opens draft pull requests, but it cannot mark them ready, approve them, or merge them. By default, workflows on its pull requests wait for a user with write access to approve them.","rationale":["Correct: Copilot cannot mark its pull requests as ready for review, so a person decides when the draft is ready for reviewers.","Correct: Copilot cannot approve or merge pull requests. A human reviewer approves, which keeps required approvals meaningful.","Correct: by default, workflows on Copilot pull requests do not run until a user with write access selects Approve and run workflows. A repository admin can change this setting.","Incorrect: pushing to a new copilot/ branch is exactly what Copilot does during a session. It can push only to that single branch, which limits its reach without human involvement.","Incorrect: Copilot runs tests and linters in its own ephemeral development environment as part of its work. No human action is needed for this step.","Incorrect: Copilot opens a draft pull request itself when it has changes to propose. The human decision comes later, when the draft is reviewed and marked ready."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.2.1-05","obj":"6.2.1","difficulty":"easy","type":"yesno","stem":"Woodgrove Bank uses Copilot cloud agent in Repo1 with the default settings. The main branch requires one approval before merging. User1 has write access to Repo1 and assigns an issue to Copilot. User2 has read access to Repo1 only.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["User1 can approve the pull request that Copilot opens for the issue to meet the approval requirement.","A comment that User2 adds to the issue is passed to Copilot as context.","Copilot can approve and merge its own pull request when all checks pass.","When User1 mentions @copilot in a comment on the pull request, Copilot can push more commits to the pull request branch."],"answer":[3],"explanation":"The requester cannot approve the pull request that Copilot creates for them, and Copilot cannot approve or merge. Comments from users without write access never reach the agent. A mention by a user with write access on an existing pull request makes Copilot push to that pull request's branch.","rationale":["No: the user who asked Copilot to create the pull request cannot approve it, so the required approval must come from another reviewer. This keeps an independent person in the loop.","No: comments from users without write access are never shown to the agent. This reduces the risk that untrusted users steer Copilot with injected instructions.","No: Copilot cloud agent cannot approve or merge pull requests. Merging stays a human decision, together with branch protection and required checks.","Yes: when a user with write access mentions @copilot on an existing pull request, Copilot pushes its changes to that pull request's branch, and those pushes stay subject to branch protection."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.2.1-06","obj":"6.2.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. requires a member of PlatformTeam to review every change that Copilot cloud agent makes to GitHub Actions workflow files in Repo1. The main branch already requires review from code owners.\n\nWhich line should you add to the CODEOWNERS file?","choices":["/.github/workflows/ @contoso/platformteam","/.github/copilot/ @contoso/platformteam","/workflows/ @contoso/platformteam","*.md @contoso/platformteam"],"answer":[0],"explanation":"Workflow files live in .github/workflows/, so a CODEOWNERS pattern for that folder makes PlatformTeam the owner. With review from code owners required, changes to those files need a PlatformTeam approval.","rationale":["Correct: the /.github/workflows/ pattern matches the workflow files of the repository, and the require review from Code Owners rule then makes a PlatformTeam approval a condition for merging those changes.","Incorrect: /.github/copilot/ covers Copilot configuration files, not workflow definitions. Use a pattern like this when a team must own changes to Copilot settings instead.","Incorrect: /workflows/ matches a workflows folder at the repository root, which is not where GitHub Actions reads workflow files. It would fit only if the repository had such a folder.","Incorrect: *.md assigns ownership of Markdown files, such as documentation, to the team. It does not match YAML workflow files, so workflow changes would not require PlatformTeam."],"ref":"https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"},{"id":"6.2.1-07","obj":"6.2.1","difficulty":"medium","type":"single","stem":"User1 plans to ask Copilot cloud agent to change the Terraform files that define production networking in Repo1. The change is hard to reverse. For low-risk work, the team lets Copilot plan and implement in a single pull request.\n\nWhich approach should User1 use for the networking change?","choices":["Use a plan-first pull request that a human approves before implementation","Let Copilot plan and implement in one pull request with the usual checks","Let Copilot implement the change and merge it after all checks pass","Add a custom instruction that asks Copilot to be careful with networking"],"answer":[0],"explanation":"High-risk or hard-to-reverse work, such as infrastructure, workflows, authentication, or production changes, should start with a plan-first pull request. A human approves the plan before any implementation, while low-risk work can combine plan and execution.","rationale":["Correct: a plan-first pull request puts a human decision on the approach before code is written, which is the recommended pattern for infrastructure and production changes that are hard to reverse.","Incorrect: plan and execution in one pull request suits low or medium risk work where speed matters. For hard-to-reverse infrastructure changes, the plan needs its own human approval first.","Incorrect: Copilot cannot merge pull requests, and passing checks alone do not judge whether a networking design is right. A human must decide on the plan for this kind of change.","Incorrect: instructions are guidance that the model can misread, not an enforced gate. Use instructions for conventions, and use a plan-first pull request with review to control risky changes."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/4-plan-reason-execution"},{"id":"6.2.1-08","obj":"6.2.1","difficulty":"hard","type":"single","stem":"Copilot cloud agent works on a pull request in Repo1. A required status check named integration-tests fails. Copilot pushes a fix, and the same check fails again with the same error. The team wants humans involved only when their judgment is needed.\n\nWhat should the team do next?","choices":["Escalate the pull request to a human who decides on the next step","Let Copilot keep pushing fixes until the integration-tests check passes","Remove integration-tests from the required checks of the main branch","Ask Copilot to change the workflow so that the failing step is skipped"],"answer":[0],"explanation":"A repeated failure of the same required check signals that automation is stuck, which is the point where human judgment adds value. Escalation keeps the check in place and lets a person decide how to proceed.","rationale":["Correct: when the same required check fails twice, the recommended control is to escalate to a human. A person can judge whether the test, the code, or the approach is wrong.","Incorrect: unlimited retries waste time and compute and can hide a real defect. Retrying fits a single transient failure, not a repeated failure with the same error.","Incorrect: removing a required check weakens the merge gate for every pull request just to get one change through. Change required checks only through a deliberate governance decision.","Incorrect: letting the agent edit the workflow to skip a failing step removes a control without human review. Workflow changes are governance-sensitive and should be decided by a person."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"6.2.1-09","obj":"6.2.1","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. builds an agent that requests human approval before it runs a database migration. A reviewer approves a request at 09:00. At 15:00, the agent runs the migration with different arguments that it generated after the approval.\n\nWhich design change should Fabrikam make to the approval flow?","choices":["Tie each approval to the exact action and arguments, and revalidate before running","Ask the reviewer to approve every action that the agent runs during the day","Log every migration that the agent runs so that auditors can review it later","Let the agent reuse an approval for any action of the same type that day"],"answer":[0],"explanation":"An approval is only meaningful for what the reviewer actually saw. Binding the approval to the exact action and arguments, with an expiry, and revalidating before execution stops the agent from running something different under an old approval.","rationale":["Correct: binding each approval to the exact action and arguments, with an expiry, and revalidating before execution keeps the human decision tied to what actually runs.","Incorrect: approving every action turns reviewers into a bottleneck who start to rubber-stamp requests. Reserve human review for the high-impact actions where judgment changes the risk.","Incorrect: an audit trail helps after the fact but does not stop an unapproved migration from running. Use logging together with a binding approval, not instead of it.","Incorrect: reusing approvals across actions of the same type is the weakness that caused the problem. Broad reuse fits only low-impact actions that do not need human approval at all."],"ref":"https://learn.microsoft.com/startups/build/enterprise-readiness/ai-guardrails/safety-to-controllability-enterprise-ai"},{"id":"6.2.2-01","obj":"6.2.2","difficulty":"medium","type":"single","case":"C-g","stem":"You need to meet the business requirement for the anonymized patient sample files in LabPortal.\n\nWhat should you configure?","choices":["Content exclusion for the data/samples/ path in LabPortal","A push ruleset that restricts the data/samples/ file path","A CODEOWNERS entry that assigns data/samples/ to SecTeam","A custom instruction that tells Copilot to skip data/samples/"],"answer":[0],"explanation":"Content exclusion stops excluded files from informing Copilot responses and from being reviewed by Copilot code review, and it is supported for Copilot in the cloud on Copilot Business and Enterprise. The other options control pushes, reviews, or guidance, not what Copilot can use.","rationale":["Correct: excluded files do not inform Copilot responses and are not reviewed by Copilot code review. Trey Research has Copilot Enterprise, which supports content exclusion for Copilot in the cloud and IDE agents.","Incorrect: a push ruleset that restricts file paths blocks pushes that change those paths. The files already exist and integration tests need them, and the rule does not stop Copilot from reading them.","Incorrect: CODEOWNERS routes reviews of changes to the folder to SecTeam. It does not prevent Copilot from using the file contents when it generates code or answers questions.","Incorrect: instructions are guidance that the model can ignore or misread, so they do not enforce the requirement. Use instructions for conventions and content exclusion to keep files out of Copilot context."],"ref":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"6.2.2-02","obj":"6.2.2","difficulty":"medium","type":"order","stem":"Adatum Corporation uses GitHub Secret Protection in Repo1. Developers sometimes commit Adatum internal service tokens, which have a custom format that secret scanning does not detect by default. The security team wants pushes that contain these tokens to be blocked, without creating false alerts before the pattern is checked.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In Repo1, open Settings > Advanced Security and, next to Custom patterns, click New pattern. Enter a pattern name and a regular expression for the token format.","Click Save and dry run, and review the sample results for false positives.","Click Publish pattern.","Next to push protection for the custom pattern, click Enable.","Add the regular expression to the paths-ignore list in .github/secret_scanning.yml.","Create a branch ruleset that requires code scanning results for Repo1."],"answer":[0,1,2,3],"explanation":"A custom pattern defines the token format. A dry run finds matches without creating alerts, so you can fix false positives before you publish. Push protection for a custom pattern can be enabled only after the dry run succeeds and the pattern is published.","rationale":["Step 1: secret scanning detects a custom token format only after you define a custom pattern with a name and a regular expression. Secret Protection is already enabled, which is the prerequisite.","Step 2: Save and dry run identifies matches in the repository without creating alerts, so the team can review false positives before the pattern goes live.","Step 3: Publish pattern makes the pattern active, and secret scanning then scans the full Git history on all branches. Publishing must happen before push protection is available.","Step 4: the Enable button for push protection is available only after the dry run succeeds and the pattern is published. Once enabled, pushes that contain the token are blocked.","Incorrect: paths-ignore in secret_scanning.yml excludes paths from secret scanning. It does not define a new secret format, and it would reduce detection instead of adding it.","Incorrect: a code scanning rule blocks merges based on code scanning alerts such as CodeQL results. It does not detect secrets, and it does not block pushes."],"ref":"https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/define-custom-patterns"},{"id":"6.2.2-03","obj":"6.2.2","difficulty":"hard","type":"dropdown","stem":"Proseware, Inc. adds the file .github/hooks/policy.json to Repo1. The script check-tool.sh inspects each tool call. When a call violates company policy, the call must be blocked without a prompt, both in Copilot CLI and in Copilot cloud agent sessions.\n\n```json\n{\n  \"version\": 1,\n  \"hooks\": {\n    \"[[1]]\": [\n      { \"type\": \"command\", \"bash\": \"./scripts/check-tool.sh\", \"timeoutSec\": 30 }\n    ]\n  }\n}\n```\n\nFor a violation, check-tool.sh writes this output:\n\n```json\n{ \"permissionDecision\": \"[[2]]\", \"permissionDecisionReason\": \"Blocked by policy\" }\n```\n\nHow should you complete the configuration? To answer, select the appropriate options in the answer area.","targets":[{"label":"Box 1","options":["preToolUse","postToolUse","permissionRequest","errorOccurred"],"why":["Correct: preToolUse runs before a tool executes and can return a permission decision, so it can stop a call in both Copilot CLI and Copilot cloud agent.","Incorrect: postToolUse runs after a tool completes successfully. It can change the result or add context, but the action has already happened, so it cannot block it.","Incorrect: in Copilot cloud agent, tool calls are pre-approved, so permissionRequest does not fire or has no effect there. The docs advise preToolUse for decisions in cloud agent.","Incorrect: errorOccurred fires when an error occurs during execution and cannot block anything. Use it for logging or alerting on failures, not for policy enforcement."]},{"label":"Box 2","options":["deny","ask","allow"],"why":["Correct: deny stops the tool from executing, and permissionDecisionReason, which is required for deny, tells the agent why the call was blocked.","Incorrect: in Copilot CLI, ask can prompt the user, which breaks the no-prompt requirement. Cloud agent treats ask as deny only because no user can answer there.","Incorrect: allow lets the tool execute, which is the opposite of what a policy violation requires. Return allow for calls that pass the check."]}],"answer":[0,0],"explanation":"A preToolUse hook in .github/hooks/ runs before each tool call in both Copilot CLI and Copilot cloud agent. Returning deny with a reason blocks the call independently of the model's reasoning, while ask can prompt a user in Copilot CLI.","ref":"https://docs.github.com/en/copilot/reference/hooks-reference"},{"id":"6.2.2-04","obj":"6.2.2","difficulty":"easy","type":"single","stem":"Repo1 is used by developers and by Copilot cloud agent. You must block any push to Repo1 that contains a detected secret, before the secret reaches the repository.\n\nWhich feature should you enable?","choices":["Push protection for secret scanning","Dependabot alerts for the repository","Code scanning with the default setup","Required signed commits on main"],"answer":[0],"explanation":"Push protection scans pushes for secrets and blocks them before the secret is stored in the repository. The other features detect other problems or check commit metadata.","rationale":["Correct: push protection blocks pushes that contain supported secrets before they reach the repository, from the command line, web commits, file uploads, and other push surfaces.","Incorrect: Dependabot alerts report vulnerable dependencies after they are in the repository. They do not inspect pushes for secrets. Use them to track known vulnerabilities in packages.","Incorrect: code scanning finds security problems in code, such as injection flaws, and reports alerts. It does not block a push that contains a credential.","Incorrect: required signed commits checks that commits are signed by a verified key. It does not inspect commit content, so a signed commit can still contain a secret."],"ref":"https://docs.github.com/en/code-security/concepts/secret-security/about-push-protection"},{"id":"6.2.2-05","obj":"6.2.2","difficulty":"easy","type":"single","stem":"Repo1 is a private repository in an organization that does not have GitHub Advanced Security. Packages that Copilot cloud agent adds must be checked for known malware and for high or critical vulnerabilities before a human reviews the pull request.\n\nWhat should you do?","choices":["Keep the default validation tools of Copilot cloud agent enabled","Buy GitHub Advanced Security and turn on Dependabot updates","Tell Copilot in custom instructions to check every new package","Turn on push protection for secret scanning in the repository"],"answer":[0],"explanation":"Copilot cloud agent runs built-in validation by default, without a GitHub Advanced Security license. It checks new dependencies against the GitHub Advisory Database for malware and for High or Critical CVSS vulnerabilities.","rationale":["Correct: the built-in validation checks newly added dependencies against the GitHub Advisory Database for malware and High or Critical vulnerabilities, and it needs no GitHub Advanced Security license.","Incorrect: buying a license adds cost and effort that the requirement does not need, because the built-in validation already covers new dependencies that Copilot adds.","Incorrect: an instruction is guidance that the model can skip, so it does not enforce the check. Built-in validation runs as a tool, independently of what the model decides.","Incorrect: push protection blocks secrets in pushes. It does not check packages for malware or vulnerabilities, so it addresses a different policy."],"ref":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/risks-and-mitigations"},{"id":"6.2.2-06","obj":"6.2.2","difficulty":"easy","type":"single","stem":"A security policy at Litware, Inc. limits the internet hosts that agents can reach. Copilot cloud agent works in Repo1 and must reach only approved package registries and the hosts of the company build service.\n\nWhich feature should you configure?","choices":["The Copilot cloud agent firewall with a custom allowlist","A push ruleset that restricts file extensions in Repo1","Content exclusion settings for the Repo1 repository","A branch ruleset that requires status checks on main"],"answer":[0],"explanation":"The Copilot cloud agent firewall is on by default and restricts internet access. A custom allowlist adds the company build hosts, and the recommended allowlist covers common package registries.","rationale":["Correct: the firewall restricts outbound internet access from the agent environment, and a custom allowlist adds approved domains or URLs, such as the company build service hosts.","Incorrect: a push ruleset that restricts file extensions blocks pushes of certain file types. It has no effect on which internet hosts the agent can reach.","Incorrect: content exclusion keeps selected files out of Copilot context. It does not filter network traffic, so it cannot enforce a list of allowed hosts.","Incorrect: required status checks block merges until checks pass. They act on pull requests, not on network calls that the agent makes during a session."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"6.2.2-07","obj":"6.2.2","difficulty":"medium","type":"single","stem":"Repo1 has code scanning configured with CodeQL. Company policy states that no pull request, including pull requests from Copilot cloud agent, can be merged into main while code scanning reports high or critical security alerts for the changes.\n\nWhich ruleset rule should you add for main?","choices":["Require code scanning results","Require signed commits","Require deployments to succeed","Block force pushes"],"answer":[0],"explanation":"The Require code scanning results rule blocks merges based on code scanning alert severity. Copilot cloud agent is subject to rulesets like any other contributor, so the rule applies to its pull requests too.","rationale":["Correct: this rule lets you set the security alert severity, such as High or higher, at which a pull request cannot be merged, and it applies to Copilot pull requests like any other.","Incorrect: required signed commits checks commit signatures, not security alerts. Copilot signs its commits, so this rule would not stop a change with high-severity alerts.","Incorrect: this rule requires deployments to selected environments to succeed before merging. It checks deployment outcomes, not code scanning alerts, so it fits staging validation instead.","Incorrect: blocking force pushes protects branch history from being rewritten. It does not evaluate code scanning alerts, so vulnerable code could still be merged."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"6.2.2-08","obj":"6.2.2","difficulty":"hard","type":"single","stem":"An enterprise sets Restrict MCP access to registry servers to Registry only and points the MCP Registry URL to an Azure API Center registry. A developer runs an approved MCP server locally, but the server is not listed in the registry, and Copilot blocks it.\n\nWhat should the enterprise admin do so that the developer can use the server?","choices":["Add the server to the registry with an ID that matches the developer setup","Add the server host to the custom allowlist of the cloud agent firewall","Ask the developer to start the server as a remote server instead","Add the server name to the Copilot custom instructions of the repo"],"answer":[0],"explanation":"With Registry only, local servers are also blocked unless they are in the registry with exactly matching IDs. Adding the server to the registry keeps the allowlist enforced while allowing the approved server.","rationale":["Correct: under Registry only, local MCP servers must also appear in the registry, and the IDs must match exactly, so registering the server is the supported way to allow it.","Incorrect: the firewall controls network egress from the Copilot cloud agent environment. It does not decide which MCP servers the policy allows, so the server stays blocked.","Incorrect: remote servers that are not in the registry are blocked by the same policy. Moving the server does not help unless it is registered.","Incorrect: custom instructions guide the model and do not change policy. The MCP access policy is evaluated independently of any instruction text."],"ref":"https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists"},{"id":"6.2.2-09","obj":"6.2.2","difficulty":"hard","type":"single","stem":"The custom instructions of Repo1 state that Copilot must not run terraform apply. During a Copilot cloud agent session, the agent ran terraform apply anyway. The platform team needs a control that blocks the command regardless of how the model interprets its instructions.\n\nWhat should the platform team add?","choices":["A pre-tool-use hook in .github/hooks/ that blocks the command","A stronger warning in the .github/copilot-instructions.md file","A note in the description of a custom agent for Terraform work","A CODEOWNERS entry for the Terraform folder in the repository"],"answer":[0],"explanation":"Instructions are guidance, while hooks are enforced independently of the model's reasoning. A pre-tool-use hook can block a command before it runs.","rationale":["Correct: a pre-tool-use hook runs before each tool call and can block it, which enforces the rule regardless of how the model reads its instructions. Hooks for Copilot cloud agent live in .github/hooks/.","Incorrect: stronger wording is still guidance that the model can misread or ignore, which is what already happened. Use instructions for conventions, not for enforcement.","Incorrect: an agent description tells Copilot when to use a custom agent. It is not an enforcement point and does not stop a shell command from running.","Incorrect: CODEOWNERS routes reviews of file changes. Running terraform apply does not change files in a pull request, so code owners would not see or block it."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"6.2.3-01","obj":"6.2.3","difficulty":"medium","type":"multi","case":"C-g","stem":"You need to meet the technical requirements for TrackerMCP.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.","choices":["Create an Agents secret named COPILOT_MCP_TRACKER_TOKEN in LabPortal.","Reference the COPILOT_MCP_TRACKER_TOKEN secret in the TrackerMCP server configuration.","Rename the Actions secret TRACKER_TOKEN to COPILOT_MCP_TRACKER_TOKEN.","Create an Agents secret named TRACKER_TOKEN in LabPortal.","Store the token as an environment secret of the production environment."],"answer":[0,1],"explanation":"Copilot reads dedicated Agents secrets, not GitHub Actions secrets. Agents secrets with the COPILOT_MCP_ prefix are passed only to MCP servers, and the MCP configuration must reference the secret to receive it.","rationale":["Correct: Agents secrets are dedicated to Copilot, so other Actions workflows cannot read them, and the COPILOT_MCP_ prefix keeps the value away from the agent's shell environment.","Correct: the MCP server receives the token only when its configuration references the COPILOT_MCP_ secret, which is what makes TrackerMCP authenticate during sessions.","Incorrect: data stored as GitHub Actions secrets is not accessible to Copilot, whatever its name. Other workflows could also read it, which breaks the isolation requirement.","Incorrect: an Agents secret without the COPILOT_MCP_ prefix is exposed to Copilot as a regular environment variable, which the requirements forbid. Use unprefixed secrets for values the agent itself needs.","Incorrect: production environment secrets are for deployment jobs and become available only after reviewers approve. Copilot does not read them, and they would mix deployment credentials with agent tooling."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"6.2.3-02","obj":"6.2.3","difficulty":"medium","type":"order","stem":"Contoso, Ltd. has 40 repositories in one organization. An MCP server that Copilot cloud agent uses in Repo1 and Repo2 needs an API key. Only Repo1 and Repo2 may use the key, and only the MCP server may receive it. The MCP server configuration in both repositories already references COPILOT_MCP_API_KEY.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In the organization settings, open Security > Secrets and variables > Agents.","Click New organization secret, and enter COPILOT_MCP_API_KEY as the name and the key as the value.","Set the repository access of the secret to Selected repositories, and select Repo1 and Repo2.","Click Add secret.","Create the secret under Secrets and variables > Actions instead of Agents.","Set the repository access of the secret to All repositories."],"answer":[0,1,2,3],"explanation":"Organization owners create Agents secrets at the organization level and choose which repositories can use them. The COPILOT_MCP_ prefix limits the value to MCP servers, and each repository's MCP configuration must reference it.","rationale":["Step 1: Agents secrets and variables are a dedicated category for Copilot, set at the organization or repository level under Security > Secrets and variables > Agents.","Step 2: the COPILOT_MCP_ prefix means the value is passed only to MCP servers and is not exposed to the agent as a regular environment variable.","Step 3: organization secrets can be limited to selected repositories, which keeps the key away from the other 38 repositories and applies least privilege.","Step 4: Add secret saves the secret with its repository access, and the existing MCP configuration in Repo1 and Repo2 can then receive the value.","Incorrect: GitHub Actions secrets are not accessible to Copilot, so the MCP server would not receive the key. Use Actions secrets for regular workflows.","Incorrect: All repositories would let every repository in the organization use the key, which breaks the requirement. It fits only keys that every repository legitimately needs."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"6.2.3-03","obj":"6.2.3","difficulty":"medium","type":"dragdrop","stem":"Fabrikam, Inc. defines three custom agents in .github/agents/ for Copilot cloud agent. Each agent must get only the tools that it needs.\n\nWhich tools value should you use for each agent? To answer, drag the appropriate values to the correct agents. Each value may be used once, more than once, or not at all.","choices":["tools: [\"read\", \"search\"]","tools: [\"read\", \"edit\", \"search\", \"execute\"]","tools: []","tools: [\"*\"]","tools: [\"web\"]"],"targets":["Agent1: reads code and writes an implementation plan in its response, without changing files","Agent2: implements changes and runs the test suite in a shell","Agent3: rewrites text that the user pastes into the prompt and needs no tools"],"answer":[0,1,2],"rationale":["Agent1 only plans, so read and search are enough. A read-only toolset is the recommended pattern for planning and review agents.","Agent2 must edit files and run tests, so it needs edit and execute in addition to read and search, and nothing more.","Agent3 works only on prompt text, so an empty list disables all tools and removes any capability it does not need."],"notes":["A read-only list of read and search lets an agent inspect code without changing it. Use it for planning and review agents.","Adding edit and execute lets an agent change files and run shell commands. Use it for implementation agents that must build and test.","An empty list disables all tools. Use it for agents that only transform or analyze what is in the prompt.","The wildcard enables all available tools, which is the same as omitting the property. It breaks least privilege for focused agents.","The web alias is not applicable to Copilot cloud agent, so an agent with only this alias would have no useful tools there."],"explanation":"The tools property limits a custom agent to the listed tools, an empty list disables all tools, and a wildcard or omitted property enables all tools. Matching each list to the job keeps every agent at least privilege.","ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"6.2.3-04","obj":"6.2.3","difficulty":"hard","type":"multi","stem":"Repo1 uses a copilot-setup-steps.yml file that checks out the code and installs dependencies before Copilot cloud agent starts. The security team requires least privilege for the setup job and for the machines that run it. Copilot must still be able to push its changes.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.","choices":["Set permissions to contents: read in the copilot-setup-steps job.","Use GitHub-hosted runners, or ephemeral single-use self-hosted runners.","Set permissions to contents: write so that Copilot can push its commits.","Reuse one persistent self-hosted runner so that dependency caches stay warm.","Set permissions to write-all so that no setup step fails on permissions."],"answer":[0,1],"explanation":"The setup job only needs contents: read to clone the repository, because Copilot gets its own token for its operations. Ephemeral runners start clean for every job, which limits what one session can leave behind for the next.","rationale":["Correct: contents: read is enough to clone the repository during setup. Copilot receives its own token for pushing, so the setup job does not need write access.","Correct: GitHub-hosted runners provide a fresh environment for each job, and for self-hosted runners only ephemeral, single-use runners are recommended for Copilot cloud agent.","Incorrect: Copilot is given its own token for its operations, so granting contents: write to the setup job adds privilege that nothing needs.","Incorrect: a reused runner keeps state between jobs, so one session could affect the next. Persistent runners fit trusted CI jobs, not agent sessions.","Incorrect: write-all grants every scope to the setup job, which is the opposite of least privilege. Grant only the specific permissions that the setup steps use."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"6.2.3-05","obj":"6.2.3","difficulty":"easy","type":"single","stem":"User1 creates a custom agent profile named Agent1 for Copilot cloud agent. Agent1 must not be able to use any tools.\n\nWhich tools setting should User1 use in the profile?","choices":["tools: []","tools: [\"*\"]","tools: [\"read\"]","Omit the tools property"],"answer":[0],"explanation":"In a custom agent profile, an empty tools list disables all tools. Omitting the property or using the wildcard enables all tools.","rationale":["Correct: an empty list disables all tools for the custom agent, so it can only work with what is in its prompt and the conversation.","Incorrect: the wildcard enables all available tools, which grants the most access instead of none. Use it only for general-purpose agents that need every tool.","Incorrect: the read alias still lets the agent read files in the repository. Use a read-only list for planning or review agents, not for an agent that needs no tools.","Incorrect: when the tools property is omitted, the agent gets all available tools by default. Omit it only when full access is intended."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"6.2.3-06","obj":"6.2.3","difficulty":"easy","type":"single","stem":"Copilot cloud agent in Repo1 needs a token to download packages from a private registry. The token is stored as a GitHub Actions repository secret, and Copilot cannot read it. Other workflows in Repo1 must not be able to read the token.\n\nWhich location should you use to store the token?","choices":["As an Agents secret in the settings of Repo1","As an Actions variable in the settings of Repo1","In the copilot-instructions.md file of Repo1","As a Dependabot secret in the settings of Repo1"],"answer":[0],"explanation":"Copilot uses dedicated Agents secrets and variables, which are separate from GitHub Actions secrets. Storing the token as an Agents secret gives Copilot access without sharing it with other workflows.","rationale":["Correct: Agents secrets are dedicated to Copilot and exposed to it during sessions, while data stored as GitHub Actions secrets or variables is not accessible to Copilot.","Incorrect: data stored as GitHub Actions variables is not accessible to Copilot, and variables are meant for non-sensitive values that other workflows can read. Use them for plain configuration of regular workflows.","Incorrect: instructions files are committed to the repository, so anyone with read access could see the token. Keep secrets out of instructions and configuration files.","Incorrect: Dependabot secrets are for Dependabot updates to private registries. Copilot cloud agent does not read them, so the session would still lack the token."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"6.2.3-07","obj":"6.2.3","difficulty":"easy","type":"single","stem":"User1 wants Copilot cloud agent in Repo1 to read issues and pull requests in Repo1 through MCP. User1 wants no extra configuration and no MCP tools that can write data.\n\nWhich MCP server should User1 use?","choices":["The built-in github MCP server, read-only and scoped to Repo1","A custom GitHub MCP server with a PAT that has the repo scope","The built-in playwright MCP server, scoped to localhost only","A remote MCP server with a GitHub App token for every repo"],"answer":[0],"explanation":"Copilot cloud agent includes a github MCP server out of the box. It exposes read-only tools, and its token is scoped to the source repository.","rationale":["Correct: the out-of-the-box github MCP server is configured with read-only tools and a token scoped to the source repository, which meets both requirements without setup.","Incorrect: a PAT with the repo scope grants write access to every repository the user can reach, and it needs extra configuration. Use a custom token only when write tools are required.","Incorrect: the playwright MCP server lets the agent browse web pages on localhost. It cannot read issues or pull requests.","Incorrect: a token for every repository grants more access than reading Repo1 requires, and it needs extra configuration. Scope tokens to the repositories that the agent works in."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"6.2.3-08","obj":"6.2.3","difficulty":"hard","type":"single","stem":"User1 starts Copilot CLI in Repo1 to update the API documentation. Copilot must fetch reference pages from docs.contoso.com without a prompt. Copilot must never reach share.fabrikam.net, an external file-share host, and User1 must not be offered a prompt that could approve that access.\n\nWhich command should User1 run?","choices":["copilot --allow-url=docs.contoso.com --deny-url=share.fabrikam.net","copilot --allow-url=docs.contoso.com --deny-tool='shell(curl)'","copilot --allow-url=docs.contoso.com","copilot --excluded-tools='web_fetch'"],"answer":[0],"explanation":"--allow-url pre-approves only the documentation domain, and --deny-url blocks the file-share host outright. A deny rule takes precedence over allow rules, so no prompt for share.fabrikam.net can appear.","rationale":["Correct: --allow-url lets Copilot reach docs.contoso.com without a prompt, and --deny-url blocks share.fabrikam.net. --deny-url takes precedence over --allow-url, so the host stays blocked.","Incorrect: this pre-approves the documentation domain and blocks curl, but share.fabrikam.net has no deny rule, so a web fetch to it still triggers a prompt that User1 could approve.","Incorrect: this allows the documentation domain, but a URL without an allow or deny rule still triggers a prompt, and User1 could approve access to the file share.","Incorrect: --excluded-tools removes web_fetch from the model, which also stops Copilot from fetching the documentation, and URL access through shell commands is not denied."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"6.2.3-09","obj":"6.2.3","difficulty":"hard","type":"single","stem":"Copilot cloud agent sessions for Repo1 run in a cloud sandbox and must keep running there. An MCP server reads its endpoint URL from an Agents variable, but the value is missing during sessions. The URL is not sensitive.\n\nWhat should you do?","choices":["Store the endpoint URL as an Agents secret instead of a variable","Store the endpoint URL as an Actions variable of the repository","Export the endpoint URL in a step of copilot-setup-steps.yml","Rename the Agents variable to start with the COPILOT_MCP_ prefix"],"answer":[0],"explanation":"Sessions on GitHub Actions receive Agents secrets and variables, but sessions in a cloud sandbox receive only secrets. Storing the value as an Agents secret makes it available in the sandbox.","rationale":["Correct: cloud sandbox sessions receive Agents secrets but not Agents variables, so the value must be stored as a secret even though it is not sensitive.","Incorrect: data stored as GitHub Actions secrets or variables is not accessible to Copilot, so the MCP server would still lack the value.","Incorrect: copilot-setup-steps.yml applies only to sessions that run on GitHub Actions, not to sessions in a cloud sandbox. It fits when the session runs on Actions.","Incorrect: the prefix controls whether a value is passed only to MCP servers. It does not change the fact that variables are not delivered to cloud sandbox sessions."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"6.2.4-01","obj":"6.2.4","difficulty":"medium","type":"dropdown","case":"C-g","stem":"You need to configure the production environment of LabPortal to meet the business requirements. The deployment must not be possible without the required approval.\n\nHow should you configure the environment? To answer, select the appropriate options in the answer area.\n\nRequired reviewers: [[1]]\nPrevent self-reviews: [[2]]\nLocation of the deployment credential: [[3]]","targets":[{"label":"Required reviewers","options":["ReleaseTeam","SecTeam","PlatformTeam"],"why":["Correct: the business requirements state that a member of ReleaseTeam must approve production deployments, so ReleaseTeam is the required reviewer of the environment.","Incorrect: SecTeam must decide on authentication and workflow changes before merge. It is not named as the approver of deployments, so it would put the wrong people in the gate.","Incorrect: PlatformTeam owns builds and infrastructure, but the requirements name ReleaseTeam for production approvals. Add PlatformTeam only if it is also accountable for releases."]},{"label":"Prevent self-reviews","options":["Enabled","Disabled"],"why":["Correct: Prevent self-reviews stops the user who started the deployment from approving it, even when that user is a member of ReleaseTeam."
