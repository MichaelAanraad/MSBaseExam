mment on the pull request.","The contributor assigns the original issue to Copilot to start a new session.","A maintainer re-runs the workflows on the pull request to retrigger Copilot."],"answer":[0],"explanation":"Copilot responds only to users who have write access, and comments from other users are not passed to the agent. A maintainer with write access must take over the request.","rationale":["Correct: only users with write access can trigger Copilot cloud agent. Escalating the request to a maintainer with write access is the path for input from other users.","Incorrect: comments from users without write access are not passed to Copilot, so repeating the comment from the same account has no effect.","Incorrect: only users with write access can assign issues to Copilot, and a read-only contributor cannot start a session.","Incorrect: re-running workflows repeats CI checks. It does not forward the comment from the contributor to Copilot."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.4.4-05","obj":"2.4.4","difficulty":"medium","type":"order","stem":"User3 at Proseware, Inc. runs a task in Autopilot mode in Copilot CLI. User3 notices that Copilot is about to start changes that need a human decision. User3 must stop the work, make sure the next prompt does not run autonomously, and check the work before anything is committed.\n\nWhich four actions should User3 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Press Esc twice to interrupt the running turn.","Press Shift+Tab to select a mode other than Autopilot.","Run /diff to review the files that Copilot changed.","Run the relevant tests and linters before committing the changes.","Run /allow-all to let Copilot continue without asking for approval.","Run /clear to remove the task from the conversation."],"answer":[0,1,2,3],"explanation":"The documented stop-and-review steps are: interrupt the turn, leave Autopilot mode, review the diff, and validate with tests before committing. This hands control back to the human.","rationale":["Step 1: pressing Esc twice interrupts the running turn so that Copilot stops before it makes the change that needs a decision.","Step 2: Autopilot mode is sticky by default, so selecting another mode with Shift+Tab prevents the next prompt from running autonomously.","Step 3: /diff shows what the agent changed so far, so User3 can decide what to keep.","Step 4: running tests, linters, and security checks before a commit is the final human check on autonomous work.","Incorrect: /allow-all grants all permissions, which removes approval checkpoints. That is the opposite of escalating a decision to a human.","Incorrect: /clear starts a new conversation and discards the context. The changes stay on disk without being reviewed."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/use-autopilot-mode"},{"id":"2.4.4-06","obj":"2.4.4","difficulty":"medium","type":"single","stem":"Your team receives a ticket about a production outage in Repo1.\n\nWhat should you do with the ticket?","choices":["Assign the ticket to User3 and keep Copilot cloud agent out of the incident.","Assign the ticket to Copilot cloud agent and require approval for workflow runs.","Assign the ticket to Copilot cloud agent with tool permissions set to Always ask.","Assign the ticket to Copilot cloud agent and ask User3 to steer the session."],"answer":[0],"explanation":"The escalation requirement sends incidents to the Security team, and GitHub also advises against giving Copilot incident response work. The ticket goes to User3 directly.","rationale":["Correct: production incidents must be handled by the Security team, and User3 is the Security team member who handles incidents. GitHub also lists incident response as work to keep with people rather than Copilot.","Incorrect: workflow approval adds a checkpoint before CI runs, but the incident is still delegated to Copilot, which violates the escalation requirement.","Incorrect: Always ask adds approvals for tool calls, but Copilot still performs the incident work. The requirement forbids delegating incidents to Copilot at all.","Incorrect: steering lets User3 redirect the session, but Copilot remains the one doing the incident work. The requirement says incidents must not be delegated."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results","case":"C-c"},{"id":"2.4.5-01","obj":"2.4.5","difficulty":"easy","type":"single","stem":"A team lead at Litware, Inc. wants to understand why Copilot cloud agent made a specific change in a pull request. The team lead wants to see the reasoning of the agent and the tools that it used.\n\nWhat should the team lead open?","choices":["The session log of the Copilot session","The repository-level facts in Copilot Memory","The commit list of the pull request branch","The Actions usage report of the organization"],"answer":[0],"explanation":"The session log records what Copilot did in a session, including its reasoning, the tools it called, and token usage. It is the primary record for understanding how an agent reached a change.","rationale":["Correct: the session log, available from the Agents panel or View session, shows the reasoning of the agent, the tools it used, token usage, and session length.","Incorrect: repository-level facts are conventions that Copilot learned. They do not record the steps or reasoning of a specific session.","Incorrect: the commit list shows what changed and who authored it, but not the reasoning or tool calls behind each change.","Incorrect: the usage report shows consumption of Actions minutes. It does not describe what the agent did or why it made a change."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"2.4.5-02","obj":"2.4.5","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. creates two automations that post comments on issues. Automation1 is a shared automation, and Automation2 is a personal automation that User1 created.\n\nHow should you expect the comments from each automation to be attributed?","choices":["Automation1 comments are attributed to Copilot, and Automation2 comments to User1.","Automation1 comments are attributed to User1, and Automation2 comments to Copilot.","Comments from both automations are attributed to Copilot.","Comments from both automations are attributed to User1."],"answer":[0],"explanation":"Actions taken by shared automations are attributed to Copilot, and actions taken by personal automations are attributed to the user who created them. This tells reviewers who is accountable for each action.","rationale":["Correct: shared automation actions are attributed to Copilot, while personal automation actions are attributed to the person who created the automation, here User1.","Incorrect: this reverses the rule. A personal automation acts on behalf of its creator, so its actions carry the identity of User1.","Incorrect: only shared automations are attributed to Copilot. Personal automations are attributed to their creator for accountability.","Incorrect: only personal automations are attributed to their creator. A shared automation is not tied to one user, so its actions are attributed to Copilot."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.4.5-03","obj":"2.4.5","difficulty":"hard","type":"single","stem":"Developers at Contoso, Ltd. use Copilot Business. User1 wants to ask natural-language questions about past Copilot CLI sessions from a second workstation, but only sessions from the current workstation are found. The remoteExport setting is not configured.\n\nWhat should you do?","choices":["Set the Store local sessions in the Cloud policy to at least View from cloud.","Set remoteExport to false in the configuration of Copilot CLI on each workstation.","Share each local session with User1 as a link so that it appears in the history.","Enable user-level preferences in Copilot Memory for the organization."],"answer":[0],"explanation":"For Copilot Business and Enterprise, local sessions sync to the account only when the Store local sessions in the Cloud policy is at least View from cloud. Otherwise sessions stay local.","rationale":["Correct: when the Store local sessions in the Cloud policy is disabled or not configured, sessions are stored locally only. Setting it to at least View from cloud lets sessions sync so that User1 can query them.","Incorrect: remoteExport set to false turns syncing off. It would keep sessions local, which is the opposite of what User1 needs.","Incorrect: shared sessions are view-only copies for other people, and they are not included in queries of the session history of the recipient.","Incorrect: user-level preferences store how User1 likes to work. They do not sync session records or make past sessions searchable."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/session-data"},{"id":"2.4.5-04","obj":"2.4.5","difficulty":"medium","type":"dragdrop","stem":"Woodgrove Bank must answer audit questions about work by Copilot cloud agent. You must identify the record that answers each question.\n\nWhich record should you use for each question? To answer, drag the appropriate records to the correct questions. Each record may be used once, more than once, or not at all.","choices":["The Co-authored-by trailer on the commit","The session log","The Verified signature on the commit","The audit log","Copilot Memory repository-level facts"],"targets":["Question1: Which developer requested the work that produced a commit by Copilot?","Question2: Which tools did the agent call while it worked on the change?","Question3: Was the commit created by Copilot and not altered afterwards?","Question4: Which agent events occurred across the organization last month?"],"answer":[0,1,2,3],"explanation":"Copilot commits are authored by Copilot with the requester as co-author and are signed. Session logs show what the agent did, and the audit log records agent events for administrators.","rationale":["Question1: Copilot authors the commit and adds the developer who requested the work as a co-author, so the trailer names the accountable person.","Question2: the session log records the reasoning of the agent and the tools it called, which is the record for how the change was made.","Question3: commits by Copilot are signed and show as Verified, which confirms they came from Copilot and were not changed.","Question4: administrators can review audit log events for agent activity, which covers the organization rather than one session."],"notes":["The trailer added to commits by Copilot that names the person who requested the work. Use it to link a commit to an accountable human.","The record of one session, with reasoning, tool calls, and token usage. Use it to see how the agent arrived at a change.","The signature status of a commit. Copilot signs its commits so that they show as Verified, which proves their origin.","The organization or enterprise record of events, including agent events. Use it for oversight across many sessions.","Learned conventions about a repository that guide future work. They are not an audit record of what an agent did in the past."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.4.5-05","obj":"2.4.5","difficulty":"medium","type":"yesno","stem":"Relecloud reviews the safeguards that make Copilot cloud agent actions traceable and accountable.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The commit message of a commit by Copilot links to the session logs for that work.","Copilot can approve and merge the pull requests that it creates.","Comments on a pull request from users without write access are passed to Copilot.","Copilot pushes only to a single branch, such as a branch that starts with copilot/."],"answer":[0,3],"explanation":"Copilot commits link to the session logs, and Copilot pushes to a single branch. It cannot approve or merge, and comments from users without write access are not passed to it.","rationale":["Yes: each commit message links to the session logs, so a reviewer can go from any commit to the record of how it was produced.","No: Copilot opens draft pull requests and cannot approve or merge them. A human must review, approve, and merge the work.","No: only users with write access can trigger Copilot, and comments from users without write access are not passed to the agent.","Yes: Copilot pushes to one branch, either the branch of an existing pull request or a new branch that starts with copilot/, which keeps its changes contained."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.4.5-06","obj":"2.4.5","difficulty":"hard","type":"multi","stem":"You need to meet the traceability requirements.\n\nWhich two sources should the auditors use? Each correct answer presents part of the solution. Choose two.","choices":["The co-author information on each commit by Copilot","The session log linked from the commit message","The repository-level facts stored for Repo1","The thumbs up and thumbs down feedback on each session","The re-run history of the workflows on each pull request"],"answer":[0,1],"explanation":"Auditors must know who requested each commit and how Copilot arrived at it. The co-author records the requester, and the session log linked from the commit message shows the work.","rationale":["Correct: Copilot authors each commit and adds the developer who requested the work as a co-author, which answers who requested the work.","Correct: the commit message links to the session logs, which show the reasoning and tool calls that led to the change.","Incorrect: repository-level facts describe conventions that Copilot learned about Repo1. They do not record who requested a commit or how it was made.","Incorrect: feedback ratings tell GitHub whether a result was useful. They do not identify the requester or document the steps of the agent.","Incorrect: re-run history shows how often CI checks ran. It does not connect a commit to the requesting developer or to the agent reasoning."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations","case":"C-c"},{"id":"3.1.1-01","obj":"3.1.1","difficulty":"easy","type":"single","stem":"At Litware, Inc., Copilot cloud agent learns during a session that a repository generates its API client from an OpenAPI file. The team wants Copilot code review to use the same knowledge later when it reviews pull requests in that repository.\n\nWhich memory mechanism should the team rely on?","choices":["A repository-level fact in Copilot Memory","A user-level preference in Copilot Memory","The context window of the current session","The plan.md file in the session folder"],"answer":[0],"explanation":"Repository-level facts are shared with collaborators and across Copilot surfaces in the same repository. A fact that the cloud agent learns can be used later by Copilot code review.","rationale":["Correct: repository-level facts apply to the repository and are shared across surfaces, so a fact learned by the cloud agent can be used by Copilot code review in the same repository.","Incorrect: a user-level preference follows one user, and Copilot code review does not apply user-level preferences, so it would not use the knowledge.","Incorrect: the context window is short-term memory that exists only during one session. The knowledge is gone when the session ends.","Incorrect: plan.md is a local file of one Copilot CLI session. Copilot code review on GitHub does not read it."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.1-02","obj":"3.1.1","difficulty":"easy","type":"single","stem":"User1 at Fabrikam, Inc. works in many repositories. User1 wants Copilot to run the relevant tests and summarize the results before it proposes a commit, in every project that User1 works in.\n\nWhich type of memory should User1 ask Copilot to create?","choices":["A user-level preference","A repository-level fact","An organization custom instruction","A session checkpoint"],"answer":[0],"explanation":"User-level preferences follow a user across repositories and describe how that user likes to work. Repository-level facts apply only to one repository.","rationale":["Correct: a user-level preference follows User1 across repositories and is created only by User1, which matches a personal workflow for every project.","Incorrect: a repository-level fact applies only to the repository where it was created and is shared with every collaborator, so it is not a personal cross-project preference.","Incorrect: organization custom instructions are set by owners and apply to everyone in the organization. They are not a personal preference of one developer.","Incorrect: a checkpoint is a compaction summary inside one Copilot CLI session. It does not carry a preference into other projects."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/create-memories"},{"id":"3.1.1-03","obj":"3.1.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. uses Copilot cloud agent in 40 repositories. Copilot learned a repository-level fact in Repo1 about the logging library that all the company services use. The team expects Copilot cloud agent to use the same knowledge in the other 39 repositories, but it does not.\n\nWhat should the team use to share this knowledge with Copilot across all the repositories?","choices":["Organization custom instructions","A longer retention period for repository-level facts","Repository access set to All repositories","A user-level preference for each developer"],"answer":[0],"explanation":"Copilot Memory is not pooled across the repositories of an organization, so a repository-level fact stays in Repo1. Organization custom instructions apply to all repositories in the organization.","rationale":["Correct: organization custom instructions apply across the repositories of the organization, which suits knowledge that every repository needs. Repository-level instructions still take priority where they exist.","Incorrect: retention controls how long a fact lives. It does not share a fact from Repo1 with other repositories, because memory is not pooled.","Incorrect: Repository access controls which repositories may store and use facts. Each repository still learns its own facts; facts are not copied between them.","Incorrect: user-level preferences describe how one person likes to work, and administrators cannot create them for users. They are the wrong place for a technical fact."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"3.1.1-04","obj":"3.1.1","difficulty":"medium","type":"single","stem":"User2 at Tailspin Toys wants to ask Copilot CLI which tasks User2 worked on last week and which files were changed in those tasks.\n\nWhich source should Copilot use to answer the question?","choices":["The session history, queried with /chronicle","The repository-level facts in Copilot Memory","The context window of the current session","The custom instructions file of the repository"],"answer":[0],"explanation":"Questions about previous work are answered from session data, which records prompts, tools, and file changes. The /chronicle command queries this session store.","rationale":["Correct: session history is an external store of past sessions. Copilot can answer natural-language questions about earlier work from it, for example with /chronicle.","Incorrect: repository-level facts are short conventions about a codebase. They do not record which tasks a user worked on or which files changed.","Incorrect: the context window holds only the current session. Work from last week is not in it unless a session was resumed.","Incorrect: custom instructions tell Copilot how to work in a repository. They contain no record of past sessions."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/session-data"},{"id":"3.1.1-05","obj":"3.1.1","difficulty":"hard","type":"single","stem":"Adventure Works forks Repo1, which has many repository-level facts, into a new repository named Repo2. The team expects Copilot to follow a mandatory coding rule that it learned in Repo1 when it works in Repo2.\n\nWhat should the team do?","choices":["Add the rule to the custom instructions file in Repo2.","Wait for Copilot Memory to copy the facts from Repo1.","Raise the retention period of facts in Repo1 to 180 days.","Ask Copilot in Repo1 to upvote the fact before the fork."],"answer":[0],"explanation":"Forking does not copy memories, and memories are applied by judgment anyway. A mandatory rule belongs in custom instructions, which are loaded for every session in the repository.","rationale":["Correct: memories are not copied to forks, and Copilot Memory does not guarantee consistent use. Custom instructions in Repo2 make the rule available to every session there.","Incorrect: forking does not copy memories, and memory is not pooled across repositories, so Repo2 starts without the facts of Repo1.","Incorrect: retention controls how long facts live in Repo1. It has no effect on whether Repo2 receives them.","Incorrect: Copilot votes on memories automatically, and an upvote only extends the life of a fact in Repo1. It does not transfer the fact to Repo2."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.1-06","obj":"3.1.1","difficulty":"hard","type":"dragdrop","stem":"Relecloud uses Copilot cloud agent, Copilot CLI, and Copilot Memory. You must choose where each piece of information should be kept.\n\nWhich mechanism should you use for each piece of information? To answer, drag the appropriate mechanisms to the correct information. Each mechanism may be used once, more than once, or not at all.","choices":["Repository custom instructions","A repository-level fact","A user-level preference","The plan.md file of the session","A comment on the issue after assignment"],"targets":["Info1: a mandatory security review rule that every agent session in the repository must follow","Info2: a naming convention that Copilot found in the code while it fixed a bug","Info3: the wish of User1 for the smallest possible change in every project","Info4: the checklist of steps for the migration that User1 runs today in Copilot CLI"],"answer":[0,1,2,3],"explanation":"Rules that must be followed go in custom instructions. Learned code conventions are repository-level facts, personal habits are user-level preferences, and task state for one session belongs in the session plan.","rationale":["Info1: a mandatory rule must be applied consistently, and memories are applied by judgment. Custom instructions are loaded for every session in the repository.","Info2: a convention discovered in the code, with a citation to that code, is what a repository-level fact is for, and collaborators share it.","Info3: a personal way of working that follows User1 across repositories is a user-level preference.","Info4: a checklist for one task is short-lived state. Copilot is told not to store task-specific instructions as memories, and plan.md keeps it for the session."],"notes":["Instructions that are loaded for every session in the repository. Use them for rules that must be followed consistently.","A memory about the codebase that is shared with collaborators and checked against its citations. Use it for learned conventions.","A memory that follows one user across repositories. Use it for the personal working style of that user.","A checkbox plan written in the session folder in plan mode. Use it to track the steps of the current task.","Copilot does not see issue comments added after the issue was assigned to it, so this does not reach the agent reliably."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.1-07","obj":"3.1.1","difficulty":"medium","type":"single","stem":"You need to meet the memory requirement for database migration reviews.\n\nWhat should you do?","choices":["Add the review rule to the .github/copilot-instructions.md file in Repo1.","Ask Copilot in Repo1 to store the review rule as a repository-level fact.","Ask each developer to store the review rule as a user-level preference.","Set the retention period for repository-level facts to 180 days."],"answer":[0],"explanation":"The rule must be applied consistently by all agents. Memories are used at the judgment of the model, so a rule that must always apply belongs in custom instructions.","rationale":["Correct: repository custom instructions are loaded for every Copilot session in Repo1, which is the documented place for important rules such as mandatory reviews.","Incorrect: Copilot decides whether to store and use a memory, so a repository-level fact does not guarantee that every agent applies the rule consistently.","Incorrect: user-level preferences depend on each developer, and Copilot code review does not apply them, so the rule would not be applied consistently.","Incorrect: a longer retention keeps facts longer, but it does not make Copilot use a fact every time. The rule still needs custom instructions."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory","case":"C-c"},{"id":"3.1.2-01","obj":"3.1.2","difficulty":"easy","type":"single","stem":"User3 at Proseware, Inc. asks Copilot CLI to remember to use a specific formatter. From the request, it is unclear whether the instruction applies to User3 only or to every collaborator in the repository.\n\nWhat should User3 expect Copilot to do?","choices":["Ask User3 which scope the memory should have.","Store the memory as a repository-level fact.","Store the memory as a user-level preference.","Store the memory in both scopes at the same time."],"answer":[0],"explanation":"Copilot chooses the scope of a memory based on who it applies to. When the scope is ambiguous, Copilot asks instead of guessing.","rationale":["Correct: Copilot picks between a repository-level fact and a user-level preference based on who the memory applies to, and asks when that is ambiguous.","Incorrect: storing a personal habit as a repository fact would share it with every collaborator. Copilot does not choose that scope by default when it is unclear.","Incorrect: storing a repository rule as a personal preference would hide it from collaborators. Copilot asks rather than defaulting to this scope.","Incorrect: Copilot stores a memory in one scope. Duplicating it in both scopes would blur who the memory applies to."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.2-02","obj":"3.1.2","difficulty":"medium","type":"single","stem":"User1 at Northwind Traders runs Copilot CLI with several subagents. A subagent discovers a useful fact about the repository and tries to store it as a memory.\n\nWhat should User1 expect?","choices":["The subagent can read memories but cannot store them; only the root agent can store.","The subagent stores the memory, and the root agent approves it at the end of the run.","The subagent stores the memory as a user-level preference for User1 only.","The subagent stores the memory only if User1 started Copilot CLI with --enable-memory."],"answer":[0],"explanation":"In Copilot CLI, only the root agent can store or vote on memories. Subagents can use relevant memories, which keeps the memory store controlled by one agent.","rationale":["Correct: subagents can read relevant memories, but only the root agent can store or vote on memories, so the subagent cannot change the memory store.","Incorrect: there is no deferred approval of memories written by subagents. Subagents cannot write to the memory store at all.","Incorrect: subagents cannot store memories in either scope. The limitation is about which agent writes, not about the type of memory.","Incorrect: --enable-memory turns on memory for prompt mode. It does not let subagents store memories."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/create-memories"},{"id":"3.1.2-03","obj":"3.1.2","difficulty":"hard","type":"single","stem":"Woodgrove Bank uses Copilot CLI with an MCP server whose tools return very large JSON documents. A developer sets COPILOT_LARGE_OUTPUT_THRESHOLD_BYTES to a much larger value so that the model sees complete outputs.\n\nWhat should you expect from this change?","choices":["Less context is left for the conversation and for later tool calls.","The outputs are compacted into a summary before the model sees them.","The setting applies only to built-in tools and not to MCP server tools.","The outputs are stored as repository-level facts for later sessions."],"answer":[0],"explanation":"By default, tool output larger than 20 KiB is saved to a file, and the model receives the path and a preview. Raising the threshold puts more output in the context window, which leaves less room for other work.","rationale":["Correct: GitHub warns that increasing the limit leaves less context available for the conversation and subsequent tool calls, because large outputs go directly into the context window.","Incorrect: the threshold decides whether output is saved to a file with a preview. It does not summarize output; compaction is a separate process.","Incorrect: the large output handling applies to all tools, including tools provided by MCP servers.","Incorrect: tool output is context for the current session. It is not stored in Copilot Memory."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.1.2-04","obj":"3.1.2","difficulty":"easy","type":"single","stem":"User2 at Contoso, Ltd. finished a long Copilot CLI task on a payment service. User2 now wants Copilot to work on an unrelated documentation task, and the earlier context is not needed.\n\nWhat should User2 do?","choices":["Run /new to start a new conversation for the documentation task.","Run /compact to summarize the payment work before the new task.","Run /context to view the token usage of the payment work.","Run /session checkpoints to list the earlier work."],"answer":[0],"explanation":"Between unrelated tasks, a clean context window keeps Copilot focused and leaves more space for the new work. /new or /clear starts a new conversation.","rationale":["Correct: GitHub recommends /clear or /new between unrelated tasks, because the old context is not needed and a clean window leaves more room for the new task.","Incorrect: /compact keeps a summary of the payment work in the context. It is useful when the next phase still depends on earlier work.","Incorrect: /context shows how the context window is used. It reports the problem but does not remove the unrelated history.","Incorrect: /session checkpoints lists compaction summaries. It does not change what is in the context window."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"3.1.2-05","obj":"3.1.2","difficulty":"medium","type":"multi","stem":"Tailspin Toys uses Copilot Memory with Copilot cloud agent. The team reviews which information Copilot will keep as memories.\n\nWhich two items should the team expect Copilot to avoid storing as memories? Each correct answer presents part of the solution. Choose two.","choices":["A configuration line that contains a detected secret","An instruction that applies only to the current task","A code convention with a citation to the file that uses it","A preference for a test summary before each commit","A fact learned from a pull request closed without merging"],"answer":[0,1],"explanation":"Memories with detected secrets are rejected, and Copilot is instructed not to store short-lived or task-specific instructions. Conventions, preferences, and facts from closed pull requests can be stored.","rationale":["Correct: a memory that contains a detected secret is rejected, which keeps credentials out of the memory store.","Correct: Copilot is instructed not to store short-lived or task-specific instructions, because they are not useful in later work.","Incorrect: a code convention with a citation is a typical repository-level fact. Copilot checks the citation against the current branch before it uses the fact.","Incorrect: a working habit such as a test summary before commits is a typical user-level preference.","Incorrect: facts can be captured from pull requests that were closed without merging, so this item can be stored."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.2-06","obj":"3.1.2","difficulty":"medium","type":"dropdown","stem":"Relecloud explains the reach of Copilot Memory to its developers.\n\nHow should you complete the statements? To answer, select the appropriate options in the answer area.\n\nRepository-level facts are used [[1]].\n\nUser-level preferences are not applied by [[2]].","targets":[{"label":"Box 1","options":["only in the repository where they were created","in every repository of the organization","in the repository and in its forks"],"why":["Correct: repository-level facts apply only to the repository where they were created. Memory is not pooled across the repositories of an organization.","Incorrect: memory is not pooled across an organization. Knowledge that every repository needs belongs in organization custom instructions.","Incorrect: forking a repository does not copy its memories, so the fork starts without the facts of the original repository."]},{"label":"Box 2","options":["Copilot code review","Copilot cloud agent","Copilot CLI"],"why":["Correct: Copilot code review and Agentic Autofix do not apply user-level preferences, so reviews are not shaped by the personal preferences of one user.","Incorrect: Copilot cloud agent is one of the surfaces that can use memories, including the user-level preferences of the user who started the work.","Incorrect: Copilot CLI can use user-level preferences, and in interactive sessions it can ask the user to approve storing them."]}],"answer":[0,0],"explanation":"Repository-level facts stay in their own repository and are not copied to forks. Copilot code review and Agentic Autofix do not apply user-level preferences.","ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.2-07","obj":"3.1.2","difficulty":"hard","type":"dropdown","stem":"You need to meet the memory requirements for Repo3 and for personal working preferences.\n\nWhich actions should you take? To answer, select the appropriate options in the answer area.\n\nFor Repo3: [[1]]\n\nFor personal working preferences: [[2]]","targets":[{"label":"Box 1","options":["A repository administrator turns off Copilot Memory for Repo3.","An organization owner disables the policy for user-level preferences.","A user with write access deletes the existing facts for Repo3."],"why":["Correct: a repository administrator can turn off Copilot Memory for a single repository, which stops facts from being stored or used in Repo3 while other repositories keep them.","Incorrect: user-level preferences are controlled separately from repository-level facts. Disabling preferences leaves facts for Repo3 enabled.","Incorrect: deleting facts removes the current ones, but Copilot can store new facts the next time it works in Repo3."]},{"label":"Box 2","options":["An organization owner enables the policy for user-level preferences.","No action is needed, because user-level preferences are on by default.","An organization owner sets Repository access to All repositories."],"why":["Correct: for Copilot Business and Copilot Enterprise, user-level preferences are off until a policy enables them, and nobody has configured that policy.","Incorrect: preferences are on by default for individual plans such as Copilot Pro, but not for Copilot Business, which Proseware uses.","Incorrect: Repository access controls repository-level facts. It is independent of the policy for user-level preferences."]}],"answer":[0,0],"explanation":"Repository-level facts can be turned off for one repository by its administrator. On Copilot Business, user-level preferences stay off until an owner enables the policy.","ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator","case":"C-c"},{"id":"3.1.3-01","obj":"3.1.3","difficulty":"easy","type":"single","stem":"At Litware, Inc., Copilot keeps applying an outdated repository-level fact about a deprecated build script. User1 has write access to the repository and must stop Copilot from using this fact.\n\nWhat should User1 do?","choices":["Delete the fact in the Copilot Memory settings of the repository.","Edit the text of the fact in the Copilot Memory settings of the repository.","Downvote the fact on the settings page so that Copilot hides it.","Wait for the fact to expire at the end of its retention period."],"answer":[0],"explanation":"Users cannot edit memories in the settings, and Copilot itself does the voting. To make sure a memory is no longer used, you delete it explicitly.","rationale":["Correct: GitHub states that to make sure a memory is not used, you delete it explicitly. Users with write access can delete repository-level facts in the repository settings.","Incorrect: you cannot create or edit an individual memory in the settings on GitHub.com. You can only view and delete memories there.","Incorrect: Copilot upvotes and downvotes memories automatically based on usefulness. Users do not vote on memories in the settings.","Incorrect: an outdated fact may still be upvoted and stay alive, and it keeps influencing Copilot until it expires. Deletion takes effect immediately."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.3-02","obj":"3.1.3","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. configures the retention period for repository-level facts. The enterprise owner sets 30 days, and an organization owner sets 60 days for the organization.\n\nWhat retention period should you expect for repository-level facts in that organization?","choices":["30 days, because the lower value applies","60 days, because the organization value applies","90 days, because the default value applies","45 days, because the two values are averaged"],"answer":[0],"explanation":"When the organization and enterprise retention settings differ, the lower value applies. This lets an enterprise enforce a shorter maximum retention.","rationale":["Correct: if organization and enterprise values differ, the lower value applies, so facts in that organization expire after 30 days.","Incorrect: an organization cannot extend retention beyond a lower value set at the enterprise level. The more restrictive value wins.","Incorrect: 90 days is the default when nothing is configured. Here both levels set a value, so the default no longer applies.","Incorrect: GitHub does not combine the settings arithmetically. The lower of the two configured values applies."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.3-03","obj":"3.1.3","difficulty":"hard","type":"single","stem":"Woodgrove Bank lowers the retention period for repository-level facts from 90 days to 30 days. Many facts in Repo1 are 60 days old.\n\nWhat should you expect for the existing facts?","choices":["They adopt the new period the next time Copilot reinforces them.","They are deleted at once, because they are older than 30 days.","They are re-dated, and all of them expire 30 days after the change.","They keep the 90-day period, and only new facts use 30 days."],"answer":[0],"explanation":"Changing the retention setting does not re-date existing facts. Each existing fact adopts the new period at its next reinforcement, when Copilot upvotes it.","rationale":["Correct: GitHub documents that existing facts are not re-dated when the setting changes. They adopt the new period at their next reinforcement.","Incorrect: the change does not trigger an immediate cleanup. To remove a fact right away, you delete it explicitly.","Incorrect: existing facts are not re-dated by the change. Their expiry changes only when Copilot reinforces them.","Incorrect: existing facts do not keep the 90-day period permanently. Each one adopts the 30-day period when Copilot next reinforces it with an upvote."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.3-04","obj":"3.1.3","difficulty":"hard","type":"single","stem":"At Adventure Works, Copilot retrieves a repository-level fact in many sessions over three months, but it never upvotes the fact. The repository uses the default retention settings.\n\nWhat should you expect for this fact?","choices":["It expires 90 days after it was created, because retrieval does not extend it.","It stays active, because each retrieval resets the 90-day retention period.","It expires after 7 days, because facts that are not upvoted use the minimum.","It stays active until a user with write access deletes it from the settings."],"answer":[0],"explanation":"The retention period starts at creation and is reset only when Copilot upvotes the memory. Simply retrieving a memory does not extend it.","rationale":["Correct: retrieval alone does not reset the period. With no upvote, the fact expires 90 days after creation under the default setting.","Incorrect: GitHub states that simply retrieving a memory does not extend its retention period. Only an upvote by Copilot resets it.","Incorrect: 7 days is the lowest value an owner can configure. Facts that are not upvoted use the configured period, 90 days by default.","Incorrect: memories expire automatically. Deletion is needed only to remove a memory before it expires."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/copilot-memory/manage-as-administrator"},{"id":"3.1.3-05","obj":"3.1.3","difficulty":"easy","type":"single","stem":"User2 at Tailspin Toys finished the design phase of a feature in a long Copilot CLI session and is about to start implementation. User2 wants to free up context space now, while keeping the essentials of the design discussion.\n\nWhat should User2 do?","choices":["Run /compact before the implementation phase starts.","Run /clear before the implementation phase starts.","Run /context before the implementation phase starts.","Run /exit and start a new session for implementation."],"answer":[0],"explanation":"Manual compaction replaces the history with a summary that keeps the goals, decisions, and next steps. It is useful before a new phase of work.","rationale":["Correct: /compact summarizes the conversation and frees most of the context window, and GitHub suggests it when you are about to start a new phase of work.","Incorrect: /clear starts a new conversation and drops the design discussion entirely, so the essentials are lost.","Incorrect: /context shows token usage. It helps you decide to compact, but it does not free any context.","Incorrect: a new session starts without the design discussion. /exit saves the old session, but the new one does not include its context."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.1.3-06","obj":"3.1.3","difficulty":"medium","type":"yesno","stem":"Contoso, Ltd. reviews the lifecycle rules of Copilot Memory.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["An organization owner can set the retention of user-level preferences to 180 days.","A memory that is downvoted past a threshold is no longer used.","Turning off user-level preferences also turns off repository-level facts.","A memory that is hidden from use can remain stored until it expires."],"answer":[1,3],"explanation":"Retention can be configured only for repository-level facts. Downvoted memories stop being used and hidden ones can stay stored until they expire, and the two memory types are controlled independently.","rationale":["No: owners can configure a period of 7 to 180 days for repository-level facts only. User-level preferences always use the default period.","Yes: when Copilot downvotes a memory past a threshold, the memory is no longer used and is deleted after a period of disuse.","No: the two types are controlled separately. Turning off one memory type does not turn off the other.","Yes: hidden memories can remain stored until they expire, which is why you delete a memory explicitly when it must not be used."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.1.3-07","obj":"3.1.3","difficulty":"medium","type":"order","stem":"User3 at Proseware, Inc. uses Copilot CLI interactively on a workstation. Before a customer demonstration, User3 must check the local memory setting, prevent Copilot CLI from using or storing any memories on the workstation, confirm the change, and restore the setting after the demonstration.\n\nWhich four actions should User3 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run /memory show to check the current local setting.","Run /memory off to disable both memory types on the workstation.","Run /memory show to confirm that memory is now disabled.","Run /memory on after the demonstration to clear the local setting.","Start Copilot CLI with --enable-memory before the demonstration.","Delete the repository-level facts in the settings of the repository."],"answer":[0,1,2,3],"explanation":"In an interactive Copilot CLI session, /memory off disables both memory types on that machine, /memory show reports the local setting, and /memory on clears the setting afterwards.","rationale":["Step 1: /memory show reports the local memory setting, so User3 knows the starting state.","Step 2: /memory off disables both repository-level facts and user-level preferences for Copilot CLI on this machine.","Step 3: running /memory show again confirms that the local setting is now off before the demonstration starts.","Step 4: /memory on clears the local setting, so memory behaves as configured by the account and policies again.","Incorrect: --enable-memory turns memory on for prompt mode. It is the opposite of what User3 needs before the demonstration.","Incorrect: deleting facts removes them for every collaborator and does not stop Copilot from storing new ones. A local setting is the right scope."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/copilot-memory"},{"id":"3.2.1-01","obj":"3.2.1","difficulty":"easy","type":"single","stem":"A reviewer at Northwind Traders opens a pull request from Copilot cloud agent after Copilot made several rounds of changes in response to comments. The reviewer wants a current summary of what the pull request now does.\n\nWhat should the reviewer check first?","choices":["The title and body of the pull request","The first comment of the original issue","The repository-level facts in Copilot Memory","The list of workflow runs in the Actions tab"],"answer":[0],"explanation":"Copilot keeps the title and body of its pull request up to date as it changes the pull request. The description is therefore a durable, current record of the work.","rationale":["Correct: Copilot updates the pull request title and body as it makes changes, so the description reflects the current state of the work.","Incorrect: the issue describes the original request. It does not change when Copilot iterates on the pull request, so it can be out of date.","Incorrect: repository-level facts are general conventions about the codebase. They do not summarize one pull request.","Incorrect: workflow runs show check results for each push. They do not describe what the pull request changes."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"3.2.1-02","obj":"3.2.1","difficulty":"easy","type":"single","stem":"User1 at Fabrikam, Inc. uses Copilot CLI to fix 300 linter errors in a migration that will take several sessions. User1 wants a durable record of which errors are fixed and which remain.\n\nWhat should User1 ask Copilot to do?","choices":["Write the errors to a checklist file and check each one off when it is fixed.","Store each fixed error as a repository-level fact in Copilot Memory.","Keep the list of errors in the conversation and run /compact regularly.","Run the linter again at the start of each session and fix the first error."],"answer":[0],"explanation":"A checklist file, such as migration-checklist.md, keeps progress outside the context window. Copilot can read it in later sessions and continue from the first unchecked item.","rationale":["Correct: GitHub describes writing the errors to a file such as migration-checklist.md and checking them off, which gives a durable record of progress across sessions.","Incorrect: memories are for lasting conventions, and Copilot is told not to store task-specific details. They are not a progress tracker.","Incorrect: compaction summarizes the conversation and can lose fine-grained details, such as the status of individual errors.","Incorrect: re-running the linter shows what remains, but it records no decisions or progress, and each session must rediscover the state."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"3.2.1-03","obj":"3.2.1","difficulty":"medium","type":"single","stem":"User2 at Contoso, Ltd. used a Copilot session on GitHub to research, plan, and iterate on a change. The changes are on a copilot/ branch. User2 wants the team to review the result through the normal process.\n\nWhat should User2 do?","choices":["Review the changes in Diff, and then select Create pull request.","Wait for the session to open a pull request automatically.","Ask Copilot to merge the copilot/ branch into the default branch.","Archive the session so that the branch is shared with the team."],"answer":[0],"explanation":"Sessions that research, plan, and iterate do not create pull requests automatically. You review the changes in the Diff view and create the pull request when the work is ready.","rationale":["Correct: when the work is ready, you review it in Diff and select Create pull request, which turns the branch into a reviewable, durable record.","Incorrect: these sessions do not create pull requests automatically, so waiting leaves the work on the branch without review.","Incorrect: Copilot cannot merge to the default branch, and skipping the pull request would bypass the review process.","Incorrect: archiving moves a stopped session out of the active list. It does not create a pull request or start a review."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/research-plan-iterate"},{"id":"3.2.1-04","obj":"3.2.1","difficulty":"hard","type":"single","stem":"User3 at Woodgrove Bank works in a Copilot CLI session in plan mode that will run for many hours. Early in the session, User3 decides that the public API must not change. The decision must survive automatic compaction without being reduced to a vague summary.\n\nWhat should User3 do?","choices":["Ask Copilot to add the decision to the plan of the session.","Rely on the checkpoint summary that each compaction creates.","Run /context regularly to check that the decision is still present.","Raise COPILOT_LARGE_OUTPUT_THRESHOLD_BYTES for the session."],"answer":[0],"explanation":"Compaction replaces old history with a summary but keeps the original user instructions and the current state of plans and to-do lists. A decision written into the plan survives compaction intact.","rationale":["Correct: compaction keeps the current state of plans and to-do lists alongside the summary, so a decision recorded in the plan is carried forward as written.","Incorrect: a checkpoint is a summary, and GitHub notes that minor decisions made early in a long conversation may not be included.","Incorrect: /context shows token usage by category. It does not show or protect individual decisions in the history.","Incorrect: this threshold controls when large tool output is saved to a file. It has nothing to do with how decisions survive compaction."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.2.1-05","obj":"3.2.1","difficulty":"hard","type":"single","stem":"User1 at Relecloud completed a local Copilot CLI session in which the team made several design decisions. Session syncing is enabled. User1 wants teammates who have access to the repository to read the session as a record of the decisions.\n\nWhat should User1 do?","choices":["Share the session as a link, a gist, or a file.","Rely on session syncing to show it to teammates.","Archive the session so that it moves to the team view.","Ask Copilot to store the session as a repository-level fact."],"answer":[0],"explanation":"Local sessions are unshared by default, and syncing does not share them with anyone. Sharing a session creates a view-only copy for people who have access to the repository.","rationale":["Correct: you can share an individual local session with people who have access to the repository as a link, gist, or file, and recipients get view-only access.","Incorrect: syncing ties the session data to the personal account of User1, and synced data is accessible only to User1 by default.","Incorrect: archiving moves a session out of the active list of User1 without deleting it. It does not make the session visible to others.","Incorrect: a memory is a short fact that Copilot may use. It does not preserve the session as a readable record of the decisions."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/session-data"},{"id":"3.2.1-06","obj":"3.2.1","difficulty":"medium","type":"multi","stem":"User2 at Adventure Works wants to know which durable artifacts Copilot CLI keeps for a session in the ~/.copilot/session-state/SESSION-ID folder.\n\nWhich three items should User2 expect to find in that folder? Each correct answer presents part of the solution. Choose three.","choices":["The plan.md file that plan mode writes","The checkpoints folder with compaction history","The files folder with persistent session artifacts","The .github/copilot-instructions.md file of the repository","The repository-level facts from Copilot Memory","The logs of the GitHub Actions runs for the repository"],"answer":[0,1,2],"explanation":"The session folder holds the event log, workspace data, plan.md, the checkpoints folder, and a files folder for persistent artifacts. Instructions, memories, and Actions logs live elsewhere.","rationale":["Correct: plan mode writes the checkbox plan to plan.md in the session folder, which records the approved steps.","Correct: the checkpoints folder holds the compaction history, so you can review what was preserved at each compaction.","Correct: the files folder holds persistent artifacts of the session that should not be committed to the repository.","Incorrect: custom instructions are stored in the repository, not in the session folder, so that every session in the repository can load them.","Incorrect: Copilot Memory is stored by GitHub and managed in the repository or personal settings, not in a local session folder.","Incorrect: Actions run logs are stored on GitHub with the workflow runs. They are not written to the local session folder."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"3.2.1-07","obj":"3.2.1","difficulty":"medium","type":"order","stem":"User3 at Tailspin Toys starts a complex change in Copilot CLI. The approach must be recorded as a reviewed plan before any code is written, the session must be easy to find later, and implementation can then run without further approval of each step.\n\nWhich four actions should User3 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run copilot --name \"add-pagination\" to start a named session.","Run /plan with a prompt that describes the change, constraints, and tests.","Review the plan, and press Ctrl+y to edit the plan if it needs changes.","Select Accept plan and continue in Autopilot execution mode.","Run /compact to save the plan as a checkpoint before implementation.","Run copilot --continue to start the implementation in a new session."],"answer":[0,1,2,3],"explanation":"A named session is easy to resume. Plan mode writes a checkbox plan to plan.md and waits for approval, and accepting the plan can hand implementation to Autopilot mode.","rationale":["Step 1: copilot --name gives the session a name, so User3 can find and resume it later by name.","Step 2: /plan switches to plan mode, in which Copilot asks clarifying questions and writes a checkbox plan to plan.md before it changes code.","Step 3: Copilot waits for approval, and Ctrl+y opens the plan for editing, so the recorded plan matches the agreed approach.","Step 4: accepting the plan and continuing in Autopilot mode lets Copilot implement the approved plan without waiting for input after each step.","Incorrect: /compact summarizes the conversation. The plan is already a file in the session folder, and compaction is not how you save it.","Incorrect: --continue resumes the most recent session rather than starting a new one, and implementation belongs in the session that holds the plan."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"3.2.2-01","obj":"3.2.2","difficulty":"medium","type":"single","stem":"User1 at Proseware, Inc. started a cloud sandbox session in the GitHub Copilot app. User1 now wants to continue the same session from a terminal without losing the files and work in progress.\n\nWhat should User1 do?","choices":["Run /resume in Copilot CLI and select the session.","Run /delegate in Copilot CLI with the original prompt.","Run copilot --name with the title of the session.","Start a new cloud session with the original prompt."],"answer":[0],"explanation":"Cloud sandbox sessions continue across clients, including Copilot CLI through /resume. The sandbox keeps the state while the session is stopped, so files and progress are intact.","rationale":["Correct: cloud sandbox sessions can be continued from other clients, and /resume in Copilot CLI lets User1 pick up the same session.","Incorrect: /delegate hands new work to Copilot cloud agent. It creates another session instead of continuing the existing one.","Incorrect: --name names a new session that User1 starts. It does not attach to the existing cloud session.","Incorrect: a new session starts without the state of the earlier one, so completed steps would be repeated."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.2.2-02","obj":"3.2.2","difficulty":"easy","type":"single","stem":"User1 at Litware, Inc. runs a script that calls copilot -p to update the dependencies of a project. The run finished, but two tests still fail. User1 wants to continue the same session interactively to fix the tests, without Copilot repeating the dependency analysis that it already did.\n\nWhat should User1 run?","choices":["The copilot --resume=SESSION-ID command from the exit summary of the run","The same copilot -p command with a prompt that asks to fix the tests","The copilot --name command with the ID of the session from the script","The /session checkpoints command in a new interactive Copilot CLI session"],"answer":[0],"explanation":"A programmatic copilot -p run prints a copilot --resume=SESSION-ID hint in its exit summary. Resuming that session restores its conversation context, so follow-up work builds on what was already done.","rationale":["Correct: the exit summary of a copilot -p run includes a copilot --resume=SESSION-ID hint, which reopens the same session with its context, so Copilot continues without redoing the analysis.","Incorrect: another copilot -p run starts a new session without the earlier context, so Copilot repeats the analysis. It would fit if the earlier work were not needed.","Incorrect: --name sets the name of a new session. It does not reopen an existing session, so the earlier context is not available. It is right when you start work that you plan to resume later.","Incorrect: /session checkpoints lists the compaction checkpoints of the current session. In a new session, it does not show or restore the scripted run. It is right inside the resumed session."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"3.2.2-03","obj":"3.2.2","difficulty":"easy","type":"single","stem":"Copilot cloud agent finished a session on a pull request at Fabrikam, Inc. Later, the team wants an additional change that builds on the decisions that Copilot made in that pull request.\n\nWhat should the team do?","choices":["Mention @copilot in a comment on the same pull request with the request.","Open a new issue for the change and assign it to Copilot.","Unassign and reassign the original issue to Copilot.","Add the request as a comment on the original issue."],"answer":[0],"explanation":"Copilot remembers context from previous sessions on the same pull request. A follow-up on that pull request continues from the earlier decisions instead of starting over.","rationale":["Correct: Copilot remembers context from previous sessions on the same pull request, so a follow-up there builds on the earlier work and pushes to the same branch by default.","Incorrect: a new issue starts a new session without the context of the pull request, so Copilot may diverge from the earlier decisions.","Incorrect: reassigning the issue starts the work from the beginning and is the retry for a stuck session, not a follow-up.","Incorrect: Copilot does not see issue comments that are added after the issue was assigned to it."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github"},{"id":"3.2.2-04","obj":"3.2.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. runs a script that resumes a specific Copilot CLI session by its ID. Another session has a name that starts with the same characters as that ID, and the script must not resume the wrong session by prefix or name matching.\n\nWhich option should the script use?","choices":["--session-id with the exact ID","--resume with the exact ID","--continue with the exact ID","--name with the exact ID"],"answer":[0],"explanation":"--resume accepts a session ID, an ID prefix, or a session name, so it can match more broadly. --session-id uses an exact session or task ID.","rationale":["Correct: --session-id uses the exact ID and avoids the broader matching by ID prefix or session name that --resume performs.","Incorrect: --resume can match a session ID, an ID prefix, or a session name, which is the broader matching the script must avoid.","Incorrect: --continue resumes the most recent session in the current working directory. It is not the option for an exact session ID.","Incorrect: --name gives a new session a name. It does not resume an existing session by ID."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"3.2.2-05","obj":"3.2.2","difficulty":"hard","type":"dropdown","stem":"User2 at Northwind Traders returns to a project in Copilot CLI. User2 must first resume the most recent session for the current folder and then read the full content of the second compaction checkpoint to check which decisions were kept.\n\nHow should you complete the commands? To answer, select the appropriate options in the answer area.\n\n```shell\ncopilot [[1]]\n```\n\n```copilot\n/session [[2]]\n```","targets":[{"label":"Box 1","options":["--continue","--name","--session-id"],"why":["Correct: --continue resumes the most recent session in the current working directory and falls back to the globally most recent session.","Incorrect: --name names a new session. It does not resume the most recent session for the folder.","Incorrect: --session-id needs an exact session ID. It is for a known session, not for the most recent one."]},{"label":"Box 2","options":["checkpoints 2","files","plan"],"why":["Correct: /session checkpoints followed by a number shows the full content of that checkpoint, so User2 can see what the second compaction kept.","Incorrect: /session files lists the files of the session. It does not show the compaction summaries.","Incorrect: /session plan shows the current plan of the session, not the content of an earlier compaction checkpoint."]}],"answer":[0,0],"explanation":"copilot --continue resumes the most recent session for the current folder. /session checkpoints with a number shows the content of that checkpoint.","ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.2.2-06","obj":"3.2.2","difficulty":"medium","type":"order","stem":"User3 at Adventure Works stopped a named Copilot CLI session called checkout refactor yesterday. Today, User3 must continue it, check what earlier compactions preserved, check the remaining steps of the plan, and then continue the work without repeating completed steps.\n\nWhich four actions should User3 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run copilot --resume=\"checkout refactor\".","Run /session checkpoints to list the compaction checkpoints.","Run /session plan to view the remaining steps of the plan.","Ask Copilot to continue with the first unchecked step of the plan.","Run /new to start a clean conversation for today.","Run /session delete to remove the stale session data."],"answer":[0,1,2,3],"explanation":"Resuming by name restores the conversation and session state. Reviewing checkpoints and the plan confirms what was decided and what remains before Copilot continues.","rationale":["Step 1: --resume accepts a session name, so User3 returns to the same session with its context, plan, and state.","Step 2: /session checkpoints lists the compaction summaries, which show what earlier phases preserved.","Step 3: /session plan shows the plan, so User3 can see which steps are done and which remain.","Step 4: pointing Copilot at the first unchecked step continues the work from the right place without redoing completed steps.","Incorrect: /new starts a new conversation and loses the context of the resumed session, so earlier decisions are no longer available.","Incorrect: /session delete removes session data, which destroys the record that User3 needs to resume."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/work-with-multiple-sessions"},{"id":"3.2.2-07","obj":"3.2.2","difficulty":"medium","type":"single","stem":"You need to meet the state requirements for User1.\n\nWhat should User1 do?","choices":["Start the session with copilot --name, and resume it each morning with copilot --resume and the name.","Run /compact each evening, and start each morning with /new and a copy of the compaction summary.","Ask Copilot to store each decision as a user-level preference, and start a new session each morning.","Run /clear each evening, and start each morning with /context to check what Copilot still remembers."],"answer":[0],"explanation":"A named session saved with /exit can be resumed by name, which restores its conversation, context, and plan. Starting new sessions each day loses context and repeats work.","rationale":["Correct: a named session can be resumed with --resume and its name, which brings back the conversation, context, and plan, so User1 continues without repeating steps.","Incorrect: a new conversation does not contain the plan and session state, and a pasted summary can lose fine-grained decisions.","Incorrect: preferences describe how a user likes to work, and task-specific details are not stored as memories. A new session also lacks the plan.","Incorrect: /clear starts a new conversation and drops the context, so /context the next morning would show nothing about the migration."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/work-with-multiple-sessions","case":"C-c"},{"id":"3.2.3-01","obj":"3.2.3","difficulty":"easy","type":"single","series":"S-c","stem":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals.\n\nFabrikam, Inc. assigned an issue to Copilot cloud agent. While the session is running, the session log shows that Copilot started to rewrite the authentication module, which is outside the scope of the issue. You must redirect the running session back to the scope of the issue without starting a new session and without losing the commits that Copilot already pushed.\n\nSolution: You enter a follow-up instruction that restates the scope in the prompt box below the session log.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"Steering a running session from the prompt box below the session log redirects Copilot without stopping it. Copilot applies the instruction after its current tool call, and pushed commits stay in place.","rationale":["Correct: steering sends a follow-up to the running session, and Copilot applies it after the current tool call, so the same session continues within scope.","Incorrect: the solution does meet the goal. No would be right if the session had already ended or if the session were run by a third-party agent, which does not support steering."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.2.3-02","obj":"3.2.3","difficulty":"medium","type":"single","series":"S-c","stem":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals.\n\nFabrikam, Inc. assigned an issue to Copilot cloud agent. While the session is running, the session log shows that Copilot started to rewrite the authentication module, which is outside the scope of the issue. You must redirect the running session back to the scope of the issue without starting a new session and without losing the commits that Copilot already pushed.\n\nSolution: You add a comment to the issue that restates the scope and mentions @copilot.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Copilot does not see comments that are added to an issue after it was assigned. New guidance belongs in the pull request or in the running session, not in the issue.","rationale":["Incorrect: the solution does not meet the goal. Yes would be right only if Copilot read new issue comments, but it does not see comments added after assignment.","Correct: comments added to the issue after assignment are not seen by Copilot, so the running session continues to drift. Steering the session or commenting on the pull request reaches Copilot."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github"},{"id":"3.2.3-03","obj":"3.2.3","difficulty":"hard","type":"single","series":"S-c","stem":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals.\n\nFabrikam, Inc. assigned an issue to Copilot cloud agent. While the session is running, the session log shows that Copilot started to rewrite the authentication module, which is outside the scope of the issue. You must redirect the running session back to the scope of the issue without starting a new session and without losing the commits that Copilot already pushed.\n\nSolution: You select Stop session, and then you unassign and reassign the issue to Copilot with a clearer description.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Stopping the session keeps the pushed commits, but reassigning the issue starts a new session. The goal requires redirecting the running session without starting a new one.","rationale":["Incorrect: the solution does not meet the goal. It would be acceptable if a new session were allowed, because Stop session preserves commits that were already pushed.","Correct: Stop session ends the run, and reassigning the issue starts a new session, which the goal explicitly rules out. Steering the running session is the fitting correction."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.2.3-04","obj":"3.2.3","difficulty":"medium","type":"single","stem":"User1 at Woodgrove Bank has worked in one Copilot CLI session for days. The session went through many compactions, and the team now chose a different approach. Copilot keeps trying to reconcile the new approach with abandoned earlier decisions.\n\nWhat should User1 do?","choices":["Start a fresh session with a prompt that describes the new approach.","Run /compact with focus instructions that describe the new approach.","Run /session checkpoints to list the earlier compaction summaries.","Run /context to see how much of the context window is still free."],"answer":[0],"explanation":"GitHub suggests a fresh session when work went in a wrong direction and you want a clean slate rather than having Copilot reconcile earlier decisions, or when many compactions have lost context.","rationale":["Correct: a fresh session gives a clean slate, which GitHub recommends when you would rather start over than have Copilot reconcile earlier decisions with a new approach.","Incorrect: another compaction still carries a summary of the abandoned decisions forward, so the drift toward them can continue.","Incorrect: listing checkpoints helps you understand what was preserved, but it does not change what Copilot works from.","Incorrect: /context shows token usage. The problem is conflicting decisions in the history, not a lack of space."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.2.3-05","obj":"3.2.3","difficulty":"easy","type":"single","stem":"Tailspin Toys assigns large issues to Copilot cloud agent. The team wants to notice early when Copilot starts to diverge from the issue, instead of finding out only when the work is done.\n\nWhat should the team do while a session runs?","choices":["Follow the live session log from View session or the Agents panel.","Wait for the draft pull request and review the final diff.","Review the repository-level facts that Copilot stored during the session.","Review the Actions usage report for the session after it ends."],"answer":[0],"explanation":"The session log shows the reasoning of Copilot and the tools it uses as it works. Watching it live lets the team spot divergence and steer the session before much work is wasted.","rationale":["Correct: the live session log shows what Copilot is doing as it works, so the team can detect drift early and steer the session.","Incorrect: reviewing only the final diff finds drift after the work is complete, which is exactly the late detection the team wants to avoid.","Incorrect: facts are learned conventions and are not a timeline of the session. They do not show whether the current work is in scope.","Incorrect: the usage report shows consumption after the fact. It does not describe what the agent did."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"3.2.3-06","obj":"3.2.3","difficulty":"medium","type":"dragdrop","stem":"Relecloud uses Copilot cloud agent and Copilot CLI for long tasks. You must choose a correction for each sign of context drift.\n\nWhich correction should you use for each situation? To answer, drag the appropriate corrections to the correct situations. Each correction may be used once, more than once, or not at all.","choices":["Steer the session from the prompt box below the session log","Review /session checkpoints and restate the decision","Run /compact with focus instructions","Run /new and describe the new task","Re-run the failed jobs of the workflow run"],"targets":["Situation1: a running cloud agent session starts to edit files outside the scope of its issue","Situation2: after several compactions in Copilot CLI, Copilot contradicts an early decision","Situation3: the CLI session continues on the same feature, but the context window is nearly full","Situation4: User2 switches from a payment fix to an unrelated documentation task in Copilot CLI"],"answer":[0,1,2,3],"explanation":"Each correction matches a different cause of drift: steer a running cloud session, check what compaction kept, compact deliberately before a new phase, or start fresh for unrelated work.","rationale":["Situation1: steering applies a follow-up to the running session after the current tool call, which redirects it without restarting.","Situation2: checkpoints show what each compaction preserved, so you can see that the decision was lost and restate it.","Situation3: /compact frees context while keeping the essentials, and focus instructions steer what the summary keeps.","Situation4: unrelated work does not need the earlier context, and a new conversation keeps old details from steering the new task."],"notes":["Sends a follow-up to a running cloud agent session. Use it to redirect the work without stopping the session.","Shows the compaction summaries of a CLI session. Use it to verify continuity and find decisions that were lost.","Summarizes the history to free context. Use it before a new phase of the same work, with focus on what matters.","Starts a new conversation. Use it between unrelated tasks so that old context does not influence new work.","Repeats failed CI jobs on the same commit. It helps with transient CI failures, not with drift in an agent session."],"ref":"https://docs.github.com/en/copilot/concepts/prompting-and-context/context-management"},{"id":"3.2.3-07","obj":"3.2.3","difficulty":"hard","type":"order","stem":"User1 at Contoso, Ltd. notices that, after several compactions, Copilot CLI is renaming database tables even though the team decided early in the session to keep the existing names. User1 must find out what the compactions kept, correct Copilot, and verify the result.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run /session checkpoints to list the compaction checkpoints.","Run /session checkpoints 2 to read the content of a checkpoint.","Restate the decision and ask Copilot to revert the table renames.","Run /diff to verify that the table renames were reverted.","Run /compact to make Copilot summarize the decision again.","Run /clear to remove the conflicting history from the session."],"answer":[0,1,2,3],"explanation":"Checkpoints show what each compaction preserved, which reveals whether the decision was lost. After restating it
