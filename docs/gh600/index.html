vate repository. The finance-api repository also contains a repository-level agent profile named reviewer with different instructions.\n\nWhich agent should you expect Copilot to use when a user selects reviewer in finance-api?","choices":["The repository-level agent in finance-api","The organization-level agent in .github-private","A merged agent that combines both profiles","The agent whose profile was committed last"],"answer":[0],"explanation":"In a naming conflict, the lowest level configuration overrides higher levels. A repository-level agent takes precedence over an organization-level agent, which takes precedence over an enterprise-level agent.","rationale":["Correct: the repository-level profile is the lowest level, so it overrides the organization-level agent with the same name in finance-api.","Incorrect: the organization-level agent is used only in repositories that do not define an agent with the same name.","Incorrect: profiles with the same name are not merged. One configuration overrides the other.","Incorrect: commit time does not resolve naming conflicts. The level of the configuration determines which agent wins."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"2.3.2-06","obj":"2.3.2","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. stores an Agents secret named COPILOT_MCP_API_KEY at the organization level. The inventory repository needs a different key for the same MCP server, and all other repositories must keep the organization value. The solution must minimize administrative effort.\n\nWhat should you do?","choices":["Create a repository-level Agents secret named COPILOT_MCP_API_KEY in inventory","Create a repository-level Actions secret named COPILOT_MCP_API_KEY in inventory","Rename the organization secret, and create one secret for each repository","Create a repository-level Agents variable named COPILOT_MCP_API_KEY in inventory"],"answer":[0],"explanation":"Agents secrets can be defined at the organization or repository level. When the same name exists at more than one level, the lowest level wins, so a repository secret overrides the organization secret for that repository only.","rationale":["Correct: the repository-level secret overrides the organization-level secret for inventory, and all other repositories keep the organization value.","Incorrect: Actions secrets are used by GitHub Actions workflows. Copilot cloud agent reads Agents secrets.","Incorrect: this could work, but it adds a secret for every repository, which does not minimize administrative effort. A single repository-level override meets the requirement.","Incorrect: variables are not encrypted and are not available when Copilot runs in a cloud sandbox. Use a secret for keys."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"2.3.3-01","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Litware, Inc. wants to run Copilot in its GitHub Actions workflows to automate routine repository tasks. The company wants the approach that GitHub recommends for most automation use cases.\n\nWhich approach should you use?","choices":["GitHub Agentic Workflows","copilot -p in a workflow step","A copilot-setup-steps.yml file","A scheduled Copilot code review"],"answer":[0],"explanation":"GitHub recommends GitHub Agentic Workflows for most automation use cases. Agentic workflows use GITHUB_TOKEN authentication by default and include additional guardrails for automated environments.","rationale":["Correct: GitHub Agentic Workflows is the recommended approach, with GITHUB_TOKEN authentication and guardrails suited for automation.","Incorrect: invoking Copilot CLI directly is supported, but it gives the CLI broad access to the workflow environment and is not the recommended default.","Incorrect: copilot-setup-steps.yml prepares the environment for Copilot cloud agent. It does not invoke Copilot from your own workflows.","Incorrect: Copilot code review reviews pull requests. It does not automate general repository tasks in workflows."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions"},{"id":"2.3.3-02","obj":"2.3.3","difficulty":"easy","type":"single","stem":"Northwind Traders runs the following step in a GitHub Actions workflow:\n\ncopilot -p \"Write a summary of today's commits to summary.md\" --allow-tool='shell(git:*)' --no-ask-user\n\nThe job succeeds, but summary.md is never created. The log shows that a file write was denied.\n\nWhat should you add to the command?","choices":["--allow-tool=write","--allow-url=github.com","--add-dir=.","--share=summary.md"],"answer":[0],"explanation":"Non-interactive runs cannot show approval prompts, so any action that is not pre-approved is denied automatically. The GitHub Docs example pre-approves writes with --allow-tool=write.","rationale":["Correct: --allow-tool=write pre-approves file writes, so Copilot can create summary.md without an approval prompt.","Incorrect: --allow-url pre-approves access to a URL or domain. The denied action is a file write, not a network request.","Incorrect: --add-dir adds a directory to the allowed paths, but writing still needs the write tool permission.","Incorrect: --share writes the session transcript to a file. It does not grant permission to write summary.md."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/automate-copilot-cli/automate-with-actions"},{"id":"2.3.3-03","obj":"2.3.3","difficulty":"medium","type":"dropdown","stem":"Tailspin Toys invokes Copilot CLI directly in a workflow in an organization-owned repository. The workflow must authenticate without a personal access token or any stored secrets.\n\nHow should you complete the workflow? To answer, select the appropriate options in the answer area.\n\n```yaml\npermissions:\n  contents: read\n  [[1]]\njobs:\n  copilot:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v6\n      - run: npm install -g @github/copilot\n      - run: copilot -p \"Summarize the latest commit\" -s --allow-tool='shell(git show:*)'\n        env:\n          [[2]]\n```","choices":[],"answer":[0,0],"explanation":"With the GITHUB_TOKEN approach, the workflow grants copilot-requests: write so it can make Copilot requests, and passes the token as GITHUB_TOKEN: ${{ github.token }}. No additional secrets are needed.","rationale":[],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions","targets":[{"label":"Box 1","options":["copilot-requests: write","id-token: write","pull-requests: write"],"why":["Correct: the copilot-requests: write permission is required for the workflow to make Copilot requests with GITHUB_TOKEN.","Incorrect: id-token: write lets a workflow request an OIDC token, for example to sign in to Azure. It does not allow Copilot requests.","Incorrect: pull-requests: write lets the token change pull requests. It does not allow the workflow to make Copilot requests."]},{"label":"Box 2","options":["GITHUB_TOKEN: ${{ github.token }}","COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}","COPILOT_MCP_TOKEN: ${{ github.token }}"],"why":["Correct: the GITHUB_TOKEN provided by GitHub Actions handles authentication automatically, so no PAT or stored secret is needed.","Incorrect: this is the PAT approach, which needs a stored secret. The requirement rules out personal access tokens and stored secrets.","Incorrect: COPILOT_MCP_ names are used for Agents secrets that MCP servers receive. The CLI does not read this variable to authenticate."]}]},{"id":"2.3.3-04","obj":"2.3.3","difficulty":"medium","type":"order","stem":"Contoso, Ltd. wants a workflow that runs Copilot CLI every evening to summarize the changes of the day. The workflow must authenticate with a fine-grained personal access token. The workflow file already has the schedule trigger, a checkout step, and a step that installs the CLI by running npm install -g @github/copilot.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a fine-grained personal access token that has the Copilot Requests permission.","Add a step that runs copilot -p with the token passed in the COPILOT_GITHUB_TOKEN environment variable.","Store the token as an Actions repository secret.","Store the token as an Agents secret named COPILOT_MCP_GITHUB_TOKEN.","Add the CLI installation to a copilot-setup-steps.yml file."],"answer":[0,2,1],"explanation":"With the PAT option, you create a fine-grained PAT with the Copilot Requests permission, store it as an Actions secret, and then pass the secret to the run step as COPILOT_GITHUB_TOKEN. The run step comes after the installation step that already exists.","rationale":["Step 1: the token must exist and have the Copilot Requests permission before you can store it.","Step 3: the run step reads the stored secret into the COPILOT_GITHUB_TOKEN environment variable and runs the prompt in programmatic mode.","Step 2: the workflow can read the token only from a secret, such as PERSONAL_ACCESS_TOKEN, so you store the token before the step references it.","Incorrect: Agents secrets are for Copilot cloud agent and its MCP servers. A normal workflow step reads Actions secrets.","Incorrect: copilot-setup-steps.yml prepares the environment for Copilot cloud agent. It is not part of your own workflow."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/automate-copilot-cli/automate-with-actions"},{"id":"2.3.3-05","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Adatum Corporation runs Copilot CLI in a workflow with GITHUB_TOKEN authentication. The workflow grants copilot-requests: write and passes GITHUB_TOKEN to the step, and the latest CLI is installed. Copilot requests from the workflow are still rejected.\n\nWhat should you check?","choices":["The Allow use of Copilot CLI billed to the organization policy","The Copilot in the cloud policy on the Copilot policies page","The Require approval for workflow runs setting of the agent","The MCP servers in Copilot policy on the Copilot policies page"],"answer":[0],"explanation":"For workflows to use Copilot CLI with GITHUB_TOKEN, the organization policy Allow use of Copilot CLI billed to the organization under Copilot CLI must be enabled. It is enabled by default when Copilot CLI is turned on, but an owner can change it.","rationale":["Correct: this Copilot CLI policy must be enabled for workflows in the organization to use Copilot CLI with GITHUB_TOKEN.","Incorrect: the Copilot in the cloud policy controls the chat interface, delegation to Copilot, and cloud sandbox sessions, not CLI billing for workflows.","Incorrect: this setting controls whether workflows run automatically when Copilot cloud agent pushes. It does not affect CLI authentication.","Incorrect: this policy controls MCP server use. The workflow does not depend on MCP servers to make Copilot requests."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions"},{"id":"2.3.3-06","obj":"2.3.3","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. passes a deployment key to a Copilot CLI step in a workflow by using an environment variable named DEPLOY_KEY. The value must be redacted from the output of the CLI, in the same way as the tokens that the CLI redacts by default.\n\nWhich option should you add to the copilot command?","choices":["--secret-env-vars=DEPLOY_KEY","--deny-tool='shell(env)'","--excluded-tools=DEPLOY_KEY","--output-format=json"],"answer":[0],"explanation":"The --secret-env-vars option names environment variables whose values are redacted from output. GITHUB_TOKEN and COPILOT_GITHUB_TOKEN are redacted by default.","rationale":["Correct: --secret-env-vars adds DEPLOY_KEY to the variables whose values the CLI redacts, alongside the tokens that are redacted by default.","Incorrect: denying one shell command reduces one way to read the value, but it does not redact the value if it appears in the output.","Incorrect: --excluded-tools removes tools from the model. It takes tool names, not environment variables, and it does not redact anything.","Incorrect: --output-format=json changes the output to JSONL. It does not hide secret values."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-programmatic-reference"},{"id":"2.3.4-01","obj":"2.3.4","difficulty":"easy","type":"single","stem":"Woodgrove Bank assigns an issue to Copilot cloud agent on GitHub. The fix must be based on the release/2.0 branch, and the pull request must target that branch instead of the default branch.\n\nWhat should you do when you assign the issue?","choices":["Select release/2.0 as the base branch in the assignment options","Change the default branch of the repository to release/2.0","Name release/2.0 in a checkout step of copilot-setup-steps.yml","Add a comment that asks Copilot to rebase the default branch"],"answer":[0],"explanation":"When you assign an issue to Copilot, you can change the base branch. Copilot creates a new branch from the base branch, and its pull request targets that branch. Without a choice, the default branch is used.","rationale":["Correct: the base branch option makes Copilot branch from release/2.0 and open the pull request against release/2.0.","Incorrect: changing the default branch affects every user and workflow in the repository. The base branch option scopes a single task.","Incorrect: setup steps prepare the environment before Copilot starts. They do not set the base branch of the task or the branch that the pull request targets.","Incorrect: a comment after assignment does not change the base branch. Choose the base branch when you assign the issue."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github"},{"id":"2.3.4-02","obj":"2.3.4","difficulty":"easy","type":"single","stem":"A developer at Litware, Inc. starts Copilot cloud agent tasks from a terminal by using GitHub CLI. A task must use the hotfix branch as its base branch.\n\nWhich command should the developer run?","choices":["gh agent-task create \"Fix the timeout\" --base hotfix","gh agent-task view --base hotfix \"Fix the timeout\"","gh agent-task list --base hotfix","copilot -p \"Fix the timeout\" --add-dir=hotfix"],"answer":[0],"explanation":"gh agent-task create starts a Copilot cloud agent task from GitHub CLI, and --base sets the base branch. The view and list commands inspect existing tasks.","rationale":["Correct: gh agent-task create starts a new task, and --base makes Copilot use the hotfix branch as the base branch.","Incorrect: gh agent-task view shows an existing task and its logs. It cannot start a new task.","Incorrect: gh agent-task list lists recent tasks. It does not create a task.","Incorrect: this runs Copilot CLI locally, and --add-dir adds a directory to the allowed paths. It does not create a cloud agent task."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-from-cli"},{"id":"2.3.4-03","obj":"2.3.4","difficulty":"medium","type":"single","stem":"A reviewer at Contoso, Ltd. asks for changes to a pull request that Copilot cloud agent created. The changes must be added to the same pull request instead of a new one.\n\nWhat should the reviewer do?","choices":["Mention @copilot in a comment on the pull request","Assign a new issue that describes the changes to Copilot","Start a new task that uses the same base branch","Close the pull request and reassign the original issue"],"answer":[0],"explanation":"When Copilot is triggered by a mention of @copilot on an existing pull request, it has write access to the branch of that pull request. In other cases, Copilot creates a new copilot/ branch.","rationale":["Correct: mentioning @copilot on the pull request lets Copilot push to the pull request branch, so the changes are added to the same pull request.","Incorrect: a new issue starts a new task, which creates a new copilot/ branch and a new pull request.","Incorrect: a new task also creates a new copilot/ branch, even when it uses the same base branch.","Incorrect: reassigning the issue starts a new task, which creates a new copilot/ branch and a new pull request instead of updating the existing one."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.3.4-04","obj":"2.3.4","difficulty":"medium","type":"single","stem":"Tailspin Toys changes the profile of a repository-level custom agent on a branch named agent-v2 to test new instructions. The default branch still has the old profile.\n\nWhich action should you take so that the test uses the new profile without changing the default branch?","choices":["Assign a task to the custom agent and select agent-v2 as the branch","Merge agent-v2 into the default branch and roll back after the test","Copy the profile into the .github-private repository under agents","Rename the profile on agent-v2 so that its name differs"],"answer":[0],"explanation":"Custom agent versions are based on the commit SHAs of the profile. When you assign a task, the agent is instantiated from the latest version of the profile for that repository and branch.","rationale":["Correct: the agent uses the latest version of the profile on the selected branch, so a task on agent-v2 tests the new instructions.","Incorrect: merging changes the default branch for everyone during the test, which the requirement rules out.","Incorrect: this creates an organization-level agent, and the repository-level agent with the same name still wins in the repository.","Incorrect: renaming creates a different agent, and it still exists only on agent-v2. Branch selection is what scopes the version."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"2.3.4-05","obj":"2.3.4","difficulty":"hard","type":"yesno","stem":"Fabrikam, Inc. assigns a new issue to Copilot cloud agent. The default branch has a ruleset with required status checks.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Copilot creates a new copilot/ branch for the task and can push only to that branch.","Copilot can run git push to any branch that the assigning user can write to.","The ruleset and required checks of the repository apply to the work of Copilot.","Copilot can mark its draft pull request as Ready for review after the checks pass."],"answer":[0,2],"explanation":"For a new task, Copilot gets a new copilot/ branch and can push only to it. It performs only simple push operations, is subject to branch protections and required checks, and cannot mark its pull requests ready for review.","rationale":["Yes: when Copilot is not triggered on an existing pull request, a new copilot/ branch is created, and the agent can only push to that branch.","No: Copilot can only perform simple push operations to its single branch. It cannot directly run git push or other Git commands.","Yes: the agent is subject to any branch protections and required checks for the working repository.","No: draft pull requests from Copilot must be reviewed by a human. Copilot cannot mark its pull requests as Ready for review."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.3.4-06","obj":"2.3.4","difficulty":"hard","type":"single","stem":"Adatum Corporation assigns a task to a custom agent named api-docs. The agent opens a pull request. Later, a maintainer merges a new version of the api-docs profile into the default branch. A reviewer then mentions @copilot on the pull request to request a change.\n\nWhich version of the profile should you expect Copilot to use for the change?","choices":["The version that was used when the pull request was created","The latest version of the profile on the default branch","The latest version of the profile on the pull request branch","No custom agent, because the default Copilot agent is used"],"answer":[0],"explanation":"When a custom agent creates a pull request, interactions within the pull request use the same version of the custom agent for consistency. Mentioning @copilot on a pull request created by a custom agent continues with that agent.","rationale":["Correct: interactions within the pull request use the same version of the custom agent that created it, so the new default branch version is not used.","Incorrect: a new task would use the latest profile on its branch, but follow-up work in an existing pull request keeps the original version.","Incorrect: the profile version is tied to the agent that created the pull request, not to the latest commit on the pull request branch.","Incorrect: Copilot continues with the custom agent that created the pull request rather than switching to the default agent."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"2.3.5-01","obj":"2.3.5","difficulty":"easy","type":"single","stem":"Copilot cloud agent pushes changes to a pull request at Wingtip Toys. The CI workflows of the repository do not start. The repository uses the default Copilot cloud agent settings.\n\nWhat should a user with write access do after reviewing the changes?","choices":["Click Approve and run workflows in the merge box","Mark the pull request as Ready for review","Mention @copilot and ask it to run the workflows","Rerun the copilot-setup-steps workflow"],"answer":[0],"explanation":"By default, workflows are not triggered on Copilot pull requests until a user with write access reviews the code and clicks Approve and run workflows. This prevents unreviewed code from running in privileged workflows.","rationale":["Correct: Approve and run workflows in the merge box starts the workflows after a user with write access reviews the changes.","Incorrect: marking the pull request ready for review does not approve the pending workflow runs.","Incorrect: Copilot cannot approve its own workflow runs. A user with write access must approve them.","Incorrect: the setup steps workflow prepares the agent environment. It does not run the CI workflows on the pull request."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"2.3.5-02","obj":"2.3.5","difficulty":"easy","type":"single","stem":"A contractor at Northwind Traders has a Copilot license and read access to a repository. Copilot cloud agent is enabled for the repository. When the contractor mentions @copilot in an issue comment, nothing happens.\n\nWhat should you do so that the contractor can delegate work to Copilot in the repository?","choices":["Grant the contractor write access to the repository","Assign the contractor a second Copilot license","Add the contractor as an organization billing manager","Turn on the firewall for the repository"],"answer":[0],"explanation":"Only users with write access to the repository can trigger Copilot cloud agent, and comments from users without write access are never presented to the agent. Users need Copilot access and write permission.","rationale":["Correct: with write access and Copilot access, the contractor can delegate work, and the comments are presented to the agent.","Incorrect: the contractor already has Copilot access. The missing requirement is write permission for the repository.","Incorrect: billing managers manage billing settings. The role does not grant write access to repositories.","Incorrect: the firewall controls network access during sessions. It does not decide who can trigger the agent."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.3.5-03","obj":"2.3.5","difficulty":"medium","type":"order","stem":"A developer at Contoso, Ltd. wants Copilot cloud agent to implement a feature from an issue and then deliver the change through the normal review process. The repository requires one approval before merging.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Ask a different user with write access to approve the pull request, and then merge it.","Assign the issue to Copilot.","Review the changes in the draft pull request, and click Approve and run workflows.","Follow the session logs to monitor the work of Copilot.","Ask Copilot to approve and merge its own pull request.","Approve the pull request yourself because you assigned the issue."],"answer":[1,3,2,0],"explanation":"Copilot works on its own branch and opens a draft pull request. Humans review the changes, approve the workflow runs, and approve and merge the pull request, and the user who asked for the pull request cannot approve it.","rationale":["Step 4: the user who asked Copilot to create the pull request cannot approve it, so another user with write access provides the required approval.","Step 1: assigning the issue starts the task. Copilot creates a copilot/ branch and a draft pull request.","Step 3: workflows do not run until a user with write access reviews the code and approves the workflow runs.","Step 2: the session logs show what Copilot does while it works on the task.","Incorrect: Copilot cannot approve or merge a pull request. Draft pull requests must be reviewed and merged by a human.","Incorrect: the user who asked Copilot to create the pull request is prevented from approving it, which keeps the required approvals rule effective."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.3.5-04","obj":"2.3.5","difficulty":"medium","type":"multi","stem":"Tailspin Toys evaluates which actions Copilot cloud agent can perform on its own after a user assigns an issue to it.\n\nWhich three actions should you expect Copilot cloud agent to perform without human intervention? Each correct answer presents a complete solution.\n\nNOTE: Each correct selection is worth one point.","choices":["Create a copilot/ branch for the task","Push commits to its copilot/ branch","Open a draft pull request","Mark the pull request as Ready for review","Approve the pull request","Merge the pull request"],"answer":[0,1,2],"explanation":"Copilot cloud agent works on a new copilot/ branch, pushes to that branch, and opens a draft pull request. It cannot mark its pull requests ready for review and cannot approve or merge them.","rationale":["Correct: for a task from an issue, a new copilot/ branch is created for Copilot, and the agent can only push to that branch.","Correct: Copilot can perform simple push operations to its own branch while it works on the task.","Correct: Copilot opens a draft pull request with its changes, which a human must review.","Incorrect: Copilot cannot mark its pull requests as Ready for review. A human does this after reviewing the changes.","Incorrect: Copilot cannot approve a pull request, which keeps human review in place.","Incorrect: Copilot cannot merge a pull request. Draft pull requests from Copilot must be reviewed and merged by a human."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"2.3.5-05","obj":"2.3.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants CI workflows to run automatically when Copilot cloud agent pushes to its pull requests in a repository. You are a repository administrator.\n\nWhat should you change?","choices":["Disable Require approval for workflow runs in the Policies section","Disable the validation tools in the Validation tools section","Add the workflow files to the copilot-setup-steps.yml file","Disable the firewall in the Internet access settings"],"answer":[0],"explanation":"By default, workflows do not run automatically when Copilot pushes. A repository administrator can disable Require approval for workflow runs in the Policies section of the Copilot cloud agent settings page.","rationale":["Correct: disabling Require approval for workflow runs lets workflows start without the Approve and run workflows button.","Incorrect: validation tools are the security and code review checks that Copilot runs on its own code. They do not gate workflow runs.","Incorrect: setup steps run before Copilot starts work. They do not change how workflows are triggered on pull requests.","Incorrect: the firewall controls internet access for the agent. It has no effect on workflow approval."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"2.3.5-06","obj":"2.3.5","difficulty":"hard","type":"single","stem":"Fabrikam, Inc. considers disabling Require approval for workflow runs for Copilot cloud agent in a repository that deploys to production from GitHub Actions.\n\nWhich risk should you evaluate before you make the change?","choices":["Unreviewed code from Copilot could gain write access or reach Actions secrets","Copilot could merge its own pull requests into the protected default branch","Copilot could start sessions in repositories that are not in Repository access","Copilot could turn off the firewall that restricts its access to the internet"],"answer":[0],"explanation":"Workflows can be privileged and have access to secrets. Allowing workflows to run without approval may allow unreviewed code written by Copilot to gain write access to the repository or access GitHub Actions secrets.","rationale":["Correct: the documented warning is that unreviewed code could gain write access to the repository or access Actions secrets through workflows.","Incorrect: Copilot cannot approve or merge pull requests, whatever the workflow approval setting is.","Incorrect: workflow approval does not change which repositories allow the agent. Repository access is an organization setting.","Incorrect: firewall settings are managed by administrators on the Internet access page. The workflow setting does not give Copilot control over them."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"2.3.5-07","obj":"2.3.5","difficulty":"hard","type":"single","stem":"Adatum Corporation uses a third-party code security scanner on all pull requests. The built-in CodeQL check of Copilot cloud agent conflicts with the scanner and slows sessions. The company does not have GitHub Advanced Security licenses.\n\nWhat should a repository administrator do?","choices":["Turn off the CodeQL tool in the Validation tools section of the Cloud agent settings","Assign GitHub Advanced Security licenses so that the CodeQL check can be configured","Add a step to copilot-setup-steps.yml that skips CodeQL before Copilot starts working","Disable Require approval for workflow runs so that the scanner runs before CodeQL"],"answer":[0],"explanation":"Copilot cloud agent runs CodeQL, advisory checks, secret scanning, and Copilot code review on its own code by default. A repository administrator can turn these validation tools off, for example to avoid conflicts with other security products. The checks do not require GitHub Advanced Security licenses.","rationale":["Correct: the Validation tools section lets a repository administrator turn off individual tools, such as CodeQL, to avoid conflicts with other products.","Incorrect: the built-in security validation does not require GitHub Secret Protection, GitHub Code Security, or GitHub Advanced Security licenses.","Incorrect: setup steps prepare the development environment. The validation tools are controlled by a repository setting.","Incorrect: workflow approval controls whether CI runs automatically. It does not affect the validation that Copilot performs during the session."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"2.3.6-01","obj":"2.3.6","difficulty":"easy","type":"single","stem":"Litware, Inc. uses a copilot-setup-steps.yml file to install a large toolchain before Copilot cloud agent starts. The setup must have as much time as possible before the job times out.\n\nWhich timeout-minutes value should you set for the copilot-setup-steps job?","choices":["59","60","120","360"],"answer":[0],"explanation":"The copilot-setup-steps job accepts only a few settings, including timeout-minutes with a maximum value of 59.","rationale":["Correct: 59 is the maximum value that timeout-minutes accepts for the copilot-setup-steps job.","Incorrect: 60 is above the documented maximum of 59 for the copilot-setup-steps job.","Incorrect: 120 exceeds the maximum of 59. Larger runners or caching are better ways to speed up a long setup.","Incorrect: 360 is far above the documented maximum, and the copilot-setup-steps job accepts no value above 59 minutes."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"2.3.6-02","obj":"2.3.6","difficulty":"easy","type":"single","stem":"Contoso, Ltd. sets runs-on in copilot-setup-steps.yml to the name of an ARC-managed scale set of ephemeral self-hosted runners. After the change, use of Copilot cloud agent in the repository is blocked.\n\nWhat should you do?","choices":["Disable the integrated firewall of Copilot cloud agent for the repository","Enable the recommended allowlist of the firewall for the repository","Change runs-on to a macOS runner label in the same runner scale set","Increase timeout-minutes of the copilot-setup-steps job to the maximum"],"answer":[0],"explanation":"The integrated firewall is not compatible with self-hosted runners. Unless it is disabled in the repository settings, use of Copilot cloud agent is blocked, so you implement network controls on the runners instead.","rationale":["Correct: you must disable the integrated firewall for self-hosted runners and configure network security controls for the runners yourself.","Incorrect: the recommended allowlist is part of the integrated firewall, which is not compatible with self-hosted runners.","Incorrect: Copilot cloud agent supports only Ubuntu x64 and Windows 64-bit runners. macOS runners are not supported.","Incorrect: the block is caused by the firewall incompatibility, not by the time that the setup takes."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"2.3.6-03","obj":"2.3.6","difficulty":"medium","type":"order","stem":"Wingtip Toys wants Copilot cloud agent to read work items by using the Azure DevOps MCP server. The agent must authenticate to Azure by using OpenID Connect (OIDC) instead of a stored client secret. Sessions run on GitHub Actions. Every change must work as soon as it is saved: a setup step must never reference a secret that does not exist yet, and the MCP server must never be configured before the setup steps sign in to Azure.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Configure the Azure DevOps MCP server as an ado object in the repository MCP configuration.","Configure OIDC in a Microsoft Entra application that trusts GitHub, and give the application identity access to the Azure DevOps organization and projects.","Add AZURE_CLIENT_ID and AZURE_TENANT_ID as Agents secrets.","Add an azure/login step to the copilot-setup-steps job, with id-token: write permission.","Store a client secret of the application as an Agents secret named COPILOT_MCP_AZURE_SECRET.","Select Cloud as the environment so that the azure/login step runs in the sandbox."],"answer":[1,2,3,0],"explanation":"The Entra application with OIDC and Azure DevOps access must exist first, because it provides the client ID. The client and tenant IDs are stored as Agents secrets before the azure/login step references them, and the ado server is added last because it uses the Azure CLI sign-in. Setup steps run only on GitHub Actions.","rationale":["Step 4: the ado server runs npx @azure-devops/mcp with the azcli authentication option, so it depends on the azure/login step.","Step 1: the Entra application must trust GitHub for OIDC, and its identity needs access to the Azure DevOps organization and projects. It also provides the client ID.","Step 2: the client ID and tenant ID of the application are stored as Agents secrets at the organization or repository level.","Step 3: the azure/login step reads the client ID and tenant ID from the secrets and signs in before Copilot starts. The id-token: write permission lets the job request an OIDC token.","Incorrect: with OIDC, no client secret is stored. The login uses the client ID, the tenant ID, and a token that GitHub issues.","Incorrect: setup steps, including OIDC sign-in steps, apply only to sessions that run on GitHub Actions, not in a cloud sandbox."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"},{"id":"2.3.6-04","obj":"2.3.6","difficulty":"medium","type":"dragdrop","stem":"Northwind Traders runs Copilot cloud agent on GitHub Actions in several repositories. Each repository has a different environment constraint.\n\nWhich configuration should you use for each constraint? To answer, drag the appropriate configurations to the correct constraints. Each configuration may be used once, more than once, or not at all.","choices":["Set runs-on to a Windows runner label","Add actions/checkout with lfs: true","Add the host to the custom allowlist","Set https_proxy as an Agents variable","Disable the recommended allowlist","Add a dotfiles repository"],"answer":[1,2,3,0],"explanation":"Each constraint has a documented fix: Git LFS needs a checkout step with lfs set to true, blocked hosts are added to the custom allowlist, a proxy is configured with environment variables, and Windows toolchains need a Windows runner.","rationale":["Git LFS objects are fetched only when a checkout step in the copilot-setup-steps job sets the lfs option to true.","The firewall blocks hosts that are not allowed. Adding the host or URL to the custom allowlist allows the traffic.","Proxy settings such as https_proxy can be set as Agents variables or secrets, or directly on the runner.","A Windows toolchain needs a Windows development environment, which you select by setting runs-on to a Windows runner label."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment","targets":["The repository stores large design files in Git LFS","The agent cannot download packages from packages.northwind.corp","Self-hosted runners reach the internet only through a corporate proxy","The project builds only with a Windows-based toolchain"],"notes":["Selects a Windows larger or self-hosted runner, because the default environment is Ubuntu Linux.","Installs Git LFS and fetches LFS objects in the copilot-setup-steps job.","Allows traffic to a domain and its subdomains, or to a URL and its descendant paths.","Routes HTTPS traffic of the agent through a proxy server, which is useful on self-hosted runners.","Removes the package registries that the firewall allows by default, which makes downloads fail more often.","Copies personal instructions, skills, and custom agents into cloud sandboxes. It does not apply to sessions on Actions."]},{"id":"2.3.6-05","obj":"2.3.6","difficulty":"hard","type":"yesno","stem":"Relecloud plans the environment for billing-api sessions.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The integrated firewall of Copilot cloud agent can restrict outbound traffic from the Windows sessions.","Larger runners with Azure private networking let you implement your own network controls for the Windows sessions.","If the dependency restore step fails, Copilot skips the remaining setup steps and starts working anyway.","You can set timeout-minutes to 90 so that the first dependency restore can finish."],"answer":[1,2],"explanation":"The integrated firewall is not compatible with Windows, so GitHub recommends self-hosted runners or larger runners with Azure private networking. A failed setup step skips the remaining steps, and timeout-minutes is limited to 59.","rationale":["No: the integrated firewall is not compatible with Windows, so it cannot restrict traffic from Windows sessions.","Yes: GitHub recommends larger GitHub-hosted runners with Azure private networking, or self-hosted runners, so that you can implement your own network controls.","Yes: when a setup step returns a non-zero exit code, Copilot skips the remaining setup steps and begins working with the current environment.","No: the maximum value of timeout-minutes for the copilot-setup-steps job is 59, so 90 is not allowed."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment","case":"C-b"},{"id":"2.3.6-06","obj":"2.3.6","difficulty":"hard","type":"single","stem":"Tailspin Toys uses the default firewall for Copilot cloud agent. A security review finds that a copilot-setup-steps.yml step and a configured MCP server both connect to a host that is not on any allowlist, and no firewall warning appears.\n\nWhich explanation should you give?","choices":["The firewall applies only to processes that the agent starts with its Bash tool","The recommended allowlist includes every host that setup steps or servers use","Firewall warnings appear only in the session logs of runs that fail to finish","The organization firewall is set to Let repositories decide, so it is disabled"],"answer":[0],"explanation":"The firewall applies only to processes started by the agent through its Bash tool. It does not apply directly to MCP server processes or to processes started in Copilot setup steps, so it is not a comprehensive security solution.","rationale":["Correct: setup steps and MCP server processes are outside the scope of the firewall, so their requests are not blocked and do not raise warnings.","Incorrect: the recommended allowlist covers package registries, container registries, and similar hosts. It does not allow arbitrary hosts.","Incorrect: when the firewall blocks a request, a warning is added to the pull request body or a comment, not only to failed runs.","Incorrect: Let repositories decide is the default, and it lets each repository control the firewall. It does not disable the firewall."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"2.4.1-01","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Litware, Inc. assigns issues in a Python repository to Copilot cloud agent. Copilot repeatedly pushes commits that fail the unit tests in CI, because it does not know how the test suite is started in this repository.\n\nWhat should you do to reduce the number of failing pushes?","choices":["Add the build and test commands to the .github/copilot-instructions.md file.","Re-run the failed workflow jobs with debug logging enabled after each push.","Ask Copilot to store a user-level preference that contains the test command.","Set the tool permissions for the session to Always ask before each tool call."],"answer":[0],"explanation":"Copilot cloud agent reads repository custom instructions before it works. When the build and test steps are documented there, Copilot can run the tests in its environment and fix failures before it pushes.","rationale":["Correct: GitHub recommends documenting how to build and test the project in .github/copilot-instructions.md so that Copilot can validate its changes before it pushes them, which prevents pushes that fail CI.","Incorrect: debug logging adds detail to the logs of a failed run, but it only helps you diagnose a failure after the push. It does not teach Copilot how to run the tests before the next push.","Incorrect: a user-level preference follows one user and is applied at the judgment of the model. A repository-wide build rule belongs in custom instructions, which are loaded for every session in the repository.","Incorrect: Always ask makes Copilot request approval for tool calls, which slows the session down. It does not give Copilot the missing knowledge about how to start the test suite."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"2.4.1-02","obj":"2.4.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. uses Copilot cloud agent with the default firewall. During a session, Copilot fails to download a package from an internal package registry, and the session finishes without the dependency.\n\nWhat should you check first to find out which address was blocked?","choices":["The warning that Copilot adds to the pull request body or to its comment","The secret scanning alerts on the Security tab of the repository","The repository-level facts in the Copilot Memory settings of the repository","The Actions usage report for the organization in the billing settings"],"answer":[0],"explanation":"When the firewall blocks a request, Copilot adds a warning to the pull request body or to the comment it posts. The warning lists the blocked address and the command that tried to reach it, which tells you what to allow.","rationale":["Correct: a firewall block adds a warning to the pull request description or to Copilot's comment, and the warning shows the blocked address and the command that made the request.","Incorrect: secret scanning alerts report credentials that were committed to the repository. They do not record outbound network requests that the agent firewall blocked during a session.","Incorrect: repository-level facts are conventions that Copilot learned about the code. Firewall decisions are not stored as memories, so the settings page does not show blocked addresses.","Incorrect: the usage report shows how many Actions minutes were consumed. It contains no information about individual network requests made by the agent inside its environment."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"2.4.1-03","obj":"2.4.1","difficulty":"medium","type":"multi","stem":"Tailspin Toys builds tools for an agent that updates customer records in batches. When a tool fails, the agent must be able to decide on its own whether to try again or to continue with the remaining work.\n\nWhich two pieces of information should each tool result include? Each correct answer presents part of the solution. Choose two.","choices":["Whether it is safe to retry the operation","Which records were completed before the failure","The full stack trace and internal host names","Only a generic message that says the tool failed","The list of every tool that is available to the agent"],"answer":[0,1],"explanation":"An agent can only recover well when the tool result tells it what happened. A retry-safety signal and a report of partial completion let the agent avoid duplicate writes and continue from the right place.","rationale":["Correct: telling the agent whether a retry is safe prevents it from repeating a non-idempotent write, such as updating the same record twice, after a failure.","Correct: reporting partial completion lets the agent continue with the records that were not processed instead of starting the batch again from the beginning.","Incorrect: a stack trace with internal host names adds noise to the context and can expose internal details. The agent needs a clear status, not raw diagnostics meant for engineers.","Incorrect: a generic failure message gives the agent nothing to reason about, so it cannot tell a transient error from a permanent one and may retry blindly or stop too early.","Incorrect: the agent already receives the tool definitions. Repeating the tool list in every result consumes context and does not help the agent recover from the specific failure."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/agentic-loops-in-practice"},{"id":"2.4.1-04","obj":"2.4.1","difficulty":"medium","type":"single","stem":"Contoso, Ltd. tests an agent that calls an external pricing tool. In some test runs the tool never responds, and the agent waits until the user cancels the conversation.\n\nWhat should you implement to handle this failure mode?","choices":["Set a timeout on each tool call and return the timeout to the model as a clear result.","Increase the maximum number of turns that the agent can take in one conversation.","Retry the tool call in a loop until the pricing tool returns a successful response.","Suppress tool errors so that the model receives an empty result when a call fails."],"answer":[0],"explanation":"A hanging tool is handled with a per-call timeout. Returning the timeout as a clear tool result lets the model explain the problem or choose another path instead of waiting forever.","rationale":["Correct: a timeout on each tool call stops the hang, and returning the failure as a clear result lets the model react, for example by telling the user that pricing is unavailable.","Incorrect: a larger turn budget lets a looping agent run longer. It does not stop a single tool call that never returns, so the conversation still hangs.","Incorrect: retrying without a limit turns a hang into an endless loop. Retries need a cap and a backoff, and they do not help when the first call never completes.","Incorrect: hiding errors leads the model to cover up the failure, for example by inventing a price. Failures must reach the model as clear, readable results."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.4.1-05","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Proseware, Inc. runs an MCP server that exposes a search_orders tool to an agent. The order API behind the tool rejects date ranges longer than 90 days and returns an error. The model must be able to read the failure and call the tool again with a shorter date range.\n\nHow should the server report this failure?","choices":["As a tool execution error inside the tool result that is returned to the model","As a protocol error in the JSON-RPC response that the client handles itself","By closing the connection so that the client restarts the MCP server process","As a successful result with empty content so that the model tries a new query"],"answer":[0],"explanation":"MCP separates protocol errors, such as an unknown tool or invalid arguments, from tool execution errors, such as an API failure. Execution errors are returned in the tool result with isError set to true, so the model can see what went wrong and try again.","rationale":["Correct: a tool execution error is returned in the tool result with isError set to true, so the model reads it and can shorten the date range on its next call. This is the path for API failures that the model can recover from.","Incorrect: protocol errors cover problems such as an unknown tool or invalid arguments, and the client handles them, so the model might never see the API message. This path would fit if the agent called a tool that the server does not expose.","Incorrect: dropping the connection turns one rejected request into an outage for every tool on the server, and the model still does not learn why the request failed. It would fit only if the server process itself were broken.","Incorrect: an empty success hides the failure. The model may conclude that no orders exist and give the user a wrong answer. An empty result is right only when the search succeeds and finds no orders."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.4.1-06","obj":"2.4.1","difficulty":"hard","type":"single","stem":"Relecloud tests an agent against a simulated outage of a dependent API. The agent keeps calling the same failing tool over and over, and each conversation consumes far more tokens than expected before the user gives up.\n\nWhat should you add to the agent to contain this failure mode?","choices":["A cap on the number of tool calls per turn that stops and tells the user when reached","A longer timeout for each call to the failing tool so that it has time to recover","A cache that stores the last successful tool result and returns it on every call","A larger context window so that the agent can keep the whole loop in its history"],"answer":[0],"explanation":"A looping agent needs a hard stop. Cap the number of tool calls per turn, and after a set number of failures, stop and tell the user instead of burning tokens on the same failing call.","rationale":["Correct: a cap on the number of tool calls per turn stops the loop. After a set number of failures, the agent stops and tells the user, which contains the token cost of a failing dependency.","Incorrect: a longer timeout makes each failing call take more time. The agent still loops, so the conversation becomes slower and more expensive, not shorter.","Incorrect: returning stale data on every call hides the outage and can give users wrong answers. It also does not stop the agent from repeating the call.","Incorrect: a larger context window lets the loop run even longer before anything stops it. The problem is the missing stop condition, not the size of the history."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.4.2-01","obj":"2.4.2","difficulty":"easy","type":"single","stem":"Northwind Traders wants to re-run a failed GitHub Actions workflow run on a pull request that Copilot cloud agent opened. The Re-run jobs option is not available because a maintainer disabled the workflow earlier in the week.\n\nWhat should you do first?","choices":["Enable the workflow again in the Actions tab of the repository.","Ask Copilot to push an empty commit to the pull request branch.","Run gh run rerun with the --debug option for the failed run.","Close the pull request and ask Copilot to open a new one."],"answer":[0],"explanation":"A run of a disabled workflow cannot be re-run. Enabling the workflow again makes the re-run options available for runs that are still inside the 30-day re-run window.","rationale":["Correct: GitHub does not allow re-running a workflow that is disabled. After you enable the workflow, you can re-run the failed run or its failed jobs.","Incorrect: a new commit would trigger fresh runs only if the workflow were enabled. Pushing commits does not lift the restriction on a disabled workflow.","Incorrect: the --debug option only adds debug logging to a re-run. The re-run itself is still blocked while the workflow is disabled.","Incorrect: recreating the pull request discards the review context and still does not run a disabled workflow. The workflow state is the blocking setting."],"ref":"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs"},{"id":"2.4.2-02","obj":"2.4.2","difficulty":"easy","type":"single","stem":"User1 has write access to a repository at Adventure Works. User1 mentions @copilot in a comment on an open pull request that Copilot created, but Copilot does not respond, and the comment appears to be stuck.\n\nWhat should User1 do to retry the request?","choices":["Add the same comment to the pull request again.","Unassign and reassign the original issue to Copilot.","Approve and run the pending workflows on the pull request.","Convert the draft pull request to Ready for review."],"answer":[0],"explanation":"For a stuck comment on a pull request, GitHub recommends simply posting the same comment again. Reassigning an issue is the retry path for a stuck issue assignment, not for a comment.","rationale":["Correct: when Copilot appears stuck on a comment, the troubleshooting guidance is to add the same comment again, which triggers Copilot to pick up the request.","Incorrect: unassigning and reassigning is the retry for a session that started from an issue assignment and got stuck. It would start new work rather than answer the comment.","Incorrect: approving workflows lets CI run on Copilot's commits. It has no effect on whether Copilot picks up a comment that mentions it.","Incorrect: marking the pull request ready for review changes its state for reviewers. Copilot responds to comments on open pull requests whether or not they are drafts."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"2.4.2-03","obj":"2.4.2","difficulty":"hard","type":"single","stem":"Woodgrove Bank builds an agent tool that calls a rate-limited internal API. The API returns HTTP 429 or 503 with a Retry-After header during peak hours. The agent must stay responsive, and the API must not be flooded.\n\nHow should you implement retries?","choices":["In the tool code, honor Retry-After and cap the number of attempts, then return a clear failure.","In the system prompt, tell the model to call the tool again whenever it receives an error.","In the tool code, retry immediately and without a limit until the API returns a success.","In the tool code, return a success with cached data whenever the API returns an error."],"answer":[0],"explanation":"Transient errors such as 429 and 503 are best retried in code, where you can respect Retry-After and cap attempts. If the retries are exhausted, the model gets a clear failure it can explain.","rationale":["Correct: retrying 429 and 503 in the tool code while honoring Retry-After and a capped number of attempts protects the API, and a clear failure after the cap keeps the agent responsive.","Incorrect: leaving retries to the model is unpredictable and costs a turn for each attempt. The model also cannot reliably wait for the interval in the Retry-After header.","Incorrect: immediate, unlimited retries flood an API that is already rate limiting you and can make the agent hang. Retries need a delay and a cap.","Incorrect: returning cached data as a success hides the failure from the model, which may present stale values as current. Failures must be reported as failures."],"ref":"https://learn.microsoft.com/microsoft-cloud/dev/dev-proxy/concepts/test-ai-agent-tool-failures"},{"id":"2.4.2-04","obj":"2.4.2","difficulty":"medium","type":"dropdown","stem":"Fabrikam, Inc. has a workflow run with the ID 4321 on a Copilot pull request. Two jobs failed because of a transient network error. You must re-run only the failed jobs and then follow the progress of the run in the terminal.\n\nHow should you complete the commands? To answer, select the appropriate options in the answer area.\n\n```shell\ngh run rerun 4321 [[1]]\ngh run [[2]]\n```","targets":[{"label":"Box 1","options":["--failed","--debug","--job"],"why":["Correct: the --failed option re-runs only the failed jobs of the run, plus any jobs that depend on them. Jobs that succeeded keep their earlier results.","Incorrect: --debug enables debug logging for the re-run. Without --failed, the command re-runs every job in the run, not only the failed ones.","Incorrect: --job expects a job ID, not a run ID, and re-runs one specific job. It is the option for re-running a single job rather than all failed jobs."]},{"label":"Box 2","options":["watch","list","view"],"why":["Correct: gh run watch follows a run in progress and updates the terminal until the run completes, which is what you need after starting the re-run.","Incorrect: gh run list prints recent runs once and exits. It shows the status at that moment but does not follow the re-run as it progresses.","Incorrect: gh run view shows a summary of a run at that moment and exits. Use it to inspect a run, and use watch to follow one that is still in progress."]}],"answer":[0,0],"explanation":"gh run rerun with --failed re-runs only the failed jobs and their dependent jobs. gh run watch then follows the run until it finishes.","ref":"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs"},{"id":"2.4.2-05","obj":"2.4.2","difficulty":"hard","type":"order","stem":"Tailspin Toys requires approval before workflows run on pull requests from Copilot cloud agent. Copilot opened a pull request that also changes a workflow file. After the checks start, one job fails because of a transient error. You must run the checks safely and retry only what failed.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Review the changes to the files in the .github/workflows folder of the pull request.","Select Approve and run workflows on the pull request.","Run gh run rerun RUN_ID --failed for the run that contains the failed job.","Run gh run watch to follow the re-run until it completes.","Mark the draft pull request as Ready for review to trigger the workflows.","Unassign and reassign the issue to Copilot to restart the workflows."],"answer":[0,1,2,3],"explanation":"Workflows on Copilot pull requests wait for approval, so you first inspect workflow changes and then approve the run. After the transient failure, you re-run only the failed jobs and follow the re-run.","rationale":["Step 1: GitHub advises inspecting changes to files in the .github/workflows folder before you approve workflow runs on a Copilot pull request, because a changed workflow decides what runs in CI.","Step 2: by default, workflows do not run automatically for Copilot pull requests. Approve and run workflows starts the checks after your review.","Step 3: the --failed option re-runs only the failed jobs and the jobs that depend on them, which is the right scope for a transient error.","Step 4: gh run watch follows the re-run in the terminal so that you can confirm that the transient error does not recur.","Incorrect: Copilot cannot mark its pull request as ready, but you can. Doing so changes the review state; it does not approve the pending workflow runs.","Incorrect: reassigning the issue starts a new Copilot session and new work. It is the retry for a stuck session, not for a failed CI job."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"2.4.2-06","obj":"2.4.2","difficulty":"medium","type":"order","stem":"Contoso, Ltd. assigned an issue to Copilot cloud agent two hours ago. Copilot opened a draft pull request, but the session shows no progress and no new commits. You must confirm the problem and retry the work.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Select View session on the Copilot started work event to open the session log.","Confirm in the session log that the session stopped making progress and timed out.","Unassign Copilot from the issue.","Assign the issue to Copilot again.","Add a comment to the issue that asks Copilot to continue the work.","Re-run the failed jobs of the workflow from the Actions tab."],"answer":[0,1,2,3],"explanation":"First you open the session log from the pull request timeline to see what happened. A stuck session times out after one hour, and the documented retry is to unassign and then reassign the issue.","rationale":["Step 1: the Copilot started work event on the pull request has a View session button that opens the live session log, which is where you check what the agent did.","Step 2: a session on GitHub Actions that gets stuck times out after one hour. Confirming this in the log tells you that a retry is needed, not a code fix.","Step 3: to retry a stuck session, GitHub documents unassigning the issue from Copilot first.","Step 4: assigning the issue to Copilot again starts a new session that picks up the work.","Incorrect: Copilot does not see comments that are added to an issue after it was assigned, so a new issue comment does not restart the work.","Incorrect: re-running workflow jobs repeats CI checks. It does not restart the agent session that is responsible for the work."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"2.4.3-01","obj":"2.4.3","difficulty":"easy","type":"single","stem":"Adventure Works merged a pull request that Copilot cloud agent created. The change introduced a regression in production. You have write permissions to the repository and must undo the merged change by using GitHub.\n\nWhat should you do?","choices":["Select Revert on the merged pull request, and then merge the new pull request.","Delete the copilot branch that the pull request was created from.","Select Stop session on the Copilot session that created the change.","Re-run the workflow jobs that ran on the merge commit of the change."],"answer":[0],"explanation":"Reverting a merged pull request on GitHub creates a new pull request that reverts the merge commit. Merging that pull request rolls the change back while keeping a reviewable history.","rationale":["Correct: the Revert button on a merged pull request creates a new pull request that reverts the original merge commit, and merging it removes the change through the normal review path.","Incorrect: deleting the source branch after a merge does not change the default branch. The merged commits stay in place, so the regression remains.","Incorrect: Stop session ends a running agent session. The pull request is already merged, so stopping a session cannot remove changes from the default branch.","Incorrect: re-running workflows repeats the checks on the same commit. It produces new results but does not remove the change that caused the regression."],"ref":"https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/reverting-a-pull-request"},{"id":"2.4.3-02","obj":"2.4.3","difficulty":"medium","type":"single","stem":"Proseware, Inc. must roll back a change that Copilot pushed. The change reached the default branch through a pull request that was merged outside GitHub, and the Revert option on GitHub cannot be used for it.\n\nWhat should you do to roll back the change?","choices":["Revert the individual commits by using git revert, and then open a pull request.","Select Stop session on the Copilot session to discard the commits it pushed.","Ask Copilot to forget the change by deleting its repository-level facts.","Re-run the workflow for the merge commit with debug logging enabled."],"answer":[0],"explanation":"When reverting a pull request on GitHub is not possible, for example because the pull request was not merged on GitHub or the revert causes conflicts, you revert the individual commits with git revert.","rationale":["Correct: GitHub documents that you may need to revert individual commits when the original pull request was not merged on GitHub or when reverting it causes merge conflicts. git revert creates new commits that undo the change.","Incorrect: Stop session ends a running session and preserves the commits that were already pushed. It never removes commits, especially ones that are already merged.","Incorrect: repository-level facts are memories that guide future work. Deleting them has no effect on code that is already in the default branch.","Incorrect: a re-run with debug logging repeats checks on the same commit to give more diagnostics. It does not change the code on the default branch."],"ref":"https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/reverting-a-pull-request"},{"id":"2.4.3-03","obj":"2.4.3","difficulty":"easy","type":"single","stem":"User1 at Litware, Inc. watches a Copilot cloud agent session and sees that Copilot is rewriting a module that is out of scope. Copilot already pushed three commits to the pull request branch. User1 selects Stop session.\n\nWhat should User1 expect after the session stops?","choices":["The run ends, and the three commits remain on the pull request branch.","The run ends, and the three commits are removed from the pull request branch.","The run pauses, and Copilot continues automatically when User1 reopens it.","The run ends, and the pull request is closed together with its branch."],"answer":[0],"explanation":"Stopping a session ends the GitHub Actions run but preserves the commits that were already pushed. Rolling back those commits is a separate step, for example by pushing a revert or asking Copilot for a fix.","rationale":["Correct: Stop session ends the underlying GitHub Actions run, and the commits that Copilot already pushed stay on the branch, so you can review or revert them yourself.","Incorrect: stopping a session does not rewrite branch history. Any commits that you want to undo must be reverted or replaced with new commits.","Incorrect: Stop session ends the session rather than pausing it. Further work requires a new request, such as an @copilot comment on the pull request.","Incorrect: the pull request and its branch stay open after a stopped session. You can archive the stopped session, but the pull request is not closed for you."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"2.4.3-04","obj":"2.4.3","difficulty":"medium","type":"single","stem":"User2 at Fabrikam, Inc. works in Copilot CLI in a folder that is not a Git repository. Copilot edited several files during the last two turns, and the result is wrong. User2 must restore the files and the conversation to the state before those turns.\n\nWhat should User2 do?","choices":["Run /undo and select Conversation + files for the earlier turn.","Run /undo and select Conversation only for the earlier turn.","Run /compact so that the last two turns are summarized away.","Run /clear so that the session starts with an empty conversation."],"answer":[0],"explanation":"The rewind picker opened by /undo or /rewind can roll back both the conversation and the files that Copilot changed. File changes are tracked per turn, so Git is not required.","rationale":["Correct: Conversation + files rolls the session back to the chosen turn and restores the files that Copilot changed in that turn and in later discarded turns. It works without Git because changes are tracked per turn.","Incorrect: Conversation only rolls back the conversation and leaves the files as they are, so the wrong edits remain on disk.","Incorrect: /compact summarizes the history to save context. It changes no files, and the summary still includes what Copilot did in those turns.","Incorrect: /clear starts a new conversation. The edited files keep their wrong content, and the context of the earlier work is lost as well."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"2.4.3-05","obj":"2.4.3","difficulty":"hard","type":"single","stem":"In Copilot CLI, Copilot changed File1 and File2 during a turn. After that turn, User3 manually edited File2. User3 then opens the rewind picker, selects the turn, and chooses Conversation + files.\n\nWhat should User3 expect?","choices":["File1 returns to its earlier content, and File2 keeps the edits by User3.","File1 and File2 both return to the content they had before the turn.","File1 and File2 both keep their current content, and only the chat changes.","The rewind is blocked until User3 commits the manual edit to File2."],"answer":[0],"explanation":"Conversation + files restores the files that Copilot changed to their pre-change contents, but it skips files that you edited yourself afterwards. A rewind also removes the later turns permanently.","rationale":["Correct: the rewind restores files that Copilot changed but skips any that you have since edited yourself, so File1 is restored and File2 keeps the manual edits by User3.","Incorrect: files that the user edited after Copilot changed them are skipped, so File2 is not overwritten. Only File1 is restored.","Incorrect: that describes the Conversation only option. Conversation + files does restore the files that Copilot changed and that nobody edited later.","Incorrect: file changes are tracked per turn, and Git is not required. The picker does not wait for a commit before it can roll back."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"2.4.3-06","obj":"2.4.3","difficulty":"hard","type":"order","stem":"User1 at Relecloud is in a Copilot CLI session in which the last three turns produced changes that User1 wants to discard. User1 must first see what changed, must keep a copy of the current session in case the changes are needed later, and must then roll back both the conversation and the files.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run /diff to review the changes that Copilot made.","Run /fork to keep a copy of the current session.","Run /undo to open the rewind picker.","Select the earlier turn, and then select Conversation + files.","Run /compact to remove the last three turns from the context.","Run /clear to start a new conversation without the changes."],"answer":[0,1,2,3],"explanation":"Review first, then fork, because a rewind cannot be undone and removes the later turns. After the fork, /undo opens the picker, where Conversation + files restores the files that Copilot changed.","rationale":["Step 1: /diff opens the diff view of the changes, so User1 can confirm exactly what will be discarded before rolling anything back.","Step 2: a rewind cannot be undone because later turns are removed from the session. /fork first keeps a copy that User1 can return to.","Step 3: /undo, also available as /rewind, opens the rewind picker that lists earlier user turns.","Step 4: choosing the turn and Conversation + files rolls back the conversation and restores the files that Copilot changed in that turn and in later turns.","Incorrect: /compact summarizes the conversation to free context. It keeps a summary of the turns and changes no files on disk.","Incorrect: /clear starts a new conversation and leaves the changed files as they are, so the unwanted changes remain."],"ref":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"2.4.4-01","obj":"2.4.4","difficulty":"easy","type":"single","stem":"Contoso, Ltd. requires one approving review on the main branch. User1 assigned an issue to Copilot cloud agent, and Copilot opened a pull request. User1 reviewed the changes and wants the pull request merged.\n\nWhich person should approve the pull request?","choices":["Another developer who has write access to the repository","User1, because User1 reviewed all the changes from Copilot","Copilot cloud agent, after it marks the pull request as ready","Copilot code review, after it leaves review comments on the pull request"],"answer":[0],"explanation":"The developer who asked Copilot to create a pull request cannot approve it, so another person must review and approve. This keeps an independent human in the loop for agent work.","rationale":["Correct: the requester cannot approve a pull request that Copilot created for them, so an independent reviewer with write access provides the required approval.","Incorrect: User1 requested the work. The approval of the requester does not count toward the required approvals for a Copilot pull request.","Incorrect: Copilot cannot mark its own pull request as ready for review, and it cannot approve or merge pull requests.","Incorrect: Copilot code review leaves comments to help reviewers. It is not a human approval and does not satisfy a rule that requires an approving review."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"2.4.4-02","obj":"2.4.4","difficulty":"easy","type":"single","stem":"A pull request from Copilot cloud agent at Northwind Traders shows that its workflows are waiting and have not run. The repository uses the default settings for Copilot cloud agent.\n\nWhat should a reviewer do before the workflows run?","choices":["Inspect the changes to workflow files, and then select Approve and run workflows.","Ask Copilot in a comment to approve and run the workflows for the pull request.","Re-run the most recent workflow run for the default branch from the Actions tab.","Wait for the workflows to start automatically after Copilot finishes the session."],"answer":[0],"explanation":"By default, GitHub Actions workflows do not run automatically on Copilot pull requests. A human reviews the changes, especially to .github/workflows, and then approves the runs.","rationale":["Correct: the documented step is to check the pull request for changes to workflow files and then select Approve and run workflows, which escalates the decision to a human.","Incorrect: Copilot cannot approve its own workflow runs. The approval is a deliberate human checkpoint before code from the agent runs in CI.","Incorrect: re-running a run on the default branch tests different code. The pending runs for the pull request still wait for approval.","Incorrect: with the default setting, the workflows wait for approval and do not start on their own when the session ends."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"2.4.4-03","obj":"2.4.4","difficulty":"hard","type":"single","stem":"User2 at Woodgrove Bank starts Autopilot mode in Copilot CLI and selects Use Manual Approval for this session when prompted. During the task, Copilot needs a shell command that requires approval.\n\nWhat should User2 expect?","choices":["Copilot automatically denies the tool request, which can prevent the task from finishing.","Copilot pauses the task and waits for User2 to approve the request in the terminal.","Copilot runs the command, because Autopilot mode grants all permissions automatically.","Copilot switches the session from Autopilot mode back to Interactive mode for approval."],"answer":[0],"explanation":"With manual approval in Autopilot mode, Copilot automatically denies tool requests that need approval. Granting all permissions with /allow-all is a separate, deliberate choice.","rationale":["Correct: when manual approval is chosen, Copilot automatically denies any tool request that requires approval, which may stop it from completing parts of the task.","Incorrect: Autopilot mode does not wait for input after each step. Requests that need approval are denied rather than held for a decision.","Incorrect: Autopilot mode controls continuation, not approvals. Approvals are granted only by enabling all permissions, for example with /allow-all.","Incorrect: the mode stays Autopilot until the user changes it with Shift+Tab. A denied tool request does not switch the mode."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/use-autopilot-mode"},{"id":"2.4.4-04","obj":"2.4.4","difficulty":"hard","type":"single","stem":"Tailspin Toys has a public repository. An external contributor who has read access comments @copilot on a pull request that Copilot created and asks for a change. Copilot does not act on the comment. The change is valid.\n\nWhat should happen next for the change to be made?","choices":["A maintainer who has write access asks Copilot for the change in a new comment.","The contributor mentions @copilot again in a second co
