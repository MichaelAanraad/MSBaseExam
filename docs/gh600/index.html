,"Incorrect: without this option, a ReleaseTeam member who starts a deployment could approve it alone, which breaks the separation the requirements ask for."]},{"label":"Location of the deployment credential","options":["Environment secret of production","Repository secret of LabPortal","Agents secret of LabPortal"],"why":["Correct: environment secrets become available to a job only after the required reviewers approve it, so no workflow can use the credential to deploy without approval.","Incorrect: a repository secret is available to any workflow job in LabPortal, including jobs that do not reference the environment, so the credential could be used to deploy without approval.","Incorrect: Agents secrets are exposed to Copilot sessions, which would give the agent a production credential. Keep deployment secrets out of the agent's secret boundary."]}],"answer":[0,0,0],"explanation":"Required reviewers from ReleaseTeam with Prevent self-reviews give an independent approval for each deployment. Moving the credential to an environment secret ensures that only approved jobs can use it.","ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.4-02","obj":"6.2.4","difficulty":"medium","type":"single","series":"S-g","stem":"Repo1 has a workflow named deploy.yml that deploys main to production. The deploy job references an environment named production. Developers merge pull requests that Copilot cloud agent creates, and any developer can start deploy.yml.\n\nYou must ensure that every production deployment waits for approval from a member of Team1 and that the person who starts a deployment cannot approve it.\n\nSolution: You add Team1 as required reviewers of the production environment and select Prevent self-reviews.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"Required reviewers pause every job that references the environment until a reviewer approves. Prevent self-reviews stops the user who started the deployment from approving it.","rationale":["Correct: the deploy job references production, so every run waits for a member of Team1, and Prevent self-reviews blocks the person who started the deployment from approving it.","Incorrect: the solution does meet the goal. No would be right if the deploy job did not reference the environment, because protection rules apply only to jobs that use it."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.4-03","obj":"6.2.4","difficulty":"easy","type":"single","series":"S-g","stem":"Repo1 has a workflow named deploy.yml that deploys main to production. The deploy job references an environment named production. Developers merge pull requests that Copilot cloud agent creates, and any developer can start deploy.yml.\n\nYou must ensure that every production deployment waits for approval from a member of Team1 and that the person who starts a deployment cannot approve it.\n\nSolution: You add a custom instruction that tells Copilot cloud agent not to deploy to production without approval.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Developers, not Copilot, start deploy.yml, and an instruction is only guidance for the model. Nothing in the solution makes a deployment wait for Team1.","rationale":["Incorrect: an instruction cannot pause a workflow that a developer starts, and the model can misread guidance. The deployment would still run without approval from Team1.","Correct: the solution does not meet the goal. Instructions are useful for conventions, but enforcing approval needs a gate such as environment required reviewers."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.4-04","obj":"6.2.4","difficulty":"hard","type":"single","series":"S-g","stem":"Repo1 has a workflow named deploy.yml that deploys main to production. The deploy job references an environment named production. Developers merge pull requests that Copilot cloud agent creates, and any developer can start deploy.yml.\n\nYou must ensure that every production deployment waits for approval from a member of Team1 and that the person who starts a deployment cannot approve it.\n\nSolution: You add a CODEOWNERS entry that assigns .github/workflows/deploy.yml to Team1 and require review from code owners on main.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"A code owner review applies when a pull request changes deploy.yml, not when the workflow runs. Deployments of unchanged workflow files would still start without approval.","rationale":["Incorrect: CODEOWNERS gates changes to the workflow file at merge time. Each later run of deploy.yml still deploys immediately, so deployments do not wait for Team1.","Correct: the solution does not meet the goal. The CODEOWNERS entry is still useful to protect the workflow definition, but the per-deployment approval needs environment required reviewers."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.4-05","obj":"6.2.4","difficulty":"easy","type":"order","stem":"Repo1 has a job named deploy in the deploy.yml workflow that deploys to production with a credential. The job must wait for approval from Team1, and the credential must be available only to jobs that are approved for production. You must then confirm that the gate works. The workflow file must not reference the production environment until the credential is stored in it.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In Settings > Environments of Repo1, create an environment named production with Team1 as required reviewers.","Add the deployment credential as an environment secret of the production environment.","Add environment: production to the deploy job, and reference the secret in its steps.","Run deploy.yml, and have a member of Team1 approve the pending deployment.","Add the deployment credential as a repository secret of Repo1.","Assign deploy.yml to Team1 in the CODEOWNERS file of Repo1."],"answer":[0,1,2,3],"explanation":"The environment and its protection rule must exist before you can add environment secrets to it. The job then references the environment and secret, and a test run shows the pending approval.","rationale":["Step 1: the environment holds both the protection rule and the secret, so it must exist first. Required reviewers make jobs that reference it wait for Team1.","Step 2: environment secrets are available to a job only after the required reviewers approve it, which keeps the credential out of unapproved jobs.","Step 3: protection rules apply only to jobs that reference the environment, so the deploy job must name production before the gate takes effect.","Step 4: a test run confirms that the job pauses until a Team1 member approves, and that the secret is used only after approval.","Incorrect: a repository secret is available to every job in the repository, so an unapproved job could use the credential. Use repository secrets for values that every workflow may use.","Incorrect: CODEOWNERS gates changes to the workflow file in pull requests. It does not pause each deployment, so it does not create the approval gate."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.4-06","obj":"6.2.4","difficulty":"easy","type":"single","stem":"User1 assigns an issue in Repo1 to Copilot cloud agent, and Copilot opens a pull request for the work. The main branch requires one approval before merging. User1 and User2 both have write access to Repo1.\n\nWhich user should provide the required approval?","choices":["User2, as a reviewer who did not request the work","User1, as the user who asked Copilot for the work","Copilot, after all checks on the pull request pass","Any user who has read access to the repository"],"answer":[0],"explanation":"When approvals are required, the approval of the user who asked Copilot to create the pull request does not count. Another reviewer must approve, which keeps an independent person in the path to main.","rationale":["Correct: User2 did not request the work, so User2's approval counts toward the required approval and adds an independent review of the agent's changes.","Incorrect: the requester cannot approve the pull request that Copilot created for them, so User1's approval does not satisfy the requirement. User1 reviews and iterates with Copilot instead.","Incorrect: Copilot cloud agent cannot approve or merge pull requests. Approval stays a human decision, together with the required checks.","Incorrect: users with read access can comment, but their reviews do not count toward required approvals. Required approvals come from users with write access."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"6.2.4-07","obj":"6.2.4","difficulty":"medium","type":"single","stem":"A ruleset for main in Repo1 requires one approval before merging. The rule options for Copilot use their default values. A shared automation creates a pull request that is attributed to Copilot and not to any user.\n\nHow many approvals should the pull request get before it can be merged?","choices":["Two approvals","One approval","No approvals","Three approvals"],"answer":[0],"explanation":"The option to require an additional approval for unattributed Copilot pull requests is on by default. When a ruleset requires one approval, an unattributed Copilot pull request needs two.","rationale":["Correct: the additional approval option is enabled by default, so a pull request that Copilot opens under its own identity needs one approval more than the ruleset requires.","Incorrect: one approval is enough for pull requests that are attributed to a user. Unattributed Copilot pull requests get an extra approval unless an admin turns the option off.","Incorrect: no approvals would apply only if the ruleset required none. The extra approval has no effect when zero approvals are required, but here one is required.","Incorrect: the option adds one approval, not two. Three approvals would apply only if the ruleset itself required two approvals."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"6.2.4-08","obj":"6.2.4","difficulty":"hard","type":"single","stem":"In Repo1, User2 approves a pull request from Copilot cloud agent. User3, who has write access but did not open the pull request, then pushes another commit to the pull request branch and approves the pull request. Commits pushed after a review must be approved by someone other than the person who pushed them.\n\nWhich pull request option should you enable in the ruleset for main?","choices":["Require approval of the most recent reviewable push","Dismiss stale pull request approvals on new commits","Require conversation resolution before merging","Require review from Code Owners for every change"],"answer":[0],"explanation":"Requiring approval of the most recent reviewable push means the last push must be approved by someone other than the person who pushed it. Dismissing stale approvals alone would still let User3 approve the latest commit.","rationale":["Correct: this option requires that the most recent reviewable push is approved by someone other than the user who pushed it, so User3 cannot approve the commit that User3 pushed.","Incorrect: dismissing stale approvals removes User2's approval after the new push, but User3, who is not the author, could then approve the commit. Use it to force a fresh review after changes.","Incorrect: conversation resolution blocks merging while review comments are open. It does not control who approves the latest push.","Incorrect: code owner review requires an owner of the changed files to approve. If User3 is a code owner, User3 could still approve their own push."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"6.2.4-09","obj":"6.2.4","difficulty":"hard","type":"single","stem":"The production environment of Repo1 requires approval from Team1. A repository administrator deployed to production without an approval by bypassing the protection rules. A compliance rule states that nobody may skip the approval.\n\nWhat should you configure?","choices":["Disallow administrators from bypassing the environment protection rules","Add the repository administrators to the required reviewers of production","Add a wait timer of 60 minutes to the production environment rules","Limit the deployment branches of production to protected branches"],"answer":[0],"explanation":"By default, administrators can bypass environment protection rules. Disallowing the bypass makes the required reviewers apply to everyone.","rationale":["Correct: administrators can bypass environment protection rules by default, and you can turn that off so the approval from Team1 is enforced for administrators too.","Incorrect: adding administrators as reviewers lets them approve deployments, which widens who can pass the gate. It does not stop them from bypassing it.","Incorrect: a wait timer delays a deployment for a set time, but an administrator could still bypass the rules. Use a wait timer for a cooling-off period, not to block bypass.","Incorrect: deployment branch limits control which branches can deploy. They do not change whether administrators can bypass the required reviewers."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"6.2.5-01","obj":"6.2.5","difficulty":"medium","type":"yesno","case":"C-g","stem":"You review options to meet the LabDocs business requirement and the technical requirements.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Workflows on Copilot pull requests in LabDocs wait for a manual approval because of a default Copilot cloud agent setting.","Disabling Require approval for workflow runs in LabDocs removes an approval that does not materially reduce risk for that repository.","Disabling Require approval for workflow runs in LabPortal as well meets the technical requirements.","Turning off the validation tools of Copilot cloud agent in LabPortal is an acceptable way to speed up Copilot."],"answer":[0,1],"explanation":"Require approval for workflow runs is on by default, which explains the delay in LabDocs. LabDocs has no secrets or deployment credentials, so the approval adds little protection there, but LabPortal controls and validation must stay in place.","rationale":["Yes: by default, workflows on Copilot pull requests do not run until a user with write access approves them, so the LabDocs site build waits for a person.","Yes: the risk the setting addresses is unreviewed code reaching secrets or write access. LabDocs has no secrets or credentials and only builds a static site, so the approval adds delay without reducing risk.","No: the technical requirements say every control that protects LabPortal must remain. LabPortal has deployment credentials, so its workflow approval still reduces real risk.","No: the technical requirements keep the built-in security validation enabled for LabPortal. Disabling validation tools fits only when another product already performs the same checks."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"6.2.5-02","obj":"6.2.5","difficulty":"medium","type":"dropdown","stem":"Alpine Ski House uses Copilot cloud agent in two repositories. Repo1 contains documentation only, has no secrets, and runs a static site build on pull requests. Repo2 contains the payment service and its workflows use deployment secrets. Copilot pull requests in both repositories wait for workflow approval, and Copilot often installs packages from npm. The company wants to remove approvals and manual work that do not materially reduce risk.\n\nHow should you configure the settings? To answer, select the appropriate options in the answer area.\n\nRepo1, Require approval for workflow runs: [[1]]\nRepo2, Require approval for workflow runs: [[2]]\nOrganization firewall, Recommended allowlist: [[3]]","targets":[{"label":"Repo1, Require approval for workflow runs","options":["Enabled","Disabled"],"why":["Incorrect: keeping the approval in Repo1 makes every Copilot pull request wait for a person, but the workflow has no secrets or write access to protect, so the wait buys no risk reduction.","Correct: the setting protects against unreviewed code gaining write access or reaching secrets. Repo1 has neither, so disabling it lets the site build run automatically."]},{"label":"Repo2, Require approval for workflow runs","options":["Enabled","Disabled"],"why":["Correct: Repo2 workflows use deployment secrets, so a person must review agent changes before workflows run. Here the approval materially reduces risk.","Incorrect: disabling the approval in Repo2 would let unreviewed agent code run in workflows that can reach deployment secrets, which is the risk the setting exists to prevent."]},{"label":"Organization firewall, Recommended allowlist","options":["Enabled","Disabled"],"why":["Correct: setting the recommended allowlist to Enabled at organization level enforces it for all repositories. It covers common package registries such as npm, so Copilot can install packages without manual allowlist work.","Incorrect: disabling it at organization level would block common registries for every repository, so admins would have to add each host by hand. Disable it only when policy requires a fully custom allowlist."]}],"answer":[1,0,0],"explanation":"Remove the workflow approval only where it protects nothing, as in the documentation repository, and keep it where workflows reach secrets. The recommended allowlist removes manual allowlist work for common registries without turning off the firewall.","ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"},{"id":"6.2.5-03","obj":"6.2.5","difficulty":"easy","type":"single","stem":"User1 asks Copilot cloud agent to fix a typo in an error message in Repo1 and to update the matching unit test. The team uses plan-first pull requests for infrastructure and workflow changes, and required checks and reviews apply to every pull request.\n\nWhich approach should User1 use?","choices":["Let Copilot plan and implement in one pull request with the usual checks","Open a plan-first pull request and approve the plan before implementation","Ask the security team to approve the change before Copilot starts the work","Ask a release manager to approve the work in a deployment environment first"],"answer":[0],"explanation":"Low-risk changes can combine planning and execution in one pull request when speed matters, as long as checks and reviews stay required. Plan-first pull requests are for high-risk or hard-to-reverse work.","rationale":["Correct: a typo fix with a test update is low risk, so a single pull request with the required checks and review keeps the work fast without losing control.","Incorrect: a separate plan approval adds a round trip without reducing risk for a typo. Use plan-first pull requests for infrastructure, workflow, authentication, or production changes.","Incorrect: a security approval before work starts adds delay for a change that does not touch security-sensitive code. Reserve security review for paths such as authentication.","Incorrect: deployment environment approvals gate deployments, not code changes. Adding one here would slow the work without addressing any risk of the change."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/4-plan-reason-execution"},{"id":"6.2.5-04","obj":"6.2.5","difficulty":"easy","type":"single","stem":"Copilot cloud agent in Repo1 often installs packages from npm and PyPI. An administrator proposes to disable the recommended allowlist and to add each package registry host to a custom allowlist by hand. The company wants to keep the firewall and avoid unnecessary manual work.\n\nWhat should you do?","choices":["Keep the recommended allowlist of the firewall enabled","Disable the firewall for the Repo1 repository entirely","Add each registry host to the custom allowlist by hand","Move Copilot sessions to a runner without the firewall"],"answer":[0],"explanation":"The recommended allowlist is enabled by default and already allows common package registries. Keeping it avoids manual allowlist work while the firewall stays on.","rationale":["Correct: the recommended allowlist covers common language package registries, container registries, and OS package repositories, and it is enabled by default with the firewall.","Incorrect: disabling the firewall removes the network restriction entirely, which trades security for convenience. The requirement is to keep the firewall.","Incorrect: adding each host by hand is the manual work the company wants to avoid. Use the custom allowlist for hosts that the recommended allowlist does not cover.","Incorrect: avoiding the firewall removes a control instead of reducing manual work. The recommended allowlist already solves the problem with the firewall in place."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"6.2.5-05","obj":"6.2.5","difficulty":"medium","type":"single","stem":"Woodgrove Bank requires a human approval for every tool call that its internal agents make, including file reads. Reviewers now approve hundreds of requests each day without reading them, and agent work is slow.\n\nWhich change should Woodgrove Bank make?","choices":["Require approval only for actions where human judgment changes the risk","Add a second reviewer to every tool call approval that the agents request","Remove all human approvals and rely on audit logs to find problems later","Group all requests so that reviewers approve them once at the end of the day"],"answer":[0],"explanation":"Human-in-the-loop review should be reserved for decisions where judgment meaningfully changes risk. Approving everything turns reviewers into a bottleneck who rubber-stamp requests, which slows work and adds little protection.","rationale":["Correct: reserving approvals for high-impact actions removes low-value approvals, restores velocity, and lets reviewers focus on the decisions where their judgment matters.","Incorrect: a second reviewer doubles the bottleneck without fixing rubber-stamping. Two-person approval fits a few high-impact actions, not every file read.","Incorrect: removing all approvals drops the gate for high-impact actions too. Audit logs record what happened but do not prevent a harmful action.","Incorrect: a daily batch makes agents wait even longer and still asks reviewers to approve low-risk actions in bulk without reading them."],"ref":"https://learn.microsoft.com/startups/build/enterprise-readiness/ai-guardrails/safety-to-controllability-enterprise-ai"},{"id":"6.2.5-06","obj":"6.2.5","difficulty":"hard","type":"single","stem":"Contoso, Ltd. configures the Copilot cloud agent firewall at the organization level. Enable firewall is set to Enabled, the recommended allowlist is Enabled, and an organization custom allowlist contains approved company hosts. Allow repository custom rules is set to Disabled. Teams wait days for organization owners to add hosts that a single repository needs. Repository admins must be able to add hosts for their own repositories, and the organization entries must stay in effect.\n\nWhich setting should the organization owner change?","choices":["Set Allow repository custom rules to Enabled","Set Enable firewall to Let repositories decide","Set Recommended allowlist to Disabled","Move the organization allowlist into each repository"],"answer":[0],"explanation":"Allowing repository custom rules lets repository admins add their own entries, which combine with the organization custom allowlist. Repositories cannot delete organization entries, so the central control stays in place.","rationale":["Correct: with repository custom rules allowed, repository admins add hosts themselves, and those rules combine with the organization custom allowlist, which repositories cannot delete.","Incorrect: Let repositories decide allows a repository to turn the firewall off entirely. That removes a control instead of letting admins add specific hosts.","Incorrect: disabling the recommended allowlist blocks common package registries, which creates more manual work. It does not let repository admins add hosts.","Incorrect: copying the entries into each repository spreads the central list across many places that each admin can change, and it does not give admins permission to add hosts."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"6.2.5-07","obj":"6.2.5","difficulty":"hard","type":"single","stem":"A ruleset for main in Repo1 requires an approval from SecTeam on every pull request. Most pull requests from Copilot cloud agent change only docs/ and tests/, and SecTeam has become a bottleneck. SecTeam must still approve every change in src/auth/.\n\nWhat should you configure in the ruleset?","choices":["A Required reviewers rule for SecTeam with the src/auth/** file pattern","A bypass list entry for SecTeam so that it skips reviews it does not need","Zero required approvals for the ruleset that targets the main branch","Required status checks that replace the SecTeam approval in the ruleset"],"answer":[0],"explanation":"The Required reviewers option assigns teams to file patterns, so SecTeam approval is required only when matching files change. Pull requests that touch only docs/ and tests/ no longer wait for SecTeam.","rationale":["Correct: required reviewers can be set per team and file pattern, so SecTeam approval applies to src/auth/ changes and not to documentation or test changes.","Incorrect: a bypass list lets the listed actors skip the rules. It does not remove the SecTeam approval from other pull requests, so the bottleneck stays.","Incorrect: zero required approvals removes the approval gate for src/auth/ as well, which breaks the requirement that SecTeam approves authentication changes.","Incorrect: status checks are automated, so replacing the approval removes the human decision for src/auth/. Use status checks next to targeted reviews, not instead of them."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"6.2.5-08","obj":"6.2.5","difficulty":"hard","type":"single","stem":"A ruleset for main in Repo1 requires zero approvals and requires status checks to pass. The option to require an additional approval for unattributed Copilot pull requests is enabled. A manager proposes turning the option off so that pull requests from shared automations merge faster.\n\nWhat should you do?","choices":["Keep the option, because it adds no approval when none are required","Turn the option off to remove the extra approval from Copilot pull requests","Add the Copilot app to the bypass list of the ruleset for main","Set required approvals to one so that the option stops applying"],"answer":[0],"explanation":"The additional approval for unattributed Copilot pull requests has no effect when the ruleset requires zero approvals. Turning it off gains no speed and removes protection if approvals are added later.","rationale":["Correct: the option adds an approval only when at least one approval is already required. With zero required approvals, it causes no delay, and it protects the branch if approvals are added later.","Incorrect: turning the option off changes nothing for speed in this ruleset, and it removes the extra review for unattributed Copilot pull requests if approvals are required later.","Incorrect: the bypass list lets the listed actors skip the rules, including the required status checks. Granting that to the agent removes controls instead of avoiding a needless approval.","Incorrect: one required approval makes the option apply, so unattributed Copilot pull requests would need two approvals. This adds delay instead of removing it."],"ref":"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"},{"id":"6.2.5-09","obj":"6.2.5","difficulty":"easy","type":"yesno","stem":"A repository admin reviews the Copilot cloud agent settings of Repo1 to make the agent faster without adding unneeded approvals.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["If the admin disables Require approval for workflow runs, workflows on Copilot pull requests run without a manual approval.","Disabling a tool in the Validation tools section can help Copilot cloud agent finish its work faster.","An administrator must enable the recommended allowlist before Copilot cloud agent can install packages from common package registries."],"answer":[0,1],"explanation":"The workflow approval and the validation tools are both repository settings for Copilot cloud agent that trade speed for control. The recommended allowlist is already enabled by default.","rationale":["Yes: disabling Require approval for workflow runs makes workflows run automatically on Copilot pull requests. Do this only where unreviewed code cannot reach secrets or write access.","Yes: the Validation tools section lets admins turn off built-in checks, for example to let Copilot work faster or to avoid conflicts with other security products.","No: the recommended allowlist is enabled by default, so common package registries are reachable without admin action. Admins add custom entries only for other hosts."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/configuring-agent-settings"}],"cases":{"C-a":{"id":"C-a","title":"Adventure Works Cycles","sections":[["Overview","Adventure Works Cycles is a bicycle manufacturer and online retailer with its head office in Lisbon and a distribution center in Rotterdam. The company sells about 400 bike models and accessories through its own web store. The engineering department has 46 developers in three teams. The company plans to use Copilot cloud agent to reduce the backlog of small fixes, which grew to 1,200 open issues during a recent replatforming project. The marketing department also plans a new loyalty program next spring, which is out of scope for the engineering pilot."],["Existing environment","**GitHub organization**\n\nAdventure Works uses GitHub Enterprise Cloud with an organization named adventureworks. Developers sign in by using Microsoft Entra ID through single sign-on. The organization contains the following repositories:\n\n- storefront: the Node.js web store, owned by the web-team team\n- payments-api: the service that tokenizes card data and handles customer authentication, owned by the security-team team\n- infra-live: Terraform files for the production environment, owned by the platform-team team\n- docs-site: the public help center, written in Markdown\n\nCopilot cloud agent is enabled for storefront and docs-site. Repository administrators have not changed any cloud agent settings, so the defaults apply.\n\n**Branch rules**\n\nA ruleset on the default branch of every repository requires a pull request, one approval, and a passing status check named unit-tests. The unit-tests workflow runs npm test on every pull request. No other workflows are configured as required checks.\n\nThe docs-site repository contains a CODEOWNERS file that has a single line: * @adventureworks/platform-team. The ruleset for docs-site has Require review from Code Owners enabled.\n\n**Custom agents**\n\nThe storefront repository contains .github/agents/planner.agent.md. The profile has a description and a prompt body that starts with the sentence \"Never edit files; only write a plan.\" The profile does not contain a tools property.\n\n**Recent events**\n\n- A cloud agent pull request upgraded a vulnerable npm package in storefront. All checks passed and the pull request was merged, but the security alert stayed open because an older version of the package was still pulled in by another dependency.\n- A cloud agent pull request in storefront that was meant to fix a CSS bug also changed .github/workflows/release.yml and two files in a folder that the issue never mentioned.\n- Technical writers report that typo fixes in docs-site wait up to three days for a platform-team review.\n- The web team moved its daily stand-up from 09:00 to 09:30."],["Requirements","**Pilot scope**\n\n- During the pilot, the agent must only receive tasks that are low risk and well scoped.\n- Work that touches card data, authentication, or production infrastructure must stay with human developers.\n\n**Success criteria**\n\n- A dependency upgrade is complete only when the security finding that triggered it is resolved.\n- An agent pull request must change only the files that the plan or issue names. Unexpected files must block approval.\n\n**Planning**\n\n- Any future agent change to payments-api must have its plan reviewed and approved by security-team before any code is written.\n- The planner custom agent must be technically unable to modify files.\n\n**Review**\n\n- Changes to workflow files in any repository must be approved by platform-team before merge.\n- Documentation changes in docs-site must not wait for platform-team.\n- The developer who asks Copilot for a change must not be the only approver of that change.\n- Minimize the number of new tools and services. The finance team must approve any new paid service."]]},"C-b":{"id":"C-b","title":"Relecloud","sections":[["Overview","Relecloud is a travel booking company that has 340 employees and offices in Seattle, Lisbon, and Singapore. The engineering department has 60 developers who work in three product teams. Relecloud uses GitHub Enterprise Cloud with one enterprise account and one organization named relecloud. All developers are assigned Copilot Enterprise licenses by the organization. The marketing department tracks campaigns in Jira and does not use GitHub."],["Existing environment","The relecloud organization contains the following repositories:\n\n- web-portal: the public booking site. It is built with Node.js and runs integration tests against a local web server.\n- billing-api: the payment service. Its build and test toolchain runs only on Windows, and the first restore of its dependencies takes about 25 minutes.\n- data-pipeline: Python jobs that load booking data into a reporting warehouse every night.\n- .github-private: a private repository that stores organization-wide configuration.\n\nProduction errors from web-portal are reported to a hosted Sentry project at https://relecloud.sentry.io. The Sentry access token is currently stored as a GitHub Actions secret named SENTRY_TOKEN, which a deployment workflow uses. Developers use Visual Studio Code and Copilot CLI on company-managed laptops. The team chat runs in Slack, and on-call schedules are managed in a separate tool."],["Current configuration","Copilot cloud agent is enabled for all repositories in the organization, and no MCP servers are configured in any repository. The organization uses the default firewall settings for Copilot in the cloud. Last quarter, an administrator configured a custom MCP registry and set the registry policy to Registry only. During a review, the security team found that developers could still start an unapproved server by renaming it in a local configuration file so that its name matched an approved registry entry."],["Problem statements","Developers on the web-portal team spend a lot of time copying Sentry stack traces into issues before they assign the issues to Copilot. When Copilot works on a web-portal issue, it often needs to read related issues and pull requests in billing-api, but the agent reports that it cannot access that repository. Sessions that run for billing-api fail because the agent cannot build the solution in the default environment."],["Requirements","Relecloud identifies the following requirements:\n\n- Copilot cloud agent must read Sentry errors when it works on web-portal issues. The Sentry token must never be exposed to GitHub Actions workflows or to session logs.\n- When Copilot cloud agent works on web-portal, it must be able to read issues and pull requests in billing-api. It must not be able to change anything in billing-api.\n- Sessions for billing-api must build and test the code on Windows and must start with the dependencies already restored.\n- Outbound network traffic from billing-api sessions must be restricted to approved destinations.\n- In Visual Studio Code and Copilot CLI, developers must be able to use only MCP servers that the security team approves. Approval must be enforced by server URL or launch command, not only by server name, and developers must not be able to override it by editing local files.\n- Administrative effort must be minimized, and existing GitHub Actions deployment workflows must not change."]]},"C-c":{"id":"C-c","title":"Proseware, Inc.","sections":[["Overview","Proseware, Inc. is a software company that builds a claims-processing platform for insurance customers. The company has 140 developers in three teams: Platform, Claims, and Security.\n\nProseware uses GitHub Enterprise Cloud. All developers are assigned Copilot Business licenses through the Proseware organization. The engineering leadership wants to delegate more routine work to Copilot agents while keeping every agent action reviewable, reversible, and accountable to a named person."],["Existing environment","**Repositories**\n\n- Repo1 contains the claims API, which is written in Python. Repo1 stores database migration files in the db/migrations folder.\n- Repo2 contains infrastructure templates and GitHub Actions workflows in YAML.\n- Repo3 contains a partner portal. External contractors have write access to Repo3.\n- A ruleset on the main branch of each repository requires one approving review and passing status checks before a pull request can be merged.\n\n**Copilot configuration**\n\n- Copilot cloud agent is enabled for Repo1 and Repo2. Developers assign issues to Copilot and review the draft pull requests that it opens.\n- Repo1 contains a .github/copilot-instructions.md file that lists the build commands. The file contains no other instructions.\n- Copilot Memory is in use. The organization owners left the Repository access setting for repository-level facts at its default value. Nobody has configured the policy for user-level preferences.\n- Developers use Copilot CLI on their workstations for long-running local tasks.\n\n**Users**\n\n- User1 is a developer on the Platform team. User1 is leading a multi-day migration of the Repo1 data-access layer by using Copilot CLI.\n- User2 is a developer on the Claims team.\n- User3 is a member of the Security team and handles production incidents."],["Requirements","**Escalation requirements**\n\n- Production incidents and any change that touches customer personal data must be handled by members of the Security team. This work must not be delegated to Copilot cloud agent.\n\n**Traceability requirements**\n\n- For every commit that Copilot authors, auditors must be able to determine which developer requested the work and review how Copilot arrived at the change.\n\n**Memory requirements**\n\n- Every database migration file in Repo1 must be reviewed by a database administrator. All Copilot agents that work in Repo1 must apply this rule consistently.\n- Repository-level facts must not be stored or used for Repo3.\n- Developers want Copilot to remember their personal working preferences across all the repositories that they work in.\n\n**State requirements**\n\n- User1 must be able to stop the migration at the end of each day and continue it the next morning in Copilot CLI without repeating completed steps and without losing decisions that were made earlier in the migration."],["Problem statements","- Last week, Copilot cloud agent pushed several commits to a pull request in Repo1 that failed the integration tests in CI. Copilot did not know how to run the integration tests before it pushed.\n- User2 added a clarifying comment to an issue after the issue was assigned to Copilot. Copilot did not act on the comment.\n- After a long Copilot CLI session, User1 noticed that Copilot proposed a change that contradicted an early decision to keep the existing table names."]]},"C-d":{"id":"C-d","title":"Northwind Traders","sections":[["Overview","Northwind Traders is a food distribution company with offices in Chicago and Lisbon. Its engineering department has 60 developers in eight teams. The company uses GitHub Enterprise Cloud with Copilot Business licenses for all developers, and recently started to delegate routine work to the Copilot cloud agent.\n\nThe engineering director wants agent work to be predictable, reviewable, and easy to troubleshoot before the company expands agent use to more teams next quarter."],["Existing environment","**Repositories**\n\n- A private repository named orders-service contains a TypeScript API under src/api and a React web client under src/web.\n- A private repository named warehouse-tools contains internal command-line tools. It is not in scope for the agent pilot.\n- The company has no GitHub Advanced Security, GitHub Code Security, or GitHub Secret Protection licenses.\n\n**Copilot configuration in orders-service**\n\n- The Copilot cloud agent is enabled. The Validation tools settings use the default values.\n- The file .github/copilot-instructions.md states: \"Build and test with npm.\"\n- The file src/web/AGENTS.md, which the web team added last month, states: \"Always use pnpm for installs and scripts.\"\n- Copilot Memory is enabled for the repository.\n- Workflow runs that are triggered by Copilot pushes use the default approval setting.\n\n**People**\n\n- User1 is the engineering director.\n- User2 is a web developer with write access to orders-service.\n- User3 is a platform engineer with admin access to orders-service.\n- User4 is a contractor with read access to orders-service."],["Agent pilot","During the pilot, developers assign issues in orders-service to Copilot. Each issue uses a template with sections named Problem, Acceptance criteria, and Files in scope.\n\nThe web team plans a custom agent that writes an implementation plan before any code is changed. The plan must state what done looks like, and the custom agent must be available to every developer who works in the repository.\n\nDevelopers communicate in Microsoft Teams. Weekly pilot reviews take place every Friday in Lisbon."],["Problems observed","- In pull requests for src/web, the agent sometimes runs npm and sometimes runs pnpm, and some runs fail with lockfile errors.\n- Pull request 118 failed to install a package from the internal registry packages.northwindtraders.com. The pull request body contains a warning that lists the blocked address and the command that tried to reach it.\n- Pull request 121 shows no workflow results for the commits that Copilot pushed.\n- User4 posted a comment that mentions @copilot on pull request 121, and Copilot did not respond."],["Requirements","**Business requirements**\n\n- Reviewers must be able to see why the agent made a change and which tools it used.\n- Root causes of failed agent sessions must be classified before a fix is chosen.\n\n**Technical requirements**\n\n- Agent pull requests must be checked for exposed credentials and for newly added dependencies that have known vulnerabilities before the agent completes its work.\n- The company must not purchase additional security licenses during the pilot.\n- Guidance that the agent receives for src/web must not contradict guidance elsewhere in the repository.\n- Minimize the number of new workflows that the platform team must maintain."]]},"C-e":{"id":"C-e","title":"Tailspin Toys","sections":[["Overview","Tailspin Toys is an online toy retailer that has 120 developers in offices in Seattle and Dublin. The company uses GitHub Enterprise Cloud, and all developers are assigned GitHub Copilot Business licenses.\n\nThe main repository is named storefront. It contains a TypeScript web front end in the web folder, an order service in the services/orders folder, and Terraform files in the infra folder. The marketing website is hosted separately on a third-party content management system and is out of scope.\n\nThe engineering leads want to use several Copilot agents in parallel to deliver a new checkout experience before the holiday season, without losing control over quality, security, and traceability."],["Existing environment","**Copilot configuration**\n\n- Copilot cloud agent is enabled for the storefront repository.\n- The repository contains a .github/copilot-instructions.md file that describes build and test commands for the whole repository. Copilot code review uses this file.\n- Copilot Memory is enabled for the organization. Developers use Copilot CLI for local work.\n\n**Custom agents**\n\nThe .github/agents folder contains three custom agent profiles:\n\n- planner.agent.md: breaks a feature into tasks and delegates work to other custom agents.\n- test-writer.agent.md: writes and runs unit tests. The profile does not set any invocation properties.\n- security-reviewer.agent.md: reviews changes for insecure patterns. The profile does not set any invocation properties.\n\n**Branch rules**\n\nA ruleset on the main branch requires one approval and a passing build check before merging."],["Problem statements","- In March, the storefront repository moved its unit tests from Jest to Vitest. Copilot cloud agent still adds Jest configuration to new pull requests, and its session logs show that it relies on a stored repository memory which states that the project uses Jest.\n- During a recent Copilot CLI /fleet run, two subagents edited web/src/checkout/cart.ts at the same time, and the second change overwrote the first. Two other subagents wrote the same test file for the discount module.\n- The main agent in the CLI sometimes selects the test-writer agent on its own when a developer asks a general question, which starts long test runs that nobody requested.\n- Developers sometimes select the security-reviewer agent directly from the agent picker and skip the planner, so its findings are not added to the plan."],["Requirements","**Agent configuration**\n\n- The test-writer agent must run only when a developer selects it manually.\n- The security-reviewer agent must be invoked only by the planner agent. Developers must not be able to select it manually.\n\n**Instructions and memory**\n\n- Agents must stop using the outdated Jest information, and the rule to use Vitest must be applied as consistently as possible.\n- Terraform rules must be provided to Copilot cloud agent only when it works on files in the infra folder and its subfolders.\n- Copilot code review must continue to use the repository-wide instructions, but it must not receive the Terraform rules.\n\n**Parallel work**\n\n- Parallel runs must avoid overlapping edits and duplicated work.\n- The parent agent must confirm that the combined result of all subagents builds and passes tests before a run is complete."],["Audit and review","- Every change made by an agent must be reviewed by a human before it is merged to main.\n- Each month, the compliance team, whose members are enterprise owners, must review agent activity across the enterprise. For each event, they must identify the agent session that produced it and the developer who started the work.\n- The compliance team must not require developers to install additional tools or change their local configuration to support the review.\n- The solution must minimize administrative effort."]]},"C-f":{"id":"C-f","title":"Fabrikam, Inc.","sections":[["Overview","Fabrikam, Inc. is an online retailer of toys and games. The company has a GitHub Enterprise Cloud organization named fabrikam with about 120 repositories and 300 developers. Over the last year, Fabrikam, Inc. moved much of its routine engineering work to agents. Developers assign issues to Copilot cloud agent, and the platform team publishes organization custom agents that developers select when they start a task. The engineering director wants to keep delivery fast while the security and compliance teams keep a clear record of what every agent did and who approved it."],["Existing environment","The main storefront code is in a repository named shop-web. The default branch is main. A ruleset on main requires a pull request with one approval and requires the status checks named build and unit-tests to pass. Copilot cloud agent sessions for shop-web run on GitHub Actions. The repository has two GitHub Actions environments named staging and production. A workflow named deploy.yml deploys main to staging automatically. The deploy job for production references the production environment, which has no protection rules yet. Organization custom agents are stored in the agents folder of the fabrikam/.github-private repository. The platform team members are User1 and User2. User3 is a developer on the storefront team, and User4 is a compliance analyst who reviews agent activity every quarter."],["Agent inventory","The platform team maintains the following organization custom agents:\n\n- planner: produces an implementation plan as a pull request comment. Its profile lists the tools read and search.\n- implementer: makes code changes and runs tests. Its profile omits the tools property.\n- security-reviewer: reviews pull requests for risky changes. Its profile lists the tools read and search.\n- docs-bot: updates product documentation. It was the first agent that Fabrikam, Inc. built, and it is still used by several teams.\n\nThe platform team also publishes a new agent named test-writer. During its trial, the profile for test-writer is stored in the .github/agents folder of the .github-private repository. Each profile is a Markdown file with YAML frontmatter, and every change to a profile is merged through a pull request."],["Recent incidents","Incident 1: User3 assigned issue 812 to Copilot. Copilot opened a draft pull request, and the session log has shown no new activity for more than an hour.\n\nIncident 2: A pull request that Copilot cloud agent created for issue 790 was approved and merged into main. After the merge, checkout requests in staging started to fail. At the same time, a second Copilot session that User3 started for a follow-up issue is still running and pushing commits to its own copilot/ branch.\n\nIncident 3: User4 found that implementer changed a file in .github/workflows in a pull request that only one developer reviewed. Nobody from the platform team saw the change before it was merged."],["Requirements","Fabrikam, Inc. identifies the following requirements:\n\n- Any rollback of agent work on main must go through a reviewed pull request, and the history of main must never be rewritten.\n- Every agent must keep producing work that can be traced back to a session log after the agent is changed or retired.\n- Changes to the implementer profile must not change the behavior of pull requests that implementer already opened.\n- docs-bot must be retired. During a transition period, developers must no longer be able to select docs-bot, but the implementer agent must still be able to delegate documentation tasks to it. docs-bot must not be able to change any files during the transition period.\n- Changes to documentation and tests are low risk and must be delivered with as little process as possible.\n- Changes to workflow files, infrastructure, and authentication code are high risk. A reviewer must approve the plan before any code is written, and a member of the platform team must review the change.\n- Deployments to production must be approved by someone other than the person who started the deployment."]]},"C-g":{"id":"C-g","title":"Trey Research","sections":[["Overview","Trey Research is a contract research organization that runs clinical sample analysis for pharmaceutical customers. The company has 1,200 employees, offices in Basel and Boston, and a software engineering group of 90 developers. Trey Research must pass customer audits that check how code changes reach production and who approved them. Last year, the company moved its builds from Jenkins to GitHub Actions and now plans to expand the use of Copilot cloud agent."],["Existing environment","Trey Research uses GitHub Enterprise Cloud with one organization named trey-research. All developers have Copilot Enterprise licenses. GitHub Advanced Security is not licensed. The organization contains the following repositories:\n- LabPortal: the customer-facing web app. It contains the folders src/auth/ (sign-in and token validation), src/ui/, tests/, and data/samples/. The data/samples/ folder holds anonymized patient sample files that are used by integration tests.\n- LabDocs: the public documentation site. Every pull request runs a static site build. The repository has no secrets and no deployment credentials.\n- LabInfra: Terraform files for the Azure resources that host LabPortal.\nThe organization has the following teams: SecTeam (security engineers), PlatformTeam (build and infrastructure), ReleaseTeam (release managers), and DocsTeam (technical writers).\nThe main branch of LabPortal has a branch protection rule that requires one approval before merging. LabPortal has a workflow named deploy.yml that deploys main to production by using a job that references an environment named production. The production environment currently has no protection rules, and the deployment credential is stored as a repository secret.\nDevelopers assign issues in LabPortal and LabDocs to Copilot cloud agent. The repository settings for Copilot cloud agent are unchanged from the defaults. LabPortal uses an MCP server named TrackerMCP that reads tickets from the company issue tracker. TrackerMCP needs an API token. A developer stored the token as a GitHub Actions repository secret named TRACKER_TOKEN, and TrackerMCP fails to authenticate during Copilot sessions.\nThe engineering group uses Microsoft Teams for chat and holds a weekly change advisory meeting on Tuesdays."],["Business requirements","Trey Research identifies the following business requirements:\n- Changes to authentication code or to workflow definitions must be decided on by a member of SecTeam before they are merged.\n- A deployment to production must be approved by a member of ReleaseTeam. The person who starts a deployment must not be able to approve it.\n- Copilot must not use the contents of the anonymized patient sample files when it generates code, answers questions, or reviews pull requests.\n- Documentation changes in LabDocs must be merged as quickly as possible. Technical writers complain that pull requests from Copilot wait for hours before any checks run.\n- Auditors must be able to see who requested each change that Copilot makes."],["Technical requirements","Trey Research identifies the following technical requirements:\n- TrackerMCP must receive its API token during Copilot sessions. The token must not be exposed to the agent's shell commands as a regular environment variable.\n- Secrets that are used by Copilot must not be readable by other GitHub Actions workflows in the repository.\n- Approvals that do not reduce risk must be avoided, but every control that protects LabPortal must remain in place.\n- The built-in security validation that Copilot cloud agent runs on its own changes must stay enabled for LabPortal."],["Constraints","Trey Research has the following constraints:\n- Administrative effort must be minimized. Prefer built-in GitHub and Copilot settings over custom scripts.\n- Copilot cloud agent must keep running on GitHub-hosted runners. Self-hosted runners are not allowed.\n- The company does not plan to buy GitHub Advanced Security this year.\n- The office network team will replace the Boston VPN appliances next quarter, which does not affect GitHub-hosted services."]]}}};
const Q = DATA.questions, DOMAINS = DATA.domains, OBJ = DATA.objectives, CASES = DATA.cases || {};
// per-exam storage prefix ("ai500" for AI-500), so several exams on one site keep separate progress
const KEY = DATA.exam.id.toLowerCase().replace(/[^a-z0-9]/g, "");
const $app = document.getElementById("app");
const $$ = s => [...$app.querySelectorAll(s)];

// ponytail: localStorage only for per-device history; app works without it.
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let history = store.get(KEY + ".history", {}); // id -> true/false (last result fully correct)

const theme = store.get(KEY + ".theme", null);
if (theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set(KEY + ".theme", next);
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  return s.split(/```[a-zA-Z]*\n?/).map((part, i) => i % 2
    ? `<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`
    : part.split(/\n{2,}/).filter(p => p.trim()).map(p => p.split("\n").every(l => l.startsWith("- "))
      ? `<ul>${p.split("\n").map(l => `<li>${inline(l.slice(2))}</li>`).join("")}</ul>`
      : "<p>" + inline(p).replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const why = s => `<div class="why">${inline(s)}</div>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const dom = q => q.obj.split(".")[0];
const isStd = q => !q.case && !q.series;
const SERIES_NOTE = "This question is one of a series that share the same scenario. Each question in the series offers a different solution that might or might not meet the goal. A series can have more than one correct solution, or none. After you answer a question in this series, you cannot return to it, and it does not appear on the review screen.";
const HOW = {
  multi: q => `Choose ${q.answer.length}`, order: q => `Arrange ${q.answer.length} in order`,
  yesno: () => "Yes / No for each statement", dragdrop: () => "Drag and drop", dropdown: () => "Select from each list",
};

// ---------- answers ----------
function blank(q) {
  if (q.type === "yesno") return q.choices.map(() => null);
  if (q.type === "dragdrop" || q.type === "dropdown") return q.targets.map(() => null);
  return [];
}
function complete(q, p) {
  if (q.type === "single") return p.length === 1;
  if (q.type === "multi" || q.type === "order") return p.length === q.answer.length;
  return p.every(v => v !== null);
}
const answered = it => it.picked.some(v => v !== null);
// Partial credit per box/statement/selection, like the real exam; build lists are all-or-nothing.
function grade(q, p) {
  if (q.type === "single") return +(p[0] === q.answer[0]);
  if (q.type === "multi") return p.filter(x => q.answer.includes(x)).length / q.answer.length;
  if (q.type === "order") return +(p.length === q.answer.length && p.every((x, i) => x === q.answer[i]));
  if (q.type === "yesno") return p.filter((v, i) => v === q.answer.includes(i)).length / p.length;
  return p.filter((v, i) => v === q.answer[i]).length / p.length; // dragdrop, dropdown
}
const item = q => ({ q, order: !q.choices ? [] : q.series ? [0, 1] : shuffle(q.choices.map((_, i) => i)), picked: blank(q), checked: false, locked: false, mark: false });

// ---------- home ----------
let S = null, tick = null;
window.onbeforeunload = () => (S && S.mode === "exam" && !S.done ? true : undefined);

function home() {
  clearInterval(tick); S = null;
  const seen = Object.keys(history).length, wrong = Object.values(history).filter(v => !v).length;
  const cfg = { d: Object.keys(DOMAINS), lv: ["easy", "medium", "hard"], n: "25", mode: "practice", pool: "all", ...store.get(KEY + ".cfg", {}) };
  const types = Object.entries(Q.reduce((a, q) => (a[q.case ? "case" : q.series ? "series" : q.type] = (a[q.case ? "case" : q.series ? "series" : q.type] || 0) + 1, a), {}));
  $app.innerHTML = `
  <div class="card">
    <h2>New session</h2>
    <fieldset><legend>Mode</legend><select id="mode">
      <option value="practice" ${cfg.mode === "practice" ? "selected" : ""}>Practice (instant feedback)</option>
      <option value="exam" ${cfg.mode === "exam" ? "selected" : ""}>Exam (feedback at the end)</option>
      <option value="sim" ${cfg.mode === "sim" ? "selected" : ""}>Exam simulation (50 questions, 100 minutes)</option>
    </select>
    <p class="muted" id="simnote">Exam simulation ignores the filters below: questions are weighted by the study-guide domain percentages and include a problem-solution series and a case study in their own sections. No objective or difficulty hints, a countdown timer, mark for review, and a review screen per section. Once you leave a section you cannot return to it.</p>
    </fieldset>
    <div id="filters">
    <fieldset><legend>Domains</legend>
      ${Object.entries(DOMAINS).map(([k, d]) => `<label class="opt"><input type="checkbox" name="d" value="${k}" ${cfg.d.includes(k) ? "checked" : ""}> <span>${esc(d.title)} <span class="muted">(${d.weight}, ${Q.filter(q => dom(q) === k).length} questions)</span></span></label>`).join("")}
    </fieldset>
    <fieldset><legend>Difficulty</legend><div class="row">
      ${[["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]].map(([v, t]) => `<label class="opt"><input type="checkbox" name="lv" value="${v}" ${cfg.lv.includes(v) ? "checked" : ""}> ${t}</label>`).join("")}
    </div></fieldset>
    <fieldset><legend>Question pool</legend><div class="row">
      <label class="opt"><input type="radio" name="pool" value="all" ${cfg.pool === "all" ? "checked" : ""}> All</label>
      <label class="opt"><input type="radio" name="pool" value="new" ${cfg.pool === "new" ? "checked" : ""}> Not seen yet</label>
      <label class="opt"><input type="radio" name="pool" value="wrong" ${cfg.pool === "wrong" ? "checked" : ""}> Previously wrong (${wrong})</label>
    </div></fieldset>
    <fieldset><legend>Questions</legend><select id="n">${["10", "25", "50", "100", "all"].map(v => `<option ${cfg.n === v ? "selected" : ""} value="${v}">${v === "all" ? "All" : v}</option>`).join("")}</select></fieldset>
    </div>
    <div class="actions"><button id="start" type="button">Start</button></div>
    <p class="muted" id="msg"></p>
  </div>
  <div class="card">
    <h2>Progress on this device</h2>
    <p>${seen} of ${Q.length} questions answered, ${seen - wrong} last correct, ${wrong} last wrong.</p>
    ${statsTable()}
    <p class="muted">Question types: ${types.map(([t, n]) => `${t} ${n}`).join(", ")}.</p>
    <div class="actions"><button class="ghost" id="reset" type="button">Reset progress</button></div>
  </div>`;
  const mode = document.getElementById("mode"), sync = () => {
    document.getElementById("filters").hidden = mode.value === "sim";
    document.getElementById("simnote").hidden = mode.value !== "sim";
  };
  mode.onchange = sync; sync();
  document.getElementById("start").onclick = start;
  document.getElementById("reset").onclick = () => { if (confirm("Reset all progress?")) { history = {}; store.set(KEY + ".history", history); home(); } };
}

function statsTable() {
  const rows = Object.entries(DOMAINS).map(([k, d]) => {
    const qs = Q.filter(q => dom(q) === k), done = qs.filter(q => q.id in history), ok = done.filter(q => history[q.id]);
    return `<tr><td>${esc(d.title)}</td><td>${done.length}/${qs.length}</td><td>${done.length ? Math.round(100 * ok.length / done.length) + "%" : "-"}</td></tr>`;
  }).join("");
  return `<table><tr><th>Domain</th><th>Done</th><th>Correct</th></tr>${rows}</table>`;
}

// keep case-study and series questions together, in id order, at the position of their first member
function grouped(qs) {
  const g = new Map();
  qs.forEach(q => { const k = q.case || q.series || q.id; if (!g.has(k)) g.set(k, []); g.get(k).push(q); });
  return [...g.values()].flatMap(xs => xs.sort((a, b) => a.id.localeCompare(b.id)));
}

function simSections() {
  const caseIds = [...new Set(Q.filter(q => q.case).map(q => q.case))];
  const seriesIds = [...new Set(Q.filter(q => q.series).map(q => q.series))];
  const cs = caseIds.length ? grouped(Q.filter(q => q.case === pick(caseIds))) : [];
  const sr = seriesIds.length ? grouped(Q.filter(q => q.series === pick(seriesIds))) : [];
  const n = 50 - cs.length - sr.length;
  // domain share = midpoint of the study-guide weight range, largest remainder rounding
  const w = Object.entries(DOMAINS).map(([k, d]) => { const [a, b] = d.weight.match(/\d+/g).map(Number); return [k, (a + (b ?? a)) / 2]; });
  const tot = w.reduce((s, [, x]) => s + x, 0);
  const cnt = w.map(([k, x]) => ({ k, c: Math.floor(n * x / tot), r: (n * x / tot) % 1 }));
  [...cnt].sort((a, b) => b.r - a.r).slice(0, n - cnt.reduce((s, x) => s + x.c, 0)).forEach(x => x.c++);
  const std = shuffle(cnt.flatMap(({ k, c }) => shuffle(Q.filter(q => isStd(q) && dom(q) === k)).slice(0, c)));
  return [["std", std], ["series", sr], ["case", cs]].filter(([, xs]) => xs.length);
}

function start() {
  const mode = document.getElementById("mode").value;
  let secs;
  if (mode === "sim") {
    store.set(KEY + ".cfg", { ...store.get(KEY + ".cfg", {}), mode });
    secs = simSections();
  } else {
    const val = n => [...document.querySelectorAll(`input[name=${n}]:checked`)].map(i => i.value);
    const cfg = { d: val("d"), lv: val("lv"), pool: val("pool")[0], n: document.getElementById("n").value, mode };
    store.set(KEY + ".cfg", cfg);
    let pool = Q.filter(q => cfg.d.includes(dom(q)) && cfg.lv.includes(q.difficulty));
    if (cfg.pool === "new") pool = pool.filter(q => !(q.id in history));
    if (cfg.pool === "wrong") pool = pool.filter(q => history[q.id] === false);
    if (!pool.length) { document.getElementById("msg").textContent = "No questions match this selection."; return; }
    secs = [["std", grouped(shuffle(pool).slice(0, cfg.n === "all" ? pool.length : +cfg.n))]];
  }
  const items = [], sections = [];
  secs.forEach(([kind, qs]) => { sections.push({ kind, start: items.length, end: items.length + qs.length }); items.push(...qs.map(item)); });
  S = { mode: mode === "practice" ? "practice" : "exam", sim: mode === "sim", items, secs: sections, sec: 0, i: 0, tab: 0, sel: null, t0: Date.now() };
  if (S.sim) {
    S.deadline = Date.now() + 100 * 60000;
    tick = setInterval(() => {
      const left = S.deadline - Date.now(), el = document.getElementById("clock");
      if (left <= 0) { alert("Time is up. Your exam is submitted."); return finish(); }
      if (el) el.textContent = clock(left);
    }, 1000);
    return intro();
  }
  show();
}
const clock = ms => { const s = Math.ceil(ms / 1000); return `Time left ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const clockChip = () => S.deadline ? `<span class="chip clock" id="clock">${clock(S.deadline - Date.now())}</span>` : "";

function intro() {
  const sec = S.secs[S.sec], n = sec.end - sec.start;
  const text = {
    std: `This section contains ${n} questions. You can move back and forth, mark questions for review, and change your answers until you finish the section. When you finish it, you cannot return to it.`,
    series: `This section contains a problem-solution series of ${n} questions. ${SERIES_NOTE}`,
    case: `This section contains a case study with ${n} questions. Each question uses the same scenario; use the tabs to read the parts of the case study. You can move between the questions of this case study until you finish the section.`,
  }[sec.kind];
  $app.innerHTML = `<div class="card">
    <div class="chips"><span class="chip">Section ${S.sec + 1} of ${S.secs.length}</span>${clockChip()}</div>
    <h2>${{ std: "Questions", series: "Problem-solution series", case: "Case study" }[sec.kind]}</h2>
    <p>${esc(text)}</p>
    ${S.sec === 0 ? `<p class="muted">${S.items.length} questions in total, 100 minutes. Passing score: 700 on a scale of 1 to 1000.</p>` : ""}
    <div class="actions"><button id="go" type="button">Start section</button></div></div>`;
  document.getElementById("go").onclick = () => { S.i = sec.start; S.tab = 0; show(); };
}

// ---------- question ----------
function casePanel(id) {
  const c = CASES[id]; if (!c) return "";
  const t = Math.min(S.tab, c.sections.length - 1);
  return `<details class="case" ${S.caseClosed ? "" : "open"}><summary><strong>Case study: ${esc(c.title)}</strong></summary>
    <div class="tabs">${c.sections.map(([h], k) => `<button type="button" class="ghost sm" data-tab="${k}" aria-pressed="${k === t}">${esc(h)}</button>`).join("")}</div>
    <div class="case-body">${md(c.sections[t][1])}</div></details>`;
}

function sel(it, i, lock, reveal) {
  const q = it.q, t = q.targets[i], p = it.picked;
  const cls = reveal ? (p[i] === q.answer[i] ? "correct" : "wrong") : "";
  return `<select data-t="${i}" class="${cls}" ${lock ? "disabled" : ""} aria-label="Box ${i + 1}"><option value="">Select...</option>${t.options.map((o, k) => `<option value="${k}" ${p[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

function stemHTML(it, lock, reveal) {
  const h = md(it.q.stem);
  return it.q.type === "dropdown" ? h.replace(/\[\[(\d+)\]\]/g, (_, n) => sel(it, n - 1, lock, reveal)) : h;
}

function answerHTML(it, lock, reveal) {
  const q = it.q, p = it.picked, dis = lock ? "disabled" : "", drag = !lock;
  switch (q.type) {
    case "single": case "multi": {
      const multi = q.type === "multi";
      return `<div>${it.order.map(ci => {
        const cls = reveal ? (q.answer.includes(ci) ? "correct" : p.includes(ci) ? "wrong" : "") : "";
        return `<label class="choice ${cls}"><input type="${multi ? "checkbox" : "radio"}" name="c" data-c="${ci}" ${dis} ${p.includes(ci) ? "checked" : ""}>
          <span>${inline(q.choices[ci])}${reveal ? why(q.rationale[ci]) : ""}</span></label>`;
      }).join("")}</div>`;
    }
    case "yesno":
      return `<table class="yn"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${q.choices.map((s, i) => {
        const cls = reveal ? (p[i] === q.answer.includes(i) ? "correct" : "wrong") : "";
        return `<tr class="${cls}"><td>${inline(s)}${reveal ? why(q.rationale[i]) : ""}</td>${[1, 0].map(v => `<td><input type="radio" name="yn${i}" data-i="${i}" data-v="${v}" aria-label="${v ? "Yes" : "No"}: statement ${i + 1}" ${dis} ${p[i] === !!v ? "checked" : ""}></td>`).join("")}</tr>`;
      }).join("")}</table>`;
    case "order": {
      const tile = (ci, k) => {
        const cls = reveal ? (q.answer[k] === ci ? "correct" : "wrong") : "";
        return `<div class="tile ${cls}" draggable="${drag}" data-c="${ci}" ${k === undefined && !lock ? `tabindex="0" role="button"` : ""}>
          ${k === undefined ? "" : `<span class="num">${k + 1}.</span>`}<span class="txt">${inline(q.choices[ci])}</span>
          ${k === undefined || lock ? "" : `<span class="tools"><button type="button" class="ghost sm" data-up="${k}" aria-label="Move up">&uarr;</button><button type="button" class="ghost sm" data-down="${k}" aria-label="Move down">&darr;</button><button type="button" class="ghost sm" data-rm="${k}" aria-label="Remove">&times;</button></span>`}</div>`;
      };
      return `<div class="dd">
        <div><div class="lbl">Actions</div><div class="zone pool" data-zone="pool">${it.order.filter(ci => !p.includes(ci)).map(ci => tile(ci)).join("")}</div></div>
        <div><div class="lbl">Answer area</div><div class="zone area" data-zone="area">${p.map((ci, k) => tile(ci, k)).join("")}</div></div></div>
        ${lock ? "" : `<p class="muted">Click or drag an action into the answer area, then use the arrows to put it in order.</p>`}
        ${reveal ? `<div class="lbl">Correct sequence</div><ol>${q.answer.map(ci => `<li>${inline(q.choices[ci])}${why(q.rationale[ci])}</li>`).join("")}</ol>
          <div class="lbl">Not part of the sequence</div><ul>${q.choices.map((c, ci) => q.answer.includes(ci) ? "" : `<li>${inline(c)}${why(q.rationale[ci])}</li>`).join("")}</ul>` : ""}`;
    }
    case "dragdrop":
      return `<div class="lbl">Values</div><div class="zone pool flat">${it.order.map(ci => `<div class="tile ${S.sel === ci ? "sel" : ""}" draggable="${drag}" data-c="${ci}" ${lock ? "" : `tabindex="0" role="button"`}><span class="txt">${inline(q.choices[ci])}</span></div>`).join("")}</div>
        <div class="lbl">Answer area</div><table>${q.targets.map((t, i) => {
          const ok = p[i] === q.answer[i], cls = reveal ? (ok ? "correct" : "wrong") : "";
          return `<tr><td>${inline(t)}</td><td><div class="slot ${cls}" data-t="${i}" ${lock ? "" : `tabindex="0" role="button"`}>${p[i] === null ? `<span class="muted">${lock ? "(empty)" : "Click a value, then click here"}</span>` : inline(q.choices[p[i]])}</div>
            ${reveal ? why((ok ? "" : `Answer: ${q.choices[q.answer[i]]}. `) + q.rationale[i]) : ""}</td></tr>`;
        }).join("")}</table>
        ${lock ? "" : `<p class="muted">Each value may be used once, more than once, or not at all.</p>`}
        ${reveal ? `<div class="lbl">About each value</div><ul>${q.choices.map((c, ci) => `<li><strong>${inline(c)}</strong>${why(q.notes[ci])}</li>`).join("")}</ul>` : ""}`;
    case "dropdown": {
      const inStem = q.stem.includes("[[1]]");
      if (inStem && !reveal) return "";
      return `<table>${q.targets.map((t, i) => {
        const ok = p[i] === q.answer[i];
        return `<tr><td>${inStem ? `Box ${i + 1}` : inline(t.label)}</td><td>${inStem ? "" : sel(it, i, lock, reveal)}
          ${reveal ? `<div class="why"><span class="${ok ? "ok" : "bad"}">${ok ? "Your answer is correct" : p[i] === null ? "No answer" : "Your answer is incorrect"}</span>
            <ul>${t.options.map((o, k) => `<li class="${k === q.answer[i] ? "ok" : k === p[i] ? "bad" : ""}"><code>${esc(o)}</code>: ${inline(t.why[k])}</li>`).join("")}</ul></div>` : ""}</td></tr>`;
      }).join("")}</table>`;
    }
  }
  return "";
}

function bindAnswer(it, lock) {
  if (lock) return;
  const q = it.q, p = it.picked, redraw = () => show(true);
  $$("input[data-c]").forEach(b => b.onchange = () => {
    const ci = +b.dataset.c;
    if (q.type === "single") it.picked = [ci];
    else if (b.checked) { if (p.length < q.answer.length) p.push(ci); } else p.splice(p.indexOf(ci), 1);
    redraw();
  });
  $$("input[data-i]").forEach(b => b.onchange = () => { p[+b.dataset.i] = b.dataset.v === "1"; redraw(); });
  $$("select[data-t]").forEach(s => s.onchange = () => { p[+s.dataset.t] = s.value === "" ? null : +s.value; redraw(); });
  $$(".tile[draggable=true]").forEach(t => t.ondragstart = e => e.dataTransfer.setData("text/plain", t.dataset.c));
  $$("[tabindex][role=button]").forEach(el => el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } });
  const zone = (el, drop) => { el.ondragover = e => e.preventDefault(); el.ondrop = e => { e.preventDefault(); drop(+e.dataTransfer.getData("text/plain"), e); redraw(); }; };
  if (q.type === "order") {
    $$(".pool .tile").forEach(t => t.onclick = () => { if (p.length < q.answer.length) { p.push(+t.dataset.c); redraw(); } });
    $$("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; if (k > 0) [p[k - 1], p[k]] = [p[k], p[k - 1]]; redraw(); });
    $$("[data-down]").forEach(b => b.onclick = () => { const k = +b.dataset.down; if (k < p.length - 1) [p[k + 1], p[k]] = [p[k], p[k + 1]]; redraw(); });
    $$("[data-rm]").forEach(b => b.onclick = () => { p.splice(+b.dataset.rm, 1); redraw(); });
    $$("[data-zone=area]").forEach(z => zone(z, (ci, e) => {
      const from = p.indexOf(ci);
      if (from >= 0) p.splice(from, 1); else if (p.length >= q.answer.length) return;
      const li = e.target.closest(".tile[data-c]"), at = li ? p.indexOf(+li.dataset.c) : -1;
      p.splice(at < 0 ? p.length : at, 0, ci);
    }));
    $$("[data-zone=pool]").forEach(z => zone(z, ci => { const k = p.indexOf(ci); if (k >= 0) p.splice(k, 1); }));
  }
  if (q.type === "dragdrop") {
    $$(".pool .tile").forEach(t => t.onclick = () => { S.sel = S.sel === +t.dataset.c ? null : +t.dataset.c; redraw(); });
    $$(".slot").forEach(s => {
      s.onclick = () => { p[+s.dataset.t] = S.sel ?? null; S.sel = null; redraw(); };
      zone(s, ci => { p[+s.dataset.t] = ci; S.sel = null; });
    });
  }
}

function show(keep) {
  const it = S.items[S.i], q = it.q, sec = S.secs[S.sec], practice = S.mode === "practice";
  const lock = practice ? it.checked : it.locked, reveal = practice && it.checked;
  const levels = { easy: "Easy", medium: "Medium", hard: "Hard" };
  const prog = practice ? S.i / S.items.length : S.items.filter(answered).length / S.items.length;
  $app.innerHTML = `
  <div class="bar"><div style="width:${100 * prog}%"></div></div>
  <div class="card">
    <div class="chips">
      <span class="chip">Question ${S.i + 1} of ${S.items.length}</span>
      ${S.sim ? "" : `<span class="chip">${q.obj} ${esc(OBJ[q.obj])}</span><span class="chip ${q.difficulty}">${levels[q.difficulty]}</span>`}
      ${HOW[q.type] && !q.series ? `<span class="chip">${HOW[q.type](q)}</span>` : ""}
      ${it.mark ? `<span class="chip">Marked for review</span>` : ""}
      ${clockChip()}
    </div>
    ${q.case ? casePanel(q.case) : ""}
    ${q.series ? `<div class="note">${esc(SERIES_NOTE)}</div>` : ""}
    <div class="stem">${stemHTML(it, lock, reveal)}</div>
    ${answerHTML(it, lock, reveal)}
    ${reveal ? feedback(it) : ""}
    <div class="actions">${practice ? navPractice(it) : navExam(it, sec)}</div>
  </div>`;
  bindAnswer(it, lock);
  $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = +b.dataset.tab; show(true); });
  $$("details.case").forEach(d => d.ontoggle = () => { S.caseClosed = !d.open; });
  const on = (id, f) => { const b = document.getElementById(id); if (b) b.onclick = f; };
  on("prev", () => { S.i--; S.sel = null; show(); });
  on("check", () => {
    it.score = grade(q, it.picked); it.checked = true;
    history[q.id] = it.score === 1; store.set(KEY + ".history", history);
    show(true);
  });
  on("next", () => {
    if (q.series && !practice) it.locked = true;
    S.sel = null;
    if (S.i + 1 < sec.end) { S.i++; return show(); }
    if (practice) return result();
    sec.kind === "series" ? endSection() : review();
  });
  on("mark", () => { it.mark = !it.mark; show(true); });
  on("review", review);
  on("quit", () => {
    if (practice) return S.review || !S.items.some(x => x.checked) ? home() : result();
