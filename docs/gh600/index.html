or agents, not a record of the session."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"5.2.3-05","obj":"5.2.3","difficulty":"medium","type":"single","stem":"User1 must find every past Copilot CLI session in which the exact error code ERR_CART_409 appeared, including sessions where it does not appear in the summary.\n\nWhich command should User1 run?","choices":["/chronicle search ERR_CART_409","/chronicle standup ERR_CART_409","/chronicle tips ERR_CART_409","/chronicle improve ERR_CART_409"],"answer":[0],"explanation":"/chronicle search runs a direct content search across all session content, not only summaries. It is the right choice when you know the exact term.","rationale":["Correct: /chronicle search searches all session content, not just summaries, and is designed for exact terms such as an error code.","Incorrect: standup summarizes recent work, by default from the last 24 hours. Extra text customizes the report but does not run a full-content search.","Incorrect: tips gives personalized recommendations on how to use the CLI. It does not list the sessions that contain a term.","Incorrect: improve suggests changes to the custom instructions for the current repository. It does not search all sessions for a term."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"},{"id":"5.2.3-06","obj":"5.2.3","difficulty":"hard","type":"single","stem":"User1 runs a long /fleet session in Copilot CLI. The computer loses power during the session. After a restart, /chronicle standup and history queries miss part of that session, but its files still exist under ~/.copilot/session-state/.\n\nWhat should User1 do?","choices":["Run /chronicle reindex in an interactive CLI session.","Run /session cleanup in an interactive CLI session.","Run /chronicle standup for the last 2 days.","Run /share file in a new interactive CLI session."],"answer":[0],"explanation":"After a crash or power loss, data that was written to the session files might be missing from the session store. /chronicle reindex rebuilds the session store from the files on disk and syncs the data to the account.","rationale":["Correct: reindexing rebuilds the session store from the session files on disk, which can recover data that was written before an unexpected termination.","Incorrect: /session cleanup shows a storage summary and suggests delete commands. It does not delete sessions or rebuild the session store.","Incorrect: standup reads the session store, which still lacks the missing data, so a longer time range returns the same gap.","Incorrect: /share file exports the conversation of the current session to Markdown. It does not add the earlier session to the store."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"},{"id":"5.2.3-07","obj":"5.2.3","difficulty":"easy","type":"single","stem":"A lead at Litware, Inc. must find out why one Copilot cloud agent session took much longer and used more AI credits than similar sessions.\n\nWhat should the lead review?","choices":["The session log and overview of the session in the agents panel","The Copilot Memory repository facts list of the repository","The /chronicle standup report of the lead for the last 24 hours","The ruleset history of the default branch of the repository"],"answer":[0],"explanation":"The agents panel shows the session log with the agent's reasoning and tools, and an overview with progress, token usage, and session length. Together they explain where the time and credits went.","rationale":["Correct: the overview shows token usage and session length, and the session log shows the reasoning and tool calls that explain them.","Incorrect: repository facts are stored details about the code. They do not show how long a session ran or how many tokens it used.","Incorrect: standup summarizes the lead's own CLI work. It does not cover a cloud agent session that someone else may have started.","Incorrect: ruleset history shows changes to branch rules. It does not record agent activity or usage."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"5.3.1-01","obj":"5.3.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. assigns an issue to Copilot cloud agent. Copilot opens a draft pull request, and the timeline shows a \"Copilot started work\" event, but no commits appear for a long time. User1 must see what Copilot is doing right now.\n\nWhat should User1 do first?","choices":["Click View session on the timeline event to open the live session log.","Filter the organization audit log by actor:Copilot for the repository.","Run gh run rerun for the latest workflow run of the pull request.","Unassign Copilot from the issue and then assign the issue to Copilot again."],"answer":[0],"explanation":"The session log streams live and shows the reasoning and tools that Copilot uses, so it is the first place to look when a pull request seems idle. Restarting or digging into other logs comes later, and only if the session log shows a real stall.","rationale":["Correct: GitHub Docs say that when a pull request shows a \"Copilot started work\" event but nothing seems to happen, you click View session to see the session logs, which stream live and show what Copilot is doing.","Incorrect: the audit log records events such as who started a session, but it does not stream the steps of a running session. Use it for governance reviews, not to watch progress in real time.","Incorrect: re-running a workflow repeats CI jobs and does not show the agent's work. The session may be busy and healthy, so a re-run adds noise without any diagnosis.","Incorrect: unassigning and reassigning restarts the work and throws away the chance to diagnose it. GitHub Docs suggest this only after a session stays stuck and times out."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"5.3.1-02","obj":"5.3.1","difficulty":"easy","type":"single","stem":"At Contoso, Ltd., User2 has write access to a repository. Yesterday, User2 merged a pull request that Copilot cloud agent created. Today, User2 adds a comment that mentions @copilot on the merged pull request and asks for a small follow-up change. Nothing happens, and no eyes reaction appears on the comment.\n\nWhich cause should User2 identify?","choices":["Copilot cloud agent responds only to mentions in open pull requests.","Only repository administrators can send comments to Copilot cloud agent.","The agent firewall blocked the comment because it contained a link.","Steering messages can be sent only from the prompt box of the agents panel."],"answer":[0],"explanation":"Copilot cloud agent ignores new mentions and comments on pull requests that are merged or closed, so that it focuses on active work. A follow-up change needs a new task, for example a new issue assigned to Copilot.","rationale":["Correct: GitHub Docs state that Copilot only responds to mentions in open pull requests. After a pull request is merged or closed, the agent does not respond to new comments, so no eyes reaction appears.","Incorrect: the requirement is write access, not admin access. User2 has write access, so the permission level is not why the comment was ignored in this scenario.","Incorrect: the firewall limits outbound internet requests that the agent makes during a session. It does not filter comments, and a block would show as a warning with the blocked address.","Incorrect: you can steer a running session from the prompt box, but @copilot comments on an open pull request also reach the agent. The problem here is that the pull request is merged."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"5.3.1-03","obj":"5.3.1","difficulty":"medium","type":"single","stem":"Copilot cloud agent pushes several commits to a pull request in a repository at Litware, Inc. The pull request shows no results for the required build and unit-tests checks, so the agent work looks only partly done. The repository uses the default Copilot cloud agent settings.\n\nWhat should a user who has write access do so that the checks run?","choices":["Click Approve and run workflows in the merge box of the pull request.","Run gh run rerun RUN_ID --failed for the last run of the build workflow.","Enable Agent Merge with Watch and fix on the pull request.","Add a workflow_dispatch trigger to the build and unit-tests workflows."],"answer":[0],"explanation":"By default, GitHub Actions workflows do not run on pushes from Copilot until a user with write access approves them. The missing results are expected, and approving the run lets the required checks report.","rationale":["Correct: GitHub Docs say that workflows do not run automatically when Copilot pushes to a pull request, and that you click Approve and run workflows in the merge box to allow them to run.","Incorrect: gh run rerun needs an existing run to repeat. Here the workflows never started because they wait for approval, so there is no failed run to re-run.","Incorrect: Agent Merge fixes failed workflows and merge conflicts after they appear. It does not approve workflow runs, and the checks here have not started at all.","Incorrect: a manual trigger would run the workflow outside the pull request context and would not satisfy the required checks. The approval gate is the actual blocker."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"5.3.1-04","obj":"5.3.1","difficulty":"medium","type":"dragdrop","stem":"Northwind Traders runs several agents. The operations team must pick the first source of evidence for each symptom.\n\nWhich source should you use for each symptom? To answer, drag the appropriate sources to the correct symptoms. Each source may be used once, more than once, or not at all.","choices":["The firewall warning in the pull request body","The subagent.failed event of the Copilot SDK session","The job logs of the workflow run in the Actions tab","The Copilot cloud agent session log","The organization audit log filtered by actor:Copilot"],"answer":[0,1,2,3],"explanation":"Each symptom points to a different layer: the cloud agent firewall, the SDK runtime, GitHub Actions CI, or the agent's own reasoning. The audit log helps with governance questions, not with the root cause of a single run.","rationale":["A blocked request is reported as a firewall warning in the pull request body or comment, with the blocked address and the command that made the request.","In the Copilot SDK, a delegated sub-agent that errors emits subagent.failed with an error field, so the app can see why the parent never got a result.","A required check that fails at the same step is diagnosed in the job logs, where failed steps are expanded and you can link to the failing line.","The session log shows the reasoning and tools that Copilot used during the session, which is where you see which tools were called and why."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent","targets":["Copilot cloud agent PR: an install command failed because an external host could not be reached","Copilot SDK app: a delegated sub-agent stops and the parent agent never receives its output","Agent pull request: the required build check fails at the same step on every push","Copilot cloud agent PR: you must see which tools the agent called and why"],"notes":["Shows the blocked address and the command that tried to reach it. Use it when a session cannot reach an external host because of the default firewall.","Raised by the Copilot SDK runtime when a sub-agent errors. It carries the error, and the docs suggest showing it, retrying, or falling back to the parent agent.","Holds per-step output for each job. Use it to find which step of a CI workflow failed and to share a permalink to the exact failing line.","Streams the agent's reasoning, tool calls, and progress for one session. Use it to understand what the agent did and in which order.","Records who did what and when across the organization. It is useful for governance and usage reviews, but it does not explain why one run failed."]},{"id":"5.3.1-05","obj":"5.3.1","difficulty":"hard","type":"order","stem":"At Adatum Corporation, the required unit-tests check on a pull request from Copilot cloud agent failed. User1 must find the failing step and then re-run only the failed jobs with debug logging and follow the new attempt.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In the repository, click Actions and open the run summary of the failed workflow run.","Under Jobs, select the failed job and review the failed step, which is expanded automatically.","Run gh run rerun RUN_ID --failed --debug.","Run gh run watch and select the workflow run.","Run gh workflow disable unit-tests.yml.","Run gh run rerun --job JOB_ID for each job that succeeded.","After the re-run, download the log archive to get the logs of every job in the run."],"answer":[0,1,2,3],"explanation":"You first locate the run and the failing step, then re-run only failed jobs with debug logging, and then watch the new attempt. Re-running succeeded jobs adds cost, and a disabled workflow cannot be re-run.","rationale":["Step 1: the run summary is where you start, because it lists the jobs and links to the logs of the failed run that the pull request check points to.","Step 2: failed steps are expanded automatically in the job log, so you can read the error before you decide to re-run anything.","Step 3: gh run rerun with --failed re-runs only failed jobs and the jobs that depend on them, and --debug enables runner diagnostic and step debug logging.","Step 4: gh run watch shows the progress of the new attempt so User1 can confirm whether the failure reproduces with the extra logging.","Incorrect: a disabled workflow cannot be re-run until it is enabled again, so disabling unit-tests.yml blocks the re-run that User1 needs.","Incorrect: jobs that succeeded keep their outputs, and the requirement is to re-run only failed jobs. Re-running them adds cost and noise.","Incorrect: a log archive for a partly re-run workflow only includes the jobs that were re-run, so it does not give the logs of every job."],"ref":"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/re-run-workflows-and-jobs"},{"id":"5.3.1-06","obj":"5.3.1","difficulty":"hard","type":"single","stem":"Wingtip Toys has an app that uses the Copilot SDK. The main agent delegates work to custom agents. The app must raise an alert when a sub-agent starts but has produced neither a result nor an error 10 minutes later.\n\nWhich approach should you use?","choices":["Track subagent.started events by toolCallId and alert when no subagent.completed or subagent.failed event follows.","Read durationMs from each subagent.failed event and alert when the duration is longer than 10 minutes.","Alert on each subagent.deselected event that arrives more than 10 minutes after the session starts.","Set infer to false for each custom agent so that the main agent can no longer delegate work to it."],"answer":[0],"explanation":"A stalled sub-agent is detected by the absence of an end event, so you correlate each start with a later completed or failed event. Events that only fire at the end, or fire for other reasons, cannot reveal a run that never ends.","rationale":["Correct: the SDK emits subagent.started, then subagent.completed or subagent.failed, and toolCallId links the events of one delegation, so a start without a matching end event within 10 minutes marks a stall.","Incorrect: subagent.failed only arrives when a sub-agent ends with an error, so its durationMs describes a run that already ended. A stalled sub-agent sends neither subagent.completed nor subagent.failed, so this never fires.","Incorrect: subagent.deselected fires when the runtime switches away from a sub-agent, not when a delegated run fails to finish. Its timing relative to the session start says nothing about a stalled run.","Incorrect: infer set to false stops automatic delegation to the agent. It changes behavior instead of detecting stalls, and it removes the delegation that the app depends on."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.3.1-07","obj":"5.3.1","difficulty":"hard","type":"single","stem":"You need to resolve Incident 1 so that work on issue 812 continues.\n\nWhat should User3 do?","choices":["Unassign issue 812 from Copilot and then assign it to Copilot again.","Add the original request to the pull request again as a new comment.","Click Approve and run workflows in the merge box of the draft pull request.","Run gh run rerun for the GitHub Actions run of the stalled agent session."],"answer":[0],"explanation":"A session on GitHub Actions that stays stuck times out after an hour. When the session was started by an issue assignment, GitHub Docs say to retry by unassigning and reassigning the issue.","rationale":["Correct: GitHub Docs say that a stuck session on GitHub Actions times out after an hour, and that you can retry by unassigning the issue and then assigning it to Copilot again, which is how issue 812 started.","Incorrect: adding the same comment again is the retry for a session that got stuck while responding to a pull request comment. Incident 1 started from an issue assignment, not a comment.","Incorrect: approving workflow runs lets CI checks run on Copilot pushes. It does not restart an agent session that has stopped making progress.","Incorrect: re-running the run repeats the same attempt with the same event data. The docs give unassign and reassign as the supported retry for an issue-based session."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent","case":"C-f"},{"id":"5.3.2-01","obj":"5.3.2","difficulty":"easy","type":"single","stem":"User1 at Relecloud watches a running Copilot cloud agent session and sees that Copilot is changing the wrong module. User1 must correct the direction of the work without losing the progress of the session.\n\nWhat should User1 do?","choices":["Type a steering message in the prompt box below the session log.","Click Stop session and then assign a new issue that has the correction.","Edit the description of the original issue to describe the right module.","Archive the session and then start the same task from the agents panel."],"answer":[0],"explanation":"Steering lets you redirect a running session. Copilot applies the message after the current tool call finishes, so the session keeps its context and work.","rationale":["Correct: GitHub Docs describe steering, where you type a follow-up in the prompt box below the session log and Copilot applies it after the current tool call, without restarting the session.","Incorrect: stopping ends the session, and a new task starts without the context of the current one. This loses progress that steering would keep.","Incorrect: a running session does not reread the issue description, so the edit does not reach the agent while it works on the wrong module.","Incorrect: you archive sessions that are already stopped. Starting again throws away the progress that the requirement says to keep."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"5.3.2-02","obj":"5.3.2","difficulty":"easy","type":"single","stem":"Tailspin Toys assigns issues to Copilot cloud agent. The agent often pushes changes that then fail the required lint and unit-test checks. In every future session, the agent must run the same build, test, and lint commands as CI before it pushes, without a reviewer having to ask for it.\n\nWhat should you do?","choices":["Add the build, test, and lint commands to the .github/copilot-instructions.md file.","Mention @copilot on each pull request and ask it to run the tests before it pushes.","Turn off Require approval for workflow runs in the Copilot cloud agent settings.","Remove the lint check from the required status checks in the branch ruleset."],"answer":[0],"explanation":"Repository custom instructions are read in every session. When they list the commands that CI uses, the agent validates its own work the same way before it pushes, so failures are caught earlier.","rationale":["Correct: GitHub Docs recommend adding custom instructions in .github/copilot-instructions.md that tell Copilot how to build, test, and lint the project, so it validates its changes before it pushes.","Incorrect: a comment works only for that pull request and needs a reviewer to ask each time, which breaks the requirement that no one has to ask.","Incorrect: this setting lets CI run automatically after Copilot pushes. Failures are still found after the push, and unreviewed code runs with workflow permissions.","Incorrect: removing a required check weakens the merge gate for everyone. It hides lint failures instead of making the agent validate its work."],"ref":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"5.3.2-03","obj":"5.3.2","difficulty":"medium","type":"single","stem":"Fabrikam, Inc. has an app that uses the Copilot SDK. The main agent delegates tasks to a custom agent named researcher. Sometimes researcher fails, and users then see no answer at all. The app must still return an answer when researcher fails.\n\nWhat should you do?","choices":["Handle subagent.failed events and let the main agent finish the task.","Set infer to false for researcher so that it is never selected.","Remove the description of researcher from the customAgents entry.","Add the tools of researcher to defaultAgent.excludedTools."],"answer":[0],"explanation":"Failures of a sub-agent are reported as events, and the docs suggest showing the error, retrying, or falling back to the parent. Falling back keeps the user experience intact without disabling delegation.","rationale":["Correct: the Copilot SDK docs advise you to listen for subagent.failed and then show the error, retry, or fall back to the parent agent, so the user still gets an answer.","Incorrect: infer set to false stops automatic delegation entirely, so researcher is never used, even when it would succeed. This removes the agent instead of handling failures.","Incorrect: the runtime matches prompts to the description to pick a custom agent. Removing it hurts delegation and does nothing to handle failures.","Incorrect: defaultAgent.excludedTools hides tools from the main agent so that it must delegate. That makes the main agent depend more on researcher, which is the opposite of a fallback."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.3.2-04","obj":"5.3.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank has an app that uses the Copilot SDK with two custom agents. The description of one agent is \"Helps with code.\" and the description of the other is \"Helps with docs and code.\" Security review requests are often routed to the wrong agent.\n\nWhat should you change first?","choices":["Write a specific description for each agent that states which tasks it handles.","Give both agents the same model so that delegation decisions are consistent.","Rename the agents so that their names sort in the order you want them picked.","Add more tools to both agents so that either one can finish security reviews."],"answer":[0],"explanation":"The runtime picks a custom agent by matching the prompt to its description. Vague, overlapping descriptions lead to poor delegation, so you fix the descriptions first.","rationale":["Correct: the SDK docs say the runtime selects a custom agent by matching the user prompt to its description, and that vague descriptions cause poor delegation. Specific, distinct descriptions fix the routing.","Incorrect: the model choice affects the quality of each agent's work, not how the runtime matches prompts to agent descriptions.","Incorrect: names identify agents, but selection is based on intent matched against the description, not on alphabetical order.","Incorrect: more tools widen the blast radius and still leave the routing ambiguous. Requests would still go to whichever agent the vague description matches."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.3.2-05","obj":"5.3.2","difficulty":"hard","type":"single","stem":"At Adatum Corporation, an orchestrator agent delegates data checks to a worker agent. The orchestrator marks a task complete as soon as the worker returns any response. In several runs, the worker returned a partial result and asked for more input, but the orchestrator reported success.\n\nWhat should you do?","choices":["Define a shared completion contract that states when a task is complete.","Increase how many times the orchestrator retries the worker on each task.","Run the orchestrator and the worker in parallel on separate parts of the data.","Give the orchestrator the tools of the worker so that it can finish tasks itself."],"answer":[0],"explanation":"The two agents disagree about what complete means. A shared completion contract that both agents use aligns the criteria, so the orchestrator can tell a partial result from a finished one.","rationale":["Correct: Learn guidance on agentic loops describes misaligned completion criteria between a calling agent and a connected agent and recommends a shared completion contract that defines when work is done.","Incorrect: retries do not help, because the orchestrator already treats the partial result as success and never sees a reason to try again.","Incorrect: parallel work helps only with independent tasks. It does not change how the orchestrator decides that a delegated task is complete.","Incorrect: copying tools to the orchestrator widens its permissions and removes the separation of roles, and it still has no rule for when a task is complete."],"ref":"https://learn.microsoft.com/microsoft-copilot-studio/guidance/agentic-loops-in-practice"},{"id":"5.3.2-06","obj":"5.3.2","difficulty":"hard","type":"multi","stem":"At Contoso, Ltd., several agent pull requests merge into main within minutes of each other. Each merge starts the deploy-staging workflow, and overlapping runs deploy to staging at the same time and leave it in a broken state. Runs must deploy one at a time, in order, and no queued run may be canceled.\n\nWhich two changes should you make to the deploy-staging workflow? Each correct answer presents part of the solution.","choices":["Set concurrency.group to a fixed value such as staging-deploy.","Set concurrency.queue to max.","Set concurrency.cancel-in-progress to true.","Set concurrency.group to ${{ github.run_id }}.","Set concurrency.queue to max and concurrency.cancel-in-progress to true.","Add a wait timer of 10 minutes to the staging environment."],"answer":[0,1],"explanation":"A shared concurrency group allows only one run at a time. By default only one run can be pending and older pending runs are canceled, so queue: max is needed to keep every run waiting in order.","rationale":["Correct: a fixed group name puts every run of the workflow in the same concurrency group, so at most one deployment to staging runs at a time.","Correct: queue max lets up to 100 runs wait in the group instead of the default single pending run, so no queued deployment is canceled and runs proceed in order.","Incorrect: cancel-in-progress set to true cancels the deployment that is running when a new run starts, which breaks the requirement that no run is canceled.","Incorrect: the run ID is unique for each run, so every run gets its own group and runs still overlap. Use it only as a fallback when you want no serialization.","Incorrect: GitHub Docs state that queue max cannot be combined with cancel-in-progress true, and the workflow fails validation.","Incorrect: a wait timer only delays each job after it is triggered. Runs that start close together still overlap after the delay."],"ref":"https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency"},{"id":"5.3.2-07","obj":"5.3.2","difficulty":"medium","type":"order","stem":"At Northwind Traders, agent activity on issues triggers a workflow file named sync-tickets.yml. A bug makes the workflow send too many requests to an external ticket service. A run of the workflow is in progress, and a fix is ready in an approved pull request. No new run of the workflow may start before the fix is merged, the in-progress run must be stopped before the fix is merged, and the workflow must run normally after the fix.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run gh workflow disable sync-tickets.yml.","In the Actions tab, open the in-progress run and click Cancel workflow.","Merge the approved pull request that fixes sync-tickets.yml.","Run gh workflow enable sync-tickets.yml.","Run gh run rerun RUN_ID for the canceled run before you enable the workflow.","Delete sync-tickets.yml from the default branch.","Turn off Require approval for workflow runs in the Copilot cloud agent settings."],"answer":[0,1,2,3],"explanation":"Disabling first stops new triggers, but it does not cancel runs that already started, so you cancel the active run next. After the fix is merged, you enable the workflow again.","rationale":["Step 1: disabling the workflow stops new runs from being triggered without deleting the file, so no new run starts while you work.","Step 2: disabling does not cancel existing runs, so you cancel the run that is still sending requests to the ticket service. Because the workflow is already disabled, no new run can replace it.","Step 3: with nothing running, you merge the fix so that the workflow file on the default branch no longer has the bug.","Step 4: enabling the workflow again lets it run normally with the fixed definition, which meets the last requirement.","Incorrect: you cannot re-run a run while its workflow is disabled, and re-running the old run would repeat the buggy behavior.","Incorrect: deleting the file removes the workflow for everyone, and the requirement is that it runs normally after the fix. Disabling is the temporary control.","Incorrect: this setting controls whether workflows on Copilot pushes need approval. It neither stops the current run nor prevents new runs triggered by issue activity."],"ref":"https://docs.github.com/en/actions/how-tos/manage-workflow-runs/disable-and-enable-workflows"},{"id":"5.3.3-01","obj":"5.3.3","difficulty":"medium","type":"single","stem":"Relecloud merged a pull request that Copilot cloud agent created. After the merge, the checkout service fails in staging. You must undo the change on main. The rollback must go through a reviewed pull request, and the history of main must not be rewritten.\n\nSolution: On the merged pull request, you click Revert, and a reviewer approves the new pull request before it is merged.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[0],"explanation":"The Revert button creates a new pull request that reverts the merge commit. That pull request goes through normal review and adds a new commit, so history is kept.","rationale":["Correct: GitHub Docs say that Revert on a merged pull request creates a new pull request that reverts the merge, which you then review and merge, so the rollback is reviewed and main keeps its history.","Incorrect: the solution does meet the goal. No would be right only if the revert had conflicts, in which case you revert individual commits with git revert on a new branch and open a pull request."],"ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/reverting-a-pull-request","series":"S-f"},{"id":"5.3.3-02","obj":"5.3.3","difficulty":"easy","type":"single","stem":"Relecloud merged a pull request that Copilot cloud agent created. After the merge, the checkout service fails in staging. You must undo the change on main. The rollback must go through a reviewed pull request, and the history of main must not be rewritten.\n\nSolution: You reset main to the commit before the merge and force-push main.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"A reset and force-push rewrites the history of main and bypasses pull request review, which breaks both requirements.","rationale":["Incorrect: a force-push removes commits from main, which rewrites history, and it happens outside any pull request, so nobody reviews the rollback.","Correct: the solution does not meet the goal. A revert pull request undoes the change with a new commit that is reviewed, which is the pattern that keeps history and adds a human check."],"ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/reverting-a-pull-request","series":"S-f"},{"id":"5.3.3-03","obj":"5.3.3","difficulty":"medium","type":"single","stem":"Relecloud merged a pull request that Copilot cloud agent created. After the merge, the checkout service fails in staging. You must undo the change on main. The rollback must go through a reviewed pull request, and the history of main must not be rewritten.\n\nSolution: You open the session log of the agent session that created the pull request and click Stop session.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Stopping a session ends future work of that session and keeps commits it already pushed. It does not undo changes that are already merged into main.","rationale":["Incorrect: Stop session ends the agent run and preserves commits that were already pushed. The merged change stays on main, so the checkout service keeps failing.","Correct: the solution does not meet the goal. Stop session is the right control for a running session that makes bad changes, but a merged change is undone with a revert pull request."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents","series":"S-f"},{"id":"5.3.3-04","obj":"5.3.3","difficulty":"medium","type":"order","stem":"At Litware, Inc., a pull request from Copilot cloud agent was merged and broke a feature. A second Copilot cloud agent session for a follow-up task is still running and pushing commits to its own branch. You must prevent any further agent commits first, and then undo the merged change through a reviewed pull request.\n\nWhich three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Open the session log of the running session and click Stop session.","On the merged pull request, click Revert.","Have a reviewer approve the revert pull request, and then merge it.","Archive the running session from the agents panel.","Delete the copilot/ branch of the merged pull request.","Reset main to the previous commit and force-push main."],"answer":[0,1,2],"explanation":"You contain the problem by stopping the running session, then create a revert pull request, and then merge it after review. Deleting branches or rewriting main does not give a reviewed rollback.","rationale":["Step 1: Stop session ends the run of the follow-up session, so the agent pushes no more commits while you roll back. Commits already pushed are kept for review.","Step 2: Revert creates a new pull request that reverts the merge commit, which is the reviewed rollback that the requirement asks for.","Step 3: the revert pull request follows the normal rules, so a reviewer approves it before you merge it and the broken change leaves main.","Incorrect: you can archive sessions that are stopped. Archiving is for tidying the session list, not for ending a session that is still pushing commits.","Incorrect: the merged change is already on main, so deleting the source branch does not remove it from main or produce a reviewed rollback.","Incorrect: a force-push rewrites the history of main and skips review, so it fails the requirement that the rollback goes through a reviewed pull request."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"5.3.3-05","obj":"5.3.3","difficulty":"easy","type":"single","stem":"User1 at Fabrikam, Inc. assigned an issue to Copilot cloud agent. The repository requires one approving review. Copilot opens a pull request, and User1 approves it.\n\nWhat else should happen before the pull request can be merged?","choices":["An approval from a reviewer other than User1","An approval from an organization owner","A comment from User1 that mentions @copilot","A second approval from User1 after new commits"],"answer":[0],"explanation":"The person who asked Copilot to create a pull request cannot be its only approver. This keeps an independent human in the loop for agent work.","rationale":["Correct: GitHub Docs state that if you asked Copilot to create a pull request, your approval does not count toward required approvals, so another reviewer must approve it.","Incorrect: the role of the second reviewer does not matter. Any eligible reviewer other than User1 meets the rule, so an organization owner is not required.","Incorrect: an @copilot mention asks Copilot for changes. It does not add an approval and does not satisfy the review requirement.","Incorrect: User1's approval never counts for this pull request, so approving again after new commits still leaves the requirement unmet."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"5.3.3-06","obj":"5.3.3","difficulty":"easy","type":"single","stem":"Wingtip Toys lets agents prepare deployments. Operators must be able to roll back to the exact code that was running before a deployment.\n\nWhat should the deployment workflow deploy?","choices":["An explicit ref, such as a commit SHA or a tag","The latest commit on the main branch","The head of the agent's copilot/ branch","A build artifact that is named latest"],"answer":[0],"explanation":"Rollback-safe deployments use explicit refs. If you know exactly which commit or tag was deployed, you can redeploy the previous one with confidence.","rationale":["Correct: the Learn module recommends deploying explicit refs, such as a commit or tag, instead of the latest commit on a branch, so that a rollback targets a known version.","Incorrect: the latest commit on main changes over time, so you cannot be sure which code ran before, and a rollback becomes guesswork.","Incorrect: an agent branch holds unmerged, unreviewed work. Deploying it skips review, and the branch head also moves when the agent pushes.","Incorrect: an artifact called latest is overwritten by each build, so you lose the link between a deployment and a specific version."],"ref":"https://learn.microsoft.com/en-us/training/modules/design-agent-architecture-integration/7-agent-operations-controls"},{"id":"5.3.3-07","obj":"5.3.3","difficulty":"hard","type":"single","stem":"At Adatum Corporation, User2 can start the deploy job for production after agent work is merged. Another person must approve each production deployment, User2 must not be able to approve deployments that User2 started, and the deployment secrets must stay unavailable until approval.\n\nWhat should you configure?","choices":["A production environment with required reviewers and Prevent self-review selected","Require approval for workflow runs in the Copilot cloud agent settings","A CODEOWNERS entry for the deploy workflow file with code owner review","A production environment that has a wait timer of 60 minutes"],"answer":[0],"explanation":"Environment protection rules gate the job itself. Required reviewers add the human approval, prevent self-review blocks the initiator from approving, and environment secrets stay locked until approval.","rationale":["Correct: a job that references an environment with required reviewers waits for approval and cannot read environment secrets until then, and Prevent self-review stops the user who started it from approving.","Incorrect: this setting gates GitHub Actions runs on Copilot pushes to a pull request. It does not gate production deployments that User2 starts after the merge.","Incorrect: code owner review protects changes to the workflow file. It does not require an approval each time the deploy job runs.","Incorrect: a wait timer only delays the job. Nobody approves it, so the deployment proceeds after the delay without a human decision."],"ref":"https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"},{"id":"5.3.3-08","obj":"5.3.3","difficulty":"hard","type":"multi","stem":"You need to respond to Incident 2 and meet the rollback requirement.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.","choices":["Click Stop session in the session log of the follow-up session.","Click Revert on the merged pull request for issue 790, and merge the new pull request after review.","Reset main to the commit before the merge and force-push main.","Archive the follow-up session without stopping it.","Delete the copilot/ branch of the pull request for issue 790.","Click Approve and run workflows on the follow-up pull request."],"answer":[0,1],"explanation":"Recovery contains the active session and rolls back the merged change through review. Stopping keeps the commits already pushed, and the revert pull request leaves the history of main intact.","rationale":["Correct: Stop session ends the follow-up session so that it pushes no more commits while you recover, and the commits it already pushed are kept for review.","Correct: Revert creates a new pull request that reverts the merge commit. It is reviewed like any other change, which meets the Fabrikam, Inc. requirement to never rewrite main.","Incorrect: a reset and force-push rewrites the history of main and skips review, which the Fabrikam, Inc. requirements forbid.","Incorrect: archiving is for sessions that are stopped. It does not end a running session or prevent more commits from the follow-up work.","Incorrect: the change for issue 790 is already merged, so deleting its source branch does not remove the change from main.","Incorrect: approving workflow runs lets CI checks run on the follow-up pull request. It neither contains the session nor rolls back the merged change."],"ref":"https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/reverting-a-pull-request","case":"C-f"},{"id":"5.4.1-01","obj":"5.4.1","difficulty":"easy","type":"single","stem":"Contoso, Ltd. has a GitHub organization named contoso. The platform team has finished testing a new custom agent profile. The agent must be available to all members of the organization for Copilot cloud agent tasks.\n\nWhich location should the team use for the released profile?","choices":["In the agents folder of the contoso/.github-private repository","In the .github/agents folder of each repository that uses the agent","In the .github/copilot/settings.json file of the contoso/.github repository","In the .github/workflows folder of the contoso/.github-private repository"],"answer":[0],"explanation":"Organization custom agents live in the agents folder of the organization's .github or .github-private repository and are then available to all members. Repository folders only scope an agent to one repository.","rationale":["Correct: GitHub Docs say that organization custom agents are stored in the agents folder of the organization's .github or .github-private repository and are available to all members of the organization.","Incorrect: profiles in .github/agents of a repository are repository-level agents. Copying them to every repository creates many versions that drift apart.","Incorrect: settings.json in .github/copilot configures items such as plugins for a repository. It is not where custom agent profiles are stored.","Incorrect: .github/workflows holds GitHub Actions workflow files. A custom agent profile is a Markdown file, not a workflow."],"ref":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/prepare-for-custom-agents"},{"id":"5.4.1-02","obj":"5.4.1","difficulty":"easy","type":"single","stem":"User1 at Tailspin Toys adds a new custom agent profile to a repository that already has two custom agents. The profile has YAML frontmatter that sets only name and tools.\n\nWhich frontmatter property should User1 add, because it is required?","choices":["description","model","target","mcp-servers"],"answer":[0],"explanation":"description is the only required frontmatter property. It explains what the agent does, which also helps Copilot choose the right agent among several.","rationale":["Correct: the custom agents configuration reference lists description as required. It states the purpose and capabilities of the agent, which matters when the agent joins existing agents.","Incorrect: model is optional. When it is not set, the agent uses the default model, so the profile is valid without it.","Incorrect: target is optional and limits the environments where the agent is available. Without it, the agent is available in all supported environments.","Incorrect: mcp-servers is optional and only needed when the agent uses extra MCP servers. Many agents use only built-in tools."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.1-03","obj":"5.4.1","difficulty":"medium","type":"dropdown","stem":"Relecloud adds a custom agent named test-writer to an existing multi-agent workflow. test-writer must be able to read, search, and edit files, and it must not run shell commands. It must be available only on GitHub.com for Copilot cloud agent tasks.\n\n```yaml\n---\nname: test-writer\ndescription: Writes unit tests for changed Python modules. Use for test coverage tasks only.\ntools: [[1]]\ntarget: [[2]]\n---\n```\n\nHow should you complete the profile? To answer, select the appropriate options in the answer area.","choices":[],"answer":[0,0],"explanation":"A list in tools allows only those tool aliases, so read, search, and edit without execute meets the requirement. target github-copilot limits the agent to GitHub.com.","rationale":["Box 1: an explicit list of tool aliases is an allowlist, so only read, search, and edit are available and the shell tool is not.","Box 2: github-copilot limits the agent to Copilot cloud agent on GitHub.com, so it is not offered in other environments."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration","targets":[{"label":"Box 1","options":["[\"read\", \"search\", \"edit\"]","[\"*\"]","[]","[\"read\", \"search\", \"edit\", \"execute\"]"],"why":["Correct: an explicit list allows only the named tools, so test-writer can read, search, and edit, while execute, the shell alias, stays unavailable.","Incorrect: an asterisk enables all available tools, including execute, so the agent could run shell commands, which breaks the requirement.","Incorrect: an empty list disables all tools, so test-writer could not even read or edit files and would be unable to write tests.","Incorrect: execute is the alias for the shell tool. Including it allows shell commands, which the requirement forbids."]},{"label":"Box 2","options":["github-copilot","vscode"],"why":["Correct: target set to github-copilot makes the agent available for Copilot cloud agent on GitHub.com only, which matches the requirement.","Incorrect: target set to vscode limits the agent to the IDE, so it would not be available for cloud agent tasks on GitHub.com."]}]},{"id":"5.4.1-04","obj":"5.4.1","difficulty":"medium","type":"order","stem":"Woodgrove Bank has a GitHub organization named woodgrove. The platform team must add a new custom agent named release-notes to the organization. First, only members who can access the woodgrove/.github-private repository may try the agent. After the trial, the agent must be available to all members, and the team must be able to monitor its use.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Add the profile to the .github/agents folder of the .github-private repository and merge it to the default branch.","On github.com/copilot/agents, select the .github-private repository and release-notes, start a task, and review Recent sessions.","Move the profile from .github/agents to the agents folder and merge the change to the default branch.","Filter the organization audit log by actor:Copilot.","Add the agent to the .github/copilot/settings.json file of every repository.","Turn on release-notes in the Validation tools section of the Copilot cloud agent settings."],"answer":[0,1,2,3],"explanation":"A profile in .github/agents of .github-private is a test release that only people with access to that repository can use. Moving it to agents releases it to the organization, and the audit log shows its use.","rationale":["Step 1: in .github/agents of .github-private, the agent is available only to members with access to that repository and only for tasks started there, which is the trial scope.","Step 2: the team tests from the agents page by selecting the repository and the agent, then checks Recent sessions to see how the tasks went.","Step 3: moving the profile to the agents folder and merging it to the default branch releases the agent to all members of the organization.","Step 4: filtering the organization audit log by actor:Copilot lets the team monitor how the released agent is used.","Incorrect: settings.json in .github/copilot is used for plugins, not for publishing custom agents. Organization agents are released through the .github-private repository.","Incorrect: Validation tools switch built-in checks such as CodeQL and secret scanning. They do not publish or enable custom agents."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/test-custom-agents"},{"id":"5.4.1-05","obj":"5.4.1","difficulty":"hard","type":"dragdrop","stem":"Litware, Inc. adds custom agents to an app that uses the Copilot SDK. Each requirement must be met by using one setting.\n\nWhich setting should you use for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once, more than once, or not at all.","choices":["infer: false on the custom agent","defaultAgent.excludedTools","A tools list on the custom agent","The agent property of the session configuration","mcpServers on the custom agent","displayName on the custom agent"],"answer":[0,1,2,3],"explanation":"Each SDK setting controls a different layer: automatic selection, what the main agent may do itself, what one sub-agent may use, and which agent a session starts with.","rationale":["infer set to false stops the runtime from selecting the agent automatically, so a cleanup agent runs only when a user explicitly asks for it.","defaultAgent.excludedTools hides tools from the main agent, so it cannot edit files itself and must delegate that work to a custom agent.","A tools list on a custom agent limits that agent to the listed tools, so a researcher can be read-only while other agents keep edit tools.","The agent property in the session configuration pre-selects a custom agent, so sessions for the release team start with the release agent active."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents","targets":["A new cleanup agent must run only when a user explicitly requests it.","The main agent must delegate all file edits instead of editing files itself.","A new researcher agent must have read-only access.","Sessions for the release team must start with the release agent selected."],"notes":["Turns off automatic selection for one custom agent. The docs use it for a dangerous-cleanup agent that runs only on explicit request.","Removes tools from the main agent only, which forces delegation to custom agents that still have those tools.","Scopes the tools of one custom agent. Use it to make planning or research agents read-only while other agents keep broader tools.","Chooses which custom agent is active when the session starts, so users do not need to select it themselves.","Adds MCP servers that only this custom agent can use. It adds capabilities and does not restrict or route work.","Sets the name that users see for the agent. It changes the label only and has no effect on routing or permissions."]},{"id":"5.4.1-06","obj":"5.4.1","difficulty":"hard","type":"single","stem":"Adatum Corporation has an organization custom agent with the file name reviewer.agent.md. A team adds its own profile named reviewer.agent.md to the .github/agents folder of its repository, with different instructions.\n\nWhich profile should the team expect Copilot to use for tasks in that repository?","choices":["The repository profile, because the lowest level wins a naming conflict","The organization profile, because it was configured before the other one","Both profiles, because Copilot merges the instructions of the two files","Neither profile, because the duplicate name is a configuration error"],"answer":[0],"explanation":"Agents are deduplicated by file name, and in a naming conflict the agent at the lowest level wins. A repository profile therefore overrides an organization profile with the same name in that repository.","rationale":["Correct: the configuration reference says that when names conflict, the lowest level configuration wins, so a repository agent overrides an organization or enterprise agent with the same file name.","Incorrect: the order in which profiles were created does not matter. The level of the configuration decides which profile wins a conflict.","Incorrect: Copilot does not merge two profiles that share a name. It uses one of them, chosen by the level of the configuration.","Incorrect: a duplicate name is expected and resolved by precedence. This lets a repository customize an agent that the organization provides."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.1-07","obj":"5.4.1","difficulty":"hard","type":"single","stem":"Northwind Traders adds a custom agent that uses an extra MCP server. The MCP server needs an API key. The key must be available to the MCP server when Copilot cloud agent runs the agent, and it must not appear in any file in the repository.\n\nWhich location should you use for the API key?","choices":["As an Agents secret that the MCP configuration references","As a GitHub Actions secret in the repository settings","In the prompt of the agent profile, inside a code block","In the custom instructions file of the repository"],"answer":[0],"explanation":"MCP configuration for Copilot reads secrets from Agents secrets and variables. Actions secrets are not available to Copilot, and anything in a profile or instructions file is plain text in the repository.","rationale":["Correct: GitHub Docs state that MCP servers used by Copilot read secrets from Agents secrets and variables, which you reference from the MCP configuration so the key is never stored in the repository.","Incorrect: GitHub Docs note that GitHub Actions secrets are not accessible to Copilot, so the MCP server would not receive the key.","Incorrect: the profile is a file in the repository, so the key would be visible to everyone who can read it and to the agent itself.","Incorrect: the instructions file is also committed to the repository, and secrets must stay out of instructions and configuration files."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/build-guardrails"},{"id":"5.4.2-01","obj":"5.4.2","difficulty":"medium","type":"single","stem":"At Fabrikam, Inc., a custom agent opened pull request 42. While Copilot is still iterating on pull request 42, the platform team merges an update to the agent profile on the default branch. User1 then adds an @copilot comment to pull request 42.\n\nWhich version of the profile should User1 expect Copilot to use?","choices":["The version that created pull request 42","The latest version on the default branch","The version on the head branch of pull request 42","The version that the latest session in the repository used"],"answer":[0],"explanation":"Custom agent versions are based on the Git commit SHA of the profile. After an agent creates a pull request, later work on that pull request keeps the same version for consistency.","rationale":["Correct: the configuration reference says that when a custom agent creates a pull request, interactions within that pull request use the same agent version, so an update does not change work already in progress.","Incorrect: new tasks use the latest profile on the repository and branch, but a pull request that the agent already created keeps the version that created it.","Incorrect: the head branch of the pull request does not decide the version. The version is the one that created the pull request.","Incorrect: versions are not shared across sessions. Each pull request keeps the version that created it, whatever other sessions do."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.2-02","obj":"5.4.2","difficulty":"easy","type":"order","stem":"Tailspin Toys has an organization custom agent stored as agents/implementer.md in its .github-private repository. User1 must test changes to implementer with a small group first. Members must keep using the current version until the test succeeds.\n\nWhich three actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Copy the profile to .github/agents/implementer-next.md in .github-private, edit the copy, and merge it to the default branch.","On github.com/copilot/agents, select .github-private and implementer-next, start a task, and review Recent sessions.","Apply the tested changes to agents/implementer.md and merge them to the default branch.","Edit agents/implementer.md directly and merge the change to the default branch.","Delete agents/implementer.md so that members cannot use the old version during the test.","Turn on implementer-next in the Validation tools section of the Copilot cloud agent settings."],"answer":[0,1,2],"explanation":"A duplicate in .github/agents of .github-private is a test copy that only members with access to that repository can use. After testing, you apply the changes to the released profile, so members switch only once the update is proven.","rationale":["Step 1: GitHub Docs say you can duplicate an existing profile to test updates. In .github/agents of .github-private, the copy is available only to members with access to that repository.","Step 2: testing from the agents page with the .github-private repository and the copy selected, then checking Recent sessions, shows whether the update works.","Step 3: only after the test succeeds do you change the released profile in the agents folder, so new tasks for all members use the tested version.","Incorrect: editing the released profile first changes the agent for every member before anyone has tested it, which breaks the requirement.","Incorrect: deleting the released profile removes the agent that members depend on, which disrupts their work during the test.","Incorrect: Validation tools switch built-in checks such as CodeQL and secret scanning. They do not enable or test custom agents."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/test-custom-agents"},{"id":"5.4.2-03","obj":"5.4.2","difficulty":"easy","type":"single","stem":"Contoso, Ltd. maintains a custom agent profile in a repository. Teams must keep using the stable version while the platform team works on a major update over several weeks.\n\nWhat should the platform team do?","choices":["Develop the update on a separate branch and merge it to the default branch when it is ready.","Edit the profile on the default branch and add a note to the prompt that it is in progress.","Remove the profile from the default branch until the update is finished and tested.","Add a model property to the profile that points to the stable version of the agent."],"answer":[0],"explanation":"Custom agent versions follow Git, and a task uses the latest profile on the repository and branch. Working on a separate branch keeps the default branch, and therefore the stable version, unchanged.","rationale":["Correct: GitHub Docs say versioning is based on Git commit SHAs and that you can use branches or tags for versions, so work on a branch does not change the profile on the default branch.","Incorrect: tasks pick up the latest profile on the default branch, so every in-progress edit reaches users immediately. A note in the prompt does not prevent that.","Incorrect: removing the profile makes the agent unavailable for weeks, which disrupts every team that depends on it.","Incorrect: model chooses the AI model for the agent. It does not select a version of the profile."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.2-04","obj":"5.4.2","difficulty":"medium","type":"yesno","stem":"Wingtip Toys updates the profile of a custom agent named builder on the default branch of a repository. The update changes the tools list and adds a handoffs property. builder has already opened pull request 18.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["New tasks that start on the default branch use the updated tools list.","New @copilot comments on pull request 18 are handled by the updated version.","The handoffs property changes how builder behaves in Copilot cloud agent on GitHub.com.","Copilot identifies each version of the profile by a Git commit SHA."],"answer":[0,3],"explanation":"Tasks use the latest profile on the branch, but pull requests that the agent already created keep their version. handoffs is ignored on GitHub.com, and versions follow Git commit SHAs.","rationale":["Yes: a task uses the latest version of the profile on the repository and branch where it starts, so new tasks on the default branch pick up the new tools list.","No: interactions within a pull request that the agent created keep using the agent version that created it, so pull request 18 is not affected by the update.","No: the configuration reference states that handoffs is ignored on GitHub.com, so the property has no effect on Copilot cloud agent, although other environments may use it.","Yes: custom agent versioning is based on the Git commit SHAs of the profile file, which is why you can also use branches or tags for versions."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.2-05","obj":"5.4.2","difficulty":"medium","type":"single","stem":"At Relecloud, any change to custom agent profiles or MCP configuration must be reviewed by the platform team before it can merge. Developers, and agents acting for them, can open pull requests that touch these files.\n\nWhat should you configure?","choices":["A CODEOWNERS entry for the files and the Require review from Code Owners rule","A line in each agent profile that tells agents not to edit configuration files","Require approval for workflow runs in the Copilot cloud agent settings","Audit log streaming for the organization to an external system"],"answer":[0],"explanation":"Tool and MCP changes widen what agents can do, so they are governance-sensitive. CODEOWNERS plus required code owner review enforces that the platform team approves them.","rationale":["Correct: GitHub Docs recommend protecting Copilot and MCP configuration files with CODEOWNERS and the Require review from Code Owners rule, so these changes cannot merge without the platform team.","Incorrect: instructions are guidance that an agent may not follow, and they do nothing against a developer. Enforcement must come from rules and gates.","Incorrect: this setting gates GitHub Actions runs on Copilot pushes. It does not require any reviewer for changes to agent profiles.","Incorrect: streaming records events after they happen. It helps with detection but does not stop an unreviewed change from merging."],"ref":"https://docs.github.com/en/copilot/tutorials/cloud-agent/build-guardrails"},{"id":"5.4.2-06","obj":"5.4.2","difficulty":"hard","type":"single","stem":"Adatum Corporation must replace an organization custom agent named Agent1 with a new agent named Agent2. About 40 repositories use Agent1. Teams must not lose a working agent at any point, and the platform team wants to limit the impact if Agent2 behaves badly.\n\nWhat should the platform team do first?","choices":["Test Agent2 from the .github/agents folder of .github-private while Agent1 stays released.","Overwrite the profile of Agent1 with the profile of Agent2 and merge it to the default branch.","Remove the profile of Agent1 and then release Agent2 in the agents folder of .github-private.","Add a profile named Agent1 to every repository that contains the instructions of Agent2."],"answer":[0],"explanation":"A side-by-side test keeps the current agent available while a small group tries the replacement. Only after the test do you release Agent2 and retire Agent1.","rationale":["Correct: a profile in .github/agents of .github-private is available only to members with access to that repository, so Agent2 can be tested while all teams keep using Agent1.","Incorrect: overwriting Agent1 changes it for all 40 repositories at once, so a bad version reaches every team before anyone has tested it.","Incorrect: removing Agent1 before Agent2 is proven leaves teams without a working agent if Agent2 fails, which breaks the continuity requirement.","Incorrect: repository profiles override the organization profile by name, so this replaces Agent1 everywhere, untested and in 40 places that then drift apart."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/test-custom-agents"},{"id":"5.4.2-07","obj":"5.4.2","difficulty":"hard","type":"yesno","stem":"The platform team plans to update the implementer profile. The update adds a tools list that contains read, search, edit, and execute.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["The update gives implementer access to more tools than its current profile allows.","Pull requests that implementer opened before the update keep using the previous version.","If the update is merged on a branch other than the default branch, tasks that start on the default branch still use the current profile."],"answer":[1,2],"explanation":"The current implementer profile omits tools, which means all tools. A list narrows that. Versions follow Git, so open pull requests keep their version and tasks on the default branch keep the profile that is there.","rationale":["No: implementer omits the tools property today, which enables all available tools. A list of four aliases is an allowlist that narrows the tools, so the agent gets fewer tools, not more.","Yes: interactions within a pull request that a custom agent created keep using the agent version that created it, which meets the Fabrikam, Inc. requirement for open pull requests.","Yes: a task uses the latest profile on the repository and branch where it runs, so a change merged on another branch does not affect tasks on the default branch."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration","case":"C-f"},{"id":"5.4.3-01","obj":"5.4.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. retires a custom agent. The agents panel still lists many stopped cloud sessions from that agent. The team wants these sessions out of the active list, and auditors must still be able to read them later.\n\nWhat should the team do with the sessions?","choices":["Archive the sessions.","Delete the sessions.","Steer the sessions to stop.","Resume the sessions with /resume."],"answer":[0],"explanation":"Archiving removes stopped sessions from the active view while keeping them. Cloud sessions cannot be deleted, so the history stays available.","rationale":["Correct: GitHub Docs say you can archive stopped sessions, and that cloud sessions can be archived but not deleted, so the sessions leave the active list and remain available for review.","Incorrect: cloud sessions can be archived but not deleted, and deletion would also destroy the audit trail that the auditors need.","Incorrect: steering sends guidance to a running session. These sessions are already stopped, so steering has no effect on the list.","Incorrect: /resume in Copilot CLI continues a session, which starts work again instead of removing the session from the active list."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/manage-and-track-agents"},{"id":"5.4.3-02","obj":"5.4.3","difficulty":"easy","type":"single","stem":"Woodgrove Bank plans to retire an organization custom agent next month. Before that, the platform team wants evidence of how often members still use agents in the organization.\n\nWhat should the platform team use?","choices":["The organization audit log, filtered by actor:Copilot","The Recent sessions list of one test repository","The commit history of the agents folder of .github-private","The workflow run logs of the copilot-setup-steps.yml file"],"answer":[0],"explanation":"Filtering the organization audit log by actor:Copilot shows agent activity across the organization, which is the evidence you need before you retire an agent.","rationale":["Correct: GitHub Docs recommend monitoring the usage of released custom agents by filtering the organization audit log by actor:Copilot.","Incorrect: Recent sessions in one repository shows only tasks started there, so it misses use in the rest of the organization.","Incorrect: the commit history shows who changed profiles and when. It says nothing about how often members use the agents.","Incorrect: setup steps prepare the environment of some sessions. Their logs do not give a usage view of agents across the organization."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/test-custom-agents"},{"id":"5.4.3-03","obj":"5.4.3","difficulty":"medium","type":"dropdown","stem":"Contoso, Ltd. is retiring a custom agent named legacy-migrator. The profile must stay in the repository for audit purposes. Users must no longer be able to select the agent, and if it is ever invoked, it must not be able to use any tools.\n\n```yaml\n---\nname: legacy-migrator\ndescription: RETIRED. Kept for audit purposes only.\nuser-invocable: [[1]]\ntools: [[2]]\n---\n```\n\nHow should you complete the profile? To answer, select the appropriate options in the answer area.","choices":[],"answer":[1,0],"explanation":"user-invocable false removes the agent from the list that users pick from. An empty tools list disables every tool, so the retained profile can do no harm.","rationale":["Box 1: user-invocable set to false means users cannot select the agent, while the profile stays in the repository for audits.","Box 2: an empty list disables all tools, so the agent cannot read, edit, or run anything if something invokes it."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration","targets":[{"label":"Box 1","options":["true","false"],"why":["Incorrect: true is the default and keeps the agent in the list that users choose from, so users could still select the retired agent.","Correct: false makes the agent unavailable for users to select, so it can only be invoked programmatically while the profile is kept for audits."]},{"label":"Box 2","options":["[]","[\"*\"]","[\"read\"]"],"why":["Correct: an empty tools list disables all tools, so the retired agent cannot use any tool even if another component invokes it.","Incorrect: an asterisk enables all available tools, which gives the retired agent the widest possible access instead of none.","Incorrect: read still lets the agent read files. The requirement is that the agent cannot use any tools at all."]}]},{"id":"5.4.3-04","obj":"5.4.3","difficulty":"medium","type":"single","stem":"Relecloud must retire an organization custom agent named Agent1 that is stored in the agents folder of its .github-private repository. Auditors must be able to see who removed Agent1, when, and why.\n\nWhat should the platform team do?","choices":["Remove the profile in a pull request that states the reason, and merge it after review.","Delete the .github-private repository, which removes Agent1 for all members.","Change the description of Agent1 to RETIRED and leave all other settings unchanged.","Remove the profile in a commit, and then force-push to rewrite the default branch."],"answer":[0],"explanation":"A reviewed pull request is the system of record: it shows who made the change, when, who approved it, and the reason. The Git history keeps the old profile for later audits.","rationale":["Correct: removing the profile through a reviewed pull request records the author, approver, time, and reason, and the earlier versions remain in the Git history for audits.","Incorrect: deleting the repository removes every organization agent and its history, which destroys the audit trail and breaks other agents.","Incorrect: a new description does not retire the agent. Members could still select and use it, and nothing records why it should not be used.","Incorrect: a force-push rewrites history and can remove the record of the profile, which defeats the auditability requirement."],"ref":"https://learn.microsoft.com/en-us/training/modules/foundations-agentic-ai/5-identify-risks-traceability"},{"id":"5.4.3-05","obj":"5.4.3","difficulty":"hard","type":"single","stem":"Northwind Traders uses GitHub Enterprise Cloud. Before it retires an agent, the compliance team must review agent session activity across the enterprise for the past 90 days.\n\nWhich source should the compliance team use?","choices":["The audit log of the enterprise","The Agent sessions view on the AI controls page","The agents panel of each compliance team member","The session logs of the most recent cloud session"],"answer":[0],"explanation":"The AI controls page gives a quick view of recent agent sessions, but View all covers only the last 24 hours. A 90-day review needs the audit log.","rationale":["Correct: GitHub Docs list the audit log as a source for monitoring agent activity in an enterprise, and it covers far more than the last 24 hours, which suits a 90-day review.","Incorrect: the Agent sessions section of the AI controls page shows recent sessions, and View all covers only the last 24 hours, so it cannot show 90 days.","Incorrect: the agents panel is a working view for tracking and steering sessions. It is not an enterprise-wide record that covers 90 days of activity.","Incorrect: one session log explains a single run. It does not give activity across the enterprise or over 90 days."],"ref":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/monitor-agentic-activity"},{"id":"5.4.3-06","obj":"5.4.3","difficulty":"hard","type":"single","stem":"Litware, Inc. has a custom agent named orchestrator that delegates documentation tasks to a custom agent named docs-bot. docs-bot will be retired and replaced by a new agent named docs-writer. Documentation tasks must keep working during the change.\n\nWhat should the platform team do first?","choices":["Release docs-writer and update orchestrator so that it delegates to docs-writer.","Delete docs-bot and let orchestrator choose another agent by itself.","Remove the agent tool alias from the tools list of orchestrator.","Set disable-model-invocation to true in the profile of orchestrator."],"answer":[0],"explanation":"For continuity you add the replacement and move the delegation before you remove the old agent. Removing first leaves a gap in the workflow.","rationale":["Correct: the agent tool alias lets an agent invoke another custom agent, so releasing docs-writer and pointing orchestrator at it keeps documentation tasks working before docs-bot goes.","Incorrect: deleting docs-bot first leaves orchestrator without a documentation agent until a replacement exists, which breaks the continuity requirement.","Incorrect: the agent alias is what lets orchestrator invoke another custom agent. Removing it stops all delegation, including documentation tasks.","Incorrect: disable-model-invocation means orchestrator must be selected manually. It does not change which agent orchestrator delegates to."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.4.3-07","obj":"5.4.3","difficulty":"medium","type":"dropdown","stem":"You need to complete the docs-bot profile to meet the retirement requirements for the transition period. The platform team has already added user-invocable: false so that developers can no longer select docs-bot.\n\n```yaml\n---\nname: docs-bot\ndescription: Updates product documentation. Being retired.\nuser-invocable: false\n[[1]]\ntools: [[2]]\n---\n```\n\nHow should you complete the profile? To answer, select the appropriate options in the answer area.","choices":[],"answer":[0,0],"explanation":"With user-invocable false, docs-bot can only be invoked programmatically, so model invocation must stay enabled for implementer to delegate to it. read and search let it handle delegated requests without changing files.","rationale":["Box 1: disable-model-invocation false keeps automatic invocation by other agents, which is the only way left to reach docs-bot after user-invocable is set to false.","Box 2: read and search are read-only aliases, so docs-bot can still look up documentation but cannot edit files, which the transition requires."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration","case":"C-f","targets":[{"label":"Box 1","options":["disable-model-invocation: false","disable-model-invocation: true","target: vscode"],"why":["Correct: false leaves automatic invocation enabled, so implementer can still delegate documentation tasks to docs-bot during the transition.","Incorrect: true means the agent must be selected manually. With user-invocable false, nobody could select it, so implementer could no longer reach docs-bot.","Incorrect: target vscode limits the agent to the IDE, which removes it from Copilot cloud agent on GitHub.com, where implementer runs and delegates."]},{"label":"Box 2","options":["[\"read\", \"search\"]","[\"*\"]","[\"edit\"]","[\"read\", \"execute\"]"],"why":["Correct: read and search let docs-bot look up existing documentation for delegated requests, and without edit or execute it cannot change any files.","Incorrect: an asterisk enables all tools, including edit and execute, so docs-bot could change files during the transition.","Incorrect: edit is exactly the capability that must be removed during the transition period, so this option breaks the requirement.","Incorrect: exe
