read, search, and edit files while execute and agent stay disabled.","Incorrect: the solution meets the goal. No would be right if the list also contained execute, which runs shell commands, or agent, which invokes other custom agents."],"series":"S-e","ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-02","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Litware, Inc. has a custom agent profile named docs-writer.agent.md for Copilot cloud agent. The agent must be able to read, search, and edit files. It must not run shell commands and must not invoke other custom agents.\n\nSolution: You omit the tools property and add a sentence to the prompt body that forbids shell commands and calls to other agents.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"Omitting tools enables all available tools. A sentence in the prompt asks the model to comply but does not remove the execute and agent tools.","rationale":["Incorrect: when tools is omitted, all available tools are enabled, including execute and agent. The prompt sentence is guidance that the model can ignore.","Correct: the solution does not meet the goal. Use a specific tools list to remove tools; prompt text is right for describing behavior, not for restricting access."],"series":"S-e","ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-03","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Litware, Inc. has a custom agent profile named docs-writer.agent.md for Copilot cloud agent. The agent must be able to read, search, and edit files. It must not run shell commands and must not invoke other custom agents.\n\nSolution: You set tools to [\"read\", \"edit\", \"search\", \"agent\"] in the frontmatter.\n\nDoes this meet the goal?","choices":["Yes","No"],"answer":[1],"explanation":"The agent alias lets a custom agent invoke another custom agent. Including it breaks the requirement even though execute is not listed.","rationale":["Incorrect: execute is absent, so shell commands are blocked, but the agent alias allows the custom agent to invoke other custom agents, which the goal forbids.","Correct: the solution does not meet the goal. Include agent only when a profile must delegate, for example an orchestrator that hands work to specialist agents."],"series":"S-e","ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-04","obj":"4.3.3","difficulty":"hard","type":"dropdown","stem":"You need to update the test-writer and security-reviewer profiles to meet the agent configuration requirements.\n\n```yaml\n# test-writer.agent.md\n---\ndescription: Writes and runs unit tests\n[[1]]\n---\n\n# security-reviewer.agent.md\n---\ndescription: Reviews changes for insecure patterns\n[[2]]\n---\n```\n\nHow should you complete the frontmatter? To answer, select the appropriate options in the answer area.","answer":[0,1],"explanation":"disable-model-invocation: true stops the model from choosing an agent automatically, so it must be selected manually. user-invocable: false removes manual selection, so only other agents or programmatic calls can use the agent.","case":"C-e","targets":[{"label":"Box 1","options":["disable-model-invocation: true","user-invocable: false","tools: []","target: vscode"],"why":["Correct: disable-model-invocation: true prevents the main agent from selecting test-writer on its own, so it runs only when a developer selects it manually.","Incorrect: user-invocable: false removes test-writer from manual selection, which is the opposite of the requirement. Use it for agents that only other agents call.","Incorrect: tools: [] disables all tools, so the agent could not edit files or run tests. Use an empty list for agents that must only reason and answer.","Incorrect: target: vscode makes the profile available only in VS Code, so it cannot be used in the other Copilot environments. It does not stop automatic selection."]},{"label":"Box 2","options":["disable-model-invocation: true","user-invocable: false","tools: []","target: vscode"],"why":["Incorrect: disable-model-invocation: true keeps manual selection and blocks automatic invocation, so developers could still pick the agent and the planner could not call it.","Correct: user-invocable: false removes the agent from manual selection, so it can be accessed only programmatically, such as by the planner agent.","Incorrect: tools: [] removes the tools that the reviewer needs to read code, and developers could still select it manually. It does not control who invokes the agent.","Incorrect: target: vscode makes the profile available only in VS Code, where developers can still select it. It does not restrict invocation to the planner."]}],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-05","obj":"4.3.3","difficulty":"medium","type":"order","stem":"Fabrikam, Inc. wants Copilot cloud agent to use a Sentry MCP server in a repository. The server needs an access token, and only read-only tools must be enabled. An Agents secret named COPILOT_MCP_SENTRY_ACCESS_TOKEN already exists. You must confirm that the server starts in an agent session.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["In the repository settings, open Copilot and then MCP servers.","Enter a JSON configuration in which mcpServers lists the Sentry server, its read-only tools, and the COPILOT_MCP_SENTRY_ACCESS_TOKEN secret.","Click Save MCP configuration.","Assign an issue to Copilot, and then check the Start MCP Servers step in the session logs.","Add the server to the mcpServers section of .github/copilot-instructions.md.","Add a repository Actions secret named SENTRY_ACCESS_TOKEN."],"answer":[0,1,2,3],"explanation":"Repository MCP servers are configured as JSON in the repository settings and saved there, and the JSON references Agents secrets whose names start with COPILOT_MCP_. A test session confirms the server in the Start MCP Servers step of the session logs.","rationale":["Step 1: repository administrators configure MCP servers on the MCP servers page under Copilot in the repository settings.","Step 2: the JSON configuration needs an mcpServers object; listing specific read-only tools is recommended because the agent uses them without asking for approval.","Step 3: Save MCP configuration validates and stores the JSON for the cloud agent and Copilot code review.","Step 4: a saved configuration is validated with Copilot cloud agent by assigning an issue and expanding the Start MCP Servers step in the session logs to confirm the server and its tools.","Incorrect: custom instructions are natural-language guidance for the model. MCP server configuration is entered in the repository settings or in a custom agent profile.","Incorrect: the MCP configuration can only reference Agents secrets and variables whose names start with COPILOT_MCP_. A repository Actions secret with another name is not available to it."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"},{"id":"4.3.3-06","obj":"4.3.3","difficulty":"easy","type":"dragdrop","stem":"Relecloud reviews the session logs of four custom agents that run in Copilot cloud agent. You need to refine the tools property of each agent profile so that each agent gets the access that the logs show it needs, and no more.\n\nWhich change should you make for each agent? To answer, drag the appropriate changes to the correct agents. Each change may be used once, more than once, or not at all.","choices":["add the edit alias","add the agent alias","remove the execute alias","add the playwright/* entry","add the web alias","replace the list with [\"*\"]"],"answer":[0,1,2,3],"explanation":"Refining tool access means changing the tools list to match observed needs: add edit to change files, agent to delegate, a server/* entry for one MCP server, and remove execute when no shell is needed. The web alias does not apply in Copilot cloud agent, and \"*\" grants every tool.","rationale":["Agent1 can read and search but has no edit tools, so adding the edit alias lets it change files without granting shell access.","Agent2 needs to invoke another custom agent, and the agent alias maps to the custom agent tools that delegate a task.","Agent3 does not need a shell, so removing the execute alias removes the bash or powershell tools and keeps read, edit, and search.","Agent4 needs browser automation, and the out-of-the-box playwright MCP server is configured to access localhost, so playwright/* enables its tools."],"targets":["Agent1: has tools [\"read\", \"search\"] and describes fixes in its response, but it cannot save them to files","Agent2: must hand off documentation work to a separate custom agent named docs-writer","Agent3: has tools [\"read\", \"edit\", \"search\", \"execute\"] and ran shell commands, but it only updates Markdown files","Agent4: must check the web app that it starts on localhost in a browser"],"notes":["Maps to edit tools such as str_replace. Use it when an agent must change files.","Maps to the custom agent tools. Use it when an agent must delegate work to another custom agent.","Removes the bash or powershell shell tools. Use it when logs show shell commands that the task does not need.","Enables every tool of the out-of-the-box playwright MCP server, which accesses localhost. Use it for browser checks of a local app.","Fetches URLs and runs web searches in IDE clients, but it is currently not applicable for Copilot in the cloud.","Enables every available tool, the same as omitting tools. It breaks least privilege for a focused agent."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-07","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Contoso, Ltd. adds an MCP server for its ticket system to the repository MCP configuration. The configuration sets tools to [\"*\"], and the server provides tools that create and close tickets. A security engineer is concerned about autonomous changes.\n\nWhat should you do?","choices":["Set tools to a list of the specific read-only tools that the agent needs.","Keep tools set to [\"*\"] and require approval prompts for each MCP tool call.","Change type from local to http so that the server runs in read-only mode.","Move the server definition into the mcp-servers property of an IDE agent."],"answer":[0],"explanation":"Copilot cloud agent uses configured MCP tools autonomously without asking for approval. GitHub Docs recommends allowlisting specific read-only tools instead of enabling all tools.","rationale":["Correct: the tools allowlist limits which MCP tools the agent can call, and GitHub Docs recommends specific read-only tools because the agent will not ask before using them.","Incorrect: once an MCP server is configured, Copilot cloud agent uses its tools autonomously and does not ask for approval, so approval prompts are not an available control.","Incorrect: type describes how the server is reached, such as local, stdio, http, or sse. It does not make tools read-only.","Incorrect: mcp-servers is not used in VS Code or other IDE profiles, so moving the definition there does not restrict the cloud agent tools."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"},{"id":"4.3.3-08","obj":"4.3.3","difficulty":"hard","type":"single","stem":"Woodgrove Bank creates a custom agent profile named triage.agent.md. The agent must be able to read files and call only the list_issues tool of the out-of-the-box github MCP server.\n\nWhich tools value should you use?","choices":["[\"read\", \"github/list_issues\"]","[\"read\", \"github/*\"]","[\"read\", \"github.list_issues\"]","[\"*\", \"github/list_issues\"]"],"answer":[0],"explanation":"MCP tools are referenced as server/tool, and server/* enables every tool of the server. A specific list enables only the named tools.","rationale":["Correct: github/list_issues uses the server/tool syntax to enable one tool of the github MCP server, and read adds file viewing. Nothing else is enabled.","Incorrect: github/* enables all tools of the github MCP server. Use it when the agent needs the whole server, not a single tool.","Incorrect: MCP tools use a slash between the server and tool name. Unrecognized tool names are ignored, so this entry would not enable list_issues.","Incorrect: * enables all available tools, so adding a specific MCP tool does not narrow access. Use * only when the agent needs every tool."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"4.3.3-09","obj":"4.3.3","difficulty":"medium","type":"single","stem":"Adatum Corporation uses Copilot cloud agent with the default firewall settings. A pull request from Copilot shows a firewall warning: a request to api.test.adatum.com was blocked while the agent ran the integration tests. The agent must reach this host, and the firewall must keep blocking other hosts.\n\nWhat should you do?","choices":["On the Internet access page of the repository settings, add api.test.adatum.com to the custom allowlist.","On the Internet access page of the repository settings, turn off the Enable firewall setting.","Add a step that calls api.test.adatum.com to .github/workflows/copilot-setup-steps.yml.","Add api.test.adatum.com as an allowed host to .github/copilot-instructions.md."],"answer":[0],"explanation":"The Copilot firewall blocks hosts that are not on an allowlist. Adding the host to the custom allowlist on the Internet access page grants access to that host only, while the firewall keeps blocking everything else.","rationale":["Correct: a custom allowlist rule allows traffic to the domain and its subdomains, and the firewall stays enabled for every other host.","Incorrect: disabling the firewall lets Copilot connect to any host, which increases exfiltration risk and does not keep other hosts blocked.","Incorrect: setup steps run before the agent starts. The integration tests that the agent runs later are still subject to the firewall.","Incorrect: custom instructions are natural-language guidance for the model. They do not change the firewall rules that block the request."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"4.3.3-10","obj":"4.3.3","difficulty":"easy","type":"single","stem":"Tailspin Toys creates a custom agent named estimator. The agent must only reason about the text in the prompt and must not have access to any tools.\n\nWhat should you set in the frontmatter of the profile?","choices":["tools: []","tools: [\"*\"]","disable-model-invocation: true","user-invocable: false"],"answer":[0],"explanation":"An empty tools list disables all tools. Omitting the property or using * enables all tools.","rationale":["Correct: an empty list disables all tools for the custom agent, which is the documented way to create an agent without tool access.","Incorrect: [\"*\"] enables all available tools, which is the same as omitting the property. Use it for general-purpose agents.","Incorrect: disable-model-invocation controls whether the model can select the agent automatically. The agent keeps its tools.","Incorrect: user-invocable controls whether people can select the agent manually. It does not change which tools the agent can use."],"ref":"https://docs.github.com/en/copilot/reference/custom-agents-configuration"},{"id":"5.1.1-01","obj":"5.1.1","difficulty":"medium","type":"order","stem":"User1 must use Copilot CLI to plan a large refactoring task and then run the independent parts of the plan in parallel. User1 must be able to follow the progress of the parallel work.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Press Shift+Tab to switch to plan mode, and describe the task.","Review the plan that Copilot creates.","Select Accept plan and continue in Autopilot execution mode + /fleet.","Run /tasks to view the background subagent tasks.","Run /delegate to send each subagent to Copilot cloud agent.","Run /compact to split the plan into subagent tasks."],"answer":[0,1,2,3],"explanation":"/fleet is typically used after plan mode: Copilot builds a plan, you approve it with the fleet option, and the orchestrator runs independent parts as subagents. /tasks shows the background subagent tasks.","rationale":["Step 1: plan mode lets Copilot build a structured plan before any change is made, which gives /fleet clear parts to parallelize.","Step 2: reviewing the plan before accepting it confirms that the parts are correct and independent enough to run in parallel.","Step 3: this option accepts the plan and starts Autopilot with /fleet, so the orchestrator dispatches subagents for the independent parts.","Step 4: /tasks lists the background subagent tasks, where User1 can open details or a summary of each task.","Incorrect: /delegate hands the session to Copilot cloud agent, which works in a single pull request. It does not run local parallel subagents.","Incorrect: /compact summarizes the conversation to free context window space. It does not create or dispatch subagent tasks."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/speed-up-task-completion"},{"id":"5.1.1-02","obj":"5.1.1","difficulty":"medium","type":"dropdown","stem":"Contoso, Ltd. runs Copilot CLI from a scheduled script. The script must run a prompt in fleet mode without an interactive session, and the subagents must be able to change files without asking for approval.\n\n```bash\ncopilot [[1]] -p \"Update all deprecated API calls in the services folder\" [[2]]\n```\n\nHow should you complete the command? To answer, select the appropriate options in the answer area.","answer":[0,0],"explanation":"The --fleet option runs the prompt with parallel subagents, -p supplies the prompt non-interactively, and --allow-tool write lets the run change files without prompts.","targets":[{"label":"Box 1","options":["--fleet","--acp","--resume"],"why":["Correct: --fleet runs the prompt in fleet mode, so the orchestrator splits the work into parallel subagents in a non-interactive run.","Incorrect: --acp runs Copilot CLI in a different mode, and GitHub Docs states that fleet mode is not compatible with --acp, so it cannot start parallel subagents.","Incorrect: --resume continues an earlier session from a picker or by ID. It does not enable parallel subagents."]},{"label":"Box 2","options":["--allow-tool write","--deny-tool write","--continue"],"why":["Correct: --allow-tool write approves file changes in advance, which a scripted run needs because nobody can answer approval prompts.","Incorrect: --deny-tool write blocks file changes, so the subagents could not update the API calls. Use it for read-only analysis runs.","Incorrect: --continue resumes the most recent session. It does not grant permission to write files."]}],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/speed-up-task-completion"},{"id":"5.1.1-03","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. must update the documentation, the unit tests, and the logging code of five independent services. The changes do not depend on each other.\n\nWhich approach should you use with Copilot?","choices":["An orchestrator that gives each part to a subagent and runs the parts in parallel","A single agent that completes the parts one after another in one context window","A sequential chain in which each agent waits for the output of the agent before it","Five separate chat sessions in which you paste the results of each session by hand"],"answer":[0],"explanation":"Independent parts of a goal are a good fit for an orchestrator that delegates to subagents. Each subagent has its own context window, and independent tasks can run in parallel before the orchestrator combines the results.","rationale":["Correct: an orchestrator breaks down the goal, assigns parts to subagents with their own context, runs independent parts in parallel, and then reviews and combines the results.","Incorrect: one agent can complete the work, but it does it serially and fills one context window with every service. Use a single agent for small or tightly coupled tasks.","Incorrect: a sequential chain suits work in which each step needs the previous output. These parts are independent, so waiting adds time without benefit.","Incorrect: separate manual sessions can work in parallel, but nobody coordinates or combines the results. An orchestrator does that review and integration for you."],"ref":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"5.1.1-04","obj":"5.1.1","difficulty":"easy","type":"single","stem":"Litware, Inc. has a migration task in which each step needs the output of the previous step: export the schema, transform it, and then generate the new data access code.\n\nWhich approach should you use?","choices":["Run the steps in order in a single agent session instead of fleet mode.","Run the steps in fleet mode so that subagents complete them in parallel.","Assign each step to a separate subagent and merge their results at the end.","Run the steps as three Copilot cloud agent tasks that start at the same time."],"answer":[0],"explanation":"Fleet mode and parallel subagents only help when parts are independent. For inherently sequential work, a single session that runs the steps in order is the better choice.","rationale":["Correct: GitHub Docs says not to use fleet mode for sequential tasks, because each step depends on the previous output and parallel workers would have nothing to start from.","Incorrect: fleet mode runs independent work in parallel. It gives no benefit for sequential steps and uses more AI credits.","Incorrect: separate subagents still cannot start a step before the previous output exists, so this adds coordination overhead without gaining parallelism.","Incorrect: parallel cloud agent tasks would each work without the output of the earlier step. Use parallel tasks only for work that does not depend on other tasks."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.1-05","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Relecloud builds an app with the GitHub Copilot SDK that registers several custom agents. The main agent must coordinate the work and must not edit files itself, so that every edit is made by a specialist agent.\n\nWhat should you configure?","choices":["Add the edit tools to defaultAgent.excludedTools for the session.","Set the agent session option to the name of one specialist agent.","Set tools to null for each specialist agent in the session.","Set infer to false for each specialist agent in the session."],"answer":[0],"explanation":"defaultAgent.excludedTools hides tools from the main agent while sub-agents keep them. The main agent must then delegate the work, which is the orchestrator pattern.","rationale":["Correct: excluding tools from the default agent leaves them available to custom agents, so the main agent must delegate edits to the specialists.","Incorrect: the agent option pre-selects one custom agent for the session. That agent then does the work itself instead of coordinating several specialists.","Incorrect: tools set to null gives the specialists all session tools, but it does not remove the edit tools from the main agent.","Incorrect: infer set to false stops the runtime from selecting those agents automatically, which makes delegation harder instead of forcing it."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.1.1-06","obj":"5.1.1","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants agents to process a loan feature request. A requirements agent, a coding agent, and a compliance agent must run in a fixed order, and a person must approve the output before the next agent starts. Every step must be auditable.\n\nWhich orchestration pattern should you use?","choices":["A sequential workflow with approval gates between the agents","Concurrent orchestration that runs all three agents at the same time","Group chat orchestration in which the agents discuss until they agree","Handoff orchestration in which each agent chooses the next agent itself"],"answer":[0],"explanation":"A workflow-oriented design runs agents in a defined order and supports approval gates and auditability. The other patterns favor parallelism or dynamic routing over a fixed, approved sequence.","rationale":["Correct: a sequential, workflow-oriented design runs the agents in a fixed order and supports approval gates and auditability, which matches the bank's requirements.","Incorrect: concurrent orchestration runs agents in parallel on the same input. It suits independent analyses, not steps that need the previous result and an approval.","Incorrect: group chat lets agents discuss in a shared conversation. It suits brainstorming or review, but the order and approval points are not fixed.","Incorrect: handoff lets an agent transfer control dynamically. It suits routing to the right specialist, not a predefined order with approvals."],"ref":"https://learn.microsoft.com/agents/architecture/multi-agent-workflow-oriented"},{"id":"5.1.1-07","obj":"5.1.1","difficulty":"hard","type":"single","stem":"Tailspin Toys uses the fleet mode of the GitHub Copilot SDK. The orchestrator creates a todo for implementing an API and a todo for writing integration tests for the API. The tests todo must not start until the API todo is done.\n\nWhat should the orchestrator do?","choices":["Insert a row into todo_deps that makes the tests todo depend on the API todo.","Set the status of the tests todo to blocked until the API todo is done.","Give both todos the same ID so that one worker claims them together.","Put both tasks in one todo description so that one subagent does both."],"answer":[0],"explanation":"Fleet mode tracks dependencies in the todo_deps table, and workers only claim ready todos whose dependencies are done. A dependency row is the documented way to order todos.","rationale":["Correct: todo_deps records that one todo depends on another, and the ready query only returns todos whose dependencies are done, so no worker claims the tests todo early.","Incorrect: blocked means that a todo cannot proceed and needs an explanation. Using it for ordering requires a manual reset and hides a real dependency.","Incorrect: todo IDs must be unique and durable, so two todos cannot share one ID. Durable IDs are what make dependencies and handoffs work.","Incorrect: merging the tasks loses the separate ownership and status of each todo. Combine tasks only when they are too small to justify separate work."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.1-08","obj":"5.1.1","difficulty":"easy","type":"single","stem":"User1 runs /fleet in Copilot CLI. The subagents that write tests must use a custom agent named test-writer that is defined in the repository.\n\nWhat should User1 include in the /fleet prompt?","choices":["@test-writer","#test-writer","/delegate","/tasks"],"answer":[0],"explanation":"In a /fleet prompt you can name a custom agent with @ followed by its name, so the orchestrator uses that agent for the matching subagent work.","rationale":["Correct: naming the custom agent as @test-writer in the prompt tells Copilot to use that agent for the relevant subagent tasks.","Incorrect: a # prefix is not the documented way to name a custom agent in a /fleet prompt. Use @ followed by the agent name.","Incorrect: /delegate hands the work to Copilot cloud agent, which creates a pull request. It does not choose a custom agent for local fleet subagents.","Incorrect: /tasks lists background subagent tasks so that you can monitor them. It does not choose which agent the subagents use."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/speed-up-task-completion"},{"id":"5.1.2-01","obj":"5.1.2","difficulty":"medium","type":"order","stem":"Contoso, Ltd. wants Copilot cloud agent to fix three unrelated bugs in parallel. Each fix must be isolated so that it can be reviewed and merged on its own.\n\nWhich four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Create a separate issue for each bug that describes its scope.","Assign each issue to Copilot.","Monitor each agent session from the agents panel.","Review each draft pull request, and click Approve and run workflows.","Create one issue for all three bugs, and assign it to Copilot.","Ask Copilot to mark each pull request as Ready for review."],"answer":[0,1,2,3],"explanation":"Copilot cloud agent works on one branch with one pull request per task, so separate issues give isolated branches and pull requests. Workflows wait until a person with write access approves them.","rationale":["Step 1: separate issues define a separate task for each bug, which leads to a separate branch and pull request for each fix.","Step 2: assigning each issue to Copilot starts a separate agent session that pushes only to its own copilot/ branch.","Step 3: the agents panel shows the progress and session log of each session while the agents work in parallel.","Step 4: each draft pull request needs human review, and workflows do not run until someone with write access clicks Approve and run workflows.","Incorrect: one issue becomes one task with one branch and one pull request, so the three fixes would not be isolated or reviewable on their own.","Incorrect: Copilot cloud agent cannot mark its pull requests as Ready for review. A person must do that after reviewing the changes."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.1.2-02","obj":"5.1.2","difficulty":"hard","type":"yesno","stem":"Fabrikam, Inc. builds an app with the GitHub Copilot SDK that registers several custom agents as sub-agents.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.","choices":["Each sub-agent runs in its own isolated context.","A sub-agent whose tools value is null has access to no tools.","A sub-agent can use skills only when skills are configured for that sub-agent.","A tool that the session excludes becomes available when a sub-agent lists it in its tools."],"answer":[0,2],"explanation":"Sub-agents run in isolated contexts. A null tools value means all session tools, skills are opt-in per agent, and session-level exclusions win over agent settings.","rationale":["Yes: each sub-agent runs in its own isolated context and streams lifecycle events back to the parent, which keeps parallel work separate.","No: tools set to null gives the sub-agent all tools in the session. Use an explicit list to apply least privilege.","Yes: skills are opt-in for each custom agent and are not inherited from the parent, so a sub-agent only gets the skills configured for it.","No: session-level availableTools and excludedTools are applied first, and a session exclusion wins, so a sub-agent cannot add the tool back."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.1.2-03","obj":"5.1.2","difficulty":"medium","type":"multi","stem":"Relecloud uses fleet mode to run several subagents in parallel. In earlier runs, the subagents interfered with each other's work.\n\nWhich three actions should you take to isolate the subagents? Each correct answer presents part of the solution.","choices":["Give each todo a single owner.","Assign todos that change files that do not overlap.","Give each subagent complete context in its prompt.","Let each subagent read the context window of the other subagents.","Let all subagents change the same file and keep the last change.","Give each subagent all session tools so that it can fix the other subagents' work."],"answer":[0,1,2],"explanation":"Fleet best practices are one owner per todo, no overlapping files unless the parent reconciles them, and complete context for each stateless subagent.","rationale":["Correct: one owner per todo means that only one worker claims and changes the todo, which prevents two subagents from doing the same work.","Correct: keeping the files of parallel todos separate avoids conflicting edits. Overlap is acceptable only when the parent reconciles the changes.","Correct: subagents are stateless and have their own context, so the prompt must contain everything they need instead of relying on shared conversation history.","Incorrect: each subagent has its own context window that other subagents cannot read. Share information through the prompt or the todo state.","Incorrect: last-write-wins silently discards work, which is the interference the team wants to avoid. Use one owner per file or reconcile in the parent.","Incorrect: broad tool access increases the risk that a subagent changes work it does not own. Give each agent only the tools it needs."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.2-04","obj":"5.1.2","difficulty":"easy","type":"single","stem":"User1 assigns a new issue to Copilot cloud agent in a repository that has a protected main branch.\n\nWhich branch should User1 expect Copilot to push its changes to?","choices":["A new branch whose name starts with copilot/","The default branch of the repository","The branch that User1 has checked out locally","Any branch to which User1 has write access"],"answer":[0],"explanation":"For a new task, Copilot cloud agent creates a copilot/ branch and can push only to that branch. This isolates its work from other branches and agents.","rationale":["Correct: when Copilot is not working on an existing pull request, it creates a new copilot/ branch and can only push to that branch.","Incorrect: Copilot cloud agent cannot push to the default branch; its changes reach main only through a pull request that a person reviews and merges.","Incorrect: the cloud agent works in its own environment on GitHub and has no access to User1's local checkout.","Incorrect: the agent is limited to a single branch and does not inherit all the branches that the requester can push to."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.1.2-05","obj":"5.1.2","difficulty":"easy","type":"single","stem":"User1 works on two unrelated tasks in Copilot CLI at the same time: a dependency upgrade and a documentation update. The context of one task must not affect the other task.\n\nWhat should User1 do?","choices":["Run each task in its own CLI session, and name each session.","Run both tasks in one session, and run /compact between them.","Run both tasks in one session by using /fleet with two todos.","Run both tasks in one session, and run /rename between them."],"answer":[0],"explanation":"Copilot CLI can run several sessions side by side, each with its own history. Separate named sessions keep unrelated contexts apart and make them easy to resume.","rationale":["Correct: separate sessions keep separate conversation histories, and a name from --name or /rename makes each session easy to find and resume.","Incorrect: /compact summarizes the history but keeps it in the same context. GitHub Docs recommends a fresh context for unrelated tasks.","Incorrect: /fleet splits one goal into parallel subagents under one orchestrator. It is not meant to keep two unrelated tasks apart.","Incorrect: /rename only changes the name of the current session. Both tasks would still share one history and context."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/work-with-multiple-sessions"},{"id":"5.1.2-06","obj":"5.1.2","difficulty":"hard","type":"single","stem":"Litware, Inc. builds an app with the GitHub Copilot SDK. A sub-agent named scanner must only read files, but its configuration does not set tools.\n\nWhat should you do?","choices":["Set tools for scanner to an explicit list that contains only read tools.","Set tools for scanner to null so that it inherits no session tools.","Add the write tools to defaultAgent.excludedTools for the session.","Set infer to false for scanner so that it cannot be selected."],"answer":[0],"explanation":"A sub-agent without a tools list can use all session tools. An explicit tools list applies least privilege to that sub-agent only.","rationale":["Correct: an explicit tools list restricts the sub-agent to the named tools, which GitHub Docs recommends for least privilege.","Incorrect: null means that the sub-agent gets all tools in the session, which is the current problem.","Incorrect: defaultAgent.excludedTools hides tools from the main agent only. Sub-agents such as scanner keep access to them.","Incorrect: infer set to false stops automatic selection of the agent, but when it runs, it still has every session tool."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.1.2-07","obj":"5.1.2","difficulty":"medium","type":"single","stem":"Tailspin Toys builds an app with the GitHub Copilot SDK. The session sets excludedTools to block a deploy tool. A sub-agent named releaser lists the deploy tool in its tools, but it cannot call the tool. The releaser agent must be able to deploy.\n\nWhat should you do?","choices":["Remove the deploy tool from excludedTools at the session level.","Add the deploy tool to the tools list of the releaser agent again.","Add the deploy tool to defaultAgent.excludedTools for the session.","Set the agent session option to releaser when the session starts."],"answer":[0],"explanation":"Session-level availableTools and excludedTools are applied before agent settings, and a session exclusion wins. The tool must be allowed at the session level before an agent can use it.","rationale":["Correct: a session-level exclusion wins over a sub-agent tools list, so the tool must no longer be excluded for the session.","Incorrect: the releaser agent already lists the tool. Listing it again does not override the session exclusion.","Incorrect: defaultAgent.excludedTools hides tools from the main agent. It does not remove the session-level exclusion that blocks releaser.","Incorrect: pre-selecting releaser changes which agent runs first, but the session exclusion still applies to every agent."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.1.2-08","obj":"5.1.2","difficulty":"medium","type":"single","stem":"Woodgrove Bank wants to avoid parallel subagents that edit the same files. A planned change requires many tightly coupled edits to the same three files.\n\nHow should you run the change?","choices":["Run the change in a single agent session instead of fleet mode.","Run the change in fleet mode with one todo for each of the files.","Run the change in fleet mode with more workers than todos.","Run the change as one Copilot cloud agent task for each file."],"answer":[0],"explanation":"Fleet mode is not recommended for tightly coupled edits to the same files. A single agent keeps the related changes consistent without a reconciliation step.","rationale":["Correct: GitHub Docs lists tightly coupled edits to the same files as a case in which to avoid fleet mode, so a single session is the safer choice.","Incorrect: one todo per file still runs coupled edits in parallel, and each worker lacks the other workers' changes, which leads to inconsistent code.","Incorrect: more workers than todos does not create more parallel work; each todo has one owner, and coupled edits remain a conflict risk.","Incorrect: separate cloud agent tasks create separate branches and pull requests for coupled edits, which then conflict when merged."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.3-01","obj":"5.1.3","difficulty":"medium","type":"multi","stem":"You need to meet the requirements for parallel work.\n\nWhich three actions should you take? Each correct answer presents part of the solution.","choices":["Give each todo one owner, and have workers claim only ready todos.","Assign the todos so that no two subagents change the same file.","Have the parent agent verify the combined result before it finishes.","Increase the number of subagents so that each todo finishes sooner.","Let each subagent pick any todo without updating the todo status.","Give each subagent all session tools so that it can fix other subagents' files."],"answer":[0,1,2],"explanation":"One owner per todo prevents duplicate work, separate files prevent overlapping edits, and the parent verifies the combined result. These are the fleet mode practices that address the case problems.","rationale":["Correct: a worker claims one ready todo and marks it in progress, so two subagents do not write the same test file for the discount module.","Correct: avoiding overlapping files stops two subagents from editing cart.ts at the same time. Overlap is acceptable only when the parent reconciles the changes.","Correct: the parent agent verifies the combined result of all workers, which meets the requirement that the merged work builds and passes tests.","Incorrect: more subagents finish work faster but increase the chance of overlap and duplicate effort. Add workers only after the todos are independent.","Incorrect: without a status change, several workers can claim the same todo, which is how the duplicate test file happened.","Incorrect: broad tool access lets subagents change files that they do not own, which increases conflicts instead of preventing them."],"case":"C-e","ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.3-02","obj":"5.1.3","difficulty":"easy","type":"order","stem":"A pull request that Copilot cloud agent created has a merge conflict with its base branch. User1 wants Copilot to resolve the conflict and to fix the pull request if it conflicts again later.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Open the pull request on GitHub.","In the merge box, click Watch and fix.","Select Resolve merge conflicts.","Review the changes Copilot makes, and check the workflow results.","Enable auto-merge so that Copilot resolves the conflict.","In the merge box, click Unassign Copilot."],"answer":[0,1,2,3],"explanation":"Agent Merge is enabled from the merge box with Watch and fix, where you choose the blockers Copilot may fix. It watches the pull request and starts again when a selected blocker appears, but human review is still required.","rationale":["Step 1: Agent Merge is enabled per pull request, so User1 starts on the pull request page.","Step 2: Watch and fix in the merge box enables Agent Merge for the pull request.","Step 3: Resolve merge conflicts allows Copilot to resolve conflicts between the branch and its base branch whenever they appear.","Step 4: Agent Merge does not replace human review, so User1 reviews the changes and checks workflow results before merging.","Incorrect: auto-merge merges the pull request after requirements pass. It does not resolve conflicts, and enabling Agent Merge does not enable auto-merge.","Incorrect: Unassign Copilot disables Agent Merge for the pull request, which is the opposite of what User1 wants."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/watch-and-fix-pull-requests"},{"id":"5.1.3-03","obj":"5.1.3","difficulty":"medium","type":"single","stem":"Relecloud runs fleet mode with the GitHub Copilot SDK. Two workers finish the same todo, and both commit a migration script for it.\n\nWhat should you change to prevent the duplicated effort?","choices":["Have each worker set the todo to in_progress when it claims the todo.","Have each worker set the todo to done before it starts the work.","Have each worker create a new todo with the same title as a backup.","Have each worker skip the ready query and choose any pending todo."],"answer":[0],"explanation":"Fleet mode uses the todo status as shared coordination state. A worker claims one ready todo by moving it from pending to in_progress, so other workers skip it.","rationale":["Correct: the status flow pending, in_progress, done lets a worker claim a todo. Other workers query only pending, ready todos, so they skip claimed work.","Incorrect: done means that the work is complete. Setting it early hides failures and breaks the dependency checks of other todos.","Incorrect: duplicate todos create the duplicated effort that the team wants to remove. Each todo should have one owner and a durable ID.","Incorrect: the ready query ensures that dependencies are done. Skipping it lets workers start work too early or pick work that is already claimed."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.3-04","obj":"5.1.3","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs Copilot CLI /fleet. One subagent assumed version 2 of an internal API, and another subagent assumed version 3. Both subagents report success.\n\nWhat should you do?","choices":["Have the parent agent reconcile the outputs and verify the combined result.","Keep the output of the subagent that finished last, and discard the other.","Run /fleet again with more subagents so that more results can be compared.","Mark both todos as done because each subagent reported a successful result."],"answer":[0],"explanation":"Parallel workers can make inconsistent assumptions. The orchestrator must reconcile them, and the parent verifies the combined result instead of trusting individual reports.","rationale":["Correct: the parent agent is responsible for reconciling inconsistent assumptions and verifying the combined result of all workers.","Incorrect: finish order says nothing about which assumption is correct, so this keeps a random version. Decide based on the requirement, not timing.","Incorrect: more workers produce more outputs with the same missing information. Fix the context or reconcile before running again.","Incorrect: individual success does not prove that the parts work together. Each worker's report is input for the parent's verification."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.1.3-05","obj":"5.1.3","difficulty":"hard","type":"single","stem":"Contoso, Ltd. receives a pull request from a contributor's fork. The pull request now has merge conflicts with the base branch. User1 wants Copilot to resolve the conflicts automatically.\n\nWhat should User1 do?","choices":["Resolve the conflicts without Agent Merge, because it does not support fork pull requests.","Click Watch and fix in the merge box, and select Resolve merge conflicts for the pull request.","Enable auto-merge for the pull request so that GitHub resolves the conflicts before merging.","Turn on Enable Agent Merge automatically for pull requests I create in the Copilot settings."],"answer":[0],"explanation":"Agent Merge does not support pull requests opened from a fork or stacked pull requests. The conflicts must be resolved another way, for example by the contributor or by User1.","rationale":["Correct: Agent Merge does not support pull requests opened from a fork, so User1 must resolve the conflicts another way.","Incorrect: Watch and fix is the right control for pull requests in the repository, but Agent Merge does not support pull requests from forks.","Incorrect: auto-merge merges a pull request after required reviews and checks pass. It does not resolve merge conflicts.","Incorrect: this setting only applies to pull requests that User1 creates, and it still cannot act on a pull request from a fork."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/watch-and-fix-pull-requests"},{"id":"5.1.3-06","obj":"5.1.3","difficulty":"medium","type":"single","stem":"Litware, Inc. wants Copilot to keep a pull request free of merge conflicts and failing workflows, and to merge the pull request as soon as all required reviews and checks pass.\n\nWhat should you do?","choices":["Enable Agent Merge and auto-merge for the pull request.","Enable Agent Merge for the pull request and nothing else.","Enable auto-merge for the pull request and nothing else.","Ask Copilot to approve and merge the pull request when ready."],"answer":[0],"explanation":"Agent Merge fixes blockers, and auto-merge merges when requirements pass. Enabling Agent Merge does not enable auto-merge, so both are needed.","rationale":["Correct: Agent Merge fixes failed workflows and merge conflicts, and auto-merge merges once required reviews and checks pass. Combined, they meet both goals.","Incorrect: Agent Merge keeps the pull request ready but does not enable auto-merge, so the pull request still waits for a manual merge.","Incorrect: auto-merge waits for requirements to pass but does not fix conflicts or failing workflows, so the pull request might never become mergeable.","Incorrect: Copilot cloud agent cannot approve or merge pull requests. A person or auto-merge must perform the merge."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/watch-and-fix-pull-requests"},{"id":"5.1.3-07","obj":"5.1.3","difficulty":"hard","type":"single","stem":"Tailspin Toys runs three reviewer agents in parallel on the same pull request by using concurrent orchestration. The agents often return contradictory recommendations. The team needs one recommendation in which the majority opinion wins.\n\nWhat should you add to the orchestration?","choices":["An aggregation step that combines the results by voting","A shared file that each agent overwrites with its result","A rule that accepts the first result that is returned","A fourth reviewer agent that runs at the same time"],"answer":[0],"explanation":"Concurrent orchestration needs a strategy to combine or resolve conflicting results. Voting, weighted merging, and model-generated summaries are common aggregation options.","rationale":["Correct: concurrent results are aggregated by a defined strategy, and voting selects the majority opinion, which meets the requirement.","Incorrect: agents that overwrite shared state without coordination lose results. Concurrent orchestration should be avoided when agents cannot coordinate shared state.","Incorrect: the first result depends on timing, not on agreement, so it does not reflect the majority opinion of the reviewers.","Incorrect: an extra reviewer adds another opinion but does not combine the results, so the contradiction remains unresolved."],"ref":"https://learn.microsoft.com/azure/architecture/ai-ml/guide/ai-agent-design-patterns"},{"id":"5.1.3-08","obj":"5.1.3","difficulty":"easy","type":"single","stem":"User1 merges a pull request that Copilot cloud agent created. A second Copilot pull request that changed the same file now shows merge conflicts. User1 wants Copilot to resolve the conflicts.\n\nWhat should User1 click in the merge box of the second pull request?","choices":["Watch and fix","Approve and run workflows","Unassign Copilot","Ready for review"],"answer":[0],"explanation":"Watch and fix enables Agent Merge, which can resolve merge conflicts between a pull request branch and its base branch.","rationale":["Correct: Watch and fix enables Agent Merge, where User1 can let Copilot resolve merge conflicts with the base branch.","Incorrect: Approve and run workflows lets GitHub Actions workflows run on a Copilot pull request. It does not change the code to resolve conflicts.","Incorrect: Unassign Copilot disables Agent Merge for the pull request. Use it when you no longer want Copilot to watch the pull request.","Incorrect: Ready for review moves a draft pull request out of draft so it can be reviewed. It does not resolve conflicts."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/watch-and-fix-pull-requests"},{"id":"5.2.1-01","obj":"5.2.1","difficulty":"medium","type":"single","stem":"You need to meet the requirement for the monthly compliance review.\n\nWhat should you do?","choices":["Filter the enterprise audit log by actor:Copilot, and read the agent_session_id and user fields.","Ask each developer to run /chronicle standup every month and to send the report to compliance.","Review the All sessions view on the Agents tab of each repository in the enterprise every month.","Ask each compliance team member to query their own session history in natural language on GitHub."],"answer":[0],"explanation":"The enterprise audit log shows agentic activity when filtered by actor:Copilot. Each event links to the agent session through agent_session_id and names the person who started it in the user field.","rationale":["Correct: enterprise owners can filter the audit log by actor:Copilot across the enterprise, and agent_session_id and user identify the session and the developer without any developer action.","Incorrect: /chronicle standup summarizes one developer's own CLI sessions. It requires every developer to act and does not cover cloud agent activity in a consistent way.","Incorrect: the All sessions view shows shared cloud sessions per repository. Reviewing every repository is high effort, and local sessions are unshared by default.","Incorrect: session history queries only cover sessions that the person asking started. Compliance team members did not start the developers' sessions."],"case":"C-e","ref":"https://docs.github.com/en/copilot/reference/enterprise-administrators/agentic-audit-log-events"},{"id":"5.2.1-02","obj":"5.2.1","difficulty":"hard","type":"dropdown","stem":"Fabrikam, Inc. must archive a report of every Copilot CLI session in a repository when the session finishes. You create the following file in the .github/hooks folder.\n\n```json\n{\n  \"version\": [[1]],\n  \"hooks\": {\n    \"[[2]]\": [\n      {\n        \"type\": \"[[3]]\",\n        \"bash\": \"./scripts/archive-report.sh\",\n        \"timeoutSec\": 60\n      }\n    ]\n  }\n}\n```\n\nHow should you complete the configuration? To answer, select the appropriate options in the answer area.","answer":[0,0,0],"explanation":"A hooks file needs version 1 and a hooks object. sessionEnd runs when a session completes or is terminated, and each hook definition has type command.","targets":[{"label":"Box 1","options":["1","2","\"latest\""],"why":["Correct: the hooks configuration must contain a version field with the value 1.","Incorrect: the documented format requires version 1. Another number does not match the documented hook configuration format.","Incorrect: version is a number with the value 1, not a label such as latest. Use the documented value so the file is recognized."]},{"label":"Box 2","options":["sessionEnd","sessionStart","postToolUse","userPromptSubmitted"],"why":["Correct: sessionEnd runs when the agent session completes or is terminated, and GitHub Docs lists archiving session reports and logs as a use for it.","Incorrect: sessionStart runs when a session begins or resumes, before there is anything to report. Use it to initialize environments or log session starts.","Incorrect: postToolUse runs after every tool call, so the script would run many times per session. Use it for an audit trail of tool results.","Incorrect: userPromptSubmitted runs when the user submits a prompt. Use it to log requests, not to produce an end-of-session report."]},{"label":"Box 3","options":["command","script","shell"],"why":["Correct: the type property of each hook definition must be command.","Incorrect: script is not an accepted value for type. The script path goes in the bash or powershell property instead.","Incorrect: shell is not an accepted value for type. The shell is chosen by using the bash or powershell property."]}],"ref":"https://docs.github.com/en/copilot/concepts/customizations/hooks"},{"id":"5.2.1-03","obj":"5.2.1","difficulty":"easy","type":"single","stem":"A reviewer at Contoso, Ltd. must understand why Copilot cloud agent made a change in a specific commit of a pull request.\n\nWhat should the reviewer use?","choices":["The link to the session logs in the commit message","The verified signature badge on the commit","The /chronicle standup report of the requester","The repository fact list in Copilot Memory"],"answer":[0],"explanation":"Every commit that Copilot cloud agent authors includes a link to the agent session logs. The session log shows the agent's reasoning and the tools it used.","rationale":["Correct: each agent-authored commit message links to the session logs, which show the reasoning and tool use behind the change for review and audit.","Incorrect: the Verified badge proves that Copilot made the commit and that it was not altered. It does not explain why the change was made.","Incorrect: /chronicle standup summarizes a user's own Copilot CLI sessions. It is not a record of the cloud agent's reasoning for a commit.","Incorrect: repository facts are details that Copilot remembers about the code. They do not record the reasoning behind individual commits."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.2.1-04","obj":"5.2.1","difficulty":"medium","type":"single","stem":"Litware, Inc. must keep a JSON Lines record of the result of every tool call that Copilot CLI makes in a repository, including failed calls, for a compliance audit.\n\nWhich hook should you configure?","choices":["postToolUse","preToolUse","userPromptSubmitted","errorOccurred"],"answer":[0],"explanation":"postToolUse runs after a tool completes, whether it succeeded or failed, so it can append each result to a log. GitHub Docs lists audit trails as a use for this hook.","rationale":["Correct: postToolUse runs after every tool execution, successful or failed, and receives the result, which is what an audit trail of tool results needs.","Incorrect: preToolUse runs before a tool runs, so the result does not exist yet. Use it to approve or deny tool executions.","Incorrect: userPromptSubmitted runs when a user submits a prompt. It records requests, not tool results.","Incorrect: errorOccurred runs when an error occurs during agent execution. It misses successful tool calls, so the record would be incomplete."],"ref":"https://docs.github.com/en/copilot/concepts/customizations/hooks"},{"id":"5.2.1-05","obj":"5.2.1","difficulty":"hard","type":"single","stem":"Woodgrove Bank requires that no GitHub Actions workflow runs on a pull request from Copilot cloud agent until a person with write access has reviewed the code. The repository uses the default Copilot settings.\n\nWhat should you do?","choices":["Keep the default setting, which requires Approve and run workflows.","Configure Copilot to allow workflows to run on its pull requests.","Add a required status check for every workflow to the ruleset.","Add a preToolUse hook that blocks workflow runs in the repository."],"answer":[0],"explanation":"By default, workflows do not run on Copilot cloud agent pull requests until a user with write access reviews the code and clicks Approve and run workflows. The default already meets the requirement.","rationale":["Correct: by default, workflows wait until a user with write access reviews the code and clicks Approve and run workflows, so no change is needed.","Incorrect: this optional setting lets workflows run automatically on Copilot pull requests, which removes the review gate that the bank requires.","Incorrect: a required status check blocks merging until the check passes. It does not stop the workflow from running before review.","Incorrect: preToolUse controls the tools that an agent uses during a session. It does not control GitHub Actions runs that a pull request triggers."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.2.1-06","obj":"5.2.1","difficulty":"medium","type":"single","stem":"Relecloud must be able to tell from the Git history which developer started each task that Copilot cloud agent performed.\n\nWhich commit information should you use?","choices":["The co-author of each commit authored by Copilot","The Verified signature on each commit by Copilot","The author of each commit authored by Copilot","The branch name prefix of each commit by Copilot"],"answer":[0],"explanation":"Copilot is the author of its commits, and the developer who assigned the issue or requested the change is the co-author. The co-author therefore identifies who started the task.","rationale":["Correct: commits are authored by Copilot with the developer who assigned the issue or requested the change as co-author, which identifies who started the task.","Incorrect: the signature proves that the commit was made by Copilot and was not altered. It does not identify the developer who started the task.","Incorrect: the author of agent commits is Copilot itself, which identifies agent-generated code but not the person who started it.","Incorrect: the copilot/ prefix shows that Copilot created the branch for a task. It does not name the developer who requested the work."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.2.1-07","obj":"5.2.1","difficulty":"easy","type":"single","stem":"User1 asks Copilot cloud agent in a pull request comment to approve and merge its own pull request after the checks pass.\n\nWhat should User1 expect?","choices":["Copilot cannot approve or merge, so a person must review and merge.","Copilot approves the pull request but cannot merge it into main.","Copilot merges after a person clicks Approve and run workflows.","Copilot marks the pull request Ready for review and then merges it."],"answer":[0],"explanation":"Draft pull requests from Copilot cloud agent must be reviewed and merged by a human. Copilot cannot mark them Ready for review, approve, or merge them.","rationale":["Correct: Copilot cloud agent cannot approve or merge a pull request, so the human review step is preserved for audit and control.","Incorrect: Copilot cannot approve pull requests at all, and the user who asked Copilot to create the pull request cannot approve it either.","Incorrect: Approve and run workflows only lets GitHub Actions workflows run. It does not give Copilot permission to merge.","Incorrect: Copilot cannot mark its pull requests as Ready for review. A person must do that after reviewing the draft."],"ref":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"5.2.2-01","obj":"5.2.2","difficulty":"medium","type":"order","stem":"User1 must use Copilot CLI to agree on an approach for a feature, hand the implementation to Copilot cloud agent, and keep a record of the decision and the outcome.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Run /plan with a description of the feature.","Review the plan, and approve it.","Run /delegate to hand the work to Copilot cloud agent.","Review the pull request and its session logs.","Run /session delete to remove the local record of the session.","Run /compact to copy the plan into the pull request."],"answer":[0,1,2,3],"explanation":"/plan saves a plan.md file that records the agreed approach and waits for approval. /delegate hands the work to Copilot cloud agent, which creates a pull request whose commits link to the session logs.","rationale":["Step 1: /plan makes Copilot create a plan, which it saves as plan.md in the session folder as a record of the approach.","Step 2: Copilot waits for approval, so User1 reviews and approves the plan before any implementation starts.","Step 3: /delegate hands the approved work to Copilot cloud agent, which works on GitHub and creates a pull request.","Step 4: the pull request and its session logs document what the agent did, which completes the record of the outcome.","Incorrect: /session delete removes the session, including the plan and history that User1 must keep as a record of the decision.","Incorrect: /compact summarizes the conversation to free context window space. It does not copy anything into a pull request."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"5.2.2-02","obj":"5.2.2","difficulty":"medium","type":"multi","stem":"Contoso, Ltd. runs fleet mode with the GitHub Copilot SDK. The parent agent must be able to document the outcome of each worker and decide what to do next.\n\nWhich three items should each worker report when it finishes? Each correct answer presents part of the solution.","choices":["What it changed","How it validated the change","What is blocked","The full contents of its context window","The changes that the other workers made","The token count of every tool call it made"],"answer":[0,1,2],"explanation":"Fleet mode best practices ask each worker to report what it changed, how it validated the work, and what is blocked. The parent then verifies the combined result.","rationale":["Correct: a summary of the changes tells the parent which files and behavior the worker affected, which the parent needs to combine results.","Correct: reporting how the change was validated shows which tests or checks support the result and where the parent must verify more.","Correct: reporting what is blocked lets the parent reassign, add context, or record the blocker instead of assuming the work is complete.","Incorrect: the full context is large and mostly noise for the parent. A worker should return a concise result, not its whole context.","Incorrect: each worker owns its own todo and does not track other workers. The parent combines the reports from all workers.","Incorrect: token usage per call is a cost detail, not an outcome. Use session usage views or cost tools when you analyze spending."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.2.2-03","obj":"5.2.2","difficulty":"easy","type":"single","stem":"Fabrikam, Inc. runs fleet mode with the GitHub Copilot SDK. A worker cannot finish its todo because a required API key is missing. The parent agent must know why the todo stopped.\n\nWhat should the worker do?","choices":["Set the todo status to blocked, and record the reason.","Set the todo status to done, and add a short comment.","Leave the todo status set to in_progress, and exit.","Delete the todo so that no other worker claims it."],"answer":[0],"explanation":"The todo status is shared coordination state. blocked with a reason documents the problem so the parent can act on it.","rationale":["Correct: fleet mode uses the blocked status with a reason for todos that cannot proceed, which documents the problem for the parent and other workers.","Incorrect: done tells the parent and dependent todos that the work is complete, which is false and hides the missing API key.","Incorrect: in_progress tells other workers that someone owns the todo, so it stays stuck without an explanation.","Incorrect: deleting the todo removes the record of the work and of the blocker. Use blocked so that the parent can resolve it."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.2.2-04","obj":"5.2.2","difficulty":"medium","type":"single","stem":"Tailspin Toys runs fleet mode with the GitHub Copilot SDK. The orchestrator names todos t1, t2, and t3 and renumbers them when it changes the plan. Worker reports and dependencies then point to the wrong todos.\n\nWhat should you change?","choices":["Use descriptive todo IDs that do not change during the run.","Renumber all todos and dependencies after each plan change.","Keep the todo status in the parent context instead of SQL.","Remove the todo_deps rows, and let workers pick any todo."],"answer":[0],"explanation":"Fleet mode best practices recommend durable todo IDs. Stable, descriptive IDs keep dependencies and worker reports pointing at the right work across plan changes.","rationale":["Correct: durable, descriptive IDs stay valid when the plan changes, so dependencies, status updates, and handoff reports still refer to the right todo.","Incorrect: renumbering is the cause of the problem; reports that workers already returned keep the old numbers and become ambiguous.","Incorrect: the SQL todos table is the shared coordination state that workers read. Keeping status only in the parent hides it from workers.","Incorrect: todo_deps prevents todos from starting before their dependencies are done. Removing it lets work start in the wrong order."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/fleet-mode"},{"id":"5.2.2-05","obj":"5.2.2","difficulty":"hard","type":"single","stem":"User1 used /plan in a Copilot CLI session and approved the plan. A teammate on the same computer must read the approved plan to understand the decisions before taking over the work.\n\nWhich file should the teammate open?","choices":["plan.md in the session folder under ~/.copilot/session-state","workspace.yaml in the session folder under ~/.copilot/session-state",".github/copilot-instructions.md in the repository root folder","copilot-session-SESSIONID.md in the current working directory"],"answer":[0],"explanation":"Copilot CLI stores session data under ~/.copilot/session-state/ID. /plan saves the approved plan as plan.md in that session folder.","rationale":["Correct: /plan saves the plan to plan.md in the session folder under ~/.copilot/session-state, which is the record of the approved approach.","Incorrect: workspace.yaml stores session workspace metadata in the same folder. It does not contain the plan text.","Incorrect: copilot-instructions.md holds repository-wide custom instructions. /plan does not write the plan into it.","Incorrect: this file exists only after someone runs /share file without a path. Use it to export a conversation, not to find the plan."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"5.2.2-06","obj":"5.2.2","difficulty":"hard","type":"single","stem":"Contoso, Ltd. uses Enterprise Managed Users. User1 must let a teammate who has access to the repository view the decisions in a local Copilot CLI session. The teammate must not be able to change the session.\n\nWhich command should User1 run?","choices":["/share link","/share gist","/delegate","/session checkpoints"],"answer":[0],"explanation":"/share link shares the session to GitHub and prints a link. Shared local sessions are view-only for recipients, and gists are not available to Enterprise Managed Users.","rationale":["Correct: /share link shares the session on GitHub.com with a link, and people with access to the repository get view-only access.","Incorrect: /share gist creates a private gist, but gists are not available to Enterprise Managed Users. Use it for accounts that can create gists.","Incorrect: /delegate hands the work to Copilot cloud agent, which creates a pull request. It does not share the local session for viewing.","Incorrect: /session checkpoints lists the checkpoints of the session for User1. It does not share anything with the teammate."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"},{"id":"5.2.2-07","obj":"5.2.2","difficulty":"easy","type":"single","stem":"User1 has a long Copilot CLI session and must review the checkpoints that record the compaction history of the session before handing the session to a teammate.\n\nWhich command should User1 run?","choices":["/session checkpoints","/context","/compact","/tasks"],"answer":[0],"explanation":"Copilot CLI keeps checkpoints in the session folder, and /session checkpoints lists them. The other commands manage context or background tasks.","rationale":["Correct: /session checkpoints shows the checkpoints of the current session, which record the compaction history of the work.","Incorrect: /context shows how the context window is used. It does not list earlier checkpoints of the work.","Incorrect: /compact creates a summary to free context window space. It changes the context instead of showing past checkpoints.","Incorrect: /tasks lists background subagent tasks. It does not show the checkpoints of the session."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/cli-best-practices"},{"id":"5.2.3-01","obj":"5.2.3","difficulty":"medium","type":"order","stem":"User1 notices that Copilot CLI agents in a repository repeatedly use the wrong test framework and need corrections. User1 wants Copilot to analyze past sessions in the repository and update the custom instructions.\n\nWhich four actions should User1 perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","choices":["Start Copilot CLI in the folder of the repository.","Run /chronicle improve.","Deselect the recommendations that User1 does not want.","Press Enter to apply the selected recommendations.","Run /chronicle reindex to apply the recommendations.","Run /chronicle standup to choose the recommendations."],"answer":[0,1,2,3],"explanation":"/chronicle improve analyzes friction in the session history of the current repository and suggests instructions. User1 deselects unwanted suggestions and presses Enter, and Copilot updates .github/copilot-instructions.md.","rationale":["Step 1: the improve subcommand is limited to data for the current repository or working directory, so User1 starts the CLI in the repository folder.","Step 2: /chronicle improve looks for friction signals such as corrections and repeated failures, then presents 3 to 5 recommendations.","Step 3: all recommendations are selected by default, so User1 uses the arrow keys and space bar to deselect the unwanted ones.","Step 4: Enter applies the selection, and Copilot creates or updates the .github/copilot-instructions.md file.","Incorrect: /chronicle reindex rebuilds the local session store and syncs session data. It does not apply recommendations.","Incorrect: /chronicle standup creates a report of recent work. It does not offer recommendations for the instructions file."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"},{"id":"5.2.3-02","obj":"5.2.3","difficulty":"medium","type":"dragdrop","stem":"User1 analyzes past Copilot CLI sessions with the /chronicle slash command. User1 must choose the subcommand for each analysis goal.\n\nWhich subcommand should User1 use for each goal? To answer, drag the appropriate subcommands to the correct goals. Each subcommand may be used once, more than once, or not at all.","choices":["standup","tips","cost-tips","search","improve","reindex"],"answer":[2,1,5,0],"explanation":"Each /chronicle subcommand targets one kind of insight: cost-tips for token spend, tips for usage recommendations, reindex to rebuild the session store, and standup for a summary of recent work.","rationale":["Goal1 is about token spend and cost reduction, which cost-tips analyzes.","Goal2 asks for recommendations based on how User1 works, which tips provides.","Goal3 requires the local session store to be rebuilt from session files on disk, which reindex does.","Goal4 is a summary of recent work grouped by status, which standup produces."],"targets":["Goal1: find where tokens were spent and how to reduce costs","Goal2: get personalized recommendations based on usage patterns","Goal3: populate the session store from session files restored from a backup","Goal4: summarize the work of the last 24 hours by completion status"],"notes":["Generates a short report of recent work, by default the last 24 hours, grouped by completion status.","Gives 3 to 5 personalized tips based on the prompts, tools, and features that the user uses.","Analyzes token usage across recent sessions and suggests ways to reduce costs.","Searches the full session content for exact keywords or topics. Use it when you know the term you are looking for.","Finds friction in sessions of the current repository and suggests changes to the custom instructions file.","Rebuilds the local session store from the session history and syncs session data to the account."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/chronicle"},{"id":"5.2.3-03","obj":"5.2.3","difficulty":"hard","type":"multi","stem":"Relecloud builds an app with the GitHub Copilot SDK in which a main agent delegates work to several sub-agents. After a failed run, you must analyze which sub-agent did what and where the run failed.\n\nWhich three actions should you take? Each correct answer presents part of the solution.","choices":["Group events by the agentId field on the event envelope.","Use toolCallId to rebuild the execution tree of the run.","Filter the events for subagent.failed events.","Use the agentId field on root-agent events to find the main agent.","Read the parent's context window to see the sub-agents' reasoning.","Filter the events for subagent.selected events to find failures."],"answer":[0,1,2],"explanation":"Sub-agent events carry an agentId on the envelope and a toolCallId that links them to the tool call that started them. subagent.failed marks sub-agent runs that ended in an error.","rationale":["Correct: agentId on the envelope identifies which sub-agent emitted an event, so grouping by it separates the activity of each sub-agent.","Correct: toolCallId links lifecycle events to the tool call that started the sub-agent, so you can rebuild the execution tree of the run.","Correct: subagent.failed is emitted when a sub-agent run fails, so filtering for it shows where the run broke.","Incorrect: agentId is omitted for events from the root agent. Identify root events by the missing agentId instead.","Incorrect: sub-agents run in an isolated context, so their work is not in the parent's context window. Use the streamed events.","Incorrect: subagent.selected shows that the runtime chose a sub-agent for a request. It does not tell you whether the run failed."],"ref":"https://docs.github.com/en/copilot/how-tos/copilot-sdk/features/custom-agents"},{"id":"5.2.3-04","obj":"5.2.3","difficulty":"easy","type":"single","stem":"User1 must analyze everything that happened in a Copilot CLI session on a local computer, including each prompt, response, and tool call.\n\nWhich file in the session folder should User1 analyze?","choices":["events.jsonl","plan.md","workspace.yaml","copilot-instructions.md"],"answer":[0],"explanation":"Copilot CLI stores each session under ~/.copilot/session-state/ID. events.jsonl contains the full history of the session, which makes it the source for post-hoc analysis.","rationale":["Correct: events.jsonl holds the full event history of the session, including prompts, responses, and tool calls.","Incorrect: plan.md contains the plan that /plan created. It records the approach, not every event in the session.","Incorrect: workspace.yaml holds metadata about the session workspace. It does not contain the conversation or tool calls.","Incorrect: copilot-instructions.md is a repository file with custom instructions. It is input f
